 {id:"sign-1-01", cat:"sign", set:1, final:0, fo:0, ans:true, sign:"tomare", ja:"「一時停止」の標識がある交差点では、停止線の直前で一時停止しなければならない。", my:"「一時停止」ယာဉ်စည်းကမ်းဆိုင်းဘုတ် ရှိသော လမ်းဆုံတွင် ရပ်တန့်မျဉ်း၏ ရှေ့တည့်တည့် (မျဉ်းကို မကျော်မီ) တွင် ခဏရပ်တန့်ခြင်း(一時停止) ပြုလုပ်ရမည်။", exJa:"正しい。停止線の直前（停止線がなければ交差点の直前）で一時停止し、交差する道路の車の進行を妨げてはいけない。", exMy:"မှန်သည်။ ရပ်တန့်မျဉ်း၏ ရှေ့တွင် (ရပ်တန့်မျဉ်း မရှိလျှင် လမ်းဆုံ၏ ရှေ့တွင်) ခဏရပ်ပြီး ဖြတ်သွားသော လမ်းမှ ယာဉ်များကို မနှောင့်ယှက်ရ။", src:"法43条、教則5章7節"},
 {id:"sign-1-02", cat:"sign", set:1, final:0, fo:0, ans:false, sign:"jokou", ja:"「徐行」の標識がある場所では、安全を確かめれば徐行しないで通過してよい。", my:"「徐行」ဆိုင်းဘုတ် ရှိသော နေရာတွင် ဘေးကင်းကြောင်း စစ်ဆေးပြီးလျှင် ဖြည်းဖြည်းမောင်းခြင်း(徐行) မပြုဘဲ ဖြတ်သွားနိုင်သည်။", exJa:"誤り。正しくは、徐行の標識がある場所では必ず徐行しなければならない。安全を確かめても省略できない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ 徐行 ဆိုင်းဘုတ် ရှိသော နေရာတွင် အမြဲ ဖြည်းဖြည်းမောင်းရမည်။ ဘေးကင်းသည်ဟု ထင်လျှင်လည်း မချန်လှပ်ရ။", src:"法42条、教則5章4節"},
 {id:"sign-1-03", cat:"sign", set:1, final:0, fo:0, ans:false, sign:"chusha_kinshi", ja:"「駐車禁止」の標識がある場所では、駐車だけでなく停車もしてはいけない。", my:"「駐車禁止」ဆိုင်းဘုတ် ရှိသော နေရာတွင် ယာဉ်ရပ်နားခြင်း(駐車) သာမက ခဏရပ်ခြင်း(停車) ကိုလည်း မပြုလုပ်ရ။", exJa:"誤り。正しくは、駐車禁止の標識は駐車を禁止するもので、停車はできる。停車も禁止なのは「駐停車禁止」の標識である。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ 駐車禁止 ဆိုင်းဘုတ်သည် ယာဉ်ရပ်နားခြင်း(駐車) ကိုသာ တားမြစ်ပြီး ခဏရပ်ခြင်း(停車) ပြုနိုင်သည်။ ခဏရပ်ခြင်းကိုပါ တားမြစ်သည်မှာ「駐停車禁止」ဆိုင်းဘုတ် ဖြစ်သည်။", src:"教則5章8節、付表3（1）17・18"},
 {id:"sign-1-04", cat:"sign", set:1, final:0, fo:0, ans:false, sign:"max40", ja:"最高速度「40」の標識がある道路でも、周りに車がいなければ、40km/hを超えて運転してよい。", my:"အမြင့်ဆုံးအမြန်နှုန်း「40」ဆိုင်းဘုတ် ရှိသော လမ်း၌ပင် အနီးတွင် အခြားယာဉ် မရှိလျှင် တစ်နာရီ 40 ကီလိုမီတာ ထက် ကျော်၍ မောင်းနိုင်သည်။", exJa:"誤り。正しくは、標識で最高速度が指定されている道路では、周りに車がいなくても、その速度（40km/h）を超えてはいけない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ ဆိုင်းဘုတ်ဖြင့် အမြင့်ဆုံးအမြန်နှုန်း သတ်မှတ်ထားသော လမ်းတွင် အခြားယာဉ် မရှိလျှင်ပင် ထိုအမြန်နှုန်း (တစ်နာရီ 40 ကီလိုမီတာ) ကို မကျော်ရ။", src:"法22条、教則5章4節"},
 {id:"sign-1-05", cat:"sign", set:1, final:0, fo:0, ans:true, sign:"ippou", ja:"「一方通行」の標識がある道路では、車は矢印の示す方向と反対の方向に通行してはいけない。", my:"「一方通行」(တစ်လမ်းမောင်း) ဆိုင်းဘုတ် ရှိသော လမ်းတွင် ယာဉ်များသည် မြှားပြသည့် ဦးတည်ရာ၏ ဆန့်ကျင်ဘက်သို့ မသွားရ။", exJa:"正しい。一方通行の標識は、標示板の矢印の示す方向と反対の方向に車が通行することを禁止している。", exMy:"မှန်သည်။ 一方通行 ဆိုင်းဘုတ်သည် မြှားပြသည့် ဦးတည်ရာ၏ ဆန့်ကျင်ဘက်သို့ ယာဉ်များ သွားခြင်းကို တားမြစ်သည်။", src:"教則付表3（1）31"},
 {id:"sign-1-06", cat:"sign", set:1, final:0, fo:0, ans:true, sign:"hokousha_senyou", ja:"「歩行者専用」の標識がある道路は、特に通行を認められた車のほかは、車で通行してはいけない。", my:"「歩行者専用」(လမ်းလျှောက်သူများအတွက်သာ) ဆိုင်းဘုတ် ရှိသော လမ်းတွင် အထူးခွင့်ပြုထားသော ယာဉ်မှလွဲ၍ ယာဉ်ဖြင့် မသွားရ။", exJa:"正しい。歩行者用道路では、沿道に車庫を持つ車など特に通行を認められた車だけが通行できる。", exMy:"မှန်သည်။ လမ်းလျှောက်သူသုံးလမ်းတွင် လမ်းဘေး၌ ကားဂိုဒေါင်ရှိသော ယာဉ်ကဲ့သို့ အထူးခွင့်ပြုထားသော ယာဉ်များသာ သွားနိုင်သည်။", src:"法8条1項・9条、教則5章3節"},
 {id:"sign-1-07", cat:"sign", set:1, final:0, fo:0, ans:false, sign:"shitei_houkou", ja:"直進と左折の矢印が示された「指定方向外進行禁止」の標識がある交差点では、右折してもよい。", my:"ရှေ့တည့်တည့်နှင့် ဘယ်ကွေ့ မြှားများပါသော「指定方向外進行禁止」(သတ်မှတ်ဦးတည်ရာမှအပ မသွားရ) ဆိုင်းဘုတ် ရှိသော လမ်းဆုံတွင် ညာကွေ့ နိုင်သည်။", exJa:"誤り。正しくは、この標識がある交差点では矢印の方向（直進・左折）にしか進めず、右折はできない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ ဤဆိုင်းဘုတ်ရှိသော လမ်းဆုံတွင် မြှားပြသည့် ဦးတည်ရာ (ရှေ့တည့်တည့်နှင့် ဘယ်ကွေ့) သို့သာ သွားနိုင်ပြီး ညာကွေ့ မရပါ။", src:"教則5章7節、付表3（1）12"},
 {id:"sign-1-08", cat:"sign", set:1, final:0, fo:0, ans:true, sign:"yusen_douro", ja:"「優先道路」の標識がある道路を通行しているときは、左右の見通しがきかない交差点でも徐行しなくてよい。", my:"「優先道路」(ဦးစားပေးလမ်း) ဆိုင်းဘုတ် ရှိသော လမ်းပေါ်တွင် မောင်းနေစဉ် ဘယ်ညာ မမြင်ရသော လမ်းဆုံ၌ပင် ဖြည်းဖြည်းမောင်းခြင်း(徐行) မလိုပါ။", exJa:"正しい。左右の見通しがきかない交差点では徐行が必要だが、優先道路を通行している場合は除かれる。", exMy:"မှန်သည်။ ဘယ်ညာ မမြင်ရသော လမ်းဆုံတွင် ဖြည်းဖြည်းမောင်းရသော်လည်း ဦးစားပေးလမ်းပေါ်တွင် မောင်းနေလျှင် ခြွင်းချက် ဖြစ်သည်။", src:"法42条1号、教則5章4節"},
 {id:"sign-1-09", cat:"sign", set:1, final:0, fo:0, ans:false, sign:"diamond_mark", ja:"路面に描かれたひし形（◇）の標示は、前方に安全地帯があることを示している。", my:"လမ်းမျက်နှာပြင်ပေါ်တွင် ရေးဆွဲထားသော စိန်ပုံ (◇) လမ်းမျက်နှာပြင် အမှတ်အသားသည် ရှေ့တွင် ဘေးကင်းဇုန်(安全地帯) ရှိကြောင်း ပြသည်။", exJa:"誤り。正しくは、路面の◇は「前方に横断歩道又は自転車横断帯あり」を示す標示である。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ လမ်းပေါ်ရှိ ◇ သည် ရှေ့တွင် လူကူးမျဉ်းကြား သို့မဟုတ် စက်ဘီးကူးလမ်း ရှိကြောင်း ပြသော အမှတ်အသား ဖြစ်သည်။", src:"教則付表3（2）38"},
 {id:"sign-1-10", cat:"sign", set:1, final:0, fo:0, ans:true, sign:"shoshinsha", ja:"普通免許を受けて1年を経過していない人が普通自動車を運転するときは、初心者マークを付けなければならない。", my:"ယာဉ်မောင်းလိုင်စင် (普通免許) ရပြီး 1 နှစ် မပြည့်သေးသူသည် သာမန်မော်တော်ကား မောင်းသည့်အခါ ကားမောင်းသူအသစ် အမှတ်အသား (初心者マーク) ကို တပ်ရမည်။", exJa:"正しい。準中型免許・普通免許を受けて1年未満の人には、初心者マークの表示義務がある。", exMy:"မှန်သည်။ 準中型 သို့မဟုတ် 普通 လိုင်စင် ရပြီး 1 နှစ် မပြည့်သေးသူသည် 初心者マーク ကို မဖြစ်မနေ တပ်ရမည်။", src:"法71条の5、教則5章3節"},

 {id:"sign-2-01", cat:"sign", set:2, final:0, fo:0, ans:false, sign:"tomare", ja:"「一時停止」の標識がある交差点では、一時停止をすれば、交差する道路の車より先に進んでよい。", my:"「一時停止」ဆိုင်းဘုတ် ရှိသော လမ်းဆုံတွင် ခဏရပ်တန့်ပြီးလျှင် ဖြတ်သွားသော လမ်းမှ ယာဉ်များထက် အရင် ဆက်သွားနိုင်သည်။", exJa:"誤り。正しくは、一時停止したうえで、交差する道路を通行する車や路面電車の進行を妨げてはいけない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ ခဏရပ်တန့်ပြီးနောက် ဖြတ်သွားသော လမ်းမှ ယာဉ်များနှင့် ဓာတ်ရထားကို မနှောင့်ယှက်ရ။", src:"法43条、教則5章7節"},
 {id:"sign-2-02", cat:"sign", set:2, final:0, fo:0, ans:false, sign:"chuteisha_kinshi", ja:"「駐停車禁止」の標識がある場所でも、5分以内の人の乗り降りのためなら停車してよい。", my:"「駐停車禁止」ဆိုင်းဘုတ် ရှိသော နေရာ၌ပင် 5 မိနစ်အတွင်း လူအတက်အဆင်းအတွက်ဆိုလျှင် ခဏရပ်ခြင်း(停車) ပြုနိုင်သည်။", exJa:"誤り。正しくは、駐停車禁止の場所では駐車も停車もできず、人の乗り降りのための停車もできない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ 駐停車禁止 နေရာတွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း နှစ်မျိုးလုံး မပြုရ။ လူအတက်အဆင်းအတွက် ခဏရပ်ခြင်းလည်း မရပါ။", src:"法44条、教則5章8節"},
 {id:"sign-2-03", cat:"sign", set:2, final:0, fo:0, ans:true, ja:"「車両通行止め」の標識がある道路は、車で通行してはいけない。", my:"「車両通行止め」(ယာဉ်များ ဖြတ်သန်းခွင့်မပြု) ဆိုင်းဘုတ် ရှိသော လမ်းကို ယာဉ်ဖြင့် မသွားရ။", exJa:"正しい。車両通行止めの標識は車の通行止めを示し、この標識で通行が禁止された道路を通行してはいけない。", exMy:"မှန်သည်။ 車両通行止め ဆိုင်းဘုတ်သည် ယာဉ်များ ဖြတ်သန်းခြင်းကို တားမြစ်ကြောင်း ပြပြီး ထိုလမ်းကို ယာဉ်ဖြင့် မသွားရ။", src:"法8条1項、教則5章2節、付表3（1）2"},
 {id:"sign-2-04", cat:"sign", set:2, final:0, fo:0, ans:true, sign:"shinnyu_kinshi", ja:"「車両進入禁止」の標識は、標識のある側から車が入ることを禁止するもので、一方通行路の出口などに設けられる。", my:"「車両進入禁止」(ယာဉ်များ ဝင်ခွင့်မပြု) ဆိုင်းဘုတ်သည် ဆိုင်းဘုတ်ရှိသော ဘက်မှ ယာဉ်ဝင်ခြင်းကို တားမြစ်ပြီး တစ်လမ်းမောင်းလမ်း၏ ထွက်ပေါက် စသည်တွင် တပ်ဆင်ထားသည်။", exJa:"正しい。車両進入禁止は、一方通行路の出口など、車がその方向から進入することを禁止する標識である。", exMy:"မှန်သည်။ 車両進入禁止 သည် တစ်လမ်းမောင်းလမ်း ထွက်ပေါက် စသည်တွင် ထိုဘက်မှ ယာဉ်ဝင်ခြင်းကို တားမြစ်သော ဆိုင်းဘုတ် ဖြစ်သည်။", src:"教則付表3（1）3"},
 {id:"sign-2-05", cat:"sign", set:2, final:0, fo:0, ans:true, sign:"min50", ja:"最低速度「50」の標識がある道路では、やむを得ない場合を除き、50km/hに達しない速度で運転してはいけない。", my:"အနိမ့်ဆုံးအမြန်နှုန်း「50」ဆိုင်းဘုတ် ရှိသော လမ်းတွင် မလွှဲသာသော အခြေအနေမှလွဲ၍ တစ်နာရီ 50 ကီလိုမီတာ မပြည့်သော အမြန်နှုန်းဖြင့် မမောင်းရ။", exJa:"正しい。最低速度が指定されている道路では、危険を防ぐためなどやむを得ない場合を除き、その速度に達しない速度で運転してはいけない。", exMy:"မှန်သည်။ အနိမ့်ဆုံးအမြန်နှုန်း သတ်မှတ်ထားသော လမ်းတွင် အန္တရာယ်ကာကွယ်ရန် စသည့် မလွှဲသာသော အခြေအနေမှလွဲ၍ ထိုအမြန်နှုန်းထက် နှေး၍ မမောင်းရ။", src:"法23条、教則7章2節"},
 {id:"sign-2-06", cat:"sign", set:2, final:0, fo:0, ans:false, sign:"chusha_ka", ja:"「駐車可」の標識は、停車だけができて駐車はできない場所であることを示している。", my:"「駐車可」ဆိုင်းဘုတ်သည် ခဏရပ်ခြင်း(停車) သာ ပြုနိုင်ပြီး ယာဉ်ရပ်နားခြင်း(駐車) မပြုနိုင်သော နေရာ ဖြစ်ကြောင်း ပြသည်။", exJa:"誤り。正しくは、「駐車可」は車の駐車ができることを示す指示標識である。停車ができることを示すのは「停車可」の標識である。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ「駐車可」သည် ယာဉ်ရပ်နားခြင်း(駐車) ပြုနိုင်ကြောင်း ပြသော ညွှန်ပြဆိုင်းဘုတ် ဖြစ်သည်။ ခဏရပ်ခြင်း ပြုနိုင်ကြောင်း ပြသည်မှာ「停車可」ဆိုင်းဘုတ် ဖြစ်သည်။", src:"教則5章8節、付表3（1）53・54"},
 {id:"sign-2-07", cat:"sign", set:2, final:0, fo:0, ans:true, sign:"fumikiri", ja:"「踏切あり」の標識は警戒標識で、前方に踏切があることを知らせている。", my:"「踏切あり」ဆိုင်းဘုတ်သည် သတိပေးဆိုင်းဘုတ် ဖြစ်ပြီး ရှေ့တွင် ရထားလမ်းကူး ရှိကြောင်း အသိပေးသည်။", exJa:"正しい。警戒標識は道路上の危険や注意すべき状況を前もって知らせるもので、踏切ありの標識はその例である。", exMy:"မှန်သည်။ သတိပေးဆိုင်းဘုတ်သည် လမ်းပေါ်ရှိ အန္တရာယ် သို့မဟုတ် သတိထားရမည့် အခြေအနေကို ကြိုတင် အသိပေးပြီး 踏切あり ဆိုင်းဘုတ်သည် ယင်း၏ ဥပမာ ဖြစ်သည်။", src:"教則1章2節、付表3（1）"},
 {id:"sign-2-08", cat:"sign", set:2, final:0, fo:0, ans:false, sign:"oudan_hodou", ja:"「横断歩道」の標識がある所で横断しようとしている歩行者がいるときは、警音器を鳴らして先に通過してよい。", my:"「横断歩道」ဆိုင်းဘုတ် ရှိသော နေရာတွင် ဖြတ်ကူးမည့် လမ်းလျှောက်သူ ရှိလျှင် ဟွန်းတီးပြီး အရင် ဖြတ်သွားနိုင်သည်။", exJa:"誤り。正しくは、横断歩道を渡ろうとしている歩行者がいるときは、横断歩道の手前で一時停止して道を譲らなければならない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ လူကူးမျဉ်းကြားကို ကူးမည့် လမ်းလျှောက်သူ ရှိလျှင် လူကူးမျဉ်းကြား၏ ရှေ့တွင် ခဏရပ်တန့်ပြီး လမ်းဖယ်ပေးရမည်။", src:"法38条1項、教則5章3節"},
 {id:"sign-2-09", cat:"sign", set:2, final:0, fo:0, ans:true, sign:"koureisha", ja:"70歳以上の人が普通自動車を運転するときは、高齢者マークを付けるように努めなければならない。", my:"အသက် 70 နှစ်နှင့်အထက်ရှိသူ သာမန်မော်တော်ကား မောင်းသည့်အခါ သက်ကြီးကားမောင်းသူ အမှတ်အသား (高齢者マーク) ကို တပ်ရန် ကြိုးစားရမည်။", exJa:"正しい。70歳以上の運転者が高齢者マークを付けるのは努力義務である。", exMy:"မှန်သည်။ အသက် 70 နှစ်နှင့်အထက် ယာဉ်မောင်းသူ 高齢者マーク တပ်ခြင်းသည် ကြိုးစားလုပ်ဆောင်ရမည့် တာဝန် (努力義務) ဖြစ်သည်။", src:"法71条の5、教則4章1節"},
 {id:"sign-2-10", cat:"sign", set:2, final:0, fo:0, ans:false, ja:"「警笛鳴らせ」の標識がある場所では、危険がなければ警音器を鳴らさなくてよい。", my:"「警笛鳴らせ」(ဟွန်းတီးပါ) ဆိုင်းဘုတ် ရှိသော နေရာတွင် အန္တရာယ် မရှိလျှင် ဟွန်း မတီးဘဲ နေနိုင်သည်။", exJa:"誤り。正しくは、「警笛鳴らせ」の標識がある場所を通るときは、警音器を鳴らさなければならない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ「警笛鳴らせ」ဆိုင်းဘုတ် ရှိသော နေရာကို ဖြတ်သွားသည့်အခါ ဟွန်း မဖြစ်မနေ တီးရမည်။", src:"法54条1項、教則5章5節"},

 {id:"sign-3-01", cat:"sign", set:3, final:0, fo:0, ans:true, sign:"jokou", ja:"「徐行」の標識がある場所では、車がすぐに停止できるような速度で進まなければならない。", my:"「徐行」ဆိုင်းဘုတ် ရှိသော နေရာတွင် ယာဉ်ကို ချက်ချင်း ရပ်နိုင်လောက်သော အမြန်နှုန်းဖြင့် သွားရမည်။", exJa:"正しい。徐行とは、車がすぐに停止できるような速度で進むことをいう。", exMy:"မှန်သည်။ ဖြည်းဖြည်းမောင်းခြင်း(徐行) ဆိုသည်မှာ ယာဉ်ကို ချက်ချင်း ရပ်နိုင်လောက်သော အမြန်နှုန်းဖြင့် သွားခြင်း ဖြစ်သည်။", src:"法2条1項20号・42条"},
 {id:"sign-3-02", cat:"sign", set:3, final:0, fo:0, ans:true, sign:"chusha_kinshi", ja:"「駐車禁止」の標識がある場所で、運転者が車を離れてすぐに運転できない状態で車を止めてはいけない。", my:"「駐車禁止」ဆိုင်းဘုတ် ရှိသော နေရာတွင် ယာဉ်မောင်းသူ ကားမှ ခွာသွားပြီး ချက်ချင်း မမောင်းနိုင်သော အခြေအနေဖြင့် ကားကို မရပ်ထားရ။", exJa:"正しい。運転者が車を離れてすぐに運転できない状態は駐車にあたるので、駐車禁止の場所ではできない。", exMy:"မှန်သည်။ ယာဉ်မောင်းသူ ကားမှ ခွာ၍ ချက်ချင်း မမောင်းနိုင်သော အခြေအနေသည် ယာဉ်ရပ်နားခြင်း(駐車) ဖြစ်သောကြောင့် 駐車禁止 နေရာတွင် မပြုရ။", src:"法2条1項18号・45条"},
 {id:"sign-3-03", cat:"sign", set:3, final:0, fo:0, ans:true, sign:"max40", ja:"最高速度「40」の標識がある道路でも、一般原動機付自転車は30km/hを超えて運転してはいけない。", my:"အမြင့်ဆုံးအမြန်နှုန်း「40」ဆိုင်းဘုတ် ရှိသော လမ်း၌ပင် မော်တာဆိုင်ကယ်ငယ်(原付) သည် တစ်နာရီ 30 ကီလိုမီတာ ထက် ကျော်၍ မမောင်းရ။", exJa:"正しい。一般原動機付自転車の最高速度は30km/hで、標識で30km/hを超える速度が指定されていても30km/hを超えてはいけない。", exMy:"မှန်သည်။ 原付 ၏ အမြင့်ဆုံးအမြန်နှုန်းမှာ တစ်နာရီ 30 ကီလိုမီတာ ဖြစ်ပြီး ဆိုင်းဘုတ်တွင် 30 ထက်များသော အမြန်နှုန်း ပြထားလျှင်ပင် 30 ကို မကျော်ရ။", src:"令11条、教則5章4節"},
 {id:"sign-3-04", cat:"sign", set:3, final:0, fo:0, ans:true, sign:"ippou", ja:"「一方通行」の標識がある道路から右折するときは、あらかじめ道路の右端に寄らなければならない。", my:"「一方通行」ဆိုင်းဘုတ် ရှိသော လမ်းမှ ညာကွေ့ သည့်အခါ ကြိုတင်၍ လမ်း၏ ညာဘက်အစွန်သို့ ကပ်ရမည်။", exJa:"正しい。一方通行の道路から右折するときは、道路の右端に寄り、交差点の中心の内側を徐行して通行する。", exMy:"မှန်သည်။ တစ်လမ်းမောင်းလမ်းမှ ညာကွေ့ လျှင် လမ်း၏ ညာဘက်အစွန်သို့ ကပ်ပြီး လမ်းဆုံ အလယ်ဗဟို၏ အတွင်းဘက်မှ ဖြည်းဖြည်း မောင်းရမည်။", src:"法34条2項、教則5章7節"},
 {id:"sign-3-05", cat:"sign", set:3, final:0, fo:0, ans:false, sign:"shitei_houkou", ja:"直進と左折の矢印が示された「指定方向外進行禁止」の標識がある交差点では、転回してもよい。", my:"ရှေ့တည့်တည့်နှင့် ဘယ်ကွေ့ မြှားများပါသော「指定方向外進行禁止」ဆိုင်းဘုတ် ရှိသော လမ်းဆုံတွင် ယူတန်ကွေ့ခြင်း(転回) ပြုလုပ်နိုင်သည်။", exJa:"誤り。正しくは、この標識は矢印の方向以外への進行を禁止しているので、直進か左折しかできず、転回もできない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ ဤဆိုင်းဘုတ်သည် မြှားပြသည့် ဦးတည်ရာမှလွဲ၍ မသွားရဟု တားမြစ်ထားသဖြင့် ရှေ့တည့်တည့် သို့မဟုတ် ဘယ်ကွေ့သာ ရပြီး ယူတန်ကွေ့ခြင်းလည်း မရပါ။", src:"教則5章7節、付表3（1）12"},
 {id:"sign-3-06", cat:"sign", set:3, final:0, fo:0, ans:false, sign:"gakkou", ja:"「学校、幼稚園、保育所等あり」の標識は、特定の交通方法を禁止する規制標識である。", my:"「学校、幼稚園、保育所等あり」(ကျောင်း၊ မူကြို စသည် ရှိသည်) ဆိုင်းဘုတ်သည် သတ်မှတ်ထားသော သွားလာပုံကို တားမြစ်သည့် ကန့်သတ်ဆိုင်းဘုတ် (規制標識) ဖြစ်သည်။", exJa:"誤り。正しくは、この標識は前方に学校などがあることを知らせる警戒標識である。子供の飛び出しに特に注意する。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ ဤဆိုင်းဘုတ်သည် ရှေ့တွင် ကျောင်း စသည် ရှိကြောင်း အသိပေးသော သတိပေးဆိုင်းဘုတ် (警戒標識) ဖြစ်သည်။ ကလေးများ ရုတ်တရက် ထွက်လာခြင်းကို အထူး သတိထားပါ။", src:"教則1章2節・5章3節、付表3（1）"},
 {id:"sign-3-07", cat:"sign", set:3, final:0, fo:0, ans:true, ja:"補助標識は、普通、本標識の下に取り付けられ、規制が適用される時間や車の種類などを示している。", my:"အထောက်အကူဆိုင်းဘုတ် (補助標識) ကို ပုံမှန်အားဖြင့် ပင်မဆိုင်းဘုတ် (本標識) ၏ အောက်တွင် တပ်ဆင်ထားပြီး စည်းကမ်း သက်ရောက်သည့် အချိန်၊ ယာဉ်အမျိုးအစား စသည်ကို ပြသည်။", exJa:"正しい。補助標識は本標識の意味を補足するもので、規制の理由、時間、曜日、車の種類などを示す。", exMy:"မှန်သည်။ 補助標識 သည် ပင်မဆိုင်းဘုတ်၏ အဓိပ္ပာယ်ကို ဖြည့်စွက်ပြီး စည်းကမ်း၏ အကြောင်းရင်း၊ အချိန်၊ နေ့၊ ယာဉ်အမျိုးအစား စသည်ကို ပြသည်။", src:"教則1章2節"},
 {id:"sign-3-08", cat:"sign", set:3, final:0, fo:0, ans:false, ja:"「一般原動機付自転車の右折方法（二段階）」の標識がある交差点では、一般原動機付自転車は道路の中央に寄って右折してよい。", my:"「一般原動機付自転車の右折方法（二段階）」(原付 နှစ်ဆင့်ညာကွေ့) ဆိုင်းဘုတ် ရှိသော လမ်းဆုံတွင် မော်တာဆိုင်ကယ်ငယ်(原付) သည် လမ်းအလယ်သို့ ကပ်၍ ညာကွေ့ နိုင်သည်။", exJa:"誤り。正しくは、この標識のある交差点（信号などで交通整理されている所）では、原付は道路の左端に寄って二段階の方法で右折する。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ ဤဆိုင်းဘုတ်ရှိသော (မီးပွိုင့်စသည်ဖြင့် ထိန်းချုပ်ထားသော) လမ်းဆုံတွင် 原付 သည် လမ်း၏ ဘယ်ဘက်အစွန်သို့ ကပ်ပြီး နှစ်ဆင့်နည်းဖြင့် ညာကွေ့ ရမည်။", src:"法34条5項、教則8章3節"},
 {id:"sign-3-09", cat:"sign", set:3, final:0, fo:0, ans:false, sign:"shoshinsha", ja:"初心者マークを付けた車の前に無理に割り込んではいけないが、側方に幅寄せすることは禁止されていない。", my:"初心者マーク တပ်ထားသော ကား၏ ရှေ့သို့ အတင်း ဖြတ်ဝင်ခြင်း မပြုရသော်လည်း ဘေးဘက်မှ ကပ်၍ ဖိမောင်းခြင်း (幅寄せ) ကိုမူ မတားမြစ်ထားပါ။", exJa:"誤り。正しくは、危険を避けるためやむを得ない場合のほか、初心者マークの車に幅寄せすることも、割り込むことも禁止されている。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ အန္တရာယ်ရှောင်ရန် မလွှဲသာသော အခြေအနေမှလွဲ၍ 初心者マーク ကားကို ဘေးမှ ကပ်ဖိခြင်းနှင့် ရှေ့သို့ ဖြတ်ဝင်ခြင်း နှစ်မျိုးလုံး တားမြစ်ထားသည်။", src:"教則5章3節"},
 {id:"sign-3-10", cat:"sign", set:3, final:0, fo:0, ans:true, ja:"黄色の中央線が引かれている道路では、追越しのため道路の右側部分にはみ出して通行してはいけない。", my:"အဝါရောင် လမ်းအလယ်မျဉ်း ဆွဲထားသော လမ်းတွင် ကျော်တက်ခြင်းအတွက် လမ်း၏ ညာဘက်အပိုင်းသို့ ထွက်၍ မသွားရ။", exJa:"正しい。黄色の中央線は「追越しのための右側部分はみ出し通行禁止」を示す規制標示である。", exMy:"မှန်သည်။ အဝါရောင် လမ်းအလယ်မျဉ်းသည် ကျော်တက်ရန် ညာဘက်အပိုင်းသို့ ထွက်မောင်းခြင်းကို တားမြစ်ကြောင်း ပြသော ကန့်သတ်အမှတ်အသား ဖြစ်သည်။", src:"教則付表3（2）2"},

 {id:"sign-F-01", cat:"sign", set:0, final:1, fo:1, ans:true, sign:"tomare", ja:"「一時停止」の標識は、赤色の逆三角形で、白い文字で「止まれ」と書かれている。", my:"「一時停止」ဆိုင်းဘုတ်သည် အနီရောင် ပြောင်းပြန်တြိဂံပုံ ဖြစ်ပြီး အဖြူရောင်စာဖြင့်「止まれ」ဟု ရေးထားသည်။", exJa:"正しい。一時停止の標識は赤地に白い文字の逆三角形の標識で、交通整理のない交差点の手前などに設けられる。", exMy:"မှန်သည်။ 一時停止 ဆိုင်းဘုတ်သည် အနီရောင်ခံ အဖြူစာ ပြောင်းပြန်တြိဂံ ဖြစ်ပြီး မီးပွိုင့်မရှိသော လမ်းဆုံ၏ ရှေ့ စသည်တွင် တပ်ဆင်ထားသည်။", src:"教則付表3（1）40"},
 {id:"sign-F-02", cat:"sign", set:0, final:1, fo:2, ans:true, sign:"chuteisha_kinshi", ja:"「駐停車禁止」の標識がある場所でも、赤信号や危険を防ぐために一時停止することはできる。", my:"「駐停車禁止」ဆိုင်းဘုတ် ရှိသော နေရာ၌ပင် မီးနီ သို့မဟုတ် အန္တရာယ်ကာကွယ်ရန် ခဏရပ်တန့်ခြင်း ပြုနိုင်သည်။", exJa:"正しい。駐停車禁止の場所でも、赤信号での停止や危険防止のための一時停止は禁止されていない。", exMy:"မှန်သည်။ 駐停車禁止 နေရာတွင်ပင် မီးနီကြောင့် ရပ်ခြင်း သို့မဟုတ် အန္တရာယ်ကာကွယ်ရန် ခဏရပ်တန့်ခြင်းကို မတားမြစ်ပါ။", src:"法44条、教則5章8節"},
 {id:"sign-F-03", cat:"sign", set:0, final:1, fo:3, ans:false, sign:"chusha_kinshi", ja:"青地に赤のわくと赤の斜線が1本ある標識は、「駐停車禁止」を示している。", my:"အပြာရောင်ခံ၊ အနီရောင်ဘောင်နှင့် အနီရောင် ထောင့်ဖြတ်မျဉ်း 1 ကြောင်း ပါသော ဆိုင်းဘုတ်သည်「駐停車禁止」ကို ပြသည်။", exJa:"誤り。正しくは、斜線が1本なのは「駐車禁止」の標識である。「駐停車禁止」は赤の斜線が×の形になっている。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ ထောင့်ဖြတ်မျဉ်း 1 ကြောင်းပါသည်မှာ「駐車禁止」ဆိုင်းဘုတ် ဖြစ်သည်။「駐停車禁止」တွင် အနီရောင်မျဉ်းများ × ပုံ ဖြစ်နေသည်။", src:"教則付表3（1）17・18"},
 {id:"sign-F-04", cat:"sign", set:0, final:1, fo:4, ans:false, ja:"本標識は、規制標識、指示標識、警戒標識の3種類だけである。", my:"ပင်မဆိုင်းဘုတ် (本標識) တွင် ကန့်သတ်ဆိုင်းဘုတ်၊ ညွှန်ပြဆိုင်းဘုတ်၊ သတိပေးဆိုင်းဘုတ် ဟူ၍ 3 မျိုးသာ ရှိသည်။", exJa:"誤り。正しくは、本標識は規制標識、指示標識、警戒標識、案内標識の4種類である。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ ပင်မဆိုင်းဘုတ်တွင် ကန့်သတ်၊ ညွှန်ပြ၊ သတိပေး၊ လမ်းညွှန် (案内標識) ဟူ၍ 4 မျိုး ရှိသည်။", src:"教則1章2節"},
 {id:"sign-F-05", cat:"sign", set:0, final:1, fo:5, ans:true, sign:"shingou_ari", ja:"「信号機あり」の標識は、前方に信号機があることを知らせる警戒標識である。", my:"「信号機あり」ဆိုင်းဘုတ်သည် ရှေ့တွင် မီးပွိုင့် ရှိကြောင်း အသိပေးသော သတိပေးဆိုင်းဘုတ် ဖြစ်သည်။", exJa:"正しい。警戒標識は黄色のひし形に黒の記号で、前方の注意すべき状況を前もって知らせる。", exMy:"မှန်သည်။ သတိပေးဆိုင်းဘုတ်သည် အဝါရောင် စိန်ပုံပေါ်တွင် အနက်ရောင် သင်္ကေတ ပါပြီး ရှေ့တွင် သတိထားရမည့် အခြေအနေကို ကြိုတင် အသိပေးသည်။", src:"教則1章2節、付表3（1）"},
 {id:"sign-F-06", cat:"sign", set:0, final:1, fo:6, ans:false, ja:"肢体不自由を理由に免許に条件を付けられている人は、身体障害者マークを必ず付けなければならない。", my:"ခြေလက် မသန်စွမ်းမှုကြောင့် လိုင်စင်တွင် အခြေအနေ သတ်မှတ်ခံရသူသည် မသန်စွမ်းသူ အမှတ်အသား (身体障害者マーク) ကို မဖြစ်မနေ တပ်ရမည်။", exJa:"誤り。正しくは、身体障害者マークは付けるように努める努力義務で、表示義務ではない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ 身体障害者マーク သည် တပ်ရန် ကြိုးစားရမည့် တာဝန် (努力義務) သာ ဖြစ်ပြီး မဖြစ်မနေ တပ်ရမည့် တာဝန် မဟုတ်ပါ။", src:"法71条の6第3項、教則4章1節"},
 {id:"sign-F-07", cat:"sign", set:0, final:1, fo:7, ans:true, sign:"hokousha_senyou", ja:"「歩行者専用」の標識がある道路を特に認められて車で通行するときは、歩行者に注意して徐行しなければならない。", my:"「歩行者専用」ဆိုင်းဘုတ် ရှိသော လမ်းကို အထူးခွင့်ပြုချက်ဖြင့် ယာဉ်ဖြင့် သွားသည့်အခါ လမ်းလျှောက်သူများကို သတိထား၍ ဖြည်းဖြည်းမောင်းရမည်။", exJa:"正しい。歩行者用道路を特に通行を認められた車が通るときは、歩行者に特に注意して徐行しなければならない。", exMy:"မှန်သည်။ လမ်းလျှောက်သူသုံးလမ်းကို ခွင့်ပြုချက်ရှိသော ယာဉ် ဖြတ်သွားလျှင် လမ်းလျှောက်သူများကို အထူး သတိထား၍ ဖြည်းဖြည်းမောင်းရမည်။", src:"法9条、教則5章3節"},

 {id:"sign-F-08", cat:"sign", set:0, final:2, fo:8, ans:false, sign:"juji", ja:"「十形道路交差点あり」の標識は、その交差点で必ず一時停止しなければならないことを示している。", my:"「十形道路交差点あり」ဆိုင်းဘုတ်သည် ထိုလမ်းဆုံတွင် မဖြစ်မနေ ခဏရပ်တန့်ရမည်ဟု ပြသည်။", exJa:"誤り。正しくは、この標識は前方に十形の交差点があることを知らせる警戒標識で、一時停止を指定するものではない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ ဤဆိုင်းဘုတ်သည် ရှေ့တွင် + ပုံ လမ်းဆုံ ရှိကြောင်း အသိပေးသော သတိပေးဆိုင်းဘုတ် ဖြစ်ပြီး ခဏရပ်တန့်ရန် သတ်မှတ်ခြင်း မဟုတ်ပါ။", src:"教則1章2節、付表3（1）"},
 {id:"sign-F-09", cat:"sign", set:0, final:2, fo:9, ans:true, sign:"yusen_douro", ja:"交通整理のない交差点で、交差する道路が優先道路であるときは、徐行して優先道路を通行する車の進行を妨げてはいけない。", my:"မီးပွိုင့်စသည် မထိန်းချုပ်ထားသော လမ်းဆုံတွင် ဖြတ်သွားသော လမ်းသည် ဦးစားပေးလမ်း ဖြစ်လျှင် ဖြည်းဖြည်းမောင်း၍ ဦးစားပေးလမ်းပေါ်မှ ယာဉ်များကို မနှောင့်ယှက်ရ။", exJa:"正しい。交差する道路が優先道路のときは、徐行して、優先道路を通行する車の進行を妨げてはいけない。", exMy:"မှန်သည်။ ဖြတ်သွားသော လမ်းသည် ဦးစားပေးလမ်း ဖြစ်လျှင် ဖြည်းဖြည်းမောင်းပြီး ထိုလမ်းပေါ်မှ ယာဉ်များကို မနှောင့်ယှက်ရ။", src:"法36条2項・3項、教則5章7節"},
 {id:"sign-F-10", cat:"sign", set:0, final:2, fo:10, ans:true, ja:"標示とは、ペイントなどで路面に示された線や記号、文字のことで、規制標示と指示標示の2種類がある。", my:"လမ်းမျက်နှာပြင် အမှတ်အသား (標示) ဆိုသည်မှာ ဆေးသုတ်ခြင်း စသည်ဖြင့် လမ်းပေါ်တွင် ပြထားသော မျဉ်း၊ သင်္ကေတ၊ စာ များဖြစ်ပြီး ကန့်သတ်အမှတ်အသား (規制標示) နှင့် ညွှန်ပြအမှတ်အသား (指示標示) ဟူ၍ 2 မျိုး ရှိသည်။", exJa:"正しい。標示は路面に示された線・記号・文字で、規制標示と指示標示の2種類がある。", exMy:"မှန်သည်။ 標示 သည် လမ်းပေါ်ရှိ မျဉ်း၊ သင်္ကေတ၊ စာ များဖြစ်ပြီး 規制標示 နှင့် 指示標示 ဟူ၍ 2 မျိုး ရှိသည်။", src:"教則1章2節"},
 {id:"sign-F-11", cat:"sign", set:0, final:2, fo:11, ans:false, sign:"shinnyu_kinshi", ja:"「車両進入禁止」の標識がある所でも、一般原動機付自転車ならその方向から入ってよい。", my:"「車両進入禁止」ဆိုင်းဘုတ် ရှိသော နေရာ၌ပင် မော်တာဆိုင်ကယ်ငယ်(原付) ဆိုလျှင် ထိုဘက်မှ ဝင်နိုင်သည်။", exJa:"誤り。正しくは、車両進入禁止は車の進入を禁止する標識で、一般原動機付自転車も車なので入ってはいけない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ 車両進入禁止 သည် ယာဉ်များ ဝင်ခြင်းကို တားမြစ်သော ဆိုင်းဘုတ် ဖြစ်ပြီး 原付 လည်း ယာဉ် ဖြစ်သောကြောင့် မဝင်ရ။", src:"教則付表3（1）3"},
 {id:"sign-F-12", cat:"sign", set:0, final:2, fo:12, ans:false, ja:"聴覚障害を理由に免許に条件を付けられている人は、聴覚障害者マークを付けるよう努めればよく、表示の義務はない。", my:"အကြားအာရုံ ချို့ယွင်းမှုကြောင့် လိုင်စင်တွင် အခြေအနေ သတ်မှတ်ခံရသူသည် အကြားအာရုံချို့ယွင်းသူ အမှတ်အသား (聴覚障害者マーク) ကို တပ်ရန် ကြိုးစားရုံသာ ဖြစ်ပြီး မဖြစ်မနေ တပ်ရန် တာဝန် မရှိပါ။", exJa:"誤り。正しくは、聴覚障害を理由に免許に条件がある人は、聴覚障害者マークを付けなければならない（表示義務）。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ အကြားအာရုံကြောင့် လိုင်စင်တွင် အခြေအနေ သတ်မှတ်ခံရသူသည် 聴覚障害者マーク ကို မဖြစ်မနေ တပ်ရမည်။", src:"法71条の6第1項・2項"},
 {id:"sign-F-13", cat:"sign", set:0, final:2, fo:13, ans:true, sign:"max40", ja:"白地に赤のわく、青の数字で「40」と書かれた標識がある道路では、40km/hを超えて運転してはいけない。", my:"အဖြူရောင်ခံ၊ အနီရောင်ဘောင်၊ အပြာရောင် ဂဏန်းဖြင့်「40」ဟု ရေးထားသော ဆိုင်းဘုတ် ရှိသော လမ်းတွင် တစ်နာရီ 40 ကီလိုမီတာ ထက် ကျော်၍ မမောင်းရ။", exJa:"正しい。これは最高速度の標識で、表示された速度を超えて運転してはいけない。", exMy:"မှန်သည်။ ၎င်းသည် အမြင့်ဆုံးအမြန်နှုန်း ဆိုင်းဘုတ် ဖြစ်ပြီး ပြထားသော အမြန်နှုန်းကို ကျော်၍ မမောင်းရ။", src:"法22条、教則付表3（1）25"},

 {id:"sign-F-14", cat:"sign", set:0, final:3, fo:14, ans:true, sign:"ippou", ja:"「一方通行」の道路で緊急自動車が近づいてきたとき、左に寄るとかえって妨げになる場合は、右に寄って進路を譲る。", my:"「一方通行」လမ်းတွင် အရေးပေါ်ယာဉ် နီးကပ်လာသည့်အခါ ဘယ်ဘက်သို့ ကပ်လျှင် ပို၍ အနှောင့်အယှက် ဖြစ်မည်ဆိုပါက ညာဘက်သို့ ကပ်၍ လမ်းဖယ်ပေးရမည်။", exJa:"正しい。原則は左に寄って進路を譲るが、一方通行の道路で左に寄るとかえって妨げになるときは右に寄る。", exMy:"မှန်သည်။ ပုံမှန်အားဖြင့် ဘယ်ဘက်သို့ ကပ်၍ လမ်းဖယ်ပေးရသော်လည်း တစ်လမ်းမောင်းလမ်းတွင် ဘယ်ကပ်ခြင်းက ပို၍ အနှောင့်အယှက် ဖြစ်လျှင် ညာဘက်သို့ ကပ်ရမည်။", src:"法40条、教則5章2節"},
 {id:"sign-F-15", cat:"sign", set:0, final:3, fo:15, ans:false, sign:"oudan_hodou", ja:"「横断歩道」の標識がある横断歩道の手前30m以内でも、前の車を追い越してよい。", my:"「横断歩道」ဆိုင်းဘုတ် ရှိသော လူကူးမျဉ်းကြား၏ ရှေ့ 30 မီတာ အတွင်း၌ပင် ရှေ့ကားကို ကျော်တက်ခြင်း ပြုနိုင်သည်။", exJa:"誤り。正しくは、横断歩道とその手前30m以内では追越しが禁止されている。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ လူကူးမျဉ်းကြားနှင့် ၎င်း၏ ရှေ့ 30 မီတာ အတွင်းတွင် ကျော်တက်ခြင်းကို တားမြစ်ထားသည်။", src:"法30条、教則5章6節"},
 {id:"sign-F-16", cat:"sign", set:0, final:3, fo:16, ans:true, sign:"diamond_mark", ja:"路面にひし形（◇）の標示があるときは、横断する人がいないことが明らかな場合を除き、横断歩道の手前で停止できる速度で進む。", my:"လမ်းပေါ်တွင် စိန်ပုံ (◇) အမှတ်အသား ရှိလျှင် ဖြတ်ကူးမည့်သူ မရှိကြောင်း သေချာသည့် အခြေအနေမှလွဲ၍ လူကူးမျဉ်းကြား၏ ရှေ့တွင် ရပ်နိုင်သော အမြန်နှုန်းဖြင့် သွားရမည်။", exJa:"正しい。◇は前方に横断歩道等があるという予告で、渡る人がいないことが明らかでなければ、手前で停止できる速度で進む。", exMy:"မှန်သည်။ ◇ သည် ရှေ့တွင် လူကူးမျဉ်းကြား ရှိကြောင်း ကြိုတင်အသိပေးချက် ဖြစ်ပြီး ကူးမည့်သူ မရှိကြောင်း မသေချာလျှင် ရှေ့တွင် ရပ်နိုင်သော အမြန်နှုန်းဖြင့် သွားရမည်။", src:"法38条1項、教則付表3（2）38"},
 {id:"sign-F-17", cat:"sign", set:0, final:3, fo:17, ans:true, ja:"「駐車禁止」の標識の補助標識に「8-20」とあるときは、8時から20時まで駐車が禁止されていることを示す。", my:"「駐車禁止」ဆိုင်းဘုတ်၏ အထောက်အကူဆိုင်းဘုတ် (補助標識) တွင်「8-20」ဟု ပါလျှင် နံနက် 8 နာရီမှ ည 8 နာရီ (20 နာရီ) အထိ ယာဉ်ရပ်နားခြင်း(駐車) တားမြစ်ထားကြောင်း ပြသည်။", exJa:"正しい。「8-20」は規制が行われている時間を示し、8時から20時までであることを表す。", exMy:"မှန်သည်။「8-20」သည် စည်းကမ်း သက်ရောက်သည့် အချိန်ကို ပြပြီး 8 နာရီမှ 20 နာရီ အထိ ဖြစ်ကြောင်း ဆိုလိုသည်။", src:"教則付表3（1）備考"},
 {id:"sign-F-18", cat:"sign", set:0, final:3, fo:18, ans:false, sign:"fumikiri", ja:"踏切では、前の車に続いて通過するときは、一時停止をしなくてよい。", my:"ရထားလမ်းကူးတွင် ရှေ့ကားနောက်မှ လိုက်၍ ဖြတ်သွားသည့်အခါ ခဏရပ်တန့်ခြင်း မလိုပါ။", exJa:"誤り。正しくは、前の車に続いて通過するときも、踏切の直前で一時停止し、安全を確かめなければならない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ ရှေ့ကားနောက်မှ လိုက်သွားလျှင်ပင် ရထားလမ်းကူး၏ ရှေ့တွင် ခဏရပ်တန့်ပြီး ဘေးကင်းကြောင်း စစ်ဆေးရမည်။", src:"法33条1項、教則6章1節"},
 {id:"sign-F-19", cat:"sign", set:0, final:3, fo:19, ans:false, ja:"仮免許で練習中の車は初心者マークを付けていないので、危険がなければその車の前に割り込んでもよい。", my:"ယာယီလိုင်စင်ဖြင့် လေ့ကျင့်နေသော ကားသည် 初心者マーク မတပ်ထားသဖြင့် အန္တရာယ် မရှိလျှင် ထိုကား၏ ရှေ့သို့ ဖြတ်ဝင်နိုင်သည်။", exJa:"誤り。正しくは、仮免許で練習中の車にも、危険を避けるためやむを得ない場合のほか、幅寄せや割り込みをしてはいけない。", exMy:"မှားသည်။ မှန်ကန်ချက်မှာ ယာယီလိုင်စင်ဖြင့် လေ့ကျင့်နေသော ကားကိုလည်း အန္တရာယ်ရှောင်ရန် မလွှဲသာသော အခြေအနေမှလွဲ၍ ဘေးမှ ကပ်ဖိခြင်း၊ ရှေ့သို့ ဖြတ်ဝင်ခြင်း မပြုရ။", src:"教則5章3節"}
);
QUESTIONS.push(
 {id:"sokudo-1-01", cat:"sokudo", set:1, final:0, fo:0, ans:true, ja:"中央線がある一般道路で、標識などで最高速度が指定されていないとき、普通自動車の最高速度は60km/hである。", my:"လမ်းအလယ်မျဉ်း ရှိသော အထွေထွေလမ်း(一般道路)တွင် ယာဉ်စည်းကမ်းဆိုင်းဘုတ် စသည်ဖြင့် အမြင့်ဆုံးအမြန်နှုန်း မသတ်မှတ်ထားလျှင် သာမန်မော်တော်ကား(普通自動車)၏ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 60 ကီလိုမီတာ ဖြစ်သည်။", exJa:"正しい。中央線か車両通行帯がある一般道路では、指定がなければ自動車の最高速度は60km/hである。", exMy:"မှန်သည်။ လမ်းအလယ်မျဉ်း သို့မဟုတ် ယာဉ်သွားလမ်းကြော ရှိသော အထွေထွေလမ်းတွင် သတ်မှတ်ချက် မရှိလျှင် မော်တော်ကား၏ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 60 ကီလိုမီတာ ဖြစ်သည်။", src:"令11条"},
 {id:"sokudo-1-02", cat:"sokudo", set:1, final:0, fo:0, ans:true, ja:"一般原動機付自転車の法定最高速度は30km/hである。", my:"မော်တာဆိုင်ကယ်ငယ်(原付)၏ ဥပဒေသတ်မှတ် အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 30 ကီလိုမီတာ ဖြစ်သည်။", exJa:"正しい。一般原動機付自転車は、標識などの指定がなくても30km/hを超えて運転してはいけない。", exMy:"မှန်သည်။ မော်တာဆိုင်ကယ်ငယ်(原付)ကို ဆိုင်းဘုတ် စသည်ဖြင့် သတ်မှတ်ချက် မရှိသော်လည်း တစ်နာရီ 30 ကီလိုမီတာထက် ပိုမြန်အောင် မမောင်းရ။", src:"令11条、教則5章4節"},
 {id:"sokudo-1-03", cat:"sokudo", set:1, final:0, fo:0, ans:false, ja:"中央線のある一般道路で、標識により最高速度40km/hが指定されているときでも、法定速度の60km/hまでなら出してよい。", my:"လမ်းအလယ်မျဉ်း ရှိသော အထွေထွေလမ်း(一般道路)တွင် ယာဉ်စည်းကမ်းဆိုင်းဘုတ်ဖြင့် အမြင့်ဆုံးအမြန်နှုန်း တစ်နာရီ 40 ကီလိုမီတာ သတ်မှတ်ထားလျှင်ပင် ဥပဒေသတ်မှတ်အမြန်နှုန်း တစ်နာရီ 60 ကီလိုမီတာအထိ မောင်းနိုင်သည်။", exJa:"誤り。正しくは、標識や標示で最高速度が指定されていれば、その速度（この場合40km/h）を超えてはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ဆိုင်းဘုတ် သို့မဟုတ် လမ်းမျက်နှာပြင် အမှတ်အသားဖြင့် အမြင့်ဆုံးအမြန်နှုန်း သတ်မှတ်ထားလျှင် ထိုအမြန်နှုန်း(ဤနေရာတွင် တစ်နာရီ 40 ကီလိုမီတာ)ကို မကျော်ရ။", src:"法22条"},
 {id:"sokudo-1-04", cat:"sokudo", set:1, final:0, fo:0, ans:true, ja:"停止距離とは、空走距離と制動距離を合わせた距離である。", my:"ရပ်တန့်အကွာအဝေး(停止距離)ဆိုသည်မှာ ဘရိတ်မမိခင် ပြေးသွားသောအကွာအဝေး(空走距離)နှင့် ဘရိတ်မိပြီးနောက် ရပ်သည်အထိ အကွာအဝေး(制動距離)ကို ပေါင်းထားသော အကွာအဝေး ဖြစ်သည်။", exJa:"正しい。危険を感じてブレーキが効き始めるまでの空走距離と、効き始めてから止まるまでの制動距離の合計が停止距離である。", exMy:"မှန်သည်။ အန္တရာယ်ကို သတိထားမိပြီး ဘရိတ်စမိသည်အထိ ပြေးသွားသော အကွာအဝေး(空走距離)နှင့် ဘရိတ်မိပြီး ရပ်သည်အထိ အကွာအဝေး(制動距離) ပေါင်းခြင်းသည် ရပ်တန့်အကွာအဝေး ဖြစ်သည်။", src:"教則5章4節"},
 {id:"sokudo-1-05", cat:"sokudo", set:1, final:0, fo:0, ans:false, ja:"速度が2倍になると、制動距離も約2倍になる。", my:"အမြန်နှုန်း 2 ဆ ဖြစ်လာလျှင် ဘရိတ်မိပြီးနောက် ရပ်သည်အထိ အကွာအဝေး(制動距離)လည်း 2 ဆခန့်သာ ဖြစ်လာသည်။", exJa:"誤り。正しくは、制動距離は速度の2乗に比例するので、速度が2倍になると約4倍になる。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ 制動距離 သည် အမြန်နှုန်း၏ နှစ်ထပ်ကိန်းနှင့် အချိုးကျသဖြင့် အမြန်နှုန်း 2 ဆ ဖြစ်လျှင် 4 ဆခန့် ဖြစ်လာသည်။", src:"教則4章5節"},
 {id:"sokudo-1-06", cat:"sokudo", set:1, final:0, fo:0, ans:true, ja:"徐行とは、車がすぐに停止できるような速度で進むことである。", my:"ဖြည်းဖြည်းမောင်းခြင်း(徐行)ဆိုသည်မှာ ယာဉ်ကို ချက်ချင်း ရပ်နိုင်သော အမြန်နှုန်းဖြင့် မောင်းသွားခြင်း ဖြစ်သည်။", exJa:"正しい。徐行は、車が直ちに停止できるような速度で進行することをいう。", exMy:"မှန်သည်။ 徐行 ဆိုသည်မှာ ယာဉ်ကို ချက်ချင်း ရပ်တန့်နိုင်သော အမြန်နှုန်းဖြင့် ရှေ့သို့ သွားခြင်းကို ဆိုလိုသည်။", src:"法2条1項20号、教則5章4節"},
 {id:"sokudo-1-07", cat:"sokudo", set:1, final:0, fo:0, ans:false, ja:"交通整理が行われていない左右の見通しがきかない交差点は、そのままの速度で通過してよい。", my:"မီးပွိုင့် စသည်ဖြင့် ယာဉ်ထိန်းချုပ်မှု မရှိဘဲ ဘယ်ညာ မမြင်ရသော လမ်းဆုံကို အမြန်နှုန်း မလျှော့ဘဲ ဖြတ်သွားနိုင်သည်။", exJa:"誤り。正しくは、交通整理のない左右の見通しがきかない交差点は、優先道路を通行している場合を除き徐行しなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ယာဉ်ထိန်းချုပ်မှု မရှိဘဲ ဘယ်ညာ မမြင်ရသော လမ်းဆုံတွင် ဦးစားပေးလမ်းကို သွားနေသည့်အခါမှအပ ဖြည်းဖြည်းမောင်းခြင်း(徐行) ပြုရမည်။", src:"法42条"},
 {id:"sokudo-1-08", cat:"sokudo", set:1, final:0, fo:0, ans:true, ja:"高速自動車国道の本線車道では、標識などの指定がなければ、普通自動車の最高速度は100km/hである。", my:"အမြန်လမ်း(高速自動車国道)၏ ပင်မလမ်းကြော(本線車道)တွင် ဆိုင်းဘုတ် စသည်ဖြင့် သတ်မှတ်ချက် မရှိလျှင် သာမန်မော်တော်ကား(普通自動車)၏ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 100 ကီလိုမီတာ ဖြစ်သည်။", exJa:"正しい。高速自動車国道の本線車道での普通自動車の最高速度は、指定がなければ100km/hである。", exMy:"မှန်သည်။ အမြန်လမ်း၏ ပင်မလမ်းကြောတွင် သာမန်မော်တော်ကား၏ အမြင့်ဆုံးအမြန်နှုန်းသည် သတ်မှတ်ချက် မရှိလျှင် တစ်နာရီ 100 ကီလိုမီတာ ဖြစ်သည်။", src:"令27条"},
 {id:"sokudo-1-09", cat:"sokudo", set:1, final:0, fo:0, ans:false, ja:"路面が雨にぬれ、タイヤがすり減っているときは、停止距離は乾燥した路面のときより短くなる。", my:"လမ်းမျက်နှာပြင် မိုးရေစို၍ တာယာ ပွန်းစားနေသည့်အခါ ရပ်တန့်အကွာအဝေး(停止距離)သည် ခြောက်သွေ့သော လမ်းထက် တိုသွားသည်။", exJa:"誤り。正しくは、雨にぬれた路面ですり減ったタイヤのときは、停止距離は2倍程度に延びることがある。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ မိုးရေစိုသော လမ်းနှင့် ပွန်းစားနေသော တာယာဖြစ်လျှင် ရပ်တန့်အကွာအဝေးသည် 2 ဆခန့်အထိ ရှည်လာနိုင်သည်။", src:"教則5章4節"},
 {id:"sokudo-1-10", cat:"sokudo", set:1, final:0, fo:0, ans:false, ja:"緊急自動車が一般道路を通行するときの最高速度は100km/hである。", my:"အရေးပေါ်ယာဉ်သည် အထွေထွေလမ်း(一般道路)တွင် သွားသည့်အခါ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 100 ကီလိုမီတာ ဖြစ်သည်။", exJa:"誤り。正しくは、緊急自動車が一般道路を通行するときの最高速度は80km/hである。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ အရေးပေါ်ယာဉ်သည် အထွေထွေလမ်းတွင် သွားသည့်အခါ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 80 ကီလိုမီတာ ဖြစ်သည်။", src:"令12条3項"},

 {id:"sokudo-2-01", cat:"sokudo", set:2, final:0, fo:0, ans:true, ja:"中央線も車両通行帯もない一般道路で最高速度の指定がないとき、自動車の最高速度は30km/hである。", my:"လမ်းအလယ်မျဉ်းလည်း မရှိ၊ ယာဉ်သွားလမ်းကြောလည်း မရှိသော အထွေထွေလမ်း(一般道路)တွင် အမြင့်ဆုံးအမြန်နှုန်း သတ်မှတ်ချက် မရှိလျှင် မော်တော်ကား၏ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 30 ကီလိုမီတာ ဖြစ်သည်။", exJa:"正しい。2026年9月1日から、中央線も車両通行帯もない一般道路（生活道路）の自動車の法定最高速度は30km/hになった。", exMy:"မှန်သည်။ 2026 ခုနှစ် စက်တင်ဘာ 1 ရက်မှစ၍ လမ်းအလယ်မျဉ်းနှင့် ယာဉ်သွားလမ်းကြော မရှိသော အထွေထွေလမ်း(နေထိုင်ရာလမ်း)တွင် မော်တော်ကား၏ ဥပဒေသတ်မှတ် အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 30 ကီလိုမီတာ ဖြစ်သည်။", src:"令11条（2026年9月1日施行）"},
 {id:"sokudo-2-02", cat:"sokudo", set:2, final:0, fo:0, ans:false, ja:"中央線がある一般道路では、一般原動機付自転車も60km/hまで出してよい。", my:"လမ်းအလယ်မျဉ်း ရှိသော အထွေထွေလမ်းတွင် မော်တာဆိုင်ကယ်ငယ်(原付)လည်း တစ်နာရီ 60 ကီလိုမီတာအထိ မောင်းနိုင်သည်။", exJa:"誤り。正しくは、一般原動機付自転車の最高速度は道路にかかわらず30km/hで、60km/hは出せない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ မော်တာဆိုင်ကယ်ငယ်(原付)၏ အမြင့်ဆုံးအမြန်နှုန်းသည် မည်သည့်လမ်းတွင်မဆို တစ်နာရီ 30 ကီလိုမီတာ ဖြစ်ပြီး 60 ကီလိုမီတာ မမောင်းရ။", src:"令11条"},
 {id:"sokudo-2-03", cat:"sokudo", set:2, final:0, fo:0, ans:true, ja:"標識や標示で最高速度が指定されている道路では、その最高速度を超えて運転してはいけない。", my:"ယာဉ်စည်းကမ်းဆိုင်းဘုတ် သို့မဟုတ် လမ်းမျက်နှာပြင် အမှတ်အသားဖြင့် အမြင့်ဆုံးအမြန်နှုန်း သတ်မှတ်ထားသော လမ်းတွင် ထိုအမြန်နှုန်းထက် ကျော်၍ မမောင်းရ။", exJa:"正しい。標識・標示で指定された最高速度があれば、それが守るべき最高速度である。", exMy:"မှန်သည်။ ဆိုင်းဘုတ် သို့မဟုတ် လမ်းမျက်နှာပြင် အမှတ်အသားဖြင့် သတ်မှတ်ထားသော အမြင့်ဆုံးအမြန်နှုန်း ရှိလျှင် ထိုအမြန်နှုန်းကို လိုက်နာရမည်။", src:"法22条"},
 {id:"sokudo-2-04", cat:"sokudo", set:2, final:0, fo:0, ans:false, ja:"最高速度の範囲内であれば、雨や霧で見通しが悪くても速度を落とす必要はない。", my:"အမြင့်ဆုံးအမြန်နှုန်း အတွင်းဖြစ်လျှင် မိုး သို့မဟုတ် မြူကြောင့် မြင်ကွင်း မကောင်းသော်လည်း အမြန်နှုန်း လျှော့ရန် မလိုအပ်ပါ။", exJa:"誤り。正しくは、決められた速度の範囲内でも、道路や交通の状況、天候や視界を考えて安全な速度で走らなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ သတ်မှတ်အမြန်နှုန်း အတွင်းဖြစ်သော်လည်း လမ်းနှင့် ယာဉ်အခြေအနေ၊ ရာသီဥတုနှင့် မြင်ကွင်းကို စဉ်းစား၍ ဘေးကင်းသော အမြန်နှုန်းဖြင့် မောင်းရမည်။", src:"教則5章4節、法70条"},
 {id:"sokudo-2-05", cat:"sokudo", set:2, final:0, fo:0, ans:true, ja:"高速自動車国道の本線車道では、標識などの指定がなければ、最低速度は50km/hである。", my:"အမြန်လမ်း(高速自動車国道)၏ ပင်မလမ်းကြော(本線車道)တွင် ဆိုင်းဘုတ် စသည်ဖြင့် သတ်မှတ်ချက် မရှိလျှင် အနိမ့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 50 ကီလိုမီတာ ဖြစ်သည်။", exJa:"正しい。高速自動車国道の本線車道の最低速度は50km/hである（往復の方向別に分離されていない本線車道を除く）。", exMy:"မှန်သည်။ အမြန်လမ်း၏ ပင်မလမ်းကြော၏ အနိမ့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 50 ကီလိုမီတာ ဖြစ်သည်(အသွားအပြန် ခွဲခြားမထားသော ပင်မလမ်းကြောမှအပ)။", src:"令27条の2、27条の3"},
 {id:"sokudo-2-06", cat:"sokudo", set:2, final:0, fo:0, ans:false, ja:"運転者が疲れているときは、危険を感じてからブレーキが効き始めるまでの空走距離が短くなる。", my:"ယာဉ်မောင်းသူ ပင်ပန်းနေသည့်အခါ အန္တရာယ်ကို သတိထားမိပြီး ဘရိတ်စမိသည်အထိ ပြေးသွားသောအကွာအဝေး(空走距離) တိုသွားသည်။", exJa:"誤り。正しくは、疲れているときは危険を認知して判断するまでに時間がかかるので、空走距離は長くなる。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ပင်ပန်းနေလျှင် အန္တရာယ်ကို သိပြီး ဆုံးဖြတ်ရန် အချိန်ပိုကြာသဖြင့် 空走距離 ပိုရှည်လာသည်။", src:"教則5章4節"},
 {id:"sokudo-2-07", cat:"sokudo", set:2, final:0, fo:0, ans:true, ja:"道路の曲がり角付近では、徐行しなければならない。", my:"လမ်းကွေ့ထောင့်အနီးတွင် ဖြည်းဖြည်းမောင်းခြင်း(徐行) ပြုရမည်။", exJa:"正しい。道路の曲がり角付近は、徐行しなければならない場所である。", exMy:"မှန်သည်။ လမ်းကွေ့ထောင့်အနီးသည် ဖြည်းဖြည်းမောင်းခြင်း(徐行) ပြုရမည့်နေရာ ဖြစ်သည်။", src:"法42条"},
 {id:"sokudo-2-08", cat:"sokudo", set:2, final:0, fo:0, ans:false, ja:"こう配の急な上り坂は、徐行しなければならない場所である。", my:"မတ်စောက်သော တက်လမ်းသည် ဖြည်းဖြည်းမောင်းခြင်း(徐行) ပြုရမည့်နေရာ ဖြစ်သည်။", exJa:"誤り。正しくは、徐行すべき坂は「上り坂の頂上付近」と「こう配の急な下り坂」で、急な上り坂は含まれない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ 徐行 ပြုရမည့် လမ်းစောင်းများမှာ 「တက်လမ်း၏ ထိပ်အနီး」နှင့် 「မတ်စောက်သော ဆင်းလမ်း」 ဖြစ်ပြီး မတ်စောက်သော တက်လမ်း မပါဝင်ပါ။", src:"法42条"},
 {id:"sokudo-2-09", cat:"sokudo", set:2, final:0, fo:0, ans:true, ja:"高速道路で、路面が乾燥しタイヤが新しいとき、80km/hでは約80mの車間距離が必要である。", my:"အမြန်လမ်းတွင် လမ်းမျက်နှာပြင် ခြောက်သွေ့ပြီး တာယာ အသစ်ဖြစ်သည့်အခါ တစ်နာရီ 80 ကီလိုမီတာဖြင့် မောင်းလျှင် ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေး 80 မီတာခန့် လိုအပ်သည်။", exJa:"正しい。乾燥路面で新しいタイヤのとき、100km/hで約100m、80km/hで約80mの車間距離が必要である。", exMy:"မှန်သည်။ ခြောက်သွေ့သော လမ်းနှင့် တာယာအသစ်ဖြစ်လျှင် တစ်နာရီ 100 ကီလိုမီတာတွင် 100 မီတာခန့်၊ 80 ကီလိုမီတာတွင် 80 မီတာခန့် ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေး လိုအပ်သည်။", src:"教則7章2節"},
 {id:"sokudo-2-10", cat:"sokudo", set:2, final:0, fo:0, ans:false, ja:"大型貨物自動車の高速自動車国道での最高速度は、指定がなければ100km/hである。", my:"ကုန်တင်ကားကြီး(大型貨物自動車)၏ အမြန်လမ်း(高速自動車国道)ပေါ်ရှိ အမြင့်ဆုံးအမြန်နှုန်းသည် သတ်မှတ်ချက် မရှိလျှင် တစ်နာရီ 100 ကီလိုမီတာ ဖြစ်သည်။", exJa:"誤り。正しくは、大型貨物自動車の高速自動車国道での最高速度は90km/hである。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ကုန်တင်ကားကြီး၏ အမြန်လမ်းပေါ်ရှိ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 90 ကီလိုမီတာ ဖြစ်သည်။", src:"令27条"},

 {id:"sokudo-3-01", cat:"sokudo", set:3, final:0, fo:0, ans:false, ja:"中央線も車両通行帯もない一般道路でも、最高速度の指定がなければ、自動車は60km/hまで出してよい。", my:"လမ်းအလယ်မျဉ်းနှင့် ယာဉ်သွားလမ်းကြော မရှိသော အထွေထွေလမ်း(一般道路)တွင်ပင် အမြင့်ဆုံးအမြန်နှုန်း သတ်မှတ်ချက် မရှိလျှင် မော်တော်ကားသည် တစ်နာရီ 60 ကီလိုမီတာအထိ မောင်းနိုင်သည်။", exJa:"誤り。正しくは、2026年9月1日から、中央線も車両通行帯もない一般道路の自動車の法定最高速度は30km/hである。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ 2026 ခုနှစ် စက်တင်ဘာ 1 ရက်မှစ၍ လမ်းအလယ်မျဉ်းနှင့် ယာဉ်သွားလမ်းကြော မရှိသော အထွေထွေလမ်းတွင် မော်တော်ကား၏ ဥပဒေသတ်မှတ် အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 30 ကီလိုမီတာ ဖြစ်သည်။", src:"令11条（2026年9月1日施行）"},
 {id:"sokudo-3-02", cat:"sokudo", set:3, final:0, fo:0, ans:true, ja:"カーブで車を外側へ滑り出させようとする遠心力は、速度の2乗に比例して大きくなる。", my:"လမ်းကွေ့တွင် ယာဉ်ကို အပြင်ဘက်သို့ ချော်ထွက်စေသော ဗဟိုမှထွက်ခွာအား(遠心力)သည် အမြန်နှုန်း၏ နှစ်ထပ်ကိန်းနှင့် အချိုးကျ၍ ကြီးလာသည်။", exJa:"正しい。遠心力は速度の2乗に比例するので、カーブの手前の直線部分で十分に速度を落とす。", exMy:"မှန်သည်။ 遠心力 သည် အမြန်နှုန်း၏ နှစ်ထပ်ကိန်းနှင့် အချိုးကျသဖြင့် လမ်းကွေ့ မရောက်မီ ဖြောင့်သောနေရာတွင် အမြန်နှုန်းကို လုံလောက်စွာ လျှော့ရမည်။", src:"教則4章5節"},
 {id:"sokudo-3-03", cat:"sokudo", set:3, final:0, fo:0, ans:false, ja:"制動距離とは、運転者が危険を感じてからブレーキが効き始めるまでに車が走る距離である。", my:"ဘရိတ်မိပြီးနောက် ရပ်သည်အထိ အကွာအဝေး(制動距離)ဆိုသည်မှာ ယာဉ်မောင်းသူ အန္တရာယ်ကို သတိထားမိပြီး ဘရိတ်စမိသည်အထိ ယာဉ် ပြေးသွားသော အကွာအဝေး ဖြစ်သည်။", exJa:"誤り。正しくは、それは空走距離である。制動距離は、ブレーキが効き始めてから車が停止するまでの距離である。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ၎င်းသည် 空走距離 ဖြစ်သည်။ 制動距離 ဆိုသည်မှာ ဘရိတ်စမိပြီးနောက် ယာဉ်ရပ်သည်အထိ အကွာအဝေး ဖြစ်သည်။", src:"教則5章4節"},
 {id:"sokudo-3-04", cat:"sokudo", set:3, final:0, fo:0, ans:true, ja:"前の車が急に止まっても追突しないような、安全な車間距離をとらなければならない。", my:"ရှေ့ကား ရုတ်တရက် ရပ်သွားသော်လည်း နောက်မှ မတိုက်မိစေရန် ဘေးကင်းသော ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေး ထားရမည်။", exJa:"正しい。前の車が急停止しても追突を避けられる距離を保つことが義務づけられている。", exMy:"မှန်သည်။ ရှေ့ကား ရုတ်တရက် ရပ်လျှင်ပင် တိုက်မိခြင်းကို ရှောင်နိုင်သော အကွာအဝေးကို ထိန်းထားရန် တာဝန်ရှိသည်။", src:"法26条"},
 {id:"sokudo-3-05", cat:"sokudo", set:3, final:0, fo:0, ans:false, ja:"高速道路では、雨で路面がぬれ、タイヤが減っているときでも、車間距離は乾燥時と同じでよい。", my:"အမြန်လမ်းတွင် မိုးကြောင့် လမ်းစို၍ တာယာ ပွန်းစားနေသည့်အခါတွင်ပင် ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေးကို ခြောက်သွေ့ချိန်နှင့် အတူတူ ထားလျှင် ရသည်။", exJa:"誤り。正しくは、路面が雨にぬれタイヤが減っているときは、乾燥時の約2倍程度の車間距離が必要になることがある。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လမ်းမိုးရေစို၍ တာယာ ပွန်းစားနေလျှင် ခြောက်သွေ့ချိန်၏ 2 ဆခန့် အကွာအဝေး လိုအပ်နိုင်သည်။", src:"教則7章2節"},
 {id:"sokudo-3-06", cat:"sokudo", set:3, final:0, fo:0, ans:true, ja:"こう配の急な下り坂では、徐行しなければならない。", my:"မတ်စောက်သော ဆင်းလမ်းတွင် ဖြည်းဖြည်းမောင်းခြင်း(徐行) ပြုရမည်။", exJa:"正しい。こう配の急な下り坂は、徐行しなければならない場所である。", exMy:"မှန်သည်။ မတ်စောက်သော ဆင်းလမ်းသည် ဖြည်းဖြည်းမောင်းခြင်း(徐行) ပြုရမည့်နေရာ ဖြစ်သည်။", src:"法42条"},
 {id:"sokudo-3-07", cat:"sokudo", set:3, final:0, fo:0, ans:true, ja:"優先道路を通行しているときは、左右の見通しがきかない交差点でも徐行しなくてよい。", my:"ဦးစားပေးလမ်းကို သွားနေသည့်အခါ ဘယ်ညာ မမြင်ရသော လမ်းဆုံတွင်ပင် ဖြည်းဖြည်းမောင်းခြင်း(徐行) မလိုအပ်ပါ။", exJa:"正しい。左右の見通しがきかない交差点の徐行義務は、交通整理が行われている場合と優先道路を通行している場合は除かれる。", exMy:"မှန်သည်။ ဘယ်ညာ မမြင်ရသော လမ်းဆုံတွင် 徐行 ပြုရမည့် တာဝန်သည် ယာဉ်ထိန်းချုပ်မှု ရှိသည့်အခါနှင့် ဦးစားပေးလမ်းကို သွားနေသည့်အခါတွင် မသက်ဆိုင်ပါ။", src:"法42条"},
 {id:"sokudo-3-08", cat:"sokudo", set:3, final:0, fo:0, ans:false, ja:"「徐行」の標識がある場所でも、前方に車や歩行者がいなければ徐行しなくてよい。", my:"「徐行」 ယာဉ်စည်းကမ်းဆိုင်းဘုတ် ရှိသောနေရာတွင်ပင် ရှေ့တွင် ယာဉ် သို့မဟုတ် လမ်းလျှောက်သူ မရှိလျှင် ဖြည်းဖြည်းမောင်းခြင်း(徐行) မလိုအပ်ပါ။", exJa:"誤り。正しくは、「徐行」の標識がある場所では、ほかの車や歩行者の有無にかかわらず徐行しなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ 「徐行」 ဆိုင်းဘုတ် ရှိသောနေရာတွင် အခြားယာဉ် သို့မဟုတ် လမ်းလျှောက်သူ ရှိသည်ဖြစ်စေ မရှိသည်ဖြစ်စေ 徐行 ပြုရမည်။", src:"法42条、教則5章4節"},
 {id:"sokudo-3-09", cat:"sokudo", set:3, final:0, fo:0, ans:false, ja:"一般原動機付自転車は、標識で最高速度40km/hが指定されている道路では、40km/hまで出してよい。", my:"မော်တာဆိုင်ကယ်ငယ်(原付)သည် ဆိုင်းဘုတ်ဖြင့် အမြင့်ဆုံးအမြန်နှုန်း တစ်နာရီ 40 ကီလိုမီတာ သတ်မှတ်ထားသော လမ်းတွင် 40 ကီလိုမီတာအထိ မောင်းနိုင်သည်။", exJa:"誤り。正しくは、一般原動機付自転車は30km/hを超えてはいけない。30km/h以下の指定があるときだけ、その速度に従う。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ မော်တာဆိုင်ကယ်ငယ်(原付)သည် တစ်နာရီ 30 ကီလိုမီတာထက် မကျော်ရ။ 30 ကီလိုမီတာအောက် သတ်မှတ်ထားမှသာ ထိုအမြန်နှုန်းကို လိုက်နာရသည်။", src:"令11条、教則5章4節"},
 {id:"sokudo-3-10", cat:"sokudo", set:3, final:0, fo:0, ans:true, ja:"速度が2倍になると、衝突したときの衝撃力は約4倍になる。", my:"အမြန်နှုန်း 2 ဆ ဖြစ်လာလျှင် တိုက်မိသည့်အခါ ဖြစ်ပေါ်သော တိုက်ခိုက်အား(衝撃力)သည် 4 ဆခန့် ဖြစ်လာသည်။", exJa:"正しい。衝撃力は制動距離や遠心力と同じく速度の2乗に比例するので、速度が2倍なら約4倍になる。", exMy:"မှန်သည်။ 衝撃力 သည် 制動距離 နှင့် 遠心力 ကဲ့သို့ပင် အမြန်နှုန်း၏ နှစ်ထပ်ကိန်းနှင့် အချိုးကျသဖြင့် အမြန်နှုန်း 2 ဆ ဖြစ်လျှင် 4 ဆခန့် ဖြစ်လာသည်။", src:"教則4章5節"},

 {id:"sokudo-F-01", cat:"sokudo", set:0, final:1, fo:1, ans:true, ja:"車両通行帯がある一般道路で最高速度の指定がないとき、普通自動車の最高速度は60km/hである。", my:"ယာဉ်သွားလမ်းကြော ရှိသော အထွေထွေလမ်း(一般道路)တွင် အမြင့်ဆုံးအမြန်နှုန်း သတ်မှတ်ချက် မရှိလျှင် သာမန်မော်တော်ကား(普通自動車)၏ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 60 ကီလိုမီတာ ဖြစ်သည်။", exJa:"正しい。車両通行帯か中央線がある一般道路では、指定がなければ自動車の最高速度は60km/hである。", exMy:"မှန်သည်။ ယာဉ်သွားလမ်းကြော သို့မဟုတ် လမ်းအလယ်မျဉ်း ရှိသော အထွေထွေလမ်းတွင် သတ်မှတ်ချက် မရှိလျှင် မော်တော်ကား၏ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 60 ကီလိုမီတာ ဖြစ်သည်။", src:"令11条"},
 {id:"sokudo-F-02", cat:"sokudo", set:0, final:1, fo:2, ans:false, ja:"最高速度の指定がない一般道路なら、中央線の有無にかかわらず、自動車の最高速度は60km/hである。", my:"အမြင့်ဆုံးအမြန်နှုန်း သတ်မှတ်ချက် မရှိသော အထွေထွေလမ်းဖြစ်လျှင် လမ်းအလယ်မျဉ်း ရှိသည်ဖြစ်စေ မရှိသည်ဖြစ်စေ မော်တော်ကား၏ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 60 ကီလိုမီတာ ဖြစ်သည်။", exJa:"誤り。正しくは、2026年9月1日から、中央線も車両通行帯もない一般道路では自動車の最高速度は30km/hである。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ 2026 ခုနှစ် စက်တင်ဘာ 1 ရက်မှစ၍ လမ်းအလယ်မျဉ်းနှင့် ယာဉ်သွားလမ်းကြော မရှိသော အထွေထွေလမ်းတွင် မော်တော်ကား၏ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 30 ကီလိုမီတာ ဖြစ်သည်။", src:"令11条（2026年9月1日施行）"},
 {id:"sokudo-F-03", cat:"sokudo", set:0, final:1, fo:3, ans:true, ja:"緊急自動車が一般道路を通行するときの最高速度は80km/hである。", my:"အရေးပေါ်ယာဉ်သည် အထွေထွေလမ်း(一般道路)တွင် သွားသည့်အခါ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 80 ကီလိုမီတာ ဖြစ်သည်။", exJa:"正しい。緊急自動車の一般道路での最高速度は80km/hと定められている。", exMy:"မှန်သည်။ အရေးပေါ်ယာဉ်၏ အထွေထွေလမ်းပေါ်ရှိ အမြင့်ဆုံးအမြန်နှုန်းကို တစ်နာရီ 80 ကီလိုမီတာဟု သတ်မှတ်ထားသည်။", src:"令12条3項"},
 {id:"sokudo-F-04", cat:"sokudo", set:0, final:1, fo:4, ans:false, ja:"高速自動車国道の本線車道の最低速度は、標識などで指定がなければ40km/hである。", my:"အမြန်လမ်း(高速自動車国道)၏ ပင်မလမ်းကြော(本線車道)၏ အနိမ့်ဆုံးအမြန်နှုန်းသည် ဆိုင်းဘုတ် စသည်ဖြင့် သတ်မှတ်ချက် မရှိလျှင် တစ်နာရီ 40 ကီလိုမီတာ ဖြစ်သည်။", exJa:"誤り。正しくは、最低速度は50km/hである（往復の方向別に分離されていない本線車道には最低速度がない）。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ အနိမ့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 50 ကီလိုမီတာ ဖြစ်သည်(အသွားအပြန် ခွဲခြားမထားသော ပင်မလမ်းကြောတွင် အနိမ့်ဆုံးအမြန်နှုန်း မရှိပါ)။", src:"令27条の2、27条の3"},
 {id:"sokudo-F-05", cat:"sokudo", set:0, final:1, fo:5, ans:true, ja:"雨にぬれた道路を走るときや重い荷物を積んでいるときは、制動距離が長くなる。", my:"မိုးရေစိုသော လမ်းတွင် မောင်းသည့်အခါ သို့မဟုတ် ဝန်လေးများ တင်ထားသည့်အခါ ဘရိတ်မိပြီးနောက် ရပ်သည်အထိ အကွာအဝေး(制動距離) ရှည်လာသည်။", exJa:"正しい。ぬれた路面や重い荷物の積載は制動距離を長くするので、速度を控え車間距離を広くとる。", exMy:"မှန်သည်။ စိုသော လမ်းနှင့် ဝန်လေး တင်ထားခြင်းသည် 制動距離 ကို ရှည်စေသဖြင့် အမြန်နှုန်း လျှော့၍ ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေးကို ပိုထားရမည်။", src:"教則5章4節"},
 {id:"sokudo-F-06", cat:"sokudo", set:0, final:1, fo:6, ans:false, ja:"カーブで働く遠心力は、カーブの半径が大きいほど大きくなる。", my:"လမ်းကွေ့တွင် ဖြစ်ပေါ်သော ဗဟိုမှထွက်ခွာအား(遠心力)သည် လမ်းကွေ့၏ အချင်းဝက် ကြီးလေ ကြီးလာလေ ဖြစ်သည်။", exJa:"誤り。正しくは、遠心力はカーブの半径が小さい（急なカーブ）ほど大きくなる。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ 遠心力 သည် လမ်းကွေ့၏ အချင်းဝက် သေးလေ(ကွေ့ ကျဉ်းလေ) ကြီးလာလေ ဖြစ်သည်။", src:"教則4章5節"},
 {id:"sokudo-F-07", cat:"sokudo", set:0, final:1, fo:7, ans:true, ja:"上り坂の頂上付近は、徐行しなければならない場所である。", my:"တက်လမ်း၏ ထိပ်အနီးသည် ဖြည်းဖြည်းမောင်းခြင်း(徐行) ပြုရမည့်နေရာ ဖြစ်သည်။", exJa:"正しい。上り坂の頂上付近は先が見えないので、徐行しなければならない。", exMy:"မှန်သည်။ တက်လမ်း၏ ထိပ်အနီးတွင် ရှေ့ကို မမြင်ရသဖြင့် ဖြည်းဖြည်းမောင်းခြင်း(徐行) ပြုရမည်။", src:"法42条"},
 {id:"sokudo-F-08", cat:"sokudo", set:0, final:2, fo:8, ans:false, ja:"信号機による交通整理が行われている交差点でも、左右の見通しがきかなければ必ず徐行しなければならない。", my:"မီးပွိုင့်ဖြင့် ယာဉ်ထိန်းချုပ်မှု ပြုလုပ်ထားသော လမ်းဆုံတွင်ပင် ဘယ်ညာ မမြင်ရလျှင် ဖြည်းဖြည်းမောင်းခြင်း(徐行) မဖြစ်မနေ ပြုရမည်။", exJa:"誤り。正しくは、見通しのきかない交差点の徐行義務は、信号機などで交通整理が行われている場合は除かれる。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ဘယ်ညာ မမြင်ရသော လမ်းဆုံတွင် 徐行 ပြုရမည့် တာဝန်သည် မီးပွိုင့် စသည်ဖြင့် ယာဉ်ထိန်းချုပ်မှု ရှိသည့်အခါ မသက်ဆိုင်ပါ။", src:"法42条"},
 {id:"sokudo-F-09", cat:"sokudo", set:0, final:2, fo:9, ans:true, ja:"高速道路で、路面が乾燥しタイヤが新しいとき、100km/hでは約100mの車間距離が必要である。", my:"အမြန်လမ်းတွင် လမ်းမျက်နှာပြင် ခြောက်သွေ့ပြီး တာယာ အသစ်ဖြစ်သည့်အခါ တစ်နာရီ 100 ကီလိုမီတာဖြင့် မောင်းလျှင် ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေး 100 မီတာခန့် လိုအပ်သည်။", exJa:"正しい。乾燥路面で新しいタイヤのとき、100km/hでは約100mの車間距離が必要である。", exMy:"မှန်သည်။ ခြောက်သွေ့သော လမ်းနှင့် တာယာအသစ်ဖြစ်လျှင် တစ်နာရီ 100 ကီလိုမီတာတွင် ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေး 100 မီတာခန့် လိုအပ်သည်။", src:"教則7章2節"},
 {id:"sokudo-F-10", cat:"sokudo", set:0, final:2, fo:10, ans:false, ja:"停止距離は制動距離だけで決まり、運転者が危険を感じてからブレーキを踏むまでの時間には関係しない。", my:"ရပ်တန့်အကွာအဝေး(停止距離)ကို 制動距離 တစ်ခုတည်းဖြင့် ဆုံးဖြတ်ပြီး ယာဉ်မောင်းသူ အန္တရာယ်ကို သတိထားမိပြီး ဘရိတ်နင်းသည်အထိ အချိန်နှင့် မသက်ဆိုင်ပါ။", exJa:"誤り。正しくは、停止距離は空走距離と制動距離の合計で、ブレーキを踏むまでの時間が長いほど空走距離も長くなる。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ 停止距離 သည် 空走距離 နှင့် 制動距離 ပေါင်းခြင်းဖြစ်ပြီး ဘရိတ်နင်းသည်အထိ အချိန် ကြာလေ 空走距離 ရှည်လေ ဖြစ်သည်။", src:"教則5章4節"},
 {id:"sokudo-F-11", cat:"sokudo", set:0, final:2, fo:11, ans:true, ja:"一般原動機付自転車は、中央線のある一般道路でも、指定がなければ30km/hを超えて運転してはいけない。", my:"မော်တာဆိုင်ကယ်ငယ်(原付)သည် လမ်းအလယ်မျဉ်း ရှိသော အထွေထွေလမ်းတွင်ပင် သတ်မှတ်ချက် မရှိလျှင် တစ်နာရီ 30 ကီလိုမီတာထက် ကျော်၍ မမောင်းရ။", exJa:"正しい。一般原動機付自転車の最高速度は、道路の種類にかかわらず30km/hである。", exMy:"မှန်သည်။ မော်တာဆိုင်ကယ်ငယ်(原付)၏ အမြင့်ဆုံးအမြန်နှုန်းသည် လမ်းအမျိုးအစား မည်သို့ပင်ဖြစ်စေ တစ်နာရီ 30 ကီလိုမီတာ ဖြစ်သည်။", src:"令11条"},
 {id:"sokudo-F-12", cat:"sokudo", set:0, final:2, fo:12, ans:false, ja:"高速自動車国道では、標識などの指定がなければ、普通自動車は120km/hまで出してよい。", my:"အမြန်လမ်း(高速自動車国道)တွင် ဆိုင်းဘုတ် စသည်ဖြင့် သတ်မှတ်ချက် မရှိလျှင် သာမန်မော်တော်ကား(普通自動車)သည် တစ်နာရီ 120 ကီလိုမီတာအထိ မောင်းနိုင်သည်။", exJa:"誤り。正しくは、標識などの指定がなければ、普通自動車の最高速度は100km/hである。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ဆိုင်းဘုတ် စသည်ဖြင့် သတ်မှတ်ချက် မရှိလျှင် သာမန်မော်တော်ကား၏ အမြင့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 100 ကီလိုမီတာ ဖြစ်သည်။", src:"令27条"},
 {id:"sokudo-F-13", cat:"sokudo", set:0, final:2, fo:13, ans:true, ja:"決められた速度の範囲内でも、道路や交通の状況、天候や視界をよく考えて安全な速度で走る。", my:"သတ်မှတ်ထားသော အမြန်နှုန်း အတွင်းဖြစ်သော်လည်း လမ်းနှင့် ယာဉ်အခြေအနေ၊ ရာသီဥတုနှင့် မြင်ကွင်းကို ကောင်းစွာ စဉ်းစား၍ ဘေးကင်းသော အမြန်နှုန်းဖြင့် မောင်းရမည်။", exJa:"正しい。最高速度は上限であり、状況に応じてそれより低い安全な速度で走ることが必要である。", exMy:"မှန်သည်။ အမြင့်ဆုံးအမြန်နှုန်းသည် အထက်ကန့်သတ်ချက်သာ ဖြစ်ပြီး အခြေအနေအလိုက် ထိုထက်နိမ့်သော ဘေးကင်းသည့် အမြန်နှုန်းဖြင့် မောင်းရန် လိုအပ်သည်။", src:"教則5章4節、法70条"},
 {id:"sokudo-F-14", cat:"sokudo", set:0, final:3, fo:14, ans:false, ja:"「徐行」の標識がある場所では、必ず一時停止しなければならない。", my:"「徐行」 ယာဉ်စည်းကမ်းဆိုင်းဘုတ် ရှိသောနေရာတွင် မဖြစ်မနေ ခဏရပ်တန့်ခြင်း(一時停止) ပြုရမည်။", exJa:"誤り。正しくは、「徐行」の標識の場所では、すぐ停止できるような速度で進めばよく、一時停止の義務はない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ 「徐行」 ဆိုင်းဘုတ် ရှိသောနေရာတွင် ချက်ချင်း ရပ်နိုင်သော အမြန်နှုန်းဖြင့် သွားရန်သာ လိုပြီး 一時停止 ပြုရန် တာဝန် မရှိပါ။", src:"法42条、法2条1項20号"},
 {id:"sokudo-F-15", cat:"sokudo", set:0, final:3, fo:15, ans:true, ja:"大型貨物自動車の高速自動車国道での最高速度は、指定がなければ90km/hである。", my:"ကုန်တင်ကားကြီး(大型貨物自動車)၏ အမြန်လမ်း(高速自動車国道)ပေါ်ရှိ အမြင့်ဆုံးအမြန်နှုန်းသည် သတ်မှတ်ချက် မရှိလျှင် တစ်နာရီ 90 ကီလိုမီတာ ဖြစ်သည်။", exJa:"正しい。高速自動車国道では、大型貨物自動車の最高速度は90km/hと定められている。", exMy:"မှန်သည်။ အမြန်လမ်းတွင် ကုန်တင်ကားကြီး၏ အမြင့်ဆုံးအမြန်နှုန်းကို တစ်နာရီ 90 ကီလိုမီတာဟု သတ်မှတ်ထားသည်။", src:"令27条"},
 {id:"sokudo-F-16", cat:"sokudo", set:0, final:3, fo:16, ans:false, ja:"大型自動車は運転席が高いので、車間距離を実際より短く感じやすい。", my:"ယာဉ်ကြီး(大型自動車)များသည် ယာဉ်မောင်းထိုင်ခုံ မြင့်သဖြင့် ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေးကို အမှန်ထက် တိုသည်ဟု ခံစားရလွယ်သည်။", exJa:"誤り。正しくは、運転席が高く見下ろす形になるため、車間距離を実際より長く感じ、車間距離が短くなりやすい。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ထိုင်ခုံ မြင့်၍ အောက်သို့ ငုံ့ကြည့်ရသဖြင့် အကွာအဝေးကို အမှန်ထက် ရှည်သည်ဟု ခံစားရပြီး အကွာအဝေး တိုသွားလွယ်သည်။", src:"教則5章4節"},
 {id:"sokudo-F-17", cat:"sokudo", set:0, final:3, fo:17, ans:true, ja:"下り坂では加速がつき停止距離が長くなるので、車間距離を広くとる。", my:"ဆင်းလမ်းတွင် အရှိန်တက်လာ၍ ရပ်တန့်အကွာအဝေး(停止距離) ရှည်လာသဖြင့် ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေးကို ပိုကျယ်စွာ ထားရမည်။", exJa:"正しい。下り坂は加速がついて停止距離が長くなるので、車間距離を広くとる。", exMy:"မှန်သည်။ ဆင်းလမ်းတွင် အရှိန်တက်၍ ရပ်တန့်အကွာအဝေး ရှည်လာသဖြင့် ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေးကို ပိုထားရမည်။", src:"教則6章2節"},
 {id:"sokudo-F-18", cat:"sokudo", set:0, final:3, fo:18, ans:false, ja:"最高速度の指定がない一般道路では、中央線があっても、自動車は30km/hを超えて運転してはいけない。", my:"အမြင့်ဆုံးအမြန်နှုန်း သတ်မှတ်ချက် မရှိသော အထွေထွေလမ်းတွင် လမ်းအလယ်မျဉ်း ရှိသော်လည်း မော်တော်ကားသည် တစ်နာရီ 30 ကီလိုမီတာထက် ကျော်၍ မမောင်းရ။", exJa:"誤り。正しくは、中央線か車両通行帯があれば60km/hである。30km/hになるのは中央線も車両通行帯もない一般道路である。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လမ်းအလယ်မျဉ်း သို့မဟုတ် ယာဉ်သွားလမ်းကြော ရှိလျှင် တစ်နာရီ 60 ကီလိုမီတာ ဖြစ်သည်။ 30 ကီလိုမီတာ ဖြစ်သည်မှာ ၎င်းတို့ မရှိသော အထွေထွေလမ်း ဖြစ်သည်။", src:"令11条"},
 {id:"sokudo-F-19", cat:"sokudo", set:0, final:3, fo:19, ans:true, ja:"信号機がなく優先道路も通行していないとき、左右の見通しがきかない交差点では徐行しなければならない。", my:"မီးပွိုင့်လည်း မရှိ၊ ဦးစားပေးလမ်းကိုလည်း မသွားနေသည့်အခါ ဘယ်ညာ မမြင်ရသော လမ်းဆုံတွင် ဖြည်းဖြည်းမောင်းခြင်း(徐行) ပြုရမည်။", exJa:"正しい。交通整理のない、左右の見通しがきかない交差点は、優先道路を通行している場合を除き徐行しなければならない。", exMy:"မှန်သည်။ ယာဉ်ထိန်းချုပ်မှု မရှိဘဲ ဘယ်ညာ မမြင်ရသော လမ်းဆုံတွင် ဦးစားပေးလမ်းကို သွားနေသည့်အခါမှအပ 徐行 ပြုရမည်။", src:"法42条"}
);

 {id:"tsuko-1-01", cat:"tsuko", set:1, final:0, fo:0, ans:true, ja:"車は、道路の中央（中央線があるときはその中央線）から左の部分を通行しなければならない。", my:"ယာဉ်များသည် လမ်း၏အလယ် (လမ်းအလယ်မျဉ်း ရှိလျှင် ထိုမျဉ်း) မှ ဘယ်ဘက်အပိုင်းတွင် သွားရမည်။", exJa:"正しい。日本は左側通行で、車は道路の中央（中央線）から左の部分を通行する。", exMy:"မှန်သည်။ ဂျပန်တွင် ဘယ်ဘက်မှ သွားခြင်း (左側通行) ဖြစ်၍ ယာဉ်များသည် လမ်းအလယ် (လမ်းအလယ်မျဉ်း) ၏ ဘယ်ဘက်အပိုင်းတွင် သွားရသည်။", src:"法17条4項、教則5章2節"},
 {id:"tsuko-1-02", cat:"tsuko", set:1, final:0, fo:0, ans:false, ja:"片側に2つの車両通行帯がある道路では、原則として右側の通行帯を通行する。", my:"တစ်ဖက်တွင် ယာဉ်သွားလမ်းကြော 2 ခု ရှိသော လမ်းတွင် မူအားဖြင့် ညာဘက် လမ်းကြောတွင် သွားရသည်။", exJa:"誤り。正しくは、原則として左側の通行帯を通行する。右側の通行帯は追越しなどのときに使う。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ မူအားဖြင့် ဘယ်ဘက် လမ်းကြောတွင် သွားရသည်။ ညာဘက် လမ်းကြောကို ကျော်တက်ခြင်း စသည့်အခါမျိုးတွင် အသုံးပြုသည်။", src:"法20条1項、教則5章2節"},
 {id:"tsuko-1-03", cat:"tsuko", set:1, final:0, fo:0, ans:true, ja:"車両通行帯が黄色の線で区切られているところでは、その黄色の線を越えて進路を変えてはいけない。", my:"ယာဉ်သွားလမ်းကြောများကို အဝါရောင်မျဉ်းဖြင့် ပိုင်းခြားထားသော နေရာတွင် ထိုအဝါရောင်မျဉ်းကို ဖြတ်ကျော်၍ လမ်းကြောင်း မပြောင်းရ။", exJa:"正しい。車両通行帯の境の黄色の線は進路変更禁止を表し、その線を越えて進路を変えてはいけない。", exMy:"မှန်သည်။ လမ်းကြောကြားရှိ အဝါရောင်မျဉ်းသည် လမ်းကြောင်းပြောင်းခြင်း တားမြစ်ချက် ဖြစ်၍ ထိုမျဉ်းကို ကျော်ပြီး လမ်းကြောင်း မပြောင်းရ။", src:"法26条の2第3項、教則5章5節"},
 {id:"tsuko-1-04", cat:"tsuko", set:1, final:0, fo:0, ans:true, ja:"優先道路を通行している場合を除き、交差点とその手前30m以内の場所では追越しをしてはいけない。", my:"ဦးစားပေးလမ်းပေါ်တွင် သွားနေသည့်အခါမှအပ လမ်းဆုံ နှင့် ၎င်းသို့ မရောက်မီ 30 မီတာအတွင်း နေရာတွင် ကျော်တက်ခြင်း မပြုရ။", exJa:"正しい。交差点とその手前30m以内は追越し禁止。ただし優先道路を通行しているときは除かれる。", exMy:"မှန်သည်။ လမ်းဆုံ နှင့် ၎င်းသို့ မရောက်မီ 30 မီတာအတွင်းတွင် ကျော်တက်ခြင်းကို တားမြစ်သည်။ သို့သော် ဦးစားပေးလမ်းပေါ်တွင် သွားနေလျှင် ခြွင်းချက် ဖြစ်သည်။", src:"法30条3号、教則5章6節"},
 {id:"tsuko-1-05", cat:"tsuko", set:1, final:0, fo:0, ans:false, ja:"横断歩道とその手前50m以内の場所では、追越しが禁止されている。", my:"လူကူးမျဉ်းကြား နှင့် ၎င်းသို့ မရောက်မီ 50 မီတာအတွင်း နေရာတွင် ကျော်တက်ခြင်းကို တားမြစ်ထားသည်။", exJa:"誤り。正しくは、追越しが禁止されているのは横断歩道とその手前30m以内の場所である。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ကျော်တက်ခြင်း တားမြစ်ရာနေရာသည် လူကူးမျဉ်းကြား နှင့် ၎င်းသို့ မရောက်မီ 30 မီတာအတွင်း ဖြစ်သည်။", src:"法30条3号、教則5章6節"},
 {id:"tsuko-1-06", cat:"tsuko", set:1, final:0, fo:0, ans:false, ja:"前の車が自動車を追い越そうとしているときに、その前の車を追い越してもよい。", my:"ရှေ့ကားက အခြားမော်တော်ယာဉ်ကို ကျော်တက်ရန် ပြုလုပ်နေစဉ် ထိုရှေ့ကားကို ကျော်တက်နိုင်သည်။", exJa:"誤り。正しくは、前の車が自動車を追い越そうとしているときに追越しを始めること（二重追越し）は禁止されている。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ရှေ့ကားက မော်တော်ယာဉ်ကို ကျော်တက်နေစဉ် ထပ်၍ ကျော်တက်ခြင်း (二重追越し) ကို တားမြစ်ထားသည်။", src:"法29条、教則5章6節"},
 {id:"tsuko-1-07", cat:"tsuko", set:1, final:0, fo:0, ans:true, ja:"ほかの車を追い越すときは、原則としてその車の右側を通行しなければならない。", my:"အခြားယာဉ်ကို ကျော်တက်သည့်အခါ မူအားဖြင့် ထိုယာဉ်၏ ညာဘက်မှ ဖြတ်သွားရမည်။", exJa:"正しい。追越しは原則として右側から行う。右折のため中央に寄っている車などは左側から追い越す。", exMy:"မှန်သည်။ ကျော်တက်ခြင်းကို မူအားဖြင့် ညာဘက်မှ ပြုလုပ်ရသည်။ ညာကွေ့ရန် လမ်းအလယ်သို့ ကပ်နေသော ယာဉ် စသည်ကိုမူ ဘယ်ဘက်မှ ကျော်တက်ရသည်။", src:"法28条1項、教則5章6節"},
 {id:"tsuko-1-08", cat:"tsuko", set:1, final:0, fo:0, ans:true, ja:"ほかの車に追い越されるときは、相手の追越しが終わるまで速度を上げてはいけない。", my:"အခြားယာဉ်က မိမိကို ကျော်တက်နေစဉ် ထိုကျော်တက်ခြင်း မပြီးမချင်း အရှိန် မမြှင့်ရ။", exJa:"正しい。追い越されるときは、追越しが終わるまで速度を上げてはいけない。", exMy:"မှန်သည်။ ကျော်တက်ခံရသည့်အခါ ကျော်တက်ခြင်း ပြီးဆုံးသည်အထိ အရှိန် မမြှင့်ရ။", src:"法27条1項、教則5章6節"},
 {id:"tsuko-1-09", cat:"tsuko", set:1, final:0, fo:0, ans:false, ja:"交差点付近で緊急自動車が近づいてきたときは、交差点の中で止まって進路を譲らなければならない。", my:"လမ်းဆုံအနီးတွင် အရေးပေါ်ယာဉ် နီးကပ်လာသည့်အခါ လမ်းဆုံအတွင်း၌ ရပ်၍ လမ်းဖယ်ပေးရမည်။", exJa:"誤り。正しくは、交差点を避けて道路の左側に寄り、一時停止しなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လမ်းဆုံကို ရှောင်ပြီး လမ်း၏ ဘယ်ဘက်သို့ ကပ်၍ ခဏရပ်တန့်ခြင်း(一時停止) ပြုရမည်။", src:"法40条1項、教則5章2節"},
 {id:"tsuko-1-10", cat:"tsuko", set:1, final:0, fo:0, ans:true, ja:"停留所で止まっている路線バスが発進の合図をしたときは、急ブレーキや急ハンドルが必要な場合を除き、その発進を妨げてはいけない。", my:"မှတ်တိုင်တွင် ရပ်နေသော လိုင်းကားက ထွက်ခွာရန် အချက်ပြသည့်အခါ ရုတ်တရက် ဘရိတ်အုပ်ခြင်း သို့မဟုတ် ရုတ်တရက် စတီယာရင်လှည့်ခြင်း လိုအပ်မည့်အခါမှအပ ထိုကား၏ ထွက်ခွာမှုကို မနှောင့်ယှက်ရ။", exJa:"正しい。後方の車は路線バスの発進を妨げてはいけない。ただし急ブレーキや急ハンドルで避けなければならない場合は別。", exMy:"မှန်သည်။ နောက်မှ ယာဉ်များသည် လိုင်းကား၏ ထွက်ခွာမှုကို မနှောင့်ယှက်ရ။ ရုတ်တရက် ဘရိတ် သို့မဟုတ် စတီယာရင်ဖြင့် ရှောင်ရမည့်အခါမှာမူ ခြွင်းချက် ဖြစ်သည်။", src:"法31条の2、教則5章2節"},

 {id:"tsuko-2-01", cat:"tsuko", set:2, final:0, fo:0, ans:false, ja:"日本は、車が道路の右側を通行する国である。", my:"ဂျပန်သည် ယာဉ်များ လမ်း၏ ညာဘက်မှ သွားသော နိုင်ငံ ဖြစ်သည်။", exJa:"誤り。正しくは、日本は左側通行で、車は道路の左側を通行する。右側通行の国の習慣で運転しないよう注意。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ဂျပန်သည် ဘယ်ဘက်မှ သွားခြင်း (左側通行) ဖြစ်၍ ယာဉ်များ လမ်း၏ ဘယ်ဘက်မှ သွားရသည်။ ညာဘက်မောင်းသည့် နိုင်ငံ၏ အလေ့အထဖြင့် မမောင်းမိရန် သတိပြုပါ။", src:"法17条4項、教則5章2節"},
 {id:"tsuko-2-02", cat:"tsuko", set:2, final:0, fo:0, ans:true, ja:"道路外の駐車場に入るため歩道を横切るときは、歩道に入る直前で一時停止しなければならない。", my:"လမ်းပြင်ရှိ ကားပါကင်သို့ ဝင်ရန် လူသွားလမ်းကို ဖြတ်ကျော်သည့်အခါ လူသွားလမ်းထဲ မဝင်မီ ခဏရပ်တန့်ခြင်း(一時停止) ပြုရမည်။", exJa:"正しい。歩道や路側帯を横切るときは、その直前で一時停止し、歩行者の通行を妨げてはいけない。", exMy:"မှန်သည်။ လူသွားလမ်း သို့မဟုတ် လမ်းဘေးဇုန်(路側帯) ကို ဖြတ်ကျော်သည့်အခါ မဝင်မီ ခဏရပ်တန့်ပြီး လမ်းလျှောက်သူကို မနှောင့်ယှက်ရ။", src:"法17条2項"},
 {id:"tsuko-2-03", cat:"tsuko", set:2, final:0, fo:0, ans:false, ja:"歩道や路側帯のない道路では、路端から1mの部分（路肩）にはみ出して通行してはいけない。", my:"လူသွားလမ်း သို့မဟုတ် လမ်းဘေးဇုန်(路側帯) မရှိသော လမ်းတွင် လမ်းအစွန်းမှ 1 မီတာ အပိုင်း (路肩) သို့ ထွက်၍ မသွားရ။", exJa:"誤り。正しくは、路肩は路端から0.5mの部分で、そこにはみ出して通行してはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ 路肩 ဆိုသည်မှာ လမ်းအစွန်းမှ 0.5 မီတာ အပိုင်း ဖြစ်ပြီး ထိုနေရာသို့ ထွက်၍ မသွားရ။", src:"教則5章2節"},
 {id:"tsuko-2-04", cat:"tsuko", set:2, final:0, fo:0, ans:true, ja:"前の車が右折するため道路の中央に寄って通行しているときは、その左側を通って追い越す。", my:"ရှေ့ကားက ညာကွေ့ရန် လမ်းအလယ်သို့ ကပ်၍ သွားနေသည့်အခါ ထိုကား၏ ဘယ်ဘက်မှ ကျော်တက်ရသည်။", exJa:"正しい。右折のため道路の中央（一方通行では右端）に寄っている車は、その左側を通って追い越す。", exMy:"မှန်သည်။ ညာကွေ့ရန် လမ်းအလယ် (တစ်လမ်းသွားလမ်းတွင် ညာဘက်အစွန်း) သို့ ကပ်နေသော ယာဉ်ကို ၎င်း၏ ဘယ်ဘက်မှ ကျော်တက်ရသည်။", src:"法28条2項、教則5章6節"},
 {id:"tsuko-2-05", cat:"tsuko", set:2, final:0, fo:0, ans:true, ja:"上り坂の頂上付近やこう配の急な下り坂では、追越しをしてはいけない。", my:"တောင်တက်လမ်း၏ ထိပ်အနီး နှင့် မတ်စောက်သော တောင်ဆင်းလမ်းတွင် ကျော်တက်ခြင်း မပြုရ။", exJa:"正しい。上り坂の頂上付近、こう配の急な下り坂、道路の曲がり角付近は追越し禁止の場所である。", exMy:"မှန်သည်။ တောင်တက်လမ်းထိပ်အနီး၊ မတ်စောက်သော တောင်ဆင်းလမ်း နှင့် လမ်းကွေ့အနီးတို့သည် ကျော်တက်ခြင်း တားမြစ်ရာ နေရာများ ဖြစ်သည်။", src:"法30条1号、教則5章6節"},
 {id:"tsuko-2-06", cat:"tsuko", set:2, final:0, fo:0, ans:false, ja:"車両通行帯のないトンネルでも、見通しがよければ追越しをしてよい。", my:"ယာဉ်သွားလမ်းကြော မရှိသော ဥမင်လိုဏ်ခေါင်း (トンネル) တွင်ပင် ရှေ့ကို ကောင်းစွာ မြင်ရလျှင် ကျော်တက်နိုင်သည်။", exJa:"誤り。正しくは、車両通行帯のないトンネルでは、見通しがよくても追越しをしてはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ယာဉ်သွားလမ်းကြော မရှိသော ဥမင်လိုဏ်ခေါင်းတွင် မြင်ကွင်းကောင်းသော်လည်း ကျော်တက်ခြင်း မပြုရ။", src:"法30条2号、教則5章6節"},
 {id:"tsuko-2-07", cat:"tsuko", set:2, final:0, fo:0, ans:true, ja:"追越しをするときは、右側の方向指示器を出し、約3秒後に進路をゆるやかに右へ変える。", my:"ကျော်တက်သည့်အခါ ညာဘက် အချက်ပြမီး (方向指示器) ကို ပြပြီး ခန့်မှန်း 3 စက္ကန့်အကြာတွင် လမ်းကြောင်းကို ညာဘက်သို့ ဖြည်းညှင်းစွာ ပြောင်းရသည်။", exJa:"正しい。右の合図を出して約3秒後、最高速度の範囲内で加速しながら、ゆるやかに右へ進路を変える。", exMy:"မှန်သည်။ ညာဘက် အချက်ပြပြီး ခန့်မှန်း 3 စက္ကန့်အကြာတွင် အမြင့်ဆုံး အမြန်နှုန်း ကန့်သတ်ချက်အတွင်း အရှိန်မြှင့်ကာ ညာဘက်သို့ ဖြည်းညှင်းစွာ ပြောင်းရသည်။", src:"令21条、教則5章6節"},
 {id:"tsuko-2-08", cat:"tsuko", set:2, final:0, fo:0, ans:false, ja:"後ろの車が自分の車を追い越そうとしているときに、前の車を追い越し始めてもよい。", my:"နောက်ကားက မိမိကားကို ကျော်တက်ရန် ပြုလုပ်နေစဉ် မိမိက ရှေ့ကားကို စတင် ကျော်တက်နိုင်သည်။", exJa:"誤り。正しくは、後ろの車が自分の車を追い越そうとしているときは、追越しをしてはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ နောက်ကားက မိမိကို ကျော်တက်ရန် ပြုလုပ်နေစဉ် ကျော်တက်ခြင်း မပြုရ။", src:"教則5章6節"},
 {id:"tsuko-2-09", cat:"tsuko", set:2, final:0, fo:0, ans:true, ja:"交差点付近以外の場所で緊急自動車が近づいてきたときは、道路の左側に寄って進路を譲らなければならない。", my:"လမ်းဆုံအနီး မဟုတ်သော နေရာတွင် အရေးပေါ်ယာဉ် နီးကပ်လာသည့်အခါ လမ်း၏ ဘယ်ဘက်သို့ ကပ်၍ လမ်းဖယ်ပေးရမည်။", exJa:"正しい。交差点付近以外では、道路の左側に寄って緊急自動車に進路を譲る。", exMy:"မှန်သည်။ လမ်းဆုံအနီး မဟုတ်သော နေရာတွင် လမ်း၏ ဘယ်ဘက်သို့ ကပ်၍ အရေးပေါ်ယာဉ်ကို လမ်းဖယ်ပေးရသည်။", src:"法40条2項、教則5章2節"},
 {id:"tsuko-2-10", cat:"tsuko", set:2, final:0, fo:0, ans:false, ja:"路線バス等優先通行帯を通行している普通自動車は、路線バスが近づいてきても、そのまま通行を続けてよい。", my:"လိုင်းကား ဦးစားပေး လမ်းကြော (路線バス等優先通行帯) တွင် သွားနေသော သာမန်မော်တော်ကား (普通自動車) သည် လိုင်းကား နီးကပ်လာသော်လည်း ထိုလမ်းကြောတွင် ဆက်၍ သွားနိုင်သည်။", exJa:"誤り。正しくは、路線バスが近づいてきたら、速やかに優先通行帯から出なければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လိုင်းကား နီးကပ်လာလျှင် ဦးစားပေး လမ်းကြောမှ အမြန် ထွက်ပေးရမည်။", src:"法20条の2第1項、教則5章2節"},

 {id:"tsuko-3-01", cat:"tsuko", set:3, final:0, fo:0, ans:true, ja:"左側部分の幅が6m未満の見通しのよい道路では、禁止されていなければ、追越しのため右側部分にはみ出して通行できる。", my:"ဘယ်ဘက်အပိုင်း၏ အကျယ် 6 မီတာ မပြည့်ပြီး မြင်ကွင်းကောင်းသော လမ်းတွင် တားမြစ်ထားခြင်း မရှိလျှင် ကျော်တက်ရန် ညာဘက်အပိုင်းသို့ ထွက်၍ သွားနိုင်သည်။", exJa:"正しい。左側部分の幅が6m未満で見通しのよい道路では、標識・標示で禁止されていなければ、追越しのためはみ出せる。ただし、対向車の進行を妨げるおそれがないときに限る。", exMy:"မှန်သည်။ ဘယ်ဘက်အပိုင်း 6 မီတာ မပြည့်ပြီး မြင်ကွင်းကောင်းသော လမ်းတွင် ယာဉ်စည်းကမ်းဆိုင်းဘုတ် သို့မဟုတ် လမ်းမျက်နှာပြင် အမှတ်အသားဖြင့် မတားမြစ်ထားလျှင် ကျော်တက်ရန် ထွက်နိုင်သည်။ သို့သော် မျက်နှာချင်းဆိုင်ကားကို အနှောင့်အယှက် မဖြစ်စေမည့်အခါမှသာ ဖြစ်သည်။", src:"法17条5項4号、教則5章2節"},
 {id:"tsuko-3-02", cat:"tsuko", set:3, final:0, fo:0, ans:true, ja:"片側3車線以上の道路では、最も右側の車両通行帯は追越しなどのために空けておく。", my:"တစ်ဖက်တွင် လမ်းကြော 3 ခုနှင့်အထက် ရှိသော လမ်းတွင် အညာဘက်ဆုံး ယာဉ်သွားလမ်းကြောကို ကျော်တက်ခြင်း စသည်အတွက် လွတ်ထားရသည်။", exJa:"正しい。最も右側の通行帯は追越しなどのために空けておき、それ以外の通行帯を速度に応じて通行する。", exMy:"မှန်သည်။ အညာဘက်ဆုံး လမ်းကြောကို ကျော်တက်ရန် လွတ်ထားပြီး ကျန်လမ်းကြောများကို အမြန်နှုန်းအလိုက် သွားရသည်။", src:"法20条1項、教則5章2節"},
 {id:"tsuko-3-03", cat:"tsuko", set:3, final:0, fo:0, ans:false, ja:"進路を変えると後ろの車が急ブレーキで避けなければならないときでも、合図をすれば進路を変えてよい。", my:"လမ်းကြောင်းပြောင်းလျှင် နောက်ကားက ရုတ်တရက် ဘရိတ်အုပ်၍ ရှောင်ရမည့် အခြေအနေတွင်ပင် အချက်ပြလျှင် လမ်းကြောင်း ပြောင်းနိုင်သည်။", exJa:"誤り。正しくは、後ろの車が急ブレーキや急ハンドルで避けなければならないときは、合図をしても進路を変えてはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ နောက်ကားက ရုတ်တရက် ဘရိတ် သို့မဟုတ် စတီယာရင်ဖြင့် ရှောင်ရမည့်အခါ အချက်ပြသော်လည်း လမ်းကြောင်း မပြောင်းရ။", src:"法26条の2第2項、教則5章5節"},
 {id:"tsuko-3-04", cat:"tsuko", set:3, final:0, fo:0, ans:true, ja:"横断歩道の手前30m以内では、前を走る自動車の横を通ってその前に出てはいけない。", my:"လူကူးမျဉ်းကြားသို့ မရောက်မီ 30 မီတာအတွင်းတွင် ရှေ့မှ သွားနေသော မော်တော်ယာဉ်၏ ဘေးမှ ဖြတ်၍ ၎င်း၏ ရှေ့သို့ မထွက်ရ။", exJa:"正しい。横断歩道等の手前30m以内では、追越しだけでなく、前の車の横を通って前に出ること（追抜き）も禁止。", exMy:"မှန်သည်။ လူကူးမျဉ်းကြား စသည်သို့ မရောက်မီ 30 မီတာအတွင်းတွင် ကျော်တက်ခြင်းသာမက ရှေ့ကား၏ ဘေးမှ ဖြတ်၍ ရှေ့ထွက်ခြင်း (追抜き) ကိုလည်း တားမြစ်သည်။", src:"法38条3項"},
 {id:"tsuko-3-05", cat:"tsuko", set:3, final:0, fo:0, ans:false, ja:"踏切とその手前30m以内の場所では、追越しをしてもよい。", my:"ရထားလမ်းကူး နှင့် ၎င်းသို့ မရောက်မီ 30 မီတာအတွင်း နေရာတွင် ကျော်တက်နိုင်သည်။", exJa:"誤り。正しくは、踏切とその手前30m以内の場所は追越し禁止である。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ရထားလမ်းကူး နှင့် ၎င်းသို့ မရောက်မီ 30 မီတာအတွင်း နေရာသည် ကျော်တက်ခြင်း တားမြစ်ရာ နေရာ ဖြစ်သည်။", src:"法30条3号、教則5章6節"},
 {id:"tsuko-3-06", cat:"tsuko", set:3, final:0, fo:0, ans:false, ja:"道路の曲がり角付近では、見通しがよければ追越しをしてもよい。", my:"လမ်းကွေ့အနီးတွင် မြင်ကွင်းကောင်းလျှင် ကျော်တက်နိုင်သည်။", exJa:"誤り。正しくは、道路の曲がり角付近は、見通しがよくても追越し禁止の場所である。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လမ်းကွေ့အနီးသည် မြင်ကွင်းကောင်းသော်လည်း ကျော်တက်ခြင်း တားမြစ်ရာ နေရာ ဖြစ်သည်။", src:"法30条1号、教則5章6節"},
 {id:"tsuko-3-07", cat:"tsuko", set:3, final:0, fo:0, ans:false, ja:"追越しをするときは、短い時間であれば最高速度を超えて加速してもよい。", my:"ကျော်တက်သည့်အခါ အချိန်တိုသာ ဖြစ်လျှင် အမြင့်ဆုံး အမြန်နှုန်းကို ကျော်၍ အရှိန်မြှင့်နိုင်သည်။", exJa:"誤り。正しくは、追越しのときも最高速度の制限内で加速しなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ကျော်တက်သည့်အခါတွင်လည်း အမြင့်ဆုံး အမြန်နှုန်း ကန့်သတ်ချက်အတွင်းသာ အရှိန်မြှင့်ရမည်။", src:"法22条、教則5章6節"},
 {id:"tsuko-3-08", cat:"tsuko", set:3, final:0, fo:0, ans:true, ja:"一方通行の道路で、左側に寄るとかえって緊急自動車の妨げになるときは、右側に寄って進路を譲る。", my:"တစ်လမ်းသွားလမ်းတွင် ဘယ်ဘက်သို့ ကပ်လျှင် အရေးပေါ်ယာဉ်ကို ပို၍ အနှောင့်အယှက် ဖြစ်စေမည့်အခါ ညာဘက်သို့ ကပ်၍ လမ်းဖယ်ပေးရသည်။", exJa:"正しい。緊急自動車には原則として左側に寄って譲るが、一方通行で左に寄るとかえって妨げになるときは右側に寄る。", exMy:"မှန်သည်။ အရေးပေါ်ယာဉ်ကို မူအားဖြင့် ဘယ်ဘက်ကပ်၍ လမ်းဖယ်ပေးရသော်လည်း တစ်လမ်းသွားလမ်းတွင် ဘယ်ကပ်လျှင် ပို၍ အနှောင့်အယှက် ဖြစ်မည်ဆိုပါက ညာဘက်သို့ ကပ်ရသည်။", src:"法40条、教則5章2節"},
 {id:"tsuko-3-09", cat:"tsuko", set:3, final:0, fo:0, ans:true, ja:"路線バス等の専用通行帯は、右左折する場合などを除き、普通自動車は通行してはいけない。", my:"လိုင်းကား သီးသန့် လမ်းကြော (専用通行帯) တွင် ညာကွေ့ သို့မဟုတ် ဘယ်ကွေ့ ပြုလုပ်သည့်အခါ စသည်မှအပ သာမန်မော်တော်ကား (普通自動車) မသွားရ။", exJa:"正しい。専用通行帯は、小型特殊・原付・軽車両以外の車は通行できない。右左折や工事でやむを得ないときは別。", exMy:"မှန်သည်။ သီးသန့် လမ်းကြောကို 小型特殊 ယာဉ်၊ မော်တာဆိုင်ကယ်ငယ်(原付) နှင့် 軽車両 (စက်ဘီး စသည်) မှလွဲ၍ အခြားယာဉ်များ မသွားရ။ ညာကွေ့/ဘယ်ကွေ့ သို့မဟုတ် လမ်းပြင်ဆင်ရေးကြောင့် မလွဲမရှောင်သာသည့်အခါမှာမူ ခြွင်းချက် ဖြစ်သည်။", src:"法20条2項、教則5章2節"},
 {id:"tsuko-3-10", cat:"tsuko", set:3, final:0, fo:0, ans:false, ja:"前の車が交差点や踏切で停止しているときは、その前に割り込んでもよい。", my:"ရှေ့ကားက လမ်းဆုံ သို့မဟုတ် ရထားလမ်းကူးတွင် ရပ်နေသည့်အခါ ၎င်း၏ ရှေ့သို့ ဝင်ညှပ်နိုင်သည်။", exJa:"誤り。正しくは、交差点や踏切などで停止・徐行している車の前に割り込んだり、その前を横切ったりしてはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လမ်းဆုံ သို့မဟုတ် ရထားလမ်းကူး စသည်တွင် ရပ်နေသော သို့မဟုတ် ဖြည်းဖြည်းမောင်းနေသော ယာဉ်၏ ရှေ့သို့ ဝင်ညှပ်ခြင်း၊ ရှေ့မှ ဖြတ်ကူးခြင်း မပြုရ။", src:"法32条、教則5章6節"},

 {id:"tsuko-F-01", cat:"tsuko", set:0, final:1, fo:1, ans:true, ja:"車両通行帯のある道路では、追越しなどでやむを得ない場合のほかは、2つの通行帯にまたがって通行してはいけない。", my:"ယာဉ်သွားလမ်းကြော ရှိသော လမ်းတွင် ကျော်တက်ခြင်း စသည့် မလွဲမရှောင်သာသည့်အခါမှအပ လမ်းကြော 2 ခုကို ခွ၍ မသွားရ။", exJa:"正しい。車両通行帯のある道路では、やむを得ない場合のほかは、通行帯からはみ出したりまたがったりしてはいけない。", exMy:"မှန်သည်။ ယာဉ်သွားလမ်းကြော ရှိသော လမ်းတွင် မလွဲမရှောင်သာသည့်အခါမှအပ လမ်းကြောမှ ထွက်ခြင်း၊ လမ်းကြော 2 ခုကို ခွ၍ သွားခြင်း မပြုရ။", src:"法20条1項、教則5章2節"},
 {id:"tsuko-F-02", cat:"tsuko", set:0, final:1, fo:2, ans:false, ja:"追越しのため最も右側の通行帯に出たときは、追越しが終わっても、そのまま右側の通行帯を走り続けてよい。", my:"ကျော်တက်ရန် အညာဘက်ဆုံး လမ်းကြောသို့ ထွက်ပြီးနောက် ကျော်တက်ခြင်း ပြီးသော်လည်း ထိုညာဘက် လမ်းကြောတွင် ဆက်၍ မောင်းနိုင်သည်။", exJa:"誤り。正しくは、追越しが終わったら、速やかに最も右側以外の通行帯に戻らなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ကျော်တက်ခြင်း ပြီးလျှင် အညာဘက်ဆုံးမှလွဲ၍ အခြား လမ်းကြောသို့ အမြန် ပြန်ဝင်ရမည်။", src:"教則5章2節、5章6節"},
 {id:"tsuko-F-03", cat:"tsuko", set:0, final:1, fo:3, ans:true, ja:"路面電車を追い越すときは、原則としてその左側を通行する。", my:"ဓာတ်ရထား (路面電車) ကို ကျော်တက်သည့်အခါ မူအားဖြင့် ၎င်း၏ ဘယ်ဘက်မှ ဖြတ်သွားရသည်။", exJa:"正しい。路面電車は原則として左側から追い越す。軌道が道路の左端に寄って設けられているときは右側から。", exMy:"မှန်သည်။ ဓာတ်ရထားကို မူအားဖြင့် ဘယ်ဘက်မှ ကျော်တက်ရသည်။ ရထားလမ်းကြောင်းသည် လမ်း၏ ဘယ်ဘက်အစွန်းတွင် ရှိလျှင်မူ ညာဘက်မှ ဖြစ်သည်။", src:"法28条3項、教則5章6節"},
 {id:"tsuko-F-04", cat:"tsuko", set:0, final:1, fo:4, ans:true, ja:"前の車が右折などのため右側に進路を変えようとしているときは、その車を追い越してはいけない。", my:"ရှေ့ကားက ညာကွေ့ရန် စသည်ဖြင့် ညာဘက်သို့ လမ်းကြောင်း ပြောင်းရန် ပြုလုပ်နေသည့်အခါ ထိုကားကို ကျော်တက်ခြင်း မပြုရ။", exJa:"正しい。前の車が右折などで右に進路を変えようとしているときは危険なので、追越しをしてはいけない。", exMy:"မှန်သည်။ ရှေ့ကားက ညာကွေ့ စသည်ဖြင့် ညာဘက်သို့ ပြောင်းရန် ပြုလုပ်နေစဉ် အန္တရာယ်ရှိ၍ ကျော်တက်ခြင်း မပြုရ။", src:"教則5章6節"},
 {id:"tsuko-F-05", cat:"tsuko", set:0, final:1, fo:5, ans:false, ja:"追越しのため道路の右側部分に出ると対向車の進行を妨げるときでも、すばやく行えば追い越してよい。", my:"ကျော်တက်ရန် လမ်း၏ ညာဘက်အပိုင်းသို့ ထွက်လျှင် မျက်နှာချင်းဆိုင်ကားကို အနှောင့်အယှက် ဖြစ်စေမည့်အခါတွင်ပင် မြန်မြန် ပြုလုပ်လျှင် ကျော်တက်နိုင်သည်။", exJa:"誤り。正しくは、右側部分に出ると対向車の進行を妨げるようなときは、追越しをしてはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ညာဘက်အပိုင်းသို့ ထွက်လျှင် မျက်နှာချင်းဆိုင်ကားကို အနှောင့်အယှက် ဖြစ်စေမည့်အခါ ကျော်တက်ခြင်း မပြုရ။", src:"教則5章6節"},
 {id:"tsuko-F-06", cat:"tsuko", set:0, final:1, fo:6, ans:false, ja:"交差点付近で緊急自動車が近づいてきたときでも、自分の側の信号が青であれば、そのまま交差点に入ってよい。", my:"လမ်းဆုံအနီးတွင် အရေးပေါ်ယာဉ် နီးကပ်လာသော်လည်း မိမိဘက်၏ မီးပွိုင့် အစိမ်းရောင် ဖြစ်လျှင် လမ်းဆုံထဲသို့ ဆက်၍ ဝင်နိုင်သည်။", exJa:"誤り。正しくは、信号が青でも、交差点を避けて道路の左側に寄り、一時停止しなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ မီးပွိုင့် အစိမ်းရောင် ဖြစ်သော်လည်း လမ်းဆုံကို ရှောင်ပြီး လမ်း၏ ဘယ်ဘက်သို့ ကပ်၍ ခဏရပ်တန့်ခြင်း(一時停止) ပြုရမည်။", src:"法40条1項、教則5章2節"},
 {id:"tsuko-F-07", cat:"tsuko", set:0, final:1, fo:7, ans:true, ja:"追い越されるとき、追越しに十分な余地がない場合は、できるだけ左に寄って進路を譲らなければならない。", my:"ကျော်တက်ခံရသည့်အခါ ကျော်တက်ရန် နေရာ လုံလောက်စွာ မရှိလျှင် တတ်နိုင်သမျှ ဘယ်ဘက်သို့ ကပ်၍ လမ်းဖယ်ပေးရမည်။", exJa:"正しい。追越しに十分な余地がないときは、追い越される車はできるだけ左に寄って進路を譲る。", exMy:"မှန်သည်။ ကျော်တက်ရန် နေရာ မလုံလောက်လျှင် ကျော်တက်ခံရသော ယာဉ်က တတ်နိုင်သမျှ ဘယ်ဘက်ကပ်၍ လမ်းဖယ်ပေးရသည်။", src:"法27条2項、教則5章6節"},
 {id:"tsuko-F-08", cat:"tsuko", set:0, final:2, fo:8, ans:true, ja:"黄色の中央線が引かれている道路では、追越しのため道路の右側部分にはみ出して通行してはいけない。", my:"အဝါရောင် လမ်းအလယ်မျဉ်း ဆွဲထားသော လမ်းတွင် ကျော်တက်ရန် လမ်း၏ ညာဘက်အပိုင်းသို့ ထွက်၍ မသွားရ။", exJa:"正しい。黄色の中央線は、追越しのための右側部分はみ出し通行禁止を表す。", exMy:"မှန်သည်။ အဝါရောင် လမ်းအလယ်မျဉ်းသည် ကျော်တက်ရန် ညာဘက်အပိုင်းသို့ ထွက်ခြင်း တားမြစ်ချက်ကို ဆိုလိုသည်။", src:"教則付表3、教則5章6節"},
 {id:"tsuko-F-09", cat:"tsuko", set:0, final:2, fo:9, ans:false, ja:"工事などで左側部分だけでは通行に十分な幅がないときでも、道路の右側部分にはみ出して通行してはいけない。", my:"လမ်းပြင်ဆင်ရေး စသည်ကြောင့် ဘယ်ဘက်အပိုင်းတစ်ခုတည်းဖြင့် သွားရန် အကျယ် မလုံလောက်သည့်အခါတွင်ပင် လမ်း၏ ညာဘက်အပိုင်းသို့ ထွက်၍ မသွားရ။", exJa:"誤り。正しくは、工事などで左側部分の幅が十分でないときは、右側部分にはみ出して通行できる（はみ出しはできるだけ少なく）。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လမ်းပြင်ဆင်ရေး စသည်ကြောင့် ဘယ်ဘက်အပိုင်း မလုံလောက်လျှင် ညာဘက်အပိုင်းသို့ ထွက်၍ သွားနိုင်သည် (ထွက်သည့်ပမာဏ တတ်နိုင်သမျှ နည်းရမည်)။", src:"法17条5項2号、教則5章2節"},
 {id:"tsuko-F-10", cat:"tsuko", set:0, final:2, fo:10, ans:false, ja:"優先道路を通行しているときでも、交差点の手前30m以内では追越しをしてはいけない。", my:"ဦးစားပေးလမ်းပေါ်တွင် သွားနေသည့်အခါတွင်ပင် လမ်းဆုံသို့ မရောက်မီ 30 မီတာအတွင်း ကျော်တက်ခြင်း မပြုရ။", exJa:"誤り。正しくは、優先道路を通行している場合は、交差点とその手前30m以内でも追越し禁止の対象にならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ဦးစားပေးလမ်းပေါ်တွင် သွားနေလျှင် လမ်းဆုံ နှင့် ၎င်းသို့ မရောက်မီ 30 မီတာအတွင်းတွင်ပင် ကျော်တက်ခြင်း တားမြစ်ချက် မသက်ဆိုင်ပါ။", src:"法30条3号、教則5章6節"},
 {id:"tsuko-F-11", cat:"tsuko", set:0, final:2, fo:11, ans:true, ja:"自転車横断帯とその手前30m以内の場所では、追越しをしてはいけない。", my:"စက်ဘီးဖြတ်ကူးရာ လမ်းကြား (自転車横断帯) နှင့် ၎င်းသို့ မရောက်မီ 30 မီတာအတွင်း နေရာတွင် ကျော်တက်ခြင်း မပြုရ။", exJa:"正しい。踏切・横断歩道・自転車横断帯とその手前30m以内は追越し禁止の場所である。", exMy:"မှန်သည်။ ရထားလမ်းကူး၊ လူကူးမျဉ်းကြား၊ စက်ဘီးဖြတ်ကူးရာ လမ်းကြား နှင့် ၎င်းတို့သို့ မရောက်မီ 30 မီတာအတွင်းသည် ကျော်တက်ခြင်း တားမြစ်ရာ နေရာ ဖြစ်သည်။", src:"法30条3号、教則5章6節"},
 {id:"tsuko-F-12", cat:"tsuko", set:0, final:2, fo:12, ans:true, ja:"車両通行帯のあるトンネルでは、標識などで禁止されていなければ、追越しをすることができる。", my:"ယာဉ်သွားလမ်းကြော ရှိသော ဥမင်လိုဏ်ခေါင်း (トンネル) တွင် ယာဉ်စည်းကမ်းဆိုင်းဘုတ် စသည်ဖြင့် မတားမြစ်ထားလျှင် ကျော်တက်နိုင်သည်။", exJa:"正しい。トンネルで追越しが禁止されるのは車両通行帯がない場合で、車両通行帯があれば禁止の標識などがない限りできる。", exMy:"မှန်သည်။ ဥမင်လိုဏ်ခေါင်းတွင် ကျော်တက်ခြင်း တားမြစ်သည်မှာ ယာဉ်သွားလမ်းကြော မရှိသည့်အခါ ဖြစ်ပြီး လမ်းကြော ရှိလျှင် တားမြစ်ဆိုင်းဘုတ် စသည် မရှိသရွေ့ ကျော်တက်နိုင်သည်။", src:"法30条2号、教則5章6節"},
 {id:"tsuko-F-13", cat:"tsuko", set:0, final:2, fo:13, ans:true, ja:"路線バス等優先通行帯は、混雑していて路線バスが来ても出られなくなるおそれがあるときは、はじめから通行してはいけない。", my:"လိုင်းကား ဦးစားပေး လမ်းကြောတွင် ယာဉ်ကြပ်နေ၍ လိုင်းကား လာသည့်အခါ ထွက်မရမည့် အန္တရာယ် ရှိလျှင် အစကတည်းက ထိုလမ်းကြောတွင် မသွားရ။", exJa:"正しい。混雑していて路線バスが近づいても出られなくなるおそれがあるときは、はじめから優先通行帯を通行しない。", exMy:"မှန်သည်။ ယာဉ်ကြပ်၍ လိုင်းကား နီးကပ်လာသော်လည်း ထွက်မရနိုင်မည့်အခါ အစကတည်းက ဦးစားပေး လမ်းကြောတွင် မသွားရ။", src:"法20条の2第1項、教則5章2節"},
 {id:"tsuko-F-14", cat:"tsuko", set:0, final:3, fo:14, ans:false, ja:"一般原動機付自転車は、路線バス等の専用通行帯を通行することができない。", my:"မော်တာဆိုင်ကယ်ငယ်(原付) သည် လိုင်းကား သီးသန့် လမ်းကြော (専用通行帯) တွင် မသွားနိုင်ပါ။", exJa:"誤り。正しくは、専用通行帯は小型特殊自動車・原動機付自転車・軽車両なら通行できる。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ သီးသန့် လမ်းကြောကို 小型特殊 ယာဉ်၊ မော်တာဆိုင်ကယ်ငယ်(原付) နှင့် 軽車両 (စက်ဘီး စသည်) တို့ သွားနိုင်သည်။", src:"法20条2項、教則5章2節"},
 {id:"tsuko-F-15", cat:"tsuko", set:0, final:3, fo:15, ans:false, ja:"前の車が交差点で徐行しているときは、その車の前を横切ってもよい。", my:"ရှေ့ကားက လမ်းဆုံတွင် ဖြည်းဖြည်းမောင်းခြင်း(徐行) ပြုနေသည့်အခါ ထိုကား၏ ရှေ့မှ ဖြတ်ကူးနိုင်သည်။", exJa:"誤り。正しくは、交差点などで停止や徐行をしている車の前に割り込んだり、その前を横切ったりしてはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လမ်းဆုံ စသည်တွင် ရပ်နေသော သို့မဟုတ် ဖြည်းဖြည်းမောင်းနေသော ယာဉ်၏ ရှေ့သို့ ဝင်ညှပ်ခြင်း၊ ရှေ့မှ ဖြတ်ကူးခြင်း မပြုရ။", src:"法32条、教則5章6節"},
 {id:"tsuko-F-16", cat:"tsuko", set:0, final:3, fo:16, ans:true, ja:"前の車が道路外に出るため左端に寄ろうと合図しているときは、急ブレーキなどが必要な場合を除き、その進路変更を妨げてはいけない。", my:"ရှေ့ကားက လမ်းပြင်သို့ ထွက်ရန် ဘယ်ဘက်အစွန်းသို့ ကပ်မည်ဟု အချက်ပြနေသည့်အခါ ရုတ်တရက် ဘရိတ်အုပ်ရမည့်အခါ စသည်မှအပ ၎င်း၏ လမ်းကြောင်းပြောင်းမှုကို မနှောင့်ယှက်ရ။", exJa:"正しい。道路外に出るため合図をしている前の車の進路変更は、急ブレーキや急ハンドルが必要な場合を除き妨げてはいけない。", exMy:"မှန်သည်။ လမ်းပြင်သို့ ထွက်ရန် အချက်ပြနေသော ရှေ့ကား၏ လမ်းကြောင်းပြောင်းမှုကို ရုတ်တရက် ဘရိတ် သို့မဟုတ် စတီယာရင် လိုအပ်မည့်အခါမှအပ မနှောင့်ယှက်ရ။", src:"法25条3項、教則5章5節"},
 {id:"tsuko-F-17", cat:"tsuko", set:0, final:3, fo:17, ans:false, ja:"同じ方向に進みながら進路を右に変えるときの合図は、進路を変えようとする地点の30m手前で出す。", my:"ဦးတည်ရာ မပြောင်းဘဲ သွားနေရင်း ညာဘက်သို့ လမ်းကြောင်း ပြောင်းသည့်အခါ အချက်ပြခြင်းကို ပြောင်းမည့်နေရာ၏ 30 မီတာ အလိုတွင် ပြုရသည်။", exJa:"誤り。正しくは、進路変更の合図は進路を変えようとする約3秒前に出す。30m手前は右左折や転回のときである。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လမ်းကြောင်းပြောင်းခြင်း၏ အချက်ပြခြင်းကို ပြောင်းခါနီး ခန့်မှန်း 3 စက္ကန့်အလိုတွင် ပြုရသည်။ 30 မီတာ အလိုဆိုသည်မှာ ညာကွေ့/ဘယ်ကွေ့ နှင့် လမ်းကြောင်းပြန်လှည့်ခြင်း(転回) အတွက် ဖြစ်သည်။", src:"令21条、教則5章5節"},
 {id:"tsuko-F-18", cat:"tsuko", set:0, final:3, fo:18, ans:false, ja:"交差点付近以外の場所で緊急自動車が近づいてきたときは、原則として道路の右側に寄って進路を譲る。", my:"လမ်းဆုံအနီး မဟုတ်သော နေရာတွင် အရေးပေါ်ယာဉ် နီးကပ်လာသည့်အခါ မူအားဖြင့် လမ်း၏ ညာဘက်သို့ ကပ်၍ လမ်းဖယ်ပေးရသည်။", exJa:"誤り。正しくは、原則として道路の左側に寄って進路を譲る。右側に寄るのは一方通行で左に寄るとかえって妨げになるとき。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ မူအားဖြင့် လမ်း၏ ဘယ်ဘက်သို့ ကပ်၍ လမ်းဖယ်ပေးရသည်။ ညာဘက်ကပ်ရသည်မှာ တစ်လမ်းသွားလမ်းတွင် ဘယ်ကပ်လျှင် ပို၍ အနှောင့်အယှက် ဖြစ်မည့်အခါ ဖြစ်သည်။", src:"法40条2項、教則5章2節"},
 {id:"tsuko-F-19", cat:"tsuko", set:0, final:3, fo:19, ans:true, ja:"一方通行の道路では、道路の中央から右の部分を通行することができる。", my:"တစ်လမ်းသွားလမ်းတွင် လမ်းအလယ်မှ ညာဘက်အပိုင်းကိုလည်း သွားနိုင်သည်။", exJa:"正しい。一方通行の道路では、道路の中央から右の部分にはみ出して通行することができる。", exMy:"မှန်သည်။ တစ်လမ်းသွားလမ်းတွင် လမ်းအလယ်မှ ညာဘက်အပိုင်းသို့ ထွက်၍ သွားနိုင်သည်။", src:"法17条5項1号、教則5章2節"}
);

      ch.setUint16(28,nb.length,true); ch.setUint32(42,off,true);

      rows.map(row=>'<w:tr>'+row.map((c,i)=>cell(c.t!=null?c.t:c,{w:widths[i],fill:c.fill})).join('')+'</w:tr>').join('')+'</w:tbl>'+p('',{after:60}); }

// ===== 研修（絵入りスライド＋自動読み上げ＝動画のように進む） =====
const KS_ORDER = ['s_cover','s_flow','s_exam','s_tips','s_left','s_signal','s_police','s_signs1','s_signs2','s_lane','s_overtake','s_emergency','s_buslane','s_cross','s_rail','s_ped','s_weak','s_speed','s_slow','s_park','s_park2','s_highway','s_drink','s_child','s_night','s_weather','s_accident','s_end'];
const KS_N = KS_ORDER.length;
let ksIdx=0, ksPlaying=false, ksTimer=null, ksEnd=false;
function ksKey(){ return (typeof nameNow==='function'? nameNow() : '') || '_'; }
function ksDone(name){ const d=load('ksDone',{}); return d[name||ksKey()]||''; }
function ksPos(){ const p=load('ksPos',{}); return p[ksKey()]||0; }
function ksSavePos(i){ const p=load('ksPos',{}); p[ksKey()]=i; store('ksPos',p); }
function renderKenshuCard(){
  const done=ksDone(), pos=ksPos();
  $('ksCard').innerHTML='<h2>'+T('ks')+'</h2><p class="muted">'+T('ksP')+'</p>'+
    '<div class="row"><span class="passb '+(done?'p':'f')+'" style="font-size:15px">'+(done? T('ksDoneL')+' '+esc(done) : T('ksNot'))+'</span></div>'+
    '<div class="row">'+(pos>0&&pos<KS_N-1? '<button class="btn" id="ksResumeBtn">'+T('ksResume')+'（'+(pos+1)+'/'+KS_N+'）</button><button class="btn sub" id="ksStartBtn">'+T('ksAgain')+'</button>'
      : '<button class="btn" id="ksStartBtn">'+T('ksStart')+'</button>')+'</div>';
  $('ksStartBtn').onclick=()=>ksOpen(0);
  if($('ksResumeBtn')) $('ksResumeBtn').onclick=()=>ksOpen(pos);
}
function ksOpen(i){
  if(!nameNow()){ toast(T('needName')); $('name').focus(); return; }
  store('name', nameNow());
  ksIdx=i; ksEnd=false; show('kenshu'); ksPlaying=true; ksRender();
}
function ksClose(){ ksPlaying=false; clearTimeout(ksTimer); stopSpeak(); }
// 読み上げが止められたとき（言語切替・ホームなど）
function ksStopped(){ clearTimeout(ksTimer); }
// 録音（スマホ公開版）は1文ずつ。字幕も文ごとに出す
const ksSent=t=>t.match(/[^。။!?！？]+[。။!?！？]*/g)||[t];
function ksParts(t,id){
  const out=[]; langsToRead().forEach(l=>{ const txt=l==='ja'?t.nJa:t.nMy, ss=ksSent(txt); out.push({lang:l,text:txt,caps:ss,clips:ss.map((_,i)=>'s:'+id+':'+l+':'+i)}); }); return out;
}
function ksRender(langOnly){
  clearTimeout(ksTimer);
  $('ksPrev').innerHTML=T('prev'); $('ksNext').innerHTML=T('next'); $('l_ksAuto').innerHTML=T('ksAuto');
  if(ksEnd){ ksRenderEnd(); return; }
  const id=KS_ORDER[ksIdx], t=SLIDE_TEXT[id]||{tJa:id,tMy:'',pts:[],nJa:'',nMy:''};
  $('ksNo').textContent=(ksIdx+1)+' / '+KS_N;
  $('ksTitle').innerHTML='';
  $('ksBar').style.width=((ksIdx+1)/KS_N*100)+'%';
  $('ksSlide').innerHTML='<div class="ks-img">'+(IL[id]||'')+'</div><div class="ks-pts">'+((id==='s_cover'||id==='s_end')?rinenHtml():'')+'<h2>'+(LANG!=='my'?esc(t.tJa):'')+(LANG!=='ja'?'<span class="my">'+esc(t.tMy)+'</span>':'')+'</h2><ul>'+
    t.pts.map(p=>'<li>'+(LANG!=='my'?'<div>'+esc(p[0])+'</div>':'')+(LANG!=='ja'?'<div class="my">'+esc(p[1])+'</div>':'')+'</li>').join('')+'</ul></div>';
  $('ksPrev').disabled = ksIdx===0;
  $('ksCap').innerHTML='';
  ksSavePos(ksIdx);
  ksUpdPlay();
  if(ksPlaying) ksSpeak();
}
function ksSpeak(){
  const id=KS_ORDER[ksIdx], t=SLIDE_TEXT[id]; if(!t) return;
  const my=ksIdx;
  speak(ksParts(t,id), ()=>{ // 読み終わったら少し待って次へ
      if(!ksPlaying || my!==ksIdx || view!=='kenshu') return;
      if($('ksAutoNext').checked) ksTimer=setTimeout(()=>{ if(ksPlaying && my===ksIdx && view==='kenshu') ksGo(1,true); }, 1500);
      else { ksPlaying=false; ksUpdPlay(); }
    },
    (text,lang)=>{ $('ksCap').innerHTML = lang==='my'? '<span class="my">'+esc(text)+'</span>' : esc(text); });
}
function ksGo(d,auto){
  clearTimeout(ksTimer); stopSpeak();
  if(d>0 && ksIdx>=KS_N-1){ ksFinish(); return; }
  ksIdx=Math.max(0,Math.min(KS_N-1,ksIdx+d));
  if(!auto) ksPlaying=true;
  ksRender();
}
function ksFinish(){
  const d=load('ksDone',{}); d[ksKey()]=fmtDate(Date.now()); store('ksDone',d);
  ksSavePos(0); ksEnd=true; ksPlaying=false; ksRenderEnd();
  const parts=[]; langsToRead().forEach(l=>parts.push(l==='ja'?{lang:'ja',text:'研修おつかれさまでした。次はカテゴリ別練習で、1つずつ確かめましょう。',clips:['ksend:ja']}:{lang:'my',text:'သင်တန်း ပြီးဆုံးပါပြီ။ နောက်တစ်ဆင့်တွင် အမျိုးအစားအလိုက် လေ့ကျင့်ခန်းဖြင့် တစ်ခုချင်း စစ်ဆေးကြပါစို့။',clips:['ksend:my']}));
  speak(parts);
}
function ksRenderEnd(){
  $('ksNo').textContent=KS_N+' / '+KS_N; $('ksBar').style.width='100%'; $('ksCap').innerHTML='';
  $('ksSlide').innerHTML='<div class="ks-end" style="grid-column:1/-1"><h2>✅ '+T('ksEndT')+'</h2><p>'+T('ksEndP')+'</p><div class="row" style="justify-content:center;margin-top:16px">'+
    '<button class="btn" id="ksToPr">'+T('toPractice')+'</button><button class="btn sub" id="ksToF">'+T('toFinal')+'</button><button class="btn gray" id="ksAgainBtn">'+T('ksAgain')+'</button></div></div>';
  $('ksToPr').onclick=()=>{ ksClose(); renderHome(); show('home'); setTimeout(()=>$('catBox').scrollIntoView({behavior:'smooth'}),50); };
  $('ksToF').onclick=()=>{ ksClose(); begin('final',null,1); };
  $('ksAgainBtn').onclick=()=>ksOpen(0);
  $('ksPrev').disabled=false; ksUpdPlay();
}
function ksUpdPlay(){ $('ksPlayBtn').innerHTML = ksPlaying? T('ksPause') : T('ksPlay'); $('ksPlayBtn').disabled=ksEnd; }
function ksInit(){
  $('ksPrev').onclick=()=>{ if(ksEnd){ ksEnd=false; ksIdx=KS_N-1; ksPlaying=true; ksRender(); return; } ksGo(-1); };
  $('ksNext').onclick=()=>{ if(ksEnd) return; ksGo(1); };
  $('ksPlayBtn').onclick=()=>{ if(ksPlaying){ ksPlaying=false; clearTimeout(ksTimer); stopSpeak(); ksUpdPlay(); } else { ksPlaying=true; ksUpdPlay(); ksSpeak(); } };
  document.addEventListener('keydown',e=>{ if(view!=='kenshu'||e.target.tagName==='INPUT') return;
    if(e.key==='ArrowRight') $('ksNext').click(); else if(e.key==='ArrowLeft') $('ksPrev').click(); else if(e.key===' '){ e.preventDefault(); $('ksPlayBtn').click(); } });
}

// 総まとめ：各セット50問にそろえ、カテゴリが偏らないように交互に並べる
const FINALS = (()=>{
  const S={1:[],2:[],3:[]};
  QUESTIONS.filter(q=>q.set===0 && S[q.final]).forEach(q=>S[q.final].push(q));
  const big=()=>[1,2,3].sort((a,b)=>S[b].length-S[a].length)[0], small=()=>[1,2,3].sort((a,b)=>S[a].length-S[b].length)[0];
  // 多いセットから、そのセットで一番多いカテゴリの問題を、少ないセットへ移す
  const cnt=(arr,c)=>arr.filter(q=>q.cat===c).length;
  while(S[big()].length>EXAM.n && S[small()].length<EXAM.n){
    const b=big(), sm=small();
    const c=CATS.map(c=>c.id).sort((x,y)=>(cnt(S[b],y)-cnt(S[sm],y))-(cnt(S[b],x)-cnt(S[sm],x)))[0];
    const i=S[b].map(q=>q.cat).lastIndexOf(c);
    S[sm].push(S[b].splice(i,1)[0]);
  }
  const out={};
  [1,2,3].forEach(k=>{
    const by={}; S[k].forEach(q=>(by[q.cat]=by[q.cat]||[]).push(q));
    Object.values(by).forEach(a=>a.sort((x,y)=>x.fo-y.fo));
    const order=[]; let added=true;
    while(added){ added=false; CATS.forEach(c=>{ const a=by[c.id]; if(a&&a.length){ order.push(a.shift()); added=true; } }); }
    out[k]=order.slice(0,EXAM.n);
  });
  return out;
})();
function setQs(kind, cat, set){
  if(kind==='final') return FINALS[set]||[];
  return QUESTIONS.filter(q=>q.cat===cat && q.set===set);
}

const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Macintosh/.test(navigator.userAgent));

function pickVoices(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const ja = vs.filter(v=>/^ja([-_]|$)/i.test(v.lang||''));

  const my = vs.filter(v=>/^my([-_]|$)/i.test(v.lang||'') || /Burmese|Myanmar/.test(v.name));
  vMy = my.find(v=>/Nilar|နီလာ/.test(v.name)) || my[0] || null;

  if(!window.speechSynthesis){ vi.className='voice warn'; vi.innerHTML='このブラウザは読み上げに対応していません。Microsoft Edge で開いてください。'; return; }

  if(!vMy){ warn=true; s+= IS_MOBILE ? '<br>この端末にはミャンマー語の読み上げの声がありません。ミャンマー語は文字（字幕）で表示します。日本語の声は使えます。<span class="my">ဤဖုန်းတွင် မြန်မာအသံ မရှိပါ။ မြန်မာဘာသာကို စာသားဖြင့် ပြပါမည်။</span>' : '<br>ミャンマー語の声は Microsoft Edge でインターネットにつないだときに使えます。<span class="my">မြန်မာအသံကို Microsoft Edge ဖြင့် အင်တာနက်ချိတ်ဆက်ထားမှသာ အသုံးပြုနိုင်သည်။</span>'; }
  vi.className = 'voice'+(warn?' warn':''); vi.innerHTML = s;

// スマホの声（iPhone・Android）が読み間違えやすい語は、ひらがなで読ませる
const YOMI = [['外免切替','がいめんきりかえ'],['外免','がいめん'],['原付','げんつき'],['路側帯','ろそくたい'],['路肩','ろかた'],['酒気帯び','しゅきおび'],['警音器','けいおんき'],['幅寄せ','はばよせ'],['空走距離','くうそうきょり'],['制動距離','せいどうきょり'],['輪止め','わどめ'],['発炎筒','はつえんとう'],['軌道敷','きどうしき'],['内輪差','ないりんさ'],['追抜き','おいぬき'],['追越し','おいこし'],['停止表示器材','ていしひょうじきざい'],['遮断機','しゃだんき'],['本線車道','ほんせんしゃどう'],['中央分離帯','ちゅうおうぶんりたい'],['側端','そくたん'],['左方','さほう'],['盲導犬','もうどうけん'],['専用通行帯','せんようつうこうたい'],['優先通行帯','ゆうせんつうこうたい'],['通行帯','つうこうたい'],['駐停車','ちゅうていしゃ'],['転回','てんかい'],['徐行','じょこう'],['標示','ひょうじ'],
 ['km/h','キロ'],['km','キロメートル'],['ｍ','メートル'],['m以内','メートル以内'],['m以上','メートル以上'],['m手前','メートル手前'],['m以下','メートル以下'],['mg','ミリグラム'],['○','まる'],['×','ばつ'],['〜','から'],['（','、'],['）','、'],['「',''],['」',''],['…','']];
function yomi(t){ for(const [a,b] of YOMI) t=t.split(a).join(b); return t.replace(/(\d)m(?![a-zA-Z])/g,'$1メートル'); }
// ミャンマー語の声は日本語の文字を読めないので、（日本語）や「日本語」の部分を除いて読む
function myClean(t){ return t.replace(/[぀-ヿ一-鿿々ー・、。「」（）()○×]+/g,' ').replace(/\s+/g,' ').trim(); }
let spSeq=0, speaking=false;
function stopSpeak(){ spSeq++; speaking=false; if(window.speechSynthesis) speechSynthesis.cancel(); if(AP){ try{ AP.pause(); }catch(e){} if(apResolve){ const r=apResolve; apResolve=null; r(); } } updSpk(); if(window.ksStopped) ksStopped(); }
