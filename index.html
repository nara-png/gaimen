<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fae">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="外免切替">
<title>外免切替 効果測定｜株式会社ミストラルサービス</title>
<style>
:root{
  --bg:#f3f6fa; --card:#fff; --ink:#1d2733; --sub:#5b6878; --line:#d6dee8;
  --pri:#1f5fae; --pri2:#e8f0fb; --ok:#14843b; --okbg:#e6f6ec; --ng:#c62828; --ngbg:#fdecec; --warn:#b26a00; --warnbg:#fff5e0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo","Myanmar Text","Noto Sans Myanmar",sans-serif;font-size:16px;line-height:1.6}
.my{font-family:"Myanmar Text","Noto Sans Myanmar","Padauk",sans-serif;line-height:1.9}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:200px}
header h1 small{display:block;font-size:12px;font-weight:400;opacity:.9}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 10px}
.hbtn:hover{background:rgba(255,255,255,.28)}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.6);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:#fff;border:0;padding:6px 10px}
.seg button.on{background:#fff;color:var(--pri);font-weight:700}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:16px;margin:14px 0 8px}
.muted{color:var(--sub);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:220px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.sub{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.gray{background:#eef1f5;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.cat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfcfe}
.cat .t{font-weight:700}
.cat .sets{display:flex;gap:6px;margin-top:8px}
.setb{flex:1;border:1px solid var(--pri);background:#fff;color:var(--pri);border-radius:8px;padding:6px 4px;font-size:14px;line-height:1.3}
.setb small{display:block;font-size:12px;color:var(--sub)}
.setb.pass{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.setb.fail{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.final{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.finalb{border:2px solid var(--pri);background:var(--pri2);border-radius:12px;padding:12px;text-align:left}
.finalb b{font-size:17px}
.finalb.pass{border-color:var(--ok);background:var(--okbg)}
.finalb.fail{border-color:var(--warn);background:var(--warnbg)}
.voice{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--pri2);color:var(--pri)}
.voice.warn{background:var(--warnbg);color:var(--warn)}
/* 問題画面 */
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qtop .lbl{font-weight:700}
.timer{margin-left:auto;font-weight:700;font-size:18px;padding:4px 12px;border-radius:8px;background:var(--pri2);color:var(--pri)}
.timer.low{background:var(--ngbg);color:var(--ng)}
.bar{height:8px;background:#e3e8ef;border-radius:4px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--pri)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.qno{font-size:14px;color:var(--sub)}
.qbody{display:flex;gap:16px;align-items:flex-start;margin:6px 0 12px}
.sign{flex:0 0 120px;width:120px;height:120px}
.sign svg{width:100%;height:100%}
.qtext{flex:1;font-size:20px}
.qtext .ja{font-weight:600}
.qtext .my{font-size:19px;color:#253d63;margin-top:6px}
.both .qtext .my{border-top:1px dashed var(--line);padding-top:6px}
.ox{display:flex;gap:14px;margin:8px 0}
.ox button{flex:1;font-size:52px;font-weight:700;padding:10px 0;border-radius:14px;border:3px solid var(--line);background:#fff;line-height:1.1}
.ox button small{display:block;font-size:13px;font-weight:400;color:var(--sub)}
.ox .o{color:#1565c0}.ox .x{color:var(--ng)}
.ox button.sel{border-color:var(--pri);background:var(--pri2)}
.ox button.right{border-color:var(--ok);background:var(--okbg)}
.ox button.wrong{border-color:var(--ng);background:var(--ngbg)}
.fb{border-radius:12px;padding:12px 14px;margin-top:10px}
.fb.ok{background:var(--okbg);border:1px solid #9fd5b1}
.fb.ng{background:var(--ngbg);border:1px solid #f0b3b3}
.fb .h{font-weight:700;font-size:18px}
.fb .ex{margin-top:4px}
.fb .src{font-size:12px;color:var(--sub);margin-top:4px}
.anbox{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.anbar{flex:0 0 140px;height:6px;background:#dfe5ec;border-radius:3px;overflow:hidden}
.anbar i{display:block;height:100%;width:0;background:var(--pri)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.spk{background:#fff;border:1px solid var(--pri);color:var(--pri);border-radius:8px;padding:6px 12px}
.spk.on{background:var(--pri);color:#fff}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.dots button{width:34px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:13px;padding:0}
.dots button.done{background:var(--pri2);border-color:var(--pri)}
.dots button.cur{outline:2px solid var(--pri)}
/* 結果 */
.big{font-size:34px;font-weight:800}
.passb{display:inline-block;padding:4px 16px;border-radius:999px;font-weight:800;font-size:20px}
.passb.p{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}
.passb.f{background:var(--ngbg);color:var(--ng);border:2px solid var(--ng)}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:14px}
th{background:#f1f4f8}
.rate{display:inline-block;height:10px;background:var(--pri);border-radius:5px;vertical-align:middle}
.res-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.res-item.ng{border-color:#f0b3b3;background:#fffafa}
.res-item .mk{font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:90%}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:40;overflow:auto;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:820px;width:100%;padding:20px}
.flow{counter-reset:f;padding-left:0;list-style:none}
.flow li{position:relative;padding:6px 0 6px 40px}
.flow li:before{counter-increment:f;content:counter(f);position:absolute;left:0;top:6px;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;text-align:center;line-height:28px;font-weight:700}
.chk label{display:block;padding:3px 0}
.src-list{font-size:12px;color:var(--sub);word-break:break-all}
.warnc{border-color:#f0c36d;background:#fffaf0}
.warnc summary{cursor:pointer;color:var(--warn);font-size:17px}
.notes{padding-left:22px;margin:10px 0 0}
.notes li{margin-bottom:8px}
.notes .my{color:#253d63;font-size:15px}
.rncard{background:linear-gradient(90deg,#eaf1fb,#fff);border-left:6px solid var(--pri);padding:12px 16px}
.rinen .rn-co{font-weight:700;color:var(--pri)}
.rinen .rn-head{font-size:20px;font-weight:800;color:#0f3d7a;letter-spacing:.5px;margin:2px 0}
.ks-pts .rinen{background:#eaf1fb;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:15px}
.ks-pts .rinen .rn-head{font-size:17px}
.kscard{border:2px solid var(--pri);background:var(--pri2)}
.kscard .row{margin-top:8px}
.ks-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px;font-size:18px}
.ks-top b{color:var(--pri)}
.ks-slide{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;align-items:start}
.ks-img svg{width:100%;height:auto;max-height:calc(100vh - 300px);border-radius:10px;display:block}
.ks-pts h2{font-size:22px;margin:0 0 8px;color:var(--pri)}
.ks-pts h2 .my{font-size:18px;display:block;color:#253d63}
.ks-pts ul{margin:0;padding-left:20px}
.ks-pts li{margin-bottom:8px;font-size:17px}
.ks-pts li .my{font-size:15px;color:#253d63}
.ks-foot{position:sticky;bottom:0;background:var(--bg);padding:6px 0 10px;z-index:5}
.ks-cap{min-height:48px;margin:4px 0 8px;padding:10px 14px;background:#263238;color:#fff;border-radius:10px;font-size:17px}
.ks-cap .my{font-size:16px}
.ks-cap:empty{display:none}
.ks-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.ks-end{text-align:center;padding:30px 10px}
.ks-end h2{font-size:26px;color:var(--ok)}
@media (max-width:760px){ .ks-slide{grid-template-columns:1fr} }
.hide{display:none!important}
/* ===== スマホ（iPhone・Android）向け ===== */
@media (max-width:640px){
  header{position:static;padding:8px 10px;gap:6px}
  header h1{font-size:15px;min-width:100%;line-height:1.4}
  header h1 small{font-size:11px}
  body.both header .my{display:none}
  .seg button{padding:5px 9px;font-size:13px}
  .hbtn{padding:5px 8px;font-size:13px}
  main{padding:10px}
  .card{padding:12px;margin-bottom:10px}
  h2{font-size:17px}
  .rinen .rn-head{font-size:16px}
  .rncard{font-size:14px}
  input[type=text]{min-width:0;width:100%}
  .row label{width:100%}
  .grid,.final{grid-template-columns:1fr}
  .qtop{position:sticky;top:0;z-index:10;background:var(--bg);padding:6px 0;margin:-10px 0 6px}
  .qcard{padding:12px}
  .ox button{font-size:42px;padding:12px 0}
  .nav{gap:6px}
  .nav .btn{flex:1;padding:10px 8px}
  .fb .h{font-size:16px}
  #histBox{overflow-x:auto}
  th,td{font-size:13px;padding:5px 6px}
  .ks-top{font-size:16px}
  .ks-slide{padding:10px;gap:10px}
  .ks-img svg{max-height:none}
  .ks-pts h2{font-size:18px}
  .ks-pts li{font-size:15px}
  .ks-pts li .my{font-size:14px}
  .ks-cap{font-size:15px;min-height:40px}
  .ks-ctl{gap:6px}
  .ks-ctl .btn{padding:9px 10px;font-size:14px}
  .ks-ctl label{width:100%;text-align:center;font-size:14px}
  .modal{padding:8px}
  .modal .box{padding:14px}
  .big{font-size:28px}
  .mobhint{display:block!important}
}
.mobhint{display:none;font-size:13px;color:var(--warn);margin-top:8px}
#printArea{display:none}
@media (max-width:600px){ .qtext{font-size:18px} .sign{flex-basis:90px;width:90px;height:90px} .qbody{flex-direction:column;align-items:center} }
@media print{
  @page{size:A4 portrait;margin:12mm}
  html,body{background:#fff!important}
  header,main,.toast,.modal{display:none!important}
  #printArea{display:block;font-size:10pt;line-height:1.5;color:#000}
  #printArea h1{font-size:16pt;margin:0 0 4px}
  #printArea table{margin:4px 0}
  #printArea th,#printArea td{font-size:9pt;padding:3px 5px;border:1px solid #888}
  #printArea .pi{border:1px solid #999;border-radius:4px;padding:4px 6px;margin-bottom:4px;page-break-inside:avoid;font-size:9pt}
  #printArea .my{font-size:9.5pt}
  #printArea .sig{display:flex;gap:10mm;margin-top:6mm}
  #printArea .sig div{flex:1;border-bottom:1px solid #000;height:10mm;font-size:9pt}
}
</style>
</head>
<body>
<header>
  <h1 id="appTitle"></h1>
  <div class="seg" id="langSeg">
    <button data-l="ja">日本語</button><button data-l="both">両方</button><button data-l="my" class="my">မြန်မာ</button>
  </div>
  <button class="hbtn" id="guideBtn"></button>
  <button class="hbtn" id="infoBtn"></button>
  <button class="hbtn" id="homeBtn"></button>
</header>
<main>
  <!-- ホーム -->
  <section id="v_home">
    <div class="card rncard" id="rinenBox"></div>
    <div class="card">
      <h2 id="h_start"></h2>
      <div class="row">
        <label><span id="l_name"></span> <input type="text" id="name" autocomplete="off"></label>
        <label><input type="checkbox" id="autoRead" checked> <span id="l_auto"></span></label>
        <label><span id="l_rate"></span>
          <select id="rate"><option value="0.85">0.85</option><option value="1" selected>1.0</option><option value="1.15">1.15</option><option value="1.3">1.3</option></select></label>
      </div>
      <p class="voice" id="voiceInfo"></p>
      <p class="muted" id="p_howto"></p>
    </div>
    <div class="card kscard" id="ksCard"></div>
    <div class="card warnc">
      <details id="notesBox"><summary><b id="h_notes"></b></summary><div id="notesBody"></div></details>
    </div>
    <div class="card">
      <h2 id="h_cat"></h2>
      <p class="muted" id="p_cat"></p>
      <div class="grid" id="catBox"></div>
    </div>
    <div class="card">
      <h2 id="h_final"></h2>
      <p class="muted" id="p_final"></p>
      <div class="final" id="finalBox"></div>
    </div>
    <div class="card">
      <h2 id="h_hist"></h2>
      <div id="histBox"></div>
    </div>
  </section>

  <!-- 問題 -->
  <section id="v_quiz" class="hide">
    <div class="qtop">
      <span class="lbl" id="qLabel"></span>
      <button class="spk" id="spkBtn"></button>
      <span class="timer hide" id="timer"></span>
    </div>
    <div class="bar"><i id="barIn"></i></div>
    <div class="qcard" id="qCard">
      <div class="qno" id="qNo"></div>
      <div class="qbody"><div id="qSign"></div><div class="qtext" id="qText"></div></div>
      <div class="ox">
        <button class="o" id="btnO">○<small id="s_o"></small></button>
        <button class="x" id="btnX">×<small id="s_x"></small></button>
      </div>
      <div id="fb"></div>
      <div class="nav">
        <button class="btn gray" id="prevBtn"></button>
        <button class="btn gray" id="quitBtn"></button>
        <button class="btn" id="nextBtn"></button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </section>

  <!-- 研修 -->
  <section id="v_kenshu" class="hide">
    <div class="ks-top"><b id="ksNo"></b><span id="ksTitle"></span></div>
    <div class="bar"><i id="ksBar"></i></div>
    <div class="ks-slide" id="ksSlide"></div>
    <div class="ks-foot"><div class="ks-cap" id="ksCap"></div>
    <div class="ks-ctl">
      <button class="btn gray" id="ksPrev"></button>
      <button class="btn" id="ksPlayBtn"></button>
      <button class="btn gray" id="ksNext"></button>
      <label><input type="checkbox" id="ksAutoNext" checked> <span id="l_ksAuto"></span></label>
    </div></div>
  </section>

  <!-- 結果 -->
  <section id="v_result" class="hide">
    <div class="card" id="resTop"></div>
    <div class="card" id="resCat"></div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 id="h_detail" style="margin:0"></h2>
        <label><input type="checkbox" id="onlyNg"> <span id="l_onlyng"></span></label>
      </div>
      <div id="resList" style="margin-top:10px"></div>
    </div>
  </section>
</main>

<div class="modal" id="infoModal"><div class="box" id="infoBox"></div></div>
<div class="toast" id="toast"></div>

QUESTIONS.push(
 {id:"anzen-1-01", cat:"anzen", set:1, final:0, fo:0, ans:true, ja:"標識などで指定がない高速自動車国道の本線車道では、普通自動車の最高速度は時速100kmである。", my:"ယာဉ်စည်းကမ်းဆိုင်းဘုတ် စသည်ဖြင့် သတ်မှတ်ထားခြင်းမရှိသော အမြန်လမ်း(高速自動車国道) ၏ ပင်မယာဉ်သွားလမ်း(本線車道) တွင် သာမန်မော်တော်ကား(普通自動車) ၏ အမြင့်ဆုံးအမြန်နှုန်းမှာ တစ်နာရီ 100 ကီလိုမီတာ ဖြစ်သည်။", exJa:"正しい。指定がなければ、普通自動車の最高速度は100km/h、最低速度は50km/hである。", exMy:"မှန်သည်။ သတ်မှတ်ချက်မရှိလျှင် သာမန်မော်တော်ကား၏ အမြင့်ဆုံးအမြန်နှုန်းမှာ တစ်နာရီ 100 ကီလိုမီတာ၊ အနိမ့်ဆုံးအမြန်နှုန်းမှာ တစ်နာရီ 50 ကီလိုမီတာ ဖြစ်သည်။", src:"令27条・教則7章2節2"},
 {id:"anzen-1-02", cat:"anzen", set:1, final:0, fo:0, ans:false, ja:"標識などで指定がない高速自動車国道の本線車道の最低速度は、時速40kmである。", my:"ယာဉ်စည်းကမ်းဆိုင်းဘုတ် စသည်ဖြင့် သတ်မှတ်ထားခြင်းမရှိသော အမြန်လမ်း(高速自動車国道) ၏ ပင်မယာဉ်သွားလမ်း(本線車道) ၏ အနိမ့်ဆုံးအမြန်နှုန်းမှာ တစ်နာရီ 40 ကီလိုမီတာ ဖြစ်သည်။", exJa:"誤り。正しくは、最低速度は時速50kmである。これより遅く走ってはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ အနိမ့်ဆုံးအမြန်နှုန်းသည် တစ်နာရီ 50 ကီလိုမီတာ ဖြစ်သည်။ ထိုထက် နှေးကွေးစွာ မမောင်းရ။", src:"法75条の4・令27条の3"},
 {id:"anzen-1-03", cat:"anzen", set:1, final:0, fo:0, ans:true, ja:"高速道路では、路側帯や路肩を通行してはいけない。", my:"အမြန်လမ်းတွင် လမ်းဘေးဇုန်(路側帯) နှင့် လမ်းပခုံး(路肩) ပေါ်မှ မောင်းနှင်သွားလာခြင်း မပြုရ။", exJa:"正しい。高速道路の路側帯や路肩は通行してはいけない。故障などのときに止まるための場所である。", exMy:"မှန်သည်။ အမြန်လမ်း၏ လမ်းဘေးဇုန်နှင့် လမ်းပခုံးပေါ်မှ မမောင်းရ။ ယာဉ်ပျက်ခြင်း စသည့်အခါ ရပ်ရန်နေရာ ဖြစ်သည်။", src:"教則7章2節3"},
 {id:"anzen-1-04", cat:"anzen", set:1, final:0, fo:0, ans:false, ja:"一般原動機付自転車は、高速道路の左側端に寄って通行すれば、高速道路を通行してよい。", my:"မော်တာဆိုင်ကယ်ငယ်(原付) သည် အမြန်လမ်း၏ ဘယ်ဘက်အစွန်းသို့ ကပ်၍ မောင်းလျှင် အမြန်လမ်းပေါ်တွင် မောင်းနှင်နိုင်သည်။", exJa:"誤り。正しくは、一般原動機付自転車は、どのように走っても高速道路を通行できない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ မော်တာဆိုင်ကယ်ငယ်(原付) သည် မည်သို့ပင် မောင်းစေကာမူ အမြန်လမ်းပေါ်တွင် မောင်းနှင်ခွင့် မရှိပါ။", src:"教則7章"},
 {id:"anzen-1-05", cat:"anzen", set:1, final:0, fo:0, ans:true, ja:"酒気を帯びているときは、飲んだ酒の量が少なくても、車を運転してはいけない。", my:"အရက်ဓာတ် ကိုယ်ထဲတွင် ရှိနေစဉ် သောက်ခဲ့သော အရက်ပမာဏ နည်းသော်လည်း ယာဉ်ကို မမောင်းရ။", exJa:"正しい。酒の量にかかわらず、酒気を帯びて運転してはいけない。", exMy:"မှန်သည်။ အရက်ပမာဏ များသည်ဖြစ်စေ နည်းသည်ဖြစ်စေ အရက်သောက်၍ မောင်းနှင်ခြင်း(酒気帯び運転) မပြုရ။", src:"法65条1項"},
 {id:"anzen-1-06", cat:"anzen", set:1, final:0, fo:0, ans:false, ja:"走行中でも短い時間であれば、手に持った携帯電話で通話してよい。", my:"ယာဉ်မောင်းနေစဉ်ပင် ခဏတာသာ ဖြစ်လျှင် မိုဘိုင်းဖုန်းကို လက်ဖြင့်ကိုင်၍ ဖုန်းပြောနိုင်သည်။", exJa:"誤り。正しくは、停止中を除き、手に持った携帯電話で通話してはいけない。時間の長さは関係ない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ယာဉ်ရပ်ထားချိန်မှလွဲ၍ မိုဘိုင်းဖုန်းကို လက်ဖြင့်ကိုင်၍ ဖုန်းမပြောရ။ ကြာချိန် တိုသည် ရှည်သည်နှင့် မသက်ဆိုင်ပါ။", src:"法71条5号の5"},
 {id:"anzen-1-07", cat:"anzen", set:1, final:0, fo:0, ans:true, ja:"運転者は、後部座席の同乗者にもシートベルトを着用させなければならない。", my:"ယာဉ်မောင်းသူသည် နောက်ခုံတွင် လိုက်ပါစီးနင်းသူများကိုလည်း ထိုင်ခုံခါးပတ် ပတ်စေရမည်။", exJa:"正しい。運転者は自分が着用し、助手席や後部座席の同乗者にも着用させる。病気などやむを得ない場合は別である。", exMy:"မှန်သည်။ ယာဉ်မောင်းသူကိုယ်တိုင် ပတ်ရပြီး ရှေ့ခုံနှင့် နောက်ခုံ လိုက်ပါသူများကိုလည်း ပတ်စေရမည်။ ရောဂါ စသည့် မလွှဲသာသော အကြောင်းရှိလျှင် ခြွင်းချက်ဖြစ်သည်။", src:"法71条の3・教則5章1節3"},
 {id:"anzen-1-08", cat:"anzen", set:1, final:0, fo:0, ans:false, ja:"灯火をつけなければならない夜間とは、午後8時から午前5時までをいう。", my:"မီးဖွင့်ရမည့် ညအချိန်ဆိုသည်မှာ ညနေ 8 နာရီမှ မနက် 5 နာရီအထိ ဖြစ်သည်။", exJa:"誤り。正しくは、夜間とは日没から日出までをいう。前照灯・車幅灯・尾灯などをつける。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ညအချိန်ဆိုသည်မှာ နေဝင်ချိန်မှ နေထွက်ချိန်အထိ ဖြစ်သည်။ ရှေ့မီးကြီး(前照灯)၊ ဘေးမီး(車幅灯)၊ နောက်မီး(尾灯) စသည်တို့ကို ဖွင့်ရမည်။", src:"法52条1項"},
 {id:"anzen-1-09", cat:"anzen", set:1, final:0, fo:0, ans:true, ja:"交通事故を起こしたときは、直ちに運転をやめ、負傷者を救護しなければならない。", my:"ယာဉ်မတော်တဆမှု ဖြစ်စေမိလျှင် ချက်ချင်း မောင်းနှင်ခြင်းကို ရပ်ပြီး ဒဏ်ရာရသူကို ကယ်ဆယ်ပြုစုရမည်။", exJa:"正しい。直ちに運転をやめ、負傷者の救護、危険防止の措置をし、警察官に報告する。", exMy:"မှန်သည်။ ချက်ချင်းရပ်ပြီး ဒဏ်ရာရသူကို ကယ်ဆယ်ပြုစုခြင်း၊ နောက်ထပ်အန္တရာယ် မဖြစ်အောင် ကာကွယ်ခြင်း ပြုလုပ်ကာ ရဲ ထံ အကြောင်းကြားရမည်။", src:"法72条1項"},
 {id:"anzen-1-10", cat:"anzen", set:1, final:0, fo:0, ans:false, ja:"高速道路で故障して運転できなくなったときは、危険防止の措置をした後、車の中に残って救援を待つ。", my:"အမြန်လမ်းတွင် ယာဉ်ပျက်၍ မမောင်းနိုင်တော့သည့်အခါ အန္တရာယ်ကာကွယ်ရေး လုပ်ဆောင်ပြီးနောက် ကားထဲတွင် ဆက်နေ၍ အကူအညီကို စောင့်ရမည်။", exJa:"誤り。正しくは、車に残るのは後続車に追突されるおそれがあり危険なので、ガードレールの外側などに避難する。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ကားထဲတွင် နေခြင်းသည် နောက်ကားက ဝင်တိုက်နိုင်၍ အန္တရာယ်ရှိသောကြောင့် လမ်းဘေးအကာအရံ(ガードレール) ၏ အပြင်ဘက် စသည့် ဘေးကင်းသောနေရာသို့ ရှောင်ရမည်။", src:"教則7章2節4"},

 {id:"anzen-2-01", cat:"anzen", set:2, final:0, fo:0, ans:false, ja:"標識などで指定がない高速自動車国道では、大型貨物自動車の最高速度は時速100kmである。", my:"ယာဉ်စည်းကမ်းဆိုင်းဘုတ် စသည်ဖြင့် သတ်မှတ်ထားခြင်းမရှိသော အမြန်လမ်း(高速自動車国道) တွင် ကုန်တင်ကားကြီး(大型貨物自動車) ၏ အမြင့်ဆုံးအမြန်နှုန်းမှာ တစ်နာရီ 100 ကီလိုမီတာ ဖြစ်သည်။", exJa:"誤り。正しくは、大型貨物自動車などの最高速度は時速90kmである。普通自動車は100kmである。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ကုန်တင်ကားကြီး(大型貨物自動車) စသည်တို့၏ အမြင့်ဆုံးအမြန်နှုန်းမှာ တစ်နာရီ 90 ကီလိုမီတာ ဖြစ်သည်။ သာမန်မော်တော်ကားမှာ 100 ကီလိုမီတာ ဖြစ်သည်။", src:"令27条・教則7章2節2"},
 {id:"anzen-2-02", cat:"anzen", set:2, final:0, fo:0, ans:true, ja:"高速道路の本線車道に入るとき、加速車線があれば、加速車線で十分に加速しなければならない。", my:"အမြန်လမ်း၏ ပင်မယာဉ်သွားလမ်း(本線車道) သို့ ဝင်သည့်အခါ အရှိန်မြှင့်လမ်းကြော(加速車線) ရှိလျှင် ထိုလမ်းကြောတွင် အရှိန်ကို လုံလောက်စွာ မြှင့်ရမည်။", exJa:"正しい。加速車線で十分に加速し、本線車道を走る車の進行を妨げないように入る。", exMy:"မှန်သည်။ အရှိန်မြှင့်လမ်းကြောတွင် လုံလောက်စွာ အရှိန်မြှင့်ပြီး ပင်မယာဉ်သွားလမ်းပေါ်ရှိ ကားများကို မနှောင့်ယှက်အောင် ဝင်ရမည်။", src:"教則7章2節1"},
 {id:"anzen-2-03", cat:"anzen", set:2, final:0, fo:0, ans:true, ja:"路面が乾いていてタイヤが新しいとき、高速道路を時速100kmで走る場合の車間距離は約100mが目安である。", my:"လမ်းမျက်နှာပြင် ခြောက်သွေ့ပြီး တာယာ အသစ်ဖြစ်သည့်အခါ အမြန်လမ်းပေါ်တွင် တစ်နာရီ 100 ကီလိုမီတာဖြင့် မောင်းလျှင် ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေး ခန့်မှန်းခြေ 100 မီတာ ထားရမည်။", exJa:"正しい。乾燥路面で時速100kmなら約100m、時速80kmなら約80mの車間距離が必要である。", exMy:"မှန်သည်။ လမ်းခြောက်သွေ့ချိန် တစ်နာရီ 100 ကီလိုမီတာဆိုလျှင် ခန့်မှန်းခြေ 100 မီတာ၊ 80 ကီလိုမီတာဆိုလျှင် ခန့်မှန်းခြေ 80 မီတာ ခြားထားရန် လိုအပ်သည်။", src:"教則7章2節2"},
 {id:"anzen-2-04", cat:"anzen", set:2, final:0, fo:0, ans:false, ja:"高速道路の本線車道に入ろうとする車は、本線車道を走っている車より優先する。", my:"အမြန်လမ်း၏ ပင်မယာဉ်သွားလမ်း(本線車道) သို့ ဝင်မည့်ကားသည် ပင်မယာဉ်သွားလမ်းပေါ်တွင် မောင်းနေသော ကားထက် ဦးစားပေးခွင့် ရှိသည်။", exJa:"誤り。正しくは、本線車道に入るときは、本線車道を走っている車の進行を妨げてはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ပင်မယာဉ်သွားလမ်းသို့ ဝင်သည့်အခါ ထိုလမ်းပေါ်တွင် မောင်းနေသော ကားများ၏ သွားလာမှုကို မနှောင့်ယှက်ရ။", src:"法75条の6・教則7章2節1"},
 {id:"anzen-2-05", cat:"anzen", set:2, final:0, fo:0, ans:true, ja:"呼気1リットル中に0.15mg以上のアルコールを含む状態で運転すると、酒気帯び運転として罰則の対象になる。", my:"ထုတ်လိုက်သောလေ 1 လီတာတွင် အယ်လ်ကိုဟော 0.15 မီလီဂရမ် နှင့်အထက် ပါဝင်နေသည့် အခြေအနေဖြင့် မောင်းလျှင် အရက်သောက်၍ မောင်းနှင်ခြင်း(酒気帯び運転) အဖြစ် ပြစ်ဒဏ်ခံရမည်။", exJa:"正しい。呼気1リットルにつき0.15mg以上（血液1mLにつき0.3mg以上）が罰則の基準である。", exMy:"မှန်သည်။ ထုတ်လိုက်သောလေ 1 လီတာလျှင် 0.15 မီလီဂရမ် နှင့်အထက် (သွေး 1 မီလီလီတာလျှင် 0.3 မီလီဂရမ် နှင့်အထက်) သည် ပြစ်ဒဏ်ပေးမည့် စံနှုန်း ဖြစ်သည်။", src:"法117条の2の2・令44条の3"},
 {id:"anzen-2-06", cat:"anzen", set:2, final:0, fo:0, ans:false, ja:"走行中に、カーナビゲーション装置の画面を注視してもよい。", my:"ယာဉ်မောင်းနေစဉ် ကားလမ်းညွှန်စက်(カーナビ) ၏ မျက်နှာပြင်ကို စိုက်ကြည့်နေနိုင်သည်။", exJa:"誤り。正しくは、停止中を除き、カーナビや携帯電話の画面を注視してはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ယာဉ်ရပ်ထားချိန်မှလွဲ၍ ကားလမ်းညွှန်စက် သို့မဟုတ် မိုဘိုင်းဖုန်း၏ မျက်နှာပြင်ကို စိုက်မကြည့်ရ။", src:"法71条5号の5・教則5章1節2"},
 {id:"anzen-2-07", cat:"anzen", set:2, final:0, fo:0, ans:false, ja:"6歳未満の幼児を乗せるときでも、大人がひざの上で抱いていればチャイルドシートを使わなくてよい。", my:"အသက် 6 နှစ်အောက် ကလေးငယ်ကို တင်ဆောင်သည့်အခါ လူကြီးက ပေါင်ပေါ်တွင် ပွေ့ချီထားလျှင် ကလေးထိုင်ခုံ(チャイルドシート) ကို မသုံးလည်း ရသည်။", exJa:"誤り。正しくは、6歳未満の幼児にはチャイルドシートを使用させなければならない。抱いているだけではいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ အသက် 6 နှစ်အောက် ကလေးငယ်ကို ကလေးထိုင်ခုံ(チャイルドシート) အသုံးပြုစေရမည်။ ပွေ့ချီထားရုံဖြင့် မလုံလောက်ပါ။", src:"法71条の3第3項・教則5章1節4"},
 {id:"anzen-2-08", cat:"anzen", set:2, final:0, fo:0, ans:true, ja:"トンネルの中や濃い霧の中で50m先が見えない一般道路では、昼間でも前照灯などをつけなければならない。", my:"ဥမင်လိုဏ်ခေါင်းထဲ သို့မဟုတ် မြူထူထပ်သော နေရာတွင် 50 မီတာ အရှေ့ကို မမြင်ရသော သာမန်လမ်းတွင် နေ့ခင်းဖြစ်သော်လည်း ရှေ့မီးကြီး(前照灯) စသည်တို့ကို ဖွင့်ရမည်။", exJa:"正しい。50m（高速道路では200m）先が見えないような場所では、昼間でもライトをつける。", exMy:"မှန်သည်။ 50 မီတာ (အမြန်လမ်းတွင် 200 မီတာ) အရှေ့ကို မမြင်ရသော နေရာတွင် နေ့ခင်းဖြစ်သော်လည်း မီးဖွင့်ရမည်။", src:"法52条1項・令19条・教則6章3節2"},
 {id:"anzen-2-09", cat:"anzen", set:2, final:0, fo:0, ans:false, ja:"交通事故で負傷者が頭にけがをしているときは、すぐに体を起こして座らせるのがよい。", my:"ယာဉ်မတော်တဆမှုတွင် ဒဏ်ရာရသူ ခေါင်းတွင် ဒဏ်ရာရနေလျှင် ချက်ချင်း ကိုယ်ကို မ၍ ထိုင်ခိုင်းခြင်းသည် ကောင်းသည်။", exJa:"誤り。正しくは、むやみに負傷者を動かさない。特に頭にけがをしているときは動かさない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ဒဏ်ရာရသူကို မလိုအပ်ဘဲ မရွှေ့ရ။ အထူးသဖြင့် ခေါင်းတွင် ဒဏ်ရာရနေလျှင် မရွှေ့ရ။", src:"教則10章1節1"},
 {id:"anzen-2-10", cat:"anzen", set:2, final:0, fo:0, ans:true, ja:"高速道路の本線車道では、転回や後退をしてはいけない。", my:"အမြန်လမ်း၏ ပင်မယာဉ်သွားလမ်း(本線車道) တွင် ယူတန်ကွေ့ခြင်း(転回) နှင့် နောက်ဆုတ်ခြင်း မပြုရ။", exJa:"正しい。本線車道では、転回・後退・中央分離帯を横切ることをしてはいけない。", exMy:"မှန်သည်။ ပင်မယာဉ်သွားလမ်းတွင် ယူတန်ကွေ့ခြင်း၊ နောက်ဆုတ်ခြင်း၊ လမ်းအလယ်ပိုင်းခြားကျွန်း(中央分離帯) ကို ဖြတ်ကူးခြင်း မပြုရ။", src:"法75条の5・教則7章2節3"},

 {id:"anzen-3-01", cat:"anzen", set:3, final:0, fo:0, ans:true, ja:"往復の方向別に分離されていない高速自動車国道の本線車道では、法定の最低速度は定められていない。", my:"အသွားအပြန် လမ်းကြောင်းခွဲခြားထားခြင်း မရှိသော အမြန်လမ်း(高速自動車国道) ၏ ပင်မယာဉ်သွားလမ်း(本線車道) တွင် ဥပဒေအရ အနိမ့်ဆုံးအမြန်နှုန်းကို သတ်မှတ်ထားခြင်း မရှိပါ။", exJa:"正しい。往復の方向別に分離されていない本線車道には、時速50kmの法定最低速度の決まりはない。", exMy:"မှန်သည်။ အသွားအပြန် ခွဲခြားထားခြင်းမရှိသော ပင်မယာဉ်သွားလမ်းတွင် ဥပဒေအရ တစ်နာရီ 50 ကီလိုမီတာ အနိမ့်ဆုံးအမြန်နှုန်း စည်းကမ်း မရှိပါ။", src:"令27条の2・27条の3・教則7章2節2"},
 {id:"anzen-3-02", cat:"anzen", set:3, final:0, fo:0, ans:false, ja:"高速道路では、故障などでやむを得ないときでも、路肩や路側帯に車を止めてはいけない。", my:"အမြန်လမ်းတွင် ယာဉ်ပျက်ခြင်း စသည့် မလွှဲသာသော အခြေအနေတွင်ပင် လမ်းပခုံး(路肩) သို့မဟုတ် လမ်းဘေးဇုန်(路側帯) တွင် ကားကို မရပ်ရ။", exJa:"誤り。正しくは、故障などでやむを得ないときは、十分な幅のある路肩や路側帯に駐停車できる。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ယာဉ်ပျက်ခြင်း စသည့် မလွှဲသာသောအခါ လုံလောက်သော အကျယ်ရှိသည့် လမ်းပခုံး သို့မဟုတ် လမ်းဘေးဇုန်တွင် ရပ်နိုင်သည်။", src:"法75条の8・教則7章2節4"},
 {id:"anzen-3-03", cat:"anzen", set:3, final:0, fo:0, ans:true, ja:"高速道路で故障などのため運転できなくなったときは、停止表示器材を車の後方の路上に置かなければならない。", my:"အမြန်လမ်းတွင် ယာဉ်ပျက်ခြင်း စသည်ဖြင့် မမောင်းနိုင်တော့သည့်အခါ ယာဉ်ရပ်ထားကြောင်းပြ ကိရိယာ(停止表示器材) ကို ကား၏ နောက်ဘက် လမ်းပေါ်တွင် ထားရမည်။", exJa:"正しい。後続車に止まっていることが分かるよう、車の後方の路上に停止表示器材を置く。", exMy:"မှန်သည်။ နောက်မှလာသော ကားများ သိစေရန် ကား၏ နောက်ဘက် လမ်းပေါ်တွင် ယာဉ်ရပ်ထားကြောင်းပြ ကိရိယာ ကို ထားရမည်။", src:"法75条の11・教則7章2節4"},
 {id:"anzen-3-04", cat:"anzen", set:3, final:0, fo:0, ans:false, ja:"総排気量125cc以下の普通自動二輪車は、高速道路を通行することができる。", my:"အင်ဂျင်ပမာဏ 125cc နှင့်အောက် ဆိုင်ကယ်(普通自動二輪車) သည် အမြန်လမ်းပေါ်တွင် မောင်းနှင်နိုင်သည်။", exJa:"誤り。正しくは、125cc以下の普通自動二輪車（小型二輪車）は、高速道路を通行できない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ 125cc နှင့်အောက် ဆိုင်ကယ်(小型二輪車) သည် အမြန်လမ်းပေါ်တွင် မောင်းနှင်ခွင့် မရှိပါ။", src:"教則7章"},
 {id:"anzen-3-05", cat:"anzen", set:3, final:0, fo:0, ans:false, ja:"酒気を帯びていて運転するおそれがある人に、車を貸してもよい。", my:"အရက်ဓာတ်ရှိနေပြီး ယာဉ်မောင်းနိုင်ခြေ ရှိသူကို ကားငှားပေးနိုင်သည်။", exJa:"誤り。正しくは、酒気を帯びて運転するおそれがある人に車を貸してはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ အရက်သောက်၍ မောင်းနိုင်ခြေရှိသူကို ကား မငှားပေးရ။", src:"法65条2項"},
 {id:"anzen-3-06", cat:"anzen", set:3, final:0, fo:0, ans:true, ja:"運転者が酒気を帯びていると知りながら、その車に乗せてもらってはいけない。", my:"ယာဉ်မောင်းသူတွင် အရက်ဓာတ်ရှိနေကြောင်း သိလျက်နှင့် ထိုကားပေါ်တွင် လိုက်မစီးရ။", exJa:"正しい。運転者が酒気を帯びていると知って、運転を頼んだり同乗したりしてはいけない。", exMy:"မှန်သည်။ ယာဉ်မောင်းသူ အရက်သောက်ထားကြောင်း သိလျက် မောင်းခိုင်းခြင်း သို့မဟုတ် လိုက်စီးခြင်း မပြုရ။", src:"法65条4項"},
 {id:"anzen-3-07", cat:"anzen", set:3, final:0, fo:0, ans:true, ja:"夜間、対向車と行き違うときは、前照灯を減光するか、下向きに切り替えなければならない。", my:"ညအချိန် ဆန့်ကျင်ဘက်မှလာသော ကားနှင့် ဖြတ်သန်းသည့်အခါ ရှေ့မီးကြီး(前照灯) ၏ အလင်းကို လျှော့ရမည် သို့မဟုတ် အောက်သို့ ချရမည်။", exJa:"正しい。対向車と行き違うときや他の車の直後を走るときは、減光するか下向きにする。", exMy:"မှန်သည်။ ဆန့်ကျင်ဘက်ကားနှင့် ဖြတ်သန်းချိန် သို့မဟုတ် အခြားကား၏ နောက်မှ ကပ်လိုက်မောင်းချိန်တွင် မီးအလင်းလျှော့ရမည် သို့မဟုတ် အောက်သို့ ချရမည်။", src:"法52条2項・教則6章3節2"},
 {id:"anzen-3-08", cat:"anzen", set:3, final:0, fo:0, ans:false, ja:"エアバッグを備えている自動車であれば、シートベルトを着用しなくてよい。", my:"လေအိတ်(エアバッグ) တပ်ဆင်ထားသော ကားဖြစ်လျှင် ထိုင်ခုံခါးပတ် မပတ်လည်း ရသည်။", exJa:"誤り。正しくは、エアバッグがある車でも、シートベルトを着用しなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လေအိတ် ပါသော ကားဖြစ်စေကာမူ ထိုင်ခုံခါးပတ် ပတ်ရမည်။", src:"法71条の3・教則5章1節3"},
 {id:"anzen-3-09", cat:"anzen", set:3, final:0, fo:0, ans:false, ja:"交通事故で負傷者のけがが軽いときは、警察官に届けなくてよい。", my:"ယာဉ်မတော်တဆမှုတွင် ဒဏ်ရာရသူ၏ ဒဏ်ရာ ပေါ့ပါးလျှင် ရဲ ထံ အကြောင်းမကြားလည်း ရသည်။", exJa:"誤り。正しくは、軽いけがでも必ず警察官に届ける。外傷がなくても頭を強く打ったら医師の診断を受ける。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ဒဏ်ရာ ပေါ့ပါးသော်လည်း ရဲ ထံ မဖြစ်မနေ အကြောင်းကြားရမည်။ ပြင်ပဒဏ်ရာ မရှိသော်လည်း ခေါင်းကို ပြင်းထန်စွာ ထိခိုက်မိလျှင် ဆရာဝန်ထံ ပြသရမည်။", src:"法72条1項・教則10章1節2"},
 {id:"anzen-3-10", cat:"anzen", set:3, final:0, fo:0, ans:true, ja:"高速道路で路面が雨にぬれ、タイヤがすり減っているときは、乾燥時の約2倍の車間距離が必要になることがある。", my:"အမြန်လမ်းတွင် လမ်းမျက်နှာပြင် မိုးရေစိုနေပြီး တာယာ ပွန်းစားနေသည့်အခါ လမ်းခြောက်ချိန်ထက် 2 ဆခန့် ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေး လိုအပ်နိုင်သည်။", exJa:"正しい。雨でぬれた路面やすり減ったタイヤでは、乾燥時の約2倍の車間距離が必要になることがある。", exMy:"မှန်သည်။ မိုးရေစိုသောလမ်း သို့မဟုတ် ပွန်းစားနေသော တာယာ ဖြစ်လျှင် လမ်းခြောက်ချိန်ထက် 2 ဆခန့် အကွာအဝေး လိုအပ်နိုင်သည်။", src:"教則7章2節2"},

 {id:"anzen-F-01", cat:"anzen", set:0, final:1, fo:1, ans:true, ja:"路面が乾いていてタイヤが新しいとき、高速道路を時速80kmで走る場合の車間距離は約80mが目安である。", my:"လမ်းမျက်နှာပြင် ခြောက်သွေ့ပြီး တာယာ အသစ်ဖြစ်သည့်အခါ အမြန်လမ်းပေါ်တွင် တစ်နာရီ 80 ကီလိုမီတာဖြင့် မောင်းလျှင် ရှေ့ကားနှင့် ခြားနားသောအကွာအဝေး ခန့်မှန်းခြေ 80 မီတာ ထားရမည်။", exJa:"正しい。乾燥路面で時速80kmなら約80m、時速100kmなら約100mの車間距離が必要である。", exMy:"မှန်သည်။ လမ်းခြောက်သွေ့ချိန် တစ်နာရီ 80 ကီလိုမီတာဆိုလျှင် ခန့်မှန်းခြေ 80 မီတာ၊ 100 ကီလိုမီတာဆိုလျှင် ခန့်မှန်းခြေ 100 မီတာ ခြားထားရန် လိုအပ်သည်။", src:"教則7章2節2"},
 {id:"anzen-F-02", cat:"anzen", set:0, final:1, fo:2, ans:false, ja:"呼気1リットル中のアルコールが0.15mg未満であれば、酒気を帯びて車を運転してもよい。", my:"ထုတ်လိုက်သောလေ 1 လီတာတွင် အယ်လ်ကိုဟော 0.15 မီလီဂရမ် အောက် ဖြစ်လျှင် အရက်ဓာတ် ရှိနေသော်လည်း ယာဉ်ကို မောင်းနိုင်သည်။", exJa:"誤り。正しくは、量にかかわらず酒気を帯びて運転してはいけない。呼気1リットルにつき0.15mg以上は罰則の基準であり、それ未満なら運転してよいという意味ではない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ပမာဏ မည်မျှပင်ဖြစ်စေ အရက်ဓာတ်ရှိလျှင် မမောင်းရ။ ထုတ်လိုက်သောလေ 1 လီတာလျှင် 0.15 မီလီဂရမ် နှင့်အထက်သည် ပြစ်ဒဏ်ပေးမည့် စံနှုန်းသာ ဖြစ်ပြီး ထိုထက်နည်းလျှင် မောင်းနိုင်သည်ဟု မဆိုလိုပါ။", src:"法65条1項・令44条の3"},
 {id:"anzen-F-03", cat:"anzen", set:0, final:1, fo:3, ans:true, ja:"高速道路のトンネルや霧の中などで200m先が見えないときは、昼間でも前照灯などをつけなければならない。", my:"အမြန်လမ်း၏ ဥမင်လိုဏ်ခေါင်းထဲ သို့မဟုတ် မြူထဲ စသည်တို့တွင် 200 မီတာ အရှေ့ကို မမြင်ရလျှင် နေ့ခင်းဖြစ်သော်လည်း ရှေ့မီးကြီး(前照灯) စသည်တို့ကို ဖွင့်ရမည်။", exJa:"正しい。高速道路では200m（一般道路では50m）先が見えないような場所で、昼間でもライトをつける。", exMy:"မှန်သည်။ အမြန်လမ်းတွင် 200 မီတာ (သာမန်လမ်းတွင် 50 မီတာ) အရှေ့ကို မမြင်ရသော နေရာတွင် နေ့ခင်းဖြစ်သော်လည်း မီးဖွင့်ရမည်။", src:"法52条1項・令19条・教則6章3節2"},
 {id:"anzen-F-04", cat:"anzen", set:0, final:1, fo:4, ans:false, ja:"夜間、交通量の多い市街地の道路では、前照灯を上向きにして走るのがよい。", my:"ညအချိန် ယာဉ်အသွားအလာ များသော မြို့တွင်းလမ်းတွင် ရှေ့မီးကြီး(前照灯) ကို အပေါ်သို့ (အဝေးမီး) ထား၍ မောင်းခြင်းသည် ကောင်းသည်။", exJa:"誤り。正しくは、交通量の多い市街地の道路などでは、前照灯を下向きに切り替えて運転する。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ယာဉ်အသွားအလာ များသော မြို့တွင်းလမ်း စသည်တို့တွင် ရှေ့မီးကြီးကို အောက်သို့ (အနီးမီး) ပြောင်း၍ မောင်းရမည်။", src:"教則6章3節2"},
 {id:"anzen-F-05", cat:"anzen", set:0, final:1, fo:5, ans:true, ja:"高速道路で故障などのため運転できなくなったときは、110番で警察に連絡し、速やかに車を安全な場所へ移さなければならない。", my:"အမြန်လမ်းတွင် ယာဉ်ပျက်ခြင်း စသည်ဖြင့် မမောင်းနိုင်တော့လျှင် 110 သို့ ဖုန်းဆက်၍ ရဲ ကို အကြောင်းကြားပြီး ကားကို ဘေးကင်းသောနေရာသို့ အမြန် ရွှေ့ရမည်။", exJa:"正しい。110番で警察に連絡し、非常電話でレッカー車を呼ぶなどして、速やかに車を安全な場所へ移す。", exMy:"မှန်သည်။ 110 ဖြင့် ရဲ ကို အကြောင်းကြားပြီး အရေးပေါ်ဖုန်းဖြင့် ကားဆွဲယာဉ်ကို ခေါ်ခြင်း စသည်ဖြင့် ကားကို ဘေးကင်းသောနေရာသို့ အမြန် ရွှေ့ရမည်။", src:"教則7章2節4"},
 {id:"anzen-F-06", cat:"anzen", set:0, final:1, fo:6, ans:false, ja:"前の晩に飲んだ酒は、ひと晩寝れば翌朝の運転には影響しない。", my:"ယမန်နေ့ညက သောက်ခဲ့သော အရက်သည် တစ်ညအိပ်ပြီးလျှင် နောက်တစ်နေ့ မနက် ယာဉ်မောင်းခြင်းကို မထိခိုက်ပါ။", exJa:"誤り。正しくは、前夜に飲んだ酒でも、翌朝の運転時まで影響が残っていることがあるので注意する。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ယမန်နေ့ညက သောက်ခဲ့သော အရက်ပင်ဖြစ်စေ နောက်တစ်နေ့ မနက် မောင်းချိန်အထိ အရက်ဓာတ် ကျန်နေနိုင်သဖြင့် သတိထားရမည်။", src:"教則4章1節4"},
 {id:"anzen-F-07", cat:"anzen", set:0, final:1, fo:7, ans:true, ja:"ミニカーは、高速道路を通行することができない。", my:"မီနီကား(ミニカー) သည် အမြန်လမ်းပေါ်တွင် မောင်းနှင်ခွင့် မရှိပါ။", exJa:"正しい。ミニカー、125cc以下の普通自動二輪車、一般原動機付自転車は高速道路を通行できない。", exMy:"မှန်သည်။ မီနီကား၊ 125cc နှင့်အောက် ဆိုင်ကယ်၊ မော်တာဆိုင်ကယ်ငယ်(原付) တို့သည် အမြန်လမ်းပေါ်တွင် မောင်းနှင်ခွင့် မရှိပါ။", src:"教則7章"},
 {id:"anzen-F-08", cat:"anzen", set:0, final:2, fo:8, ans:false, ja:"標識などで指定がない高速自動車国道の本線車道では、普通自動車は時速120kmまで出してよい。", my:"ယာဉ်စည်းကမ်းဆိုင်းဘုတ် စသည်ဖြင့် သတ်မှတ်ထားခြင်းမရှိသော အမြန်လမ်း(高速自動車国道) ၏ ပင်မယာဉ်သွားလမ်း(本線車道) တွင် သာမန်မော်တော်ကားသည် တစ်နာရီ 120 ကီလိုမီတာအထိ မောင်းနိုင်သည်။", exJa:"誤り。正しくは、指定がなければ普通自動車の最高速度は時速100kmである。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ သတ်မှတ်ချက်မရှိလျှင် သာမန်မော်တော်ကား၏ အမြင့်ဆုံးအမြန်နှုန်းမှာ တစ်နာရီ 100 ကီလိုမီတာ ဖြစ်သည်။", src:"令27条・教則7章2節2"},
 {id:"anzen-F-09", cat:"anzen", set:0, final:2, fo:9, ans:true, ja:"高速道路でも、パーキングエリアでは駐車や停車をすることができる。", my:"အမြန်လမ်းတွင်ပင် ကားရပ်နားစခန်း(パーキングエリア) တွင် ယာဉ်ရပ်နားခြင်း(駐車) နှင့် ခဏရပ်ခြင်း(停車) ပြုလုပ်နိုင်သည်။", exJa:"正しい。高速道路は原則駐停車禁止だが、パーキングエリアでは駐停車できる。", exMy:"မှန်သည်။ အမြန်လမ်းတွင် မူအားဖြင့် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း မပြုရသော်လည်း ကားရပ်နားစခန်းတွင် ရပ်နိုင်သည်။", src:"法75条の8・教則7章2節4"},
 {id:"anzen-F-10", cat:"anzen", set:0, final:2, fo:10, ans:false, ja:"交通事故の現場で後続事故のおそれがあるときでも、負傷者は絶対に動かしてはいけない。", my:"ယာဉ်မတော်တဆမှု ဖြစ်ရာနေရာတွင် နောက်ထပ် မတော်တဆမှု ဖြစ်နိုင်ခြေ ရှိသော်လည်း ဒဏ်ရာရသူကို လုံးဝ မရွှေ့ရ။", exJa:"誤り。正しくは、むやみに動かさないが、後続事故のおそれがあるときは、早く負傷者を安全な場所に移す。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ မလိုအပ်ဘဲ မရွှေ့ရသော်လည်း နောက်ထပ် မတော်တဆမှု ဖြစ်နိုင်ခြေရှိလျှင် ဒဏ်ရာရသူကို ဘေးကင်းသောနေရာသို့ အမြန် ရွှေ့ရမည်။", src:"教則10章1節1"},
 {id:"anzen-F-11", cat:"anzen", set:0, final:2, fo:11, ans:true, ja:"これから車を運転するおそれがある人に、酒をすすめてはいけない。", my:"ယာဉ်မောင်းနိုင်ခြေ ရှိသူကို အရက် သောက်ရန် မတိုက်ရ၊ မတိုက်တွန်းရ။", exJa:"正しい。酒気を帯びて運転するおそれがある人に、酒を出したりすすめたりしてはいけない。", exMy:"မှန်သည်။ အရက်သောက်၍ မောင်းနိုင်ခြေရှိသူကို အရက် ပေးခြင်း သို့မဟုတ် သောက်ရန် တိုက်တွန်းခြင်း မပြုရ။", src:"法65条3項"},
 {id:"anzen-F-12", cat:"anzen", set:0, final:2, fo:12, ans:false, ja:"夜間、他の車の直後を走るときは、前照灯を上向きにしたままでよい。", my:"ညအချိန် အခြားကား၏ နောက်မှ ကပ်လိုက်မောင်းသည့်အခါ ရှေ့မီးကြီး(前照灯) ကို အပေါ်သို့ (အဝေးမီး) ထားလျက်ပင် မောင်းနိုင်သည်။", exJa:"誤り。正しくは、他の車の直後を走るときは、前照灯を減光するか下向きに切り替えなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ အခြားကား၏ နောက်မှ ကပ်လိုက်မောင်းသည့်အခါ ရှေ့မီးကြီး၏ အလင်းကို လျှော့ရမည် သို့မဟုတ် အောက်သို့ ချရမည်။", src:"法52条2項・教則6章3節2"},
 {id:"anzen-F-13", cat:"anzen", set:0, final:2, fo:13, ans:true, ja:"交通事故でけが人がいて救急車を呼ぶときは、119番に電話する。", my:"ယာဉ်မတော်တဆမှုတွင် ဒဏ်ရာရသူ ရှိ၍ လူနာတင်ယာဉ် ခေါ်သည့်အခါ 119 သို့ ဖုန်းဆက်ရမည်။", exJa:"正しい。救急車は119番、警察は110番である。", exMy:"မှန်သည်။ လူနာတင်ယာဉ်အတွက် 119၊ ရဲ အတွက် 110 ဖြစ်သည်။", src:"教則10章1節1"},
 {id:"anzen-F-14", cat:"anzen", set:0, final:3, fo:14, ans:false, ja:"高速道路が渋滞しているときは、路肩を通行してもよい。", my:"အမြန်လမ်းတွင် ယာဉ်ကြောပိတ်ဆို့နေသည့်အခါ လမ်းပခုံး(路肩) ပေါ်မှ မောင်းနိုင်သည်။", exJa:"誤り。正しくは、渋滞していても、高速道路の路側帯や路肩を通行してはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ယာဉ်ကြောပိတ်ဆို့နေသော်လည်း အမြန်လမ်း၏ လမ်းဘေးဇုန်(路側帯) နှင့် လမ်းပခုံး ပေါ်မှ မမောင်းရ။", src:"教則7章2節3"},
 {id:"anzen-F-15", cat:"anzen", set:0, final:3, fo:15, ans:true, ja:"携帯電話は、運転する前に電源を切るかドライブモードにして、呼出音が鳴らないようにするのがよい。", my:"မိုဘိုင်းဖုန်းကို ယာဉ်မမောင်းမီ ပိတ်ထားခြင်း သို့မဟုတ် ကားမောင်းမုဒ်(ドライブモード) ထားခြင်းဖြင့် ဖုန်းမြည်သံ မမြည်အောင် လုပ်ထားခြင်းသည် ကောင်းသည်။", exJa:"正しい。走行中は携帯電話を使ってはいけないので、運転前に電源を切るなどして呼出音が鳴らないようにする。", exMy:"မှန်သည်။ မောင်းနေစဉ် မိုဘိုင်းဖုန်း မသုံးရသောကြောင့် မမောင်းမီ ပိတ်ထားခြင်း စသည်ဖြင့် မမြည်အောင် လုပ်ထားသင့်သည်။", src:"教則5章1節2"},
 {id:"anzen-F-16", cat:"anzen", set:0, final:3, fo:16, ans:false, ja:"夜間に道路を走るときは、前照灯をつけていれば、尾灯はつけなくてよい。", my:"ညအချိန် လမ်းပေါ်တွင် မောင်းသည့်အခါ ရှေ့မီးကြီး(前照灯) ဖွင့်ထားလျှင် နောက်မီး(尾灯) ကို မဖွင့်လည်း ရသည်။", exJa:"誤り。正しくは、夜間は前照灯・車幅灯・尾灯などをつけなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ညအချိန်တွင် ရှေ့မီးကြီး၊ ဘေးမီး(車幅灯)၊ နောက်မီး စသည်တို့ကို ဖွင့်ရမည်။", src:"法52条1項・令18条"},
 {id:"anzen-F-17", cat:"anzen", set:0, final:3, fo:17, ans:true, ja:"夜間、高速道路で故障して止まったときは、停止表示器材を置くとともに、非常点滅表示灯などをつけなければならない。", my:"ညအချိန် အမြန်လမ်းတွင် ယာဉ်ပျက်၍ ရပ်ထားရသည့်အခါ ယာဉ်ရပ်ထားကြောင်းပြ ကိရိယာ(停止表示器材) ကို ထားရုံသာမက အရေးပေါ်မှိတ်တုတ်မီး(ハザード) စသည်တို့ကိုလည်း ဖွင့်ရမည်။", exJa:"正しい。停止表示器材を置き、夜間は非常点滅表示灯・駐車灯・尾灯もつける。", exMy:"မှန်သည်။ ယာဉ်ရပ်ထားကြောင်းပြ ကိရိယာကို ထားပြီး ညအချိန်တွင် အရေးပေါ်မှိတ်တုတ်မီး၊ ရပ်နားမီး သို့မဟုတ် နောက်မီး ကိုလည်း ဖွင့်ရမည်။", src:"法75条の11・教則7章2節4"},
 {id:"anzen-F-18", cat:"anzen", set:0, final:3, fo:18, ans:false, ja:"交通事故を起こしても、相手と話し合いがついたときは、警察官に報告しなくてよい。", my:"ယာဉ်မတော်တဆမှု ဖြစ်စေမိသော်လည်း တစ်ဖက်လူနှင့် ညှိနှိုင်းပြီးသွားလျှင် ရဲ ထံ အကြောင်းမကြားလည်း ရသည်။", exJa:"誤り。正しくは、話し合いがついても、事故の日時・場所・死傷者の数などを必ず警察官に報告する。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ညှိနှိုင်းပြီးသော်လည်း မတော်တဆမှု ဖြစ်ပွားသည့် ရက်စွဲ၊ အချိန်၊ နေရာ၊ သေဆုံး/ဒဏ်ရာရသူ အရေအတွက် စသည်တို့ကို ရဲ ထံ မဖြစ်မနေ အကြောင်းကြားရမည်။", src:"法72条1項"},
 {id:"anzen-F-19", cat:"anzen", set:0, final:3, fo:19, ans:true, ja:"高速道路の本線車道では、中央分離帯を横切ってはいけない。", my:"အမြန်လမ်း၏ ပင်မယာဉ်သွားလမ်း(本線車道) တွင် လမ်းအလယ်ပိုင်းခြားကျွန်း(中央分離帯) ကို ဖြတ်ကူး၍ မမောင်းရ။", exJa:"正しい。本線車道では、中央分離帯を横切ったり、転回や後退をしたりしてはいけない。", exMy:"မှန်သည်။ ပင်မယာဉ်သွားလမ်းတွင် လမ်းအလယ်ပိုင်းခြားကျွန်း ကို ဖြတ်ကူးခြင်း၊ ယူတန်ကွေ့ခြင်း(転回)၊ နောက်ဆုတ်ခြင်း မပြုရ။", src:"法75条の5・教則7章2節3"}
);
QUESTIONS.push(
 {id:"chusha-1-01", cat:"chusha", set:1, final:0, fo:0, ans:true, ja:"交差点とその端から5m以内の場所では、駐車も停車もしてはいけない。", my:"လမ်းဆုံနှင့် လမ်းဆုံ၏အစွန်းမှ 5 မီတာအတွင်းတွင် ယာဉ်ရပ်နားခြင်း(駐車)နှင့် ခဏရပ်ခြင်း(停車) နှစ်မျိုးလုံး မလုပ်ရ။", exJa:"正しい。交差点の中と、その端から5m以内の場所は駐停車禁止である。", exMy:"မှန်ပါသည်။ လမ်းဆုံအတွင်းနှင့် ၎င်း၏အစွန်းမှ 5 မီတာအတွင်းတွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားသည်။", src:"法44条1項"},
 {id:"chusha-1-02", cat:"chusha", set:1, final:0, fo:0, ans:false, ja:"踏切の手前6mの場所であれば、停車してよい。", my:"ရထားလမ်းကူး(踏切)၏ ရှေ့ 6 မီတာရှိသောနေရာ ဖြစ်လျှင် ခဏရပ်ခြင်း(停車) လုပ်နိုင်သည်။", exJa:"誤り。正しくは、踏切とその端から前後10m以内は駐停車禁止なので、手前6mでは停車もできない。", exMy:"မှားပါသည်။ အမှန်မှာ ရထားလမ်းကူးနှင့် ၎င်း၏အစွန်းမှ ရှေ့နောက် 10 မီတာအတွင်း ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားသဖြင့် ရှေ့ 6 မီတာတွင် ခဏရပ်ခြင်းလည်း မလုပ်ရ။", src:"法44条1項"},
 {id:"chusha-1-03", cat:"chusha", set:1, final:0, fo:0, ans:false, ja:"5分以内の荷物の積卸しのための停止は、駐車になる。", my:"5 မိနစ်အတွင်း ကုန်ပစ္စည်း တင်ခြင်း/ချခြင်းအတွက် ရပ်ခြင်းသည် ယာဉ်ရပ်နားခြင်း(駐車) ဖြစ်သည်။", exJa:"誤り。正しくは、5分以内の荷物の積卸しや人の乗り降りのための停止は停車で、駐車にはならない。", exMy:"မှားပါသည်။ အမှန်မှာ 5 မိနစ်အတွင်း ကုန်တင်ချခြင်း သို့မဟုတ် လူအတက်အဆင်းအတွက် ရပ်ခြင်းသည် ခဏရပ်ခြင်း(停車) ဖြစ်ပြီး ယာဉ်ရပ်နားခြင်း မဟုတ်ပါ။", src:"法2条1項18号・19号"},
 {id:"chusha-1-04", cat:"chusha", set:1, final:0, fo:0, ans:true, ja:"火災報知機から1m以内の場所は、駐車禁止である。", my:"မီးလောင်မှု သတိပေးကိရိယာ(火災報知機)မှ 1 မီတာအတွင်းသည် ယာဉ်ရပ်နားခြင်း(駐車) တားမြစ်ထားသောနေရာ ဖြစ်သည်။", exJa:"正しい。火災報知機から1m以内は駐車禁止である（停車はできる）。", exMy:"မှန်ပါသည်။ မီးလောင်မှု သတိပေးကိရိယာမှ 1 မီတာအတွင်း ယာဉ်ရပ်နားခြင်း တားမြစ်ထားသည် (ခဏရပ်ခြင်းကိုမူ လုပ်နိုင်သည်)။", src:"法45条1項"},
 {id:"chusha-1-05", cat:"chusha", set:1, final:0, fo:0, ans:true, ja:"トンネルの中では、駐車も停車もしてはいけない。", my:"ဥမင်လိုဏ်ခေါင်း(トンネル)ထဲတွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း နှစ်မျိုးလုံး မလုပ်ရ။", exJa:"正しい。トンネルは駐停車禁止の場所である。", exMy:"မှန်ပါသည်။ ဥမင်လိုဏ်ခေါင်းသည် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားသောနေရာ ဖြစ်သည်။", src:"法44条1項"},
 {id:"chusha-1-06", cat:"chusha", set:1, final:0, fo:0, ans:false, ja:"坂の頂上付近では、駐車は禁止されているが、停車はしてよい。", my:"အတက်လမ်း၏ ထိပ်ပိုင်းအနီးတွင် ယာဉ်ရပ်နားခြင်း(駐車)ကို တားမြစ်ထားသော်လည်း ခဏရပ်ခြင်း(停車)ကို လုပ်နိုင်သည်။", exJa:"誤り。正しくは、坂の頂上付近やこう配の急な坂は駐停車禁止で、停車もしてはいけない。", exMy:"မှားပါသည်။ အမှန်မှာ အတက်လမ်းထိပ်ပိုင်းအနီးနှင့် မတ်စောက်သော ကုန်းစောင်းလမ်းတို့တွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း နှစ်မျိုးလုံး တားမြစ်ထားသည်။", src:"法44条1項"},
 {id:"chusha-1-07", cat:"chusha", set:1, final:0, fo:0, ans:true, ja:"駐車したとき車の右側の道路上に3.5m以上の余地がなくなる場所では、原則として駐車してはいけない。", my:"ယာဉ်ရပ်နားလိုက်သောအခါ ယာဉ်၏ညာဘက် လမ်းပေါ်တွင် 3.5 မီတာနှင့်အထက် နေရာလွတ် မကျန်တော့သောနေရာတွင် မူအားဖြင့် ယာဉ်ရပ်နားခြင်း(駐車) မလုပ်ရ။", exJa:"正しい。右側に3.5m以上の余地がとれない場所は駐車禁止である（荷物の積卸しですぐ運転できるときなどは除く）。", exMy:"မှန်ပါသည်။ ညာဘက်တွင် 3.5 မီတာနှင့်အထက် နေရာလွတ် မကျန်သောနေရာတွင် ယာဉ်ရပ်နားခြင်း တားမြစ်ထားသည် (ကုန်တင်ချရင်း ချက်ချင်းမောင်းနိုင်သည့်အခါ စသည်မှလွဲ၍)။", src:"法45条2項"},
 {id:"chusha-1-08", cat:"chusha", set:1, final:0, fo:0, ans:false, ja:"歩道や路側帯のない道路で駐停車するときは、道路の右端に沿って止めなければならない。", my:"လူသွားလမ်း သို့မဟုတ် လမ်းဘေးဇုန်(路側帯) မရှိသောလမ်းတွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း ပြုလုပ်သောအခါ လမ်း၏ ညာဘက်အစွန်းတစ်လျှောက် ရပ်ရမည်။", exJa:"誤り。正しくは、歩道や路側帯のない道路では、道路の左端に沿って止める。", exMy:"မှားပါသည်။ အမှန်မှာ လူသွားလမ်း သို့မဟုတ် လမ်းဘေးဇုန် မရှိသောလမ်းတွင် လမ်း၏ ဘယ်ဘက်အစွန်းတစ်လျှောက် ရပ်ရမည်။", src:"法47条1項・2項、教則5章8節3"},
 {id:"chusha-1-09", cat:"chusha", set:1, final:0, fo:0, ans:false, ja:"車から離れるときは、ハンドブレーキを掛ければ、エンジンをかけたままでよい。", my:"ယာဉ်မှ ခွာသွားသောအခါ လက်ဘရိတ်(ハンドブレーキ) ဆွဲထားလျှင် အင်ဂျင်ကို နှိုးထားလျက် ထားခဲ့နိုင်သည်။", exJa:"誤り。正しくは、車から離れるときはエンジンを止め、ハンドブレーキも掛けなければならない。", exMy:"မှားပါသည်။ အမှန်မှာ ယာဉ်မှ ခွာသွားသောအခါ အင်ဂျင်ကို ရပ်ပြီး လက်ဘရိတ်ကိုလည်း ဆွဲထားရမည်။", src:"法71条5号、教則5章8節10"},
 {id:"chusha-1-10", cat:"chusha", set:1, final:0, fo:0, ans:true, ja:"赤信号で止まるときは、駐停車禁止の場所であっても止まってよい。", my:"မီးပွိုင့်(信号) အနီပြ၍ ရပ်ရသောအခါ ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားသောနေရာ ဖြစ်နေလျှင်တောင် ရပ်နိုင်သည်။", exJa:"正しい。赤信号や危険防止のための一時停止は、駐停車禁止の場所でもできる。", exMy:"မှန်ပါသည်။ မီးပွိုင့်အနီ သို့မဟုတ် အန္တရာယ်ကာကွယ်ရန် ခဏရပ်တန့်ခြင်း(一時停止)ကို တားမြစ်ထားသောနေရာတွင်လည်း လုပ်နိုင်သည်။", src:"法44条1項、教則5章8節2"},

 {id:"chusha-2-01", cat:"chusha", set:2, final:0, fo:0, ans:false, ja:"バスの停留所の標示板から10m以内の場所は、運行時間外であっても駐停車禁止である。", my:"ဘတ်စ်ကားမှတ်တိုင်၏ ဆိုင်းဘုတ်(標示板)မှ 10 မီတာအတွင်းသည် ကားပြေးဆွဲချိန် မဟုတ်သည့်အချိန်တွင်လည်း ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားသည်။", exJa:"誤り。正しくは、停留所の標示板から10m以内の駐停車禁止は、バスなどの運行時間中に限られる。", exMy:"မှားပါသည်။ အမှန်မှာ မှတ်တိုင်ဆိုင်းဘုတ်မှ 10 မီတာအတွင်း တားမြစ်ချက်သည် ဘတ်စ်ကား စသည်တို့ ပြေးဆွဲသည့်အချိန်အတွင်းသာ ဖြစ်သည်။", src:"法44条1項"},
 {id:"chusha-2-02", cat:"chusha", set:2, final:0, fo:0, ans:true, ja:"横断歩道や自転車横断帯とその端から前後5m以内の場所は、駐停車禁止である。", my:"လူကူးမျဉ်းကြား သို့မဟုတ် စက်ဘီးဖြတ်ကူးလမ်း(自転車横断帯)နှင့် ၎င်းတို့၏အစွန်းမှ ရှေ့နောက် 5 မီတာအတွင်းသည် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားသောနေရာ ဖြစ်သည်။", exJa:"正しい。横断歩道・自転車横断帯の上と、その前後5m以内は駐停車禁止である。", exMy:"မှန်ပါသည်။ လူကူးမျဉ်းကြား၊ စက်ဘီးဖြတ်ကူးလမ်းတို့ပေါ်တွင်နှင့် ၎င်းတို့၏ ရှေ့နောက် 5 မီတာအတွင်း ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားသည်။", src:"法44条1項"},
 {id:"chusha-2-03", cat:"chusha", set:2, final:0, fo:0, ans:false, ja:"「駐車禁止」の標識がある場所では、停車もしてはいけない。", my:"「ယာဉ်ရပ်နားခြင်း တားမြစ်」ယာဉ်စည်းကမ်းဆိုင်းဘုတ်(標識) ရှိသောနေရာတွင် ခဏရပ်ခြင်း(停車)လည်း မလုပ်ရ။", exJa:"誤り。正しくは、「駐車禁止」の場所で禁止されているのは駐車だけで、停車はできる。", exMy:"မှားပါသည်။ အမှန်မှာ 「ယာဉ်ရပ်နားခြင်း တားမြစ်」 နေရာတွင် တားမြစ်ထားသည်မှာ ယာဉ်ရပ်နားခြင်း(駐車)သာ ဖြစ်ပြီး ခဏရပ်ခြင်း(停車)ကို လုပ်နိုင်သည်။", src:"法45条1項、教則5章8節2"},
 {id:"chusha-2-04", cat:"chusha", set:2, final:0, fo:0, ans:true, ja:"消火栓や防火水そうの吸水口から5m以内の場所は、駐車禁止である。", my:"မီးသတ်ရေပိုက်ခေါင်း(消火栓) သို့မဟုတ် မီးသတ်ရေကန်၏ ရေစုပ်ပေါက်မှ 5 မီတာအတွင်းသည် ယာဉ်ရပ်နားခြင်း(駐車) တားမြစ်ထားသောနေရာ ဖြစ်သည်။", exJa:"正しい。消火栓・指定消防水利の標識・防火水そうの吸水口から5m以内は駐車禁止である。", exMy:"မှန်ပါသည်။ မီးသတ်ရေပိုက်ခေါင်း၊ မီးသတ်ရေရင်းမြစ် ဆိုင်းဘုတ်၊ မီးသတ်ရေကန် ရေစုပ်ပေါက်တို့မှ 5 မီတာအတွင်း ယာဉ်ရပ်နားခြင်း တားမြစ်ထားသည်။", src:"法45条1項"},
 {id:"chusha-2-05", cat:"chusha", set:2, final:0, fo:0, ans:true, ja:"運転者が車から離れていて、すぐに運転できない状態で止めているのは駐車である。", my:"ယာဉ်မောင်းသူသည် ယာဉ်မှ ခွာနေ၍ ချက်ချင်း မမောင်းနိုင်သော အခြေအနေဖြင့် ရပ်ထားခြင်းသည် ယာဉ်ရပ်နားခြင်း(駐車) ဖြစ်သည်။", exJa:"正しい。運転者が車から離れてすぐに運転できない状態での停止は、駐車になる。", exMy:"မှန်ပါသည်။ ယာဉ်မောင်းသူ ယာဉ်မှခွာ၍ ချက်ချင်း မမောင်းနိုင်သော အခြေအနေဖြင့် ရပ်ထားခြင်းသည် ယာဉ်ရပ်နားခြင်း ဖြစ်သည်။", src:"法2条1項18号"},
 {id:"chusha-2-06", cat:"chusha", set:2, final:0, fo:0, ans:false, ja:"安全地帯の左側の手前8mの場所であれば、駐停車してよい。", my:"ဘေးကင်းဇုန်(安全地帯)၏ ဘယ်ဘက်ခြမ်း ရှေ့ 8 မီတာရှိသောနေရာ ဖြစ်လျှင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း လုပ်နိုင်သည်။", exJa:"誤り。正しくは、安全地帯の左側とその前後10m以内は駐停車禁止なので、手前8mでは止められない。", exMy:"မှားပါသည်။ အမှန်မှာ ဘေးကင်းဇုန်၏ ဘယ်ဘက်ခြမ်းနှင့် ရှေ့နောက် 10 မီတာအတွင်း ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားသဖြင့် ရှေ့ 8 မီတာတွင် မရပ်ရ။", src:"法44条1項"},
 {id:"chusha-2-07", cat:"chusha", set:2, final:0, fo:0, ans:false, ja:"白の実線と破線の路側帯（駐停車禁止路側帯）でも、幅が広ければ中に入って駐車してよい。", my:"အဖြူရောင် မျဉ်းပြတ်နှင့် မျဉ်းဆက် ပါသော လမ်းဘေးဇုန်(駐停車禁止路側帯)တွင်လည်း ကျယ်လျှင် အထဲသို့ဝင်၍ ယာဉ်ရပ်နားခြင်း လုပ်နိုင်သည်။", exJa:"誤り。正しくは、白の実線と破線の路側帯は駐停車禁止で、幅が広くても中に入って止めてはいけない。", exMy:"မှားပါသည်။ အမှန်မှာ အဖြူမျဉ်းဆက်နှင့် မျဉ်းပြတ် လမ်းဘေးဇုန်တွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားပြီး ကျယ်သော်လည်း အထဲဝင်၍ မရပ်ရ။", src:"教則5章8節3、付表3(2)10"},
 {id:"chusha-2-08", cat:"chusha", set:2, final:0, fo:0, ans:true, ja:"幅の広い路側帯に入って駐停車するときは、路側帯の中に0.75m以上の余地を残さなければならない。", my:"ကျယ်သော လမ်းဘေးဇုန်(路側帯)ထဲသို့ ဝင်၍ ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း ပြုလုပ်သောအခါ လမ်းဘေးဇုန်ထဲတွင် 0.75 မီတာနှင့်အထက် နေရာလွတ် ချန်ထားရမည်။", exJa:"正しい。歩行者が通れるよう、路側帯の中に0.75m以上の余地をあける。", exMy:"မှန်ပါသည်။ လမ်းလျှောက်သူ(歩行者) ဖြတ်သွားနိုင်ရန် လမ်းဘေးဇုန်ထဲတွင် 0.75 မီတာနှင့်အထက် နေရာလွတ် ချန်ထားရမည်။", src:"法47条3項、教則5章8節3"},
 {id:"chusha-2-09", cat:"chusha", set:2, final:0, fo:0, ans:false, ja:"道路に平行に駐停車している車があるときは、その車と並んで駐停車してよい。", my:"လမ်းနှင့် အပြိုင် ရပ်ထားသော ယာဉ်ရှိသောအခါ ထိုယာဉ်၏ဘေးတွင် ယှဉ်၍ ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း လုပ်နိုင်သည်။", exJa:"誤り。正しくは、道路に平行に駐停車している車と並んで駐停車してはいけない。", exMy:"မှားပါသည်။ အမှန်မှာ လမ်းနှင့်အပြိုင် ရပ်ထားသော ယာဉ်၏ဘေးတွင် ယှဉ်၍ မရပ်ရ။", src:"教則5章8節3"},
 {id:"chusha-2-10", cat:"chusha", set:2, final:0, fo:0, ans:true, ja:"自動車の保管場所は、使用の本拠の位置から2km以内の道路以外の場所に確保しなければならない。", my:"ယာဉ်ထားရှိရာနေရာ(保管場所)ကို အသုံးပြုရာ အခြေစိုက်နေရာ (နေအိမ် စသည်) မှ 2 ကီလိုမီတာအတွင်း လမ်းမဟုတ်သောနေရာတွင် ရှိထားရမည်။", exJa:"正しい。保管場所は住所など使用の本拠から2km以内で、道路以外の場所に確保する。", exMy:"မှန်ပါသည်။ ယာဉ်ထားရှိရာနေရာကို နေအိမ်စသည့် အခြေစိုက်နေရာမှ 2 ကီလိုမီတာအတွင်း လမ်းမဟုတ်သောနေရာတွင် ရှိထားရမည်။", src:"保管場所法3条、教則5章8節9"},

 {id:"chusha-3-01", cat:"chusha", set:3, final:0, fo:0, ans:false, ja:"人の乗り降りのための停止は、駐車になる。", my:"လူအတက်အဆင်းအတွက် ရပ်ခြင်းသည် ယာဉ်ရပ်နားခြင်း(駐車) ဖြစ်သည်။", exJa:"誤り。正しくは、人の乗り降りのための停止は停車で、駐車にはならない。", exMy:"မှားပါသည်။ အမှန်မှာ လူအတက်အဆင်းအတွက် ရပ်ခြင်းသည် ခဏရပ်ခြင်း(停車) ဖြစ်ပြီး ယာဉ်ရပ်နားခြင်း မဟုတ်ပါ။", src:"法2条1項18号・19号"},
 {id:"chusha-3-02", cat:"chusha", set:3, final:0, fo:0, ans:true, ja:"道路の曲がり角から5m以内の場所では、駐車も停車もしてはいけない。", my:"လမ်းကွေ့မှ 5 မီတာအတွင်းတွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း နှစ်မျိုးလုံး မလုပ်ရ။", exJa:"正しい。道路の曲がり角から5m以内は駐停車禁止である。", exMy:"မှန်ပါသည်။ လမ်းကွေ့မှ 5 မီတာအတွင်း ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားသည်။", src:"法44条1項"},
 {id:"chusha-3-03", cat:"chusha", set:3, final:0, fo:0, ans:true, ja:"道路工事の区域の端から5m以内の場所は、駐車禁止である。", my:"လမ်းပြင်ဆင်ရေးလုပ်ငန်း(道路工事) နယ်မြေ၏ အစွန်းမှ 5 မီတာအတွင်းသည် ယာဉ်ရပ်နားခြင်း(駐車) တားမြစ်ထားသောနေရာ ဖြစ်သည်။", exJa:"正しい。道路工事の区域の端から5m以内は駐車禁止である（停車はできる）。", exMy:"မှန်ပါသည်။ လမ်းပြင်ဆင်ရေးနယ်မြေ အစွန်းမှ 5 မီတာအတွင်း ယာဉ်ရပ်နားခြင်း တားမြစ်ထားသည် (ခဏရပ်ခြင်းကိုမူ လုပ်နိုင်သည်)။", src:"法45条1項"},
 {id:"chusha-3-04", cat:"chusha", set:3, final:0, fo:0, ans:false, ja:"車庫などの自動車用の出入口から3m以内の場所は、駐車も停車も禁止されている。", my:"ကားဂိုဒေါင် စသည်တို့၏ ကားဝင်ထွက်ပေါက်မှ 3 မီတာအတွင်းတွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း နှစ်မျိုးလုံး တားမြစ်ထားသည်။", exJa:"誤り。正しくは、自動車用の出入口から3m以内は駐車禁止で、停車は禁止されていない。", exMy:"မှားပါသည်။ အမှန်မှာ ကားဝင်ထွက်ပေါက်မှ 3 မီတာအတွင်း တားမြစ်ထားသည်မှာ ယာဉ်ရပ်နားခြင်း(駐車)သာ ဖြစ်ပြီး ခဏရပ်ခြင်း(停車)ကို မတားမြစ်ပါ။", src:"法45条1項"},
 {id:"chusha-3-05", cat:"chusha", set:3, final:0, fo:0, ans:true, ja:"夜間、車道の幅が5.5m以上の道路に駐停車するときは、原則として非常点滅表示灯や尾灯などをつけなければならない。", my:"ညအချိန်တွင် ယာဉ်သွားလမ်းအကျယ် 5.5 မီတာနှင့်အထက်ရှိသော လမ်း၌ ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း ပြုလုပ်သောအခါ မူအားဖြင့် အရေးပေါ်မီးဖွင့်ပိတ်(非常点滅表示灯) သို့မဟုတ် နောက်မီး(尾灯) စသည်တို့ကို ဖွင့်ထားရမည်။", exJa:"正しい。非常点滅表示灯・駐車灯・尾灯のいずれかをつける（照明で50m後方から見える場所などは除く）。", exMy:"မှန်ပါသည်။ အရေးပေါ်မီးဖွင့်ပိတ်၊ ယာဉ်ရပ်နားမီး(駐車灯)၊ နောက်မီး တစ်ခုခုကို ဖွင့်ရမည် (လမ်းမီးကြောင့် နောက် 50 မီတာမှ မြင်ရသောနေရာ စသည်မှလွဲ၍)။", src:"法52条1項、令18条2項"},
 {id:"chusha-3-06", cat:"chusha", set:3, final:0, fo:0, ans:false, ja:"軌道敷内では、短時間の停車であればしてよい。", my:"ဓာတ်ရထားလမ်း(軌道敷)အတွင်းတွင် အချိန်တိုတို ခဏရပ်ခြင်း(停車) ဖြစ်လျှင် လုပ်နိုင်သည်။", exJa:"誤り。正しくは、軌道敷内は駐停車禁止で、短時間の停車もしてはいけない。", exMy:"မှားပါသည်။ အမှန်မှာ ဓာတ်ရထားလမ်းအတွင်း ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားပြီး အချိန်တိုတို ခဏရပ်ခြင်းလည်း မလုပ်ရ။", src:"法44条1項"},
 {id:"chusha-3-07", cat:"chusha", set:3, final:0, fo:0, ans:false, ja:"荷物の積卸しで運転者がすぐ運転できる状態でも、右側に3.5m以上の余地がなければ駐車できない。", my:"ကုန်တင်ချနေ၍ ယာဉ်မောင်းသူ ချက်ချင်း မောင်းနိုင်သော အခြေအနေ ဖြစ်သော်လည်း ညာဘက်တွင် 3.5 မီတာနှင့်အထက် နေရာလွတ် မရှိလျှင် ယာဉ်ရပ်နားခြင်း(駐車) မလုပ်နိုင်။", exJa:"誤り。正しくは、荷物の積卸しで運転者がすぐ運転できるときは、3.5mの余地がなくても駐車できる。", exMy:"မှားပါသည်။ အမှန်မှာ ကုန်တင်ချရင်း ယာဉ်မောင်းသူ ချက်ချင်း မောင်းနိုင်သည့်အခါ 3.5 မီတာ နေရာလွတ် မရှိသော်လည်း ယာဉ်ရပ်နားနိုင်သည်။", src:"法45条2項"},
 {id:"chusha-3-08", cat:"chusha", set:3, final:0, fo:0, ans:true, ja:"道路上の同じ場所に、引き続き12時間以上（夜間は8時間以上）駐車してはいけない。", my:"လမ်းပေါ်ရှိ နေရာတစ်ခုတည်းတွင် ဆက်တိုက် 12 နာရီနှင့်အထက် (ညအချိန်တွင် 8 နာရီနှင့်အထက်) ယာဉ်ရပ်နားခြင်း(駐車) မလုပ်ရ။", exJa:"正しい。道路を車庫がわりにしてはならず、同じ場所に12時間（夜間8時間）以上駐車してはいけない。", exMy:"မှန်ပါသည်။ လမ်းကို ကားဂိုဒေါင်အဖြစ် မသုံးရ။ နေရာတစ်ခုတည်းတွင် 12 နာရီ (ညတွင် 8 နာရီ) နှင့်အထက် ယာဉ်ရပ်နား၍ မရပါ။", src:"保管場所法11条2項、教則5章8節9"},
 {id:"chusha-3-09", cat:"chusha", set:3, final:0, fo:0, ans:false, ja:"交差点の中であっても、5分以内の荷物の積卸しなら止めてよい。", my:"လမ်းဆုံအတွင်း ဖြစ်သော်လည်း 5 မိနစ်အတွင်း ကုန်တင်ချခြင်း ဖြစ်လျှင် ရပ်နိုင်သည်။", exJa:"誤り。正しくは、交差点は駐停車禁止の場所なので、5分以内の荷物の積卸し（停車）もしてはいけない。", exMy:"မှားပါသည်။ အမှန်မှာ လမ်းဆုံသည် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားသောနေရာ ဖြစ်သဖြင့် 5 မိနစ်အတွင်း ကုန်တင်ချခြင်း(ခဏရပ်ခြင်း)လည်း မလုပ်ရ။", src:"法44条1項"},
 {id:"chusha-3-10", cat:"chusha", set:3, final:0, fo:0, ans:true, ja:"坂道で車から離れるときは、輪止めをしなければならない。", my:"ကုန်းစောင်းလမ်းတွင် ယာဉ်မှ ခွာသွားသောအခါ ဘီးတုံး(輪止め) ခံထားရမည်။", exJa:"正しい。車から離れるときはエンジンを止めハンドブレーキを掛け、坂道では輪止めもする。", exMy:"မှန်ပါသည်။ ယာဉ်မှ ခွာသွားသောအခါ အင်ဂျင်ရပ်၍ လက်ဘရိတ်ဆွဲရမည်။ ကုန်းစောင်းလမ်းတွင် ဘီးတုံးလည်း ခံရမည်။", src:"法71条5号、教則5章8節10"},

 {id:"chusha-F-01", cat:"chusha", set:0, final:1, fo:1, ans:true, ja:"「駐停車禁止」の標識は、青地に赤のわくと赤の斜線2本（×）である。", my:"「ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်」 ဆိုင်းဘုတ်သည် အပြာရောင်နောက်ခံ၊ အနီရောင်ဘောင်နှင့် အနီရောင် မျဉ်းစောင်း 2 ကြောင်း (×) ဖြစ်သည်။", exJa:"正しい。駐停車禁止は青地・赤わく・赤の×。赤の斜線1本は駐車禁止である。", exMy:"မှန်ပါသည်။ ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်သည် အပြာနောက်ခံ၊ အနီဘောင်၊ အနီ ×။ အနီမျဉ်းစောင်း 1 ကြောင်းသည် ယာဉ်ရပ်နားခြင်း တားမြစ် ဖြစ်သည်။", src:"教則付表3(1)17"},
 {id:"chusha-F-02", cat:"chusha", set:0, final:1, fo:2, ans:false, ja:"「駐車禁止」の標識は、白地に赤のわくと赤の斜線1本である。", my:"「ယာဉ်ရပ်နားခြင်း တားမြစ်」 ဆိုင်းဘုတ်သည် အဖြူရောင်နောက်ခံ၊ အနီရောင်ဘောင်နှင့် အနီရောင် မျဉ်းစောင်း 1 ကြောင်း ဖြစ်သည်။", exJa:"誤り。正しくは、駐車禁止の標識は青地に赤のわくと赤の斜線1本である。斜線が2本（×）なら駐停車禁止である。", exMy:"မှားပါသည်။ အမှန်မှာ ယာဉ်ရပ်နားခြင်း တားမြစ် ဆိုင်းဘုတ်သည် အပြာနောက်ခံ၊ အနီဘောင်နှင့် အနီမျဉ်းစောင်း 1 ကြောင်း ဖြစ်သည်။ မျဉ်းစောင်း 2 ကြောင်း (×) ဖြစ်လျှင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ် ဖြစ်သည်။", src:"教則付表3(1)18"},
 {id:"chusha-F-03", cat:"chusha", set:0, final:1, fo:3, ans:true, ja:"消防用機械器具の置場や、防火水そうの道路に接する出入口から5m以内の場所は、駐車禁止である。", my:"မီးသတ်စက်ပစ္စည်း သိုလှောင်ရာနေရာ သို့မဟုတ် မီးသတ်ရေကန်၏ လမ်းနှင့်ထိစပ်သော ဝင်ထွက်ပေါက်မှ 5 မီတာအတွင်းသည် ယာဉ်ရပ်နားခြင်း(駐車) တားမြစ်ထားသောနေရာ ဖြစ်သည်။", exJa:"正しい。消防用機械器具の置場・防火水そうとその出入口から5m以内は駐車禁止である。", exMy:"မှန်ပါသည်။ မီးသတ်စက်ပစ္စည်း သိုလှောင်ရာ၊ မီးသတ်ရေကန်နှင့် ၎င်းတို့၏ ဝင်ထွက်ပေါက်မှ 5 မီတာအတွင်း ယာဉ်ရပ်နားခြင်း တားမြစ်ထားသည်။", src:"法45条1項"},
 {id:"chusha-F-04", cat:"chusha", set:0, final:1, fo:4, ans:false, ja:"道路工事の区域の端から5m以内の場所では、停車もしてはいけない。", my:"လမ်းပြင်ဆင်ရေးလုပ်ငန်း နယ်မြေ၏ အစွန်းမှ 5 မီတာအတွင်းတွင် ခဏရပ်ခြင်း(停車)လည်း မလုပ်ရ။", exJa:"誤り。正しくは、道路工事の区域の端から5m以内は駐車禁止で、停車は禁止されていない。", exMy:"မှားပါသည်။ အမှန်မှာ လမ်းပြင်ဆင်ရေးနယ်မြေ အစွန်းမှ 5 မီတာအတွင်း တားမြစ်ထားသည်မှာ ယာဉ်ရပ်နားခြင်း(駐車)သာ ဖြစ်ပြီး ခဏရပ်ခြင်း(停車)ကို မတားမြစ်ပါ။", src:"法45条1項"},
 {id:"chusha-F-05", cat:"chusha", set:0, final:1, fo:5, ans:true, ja:"白の2本線の路側帯（歩行者用路側帯）には、入って駐停車してはいけない。", my:"အဖြူရောင် မျဉ်း 2 ကြောင်းပါသော လမ်းဘေးဇုန်(歩行者用路側帯)ထဲသို့ ဝင်၍ ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း မလုပ်ရ။", exJa:"正しい。歩行者用路側帯は車の駐停車が禁止され、幅が広くても中に入れない。", exMy:"မှန်ပါသည်။ လမ်းလျှောက်သူသုံး လမ်းဘေးဇုန်တွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားပြီး ကျယ်သော်လည်း အထဲမဝင်ရ။", src:"教則5章8節3、付表3(2)11"},
 {id:"chusha-F-06", cat:"chusha", set:0, final:1, fo:6, ans:true, ja:"「駐車禁止」の標識がある場所でも、警察署長の許可を受けたときは駐車できる。", my:"「ယာဉ်ရပ်နားခြင်း တားမြစ်」 ဆိုင်းဘုတ် ရှိသောနေရာ ဖြစ်သော်လည်း ရဲစခန်းမှူး(警察署長)၏ ခွင့်ပြုချက် ရထားလျှင် ယာဉ်ရပ်နားနိုင်သည်။", exJa:"正しい。駐車禁止の場所でも、警察署長の許可を受けたときは駐車できる。", exMy:"မှန်ပါသည်။ ယာဉ်ရပ်နားခြင်း တားမြစ်နေရာတွင်လည်း ရဲစခန်းမှူး၏ ခွင့်ပြုချက် ရလျှင် ယာဉ်ရပ်နားနိုင်သည်။", src:"法45条1項、教則5章8節2"},
 {id:"chusha-F-07", cat:"chusha", set:0, final:1, fo:7, ans:false, ja:"パーキング・メーターのある場所で駐車するときは、しばらくしてからメーターを作動させればよい。", my:"ပါကင်မီတာ(パーキング・メーター) ရှိသောနေရာတွင် ယာဉ်ရပ်နားသောအခါ အတန်ကြာမှ မီတာကို စတင်လည်ပတ်စေလျှင် ရသည်။", exJa:"誤り。正しくは、パーキング・メーターのある時間制限駐車区間では、駐車したら直ちにメーターを作動させる。", exMy:"မှားပါသည်။ အမှန်မှာ ပါကင်မီတာ ရှိသော အချိန်ကန့်သတ် ယာဉ်ရပ်နားဇုန်တွင် ယာဉ်ရပ်နားလျှင် ချက်ချင်း မီတာကို စတင်လည်ပတ်စေရမည်။", src:"法49条の3、教則5章8節4"},

 {id:"chusha-F-08", cat:"chusha", set:0, final:2, fo:8, ans:true, ja:"駐車場や車庫などの自動車用の出入口から3m以内の場所は、駐車禁止である。", my:"ယာဉ်ရပ်နားရာနေရာ သို့မဟုတ် ကားဂိုဒေါင် စသည်တို့၏ ကားဝင်ထွက်ပေါက်မှ 3 မီတာအတွင်းသည် ယာဉ်ရပ်နားခြင်း(駐車) တားမြစ်ထားသောနေရာ ဖြစ်သည်။", exJa:"正しい。駐車場・車庫などの自動車用の出入口から3m以内は駐車禁止である。", exMy:"မှန်ပါသည်။ ယာဉ်ရပ်နားရာနေရာ၊ ကားဂိုဒေါင် စသည်တို့၏ ကားဝင်ထွက်ပေါက်မှ 3 မီတာအတွင်း ယာဉ်ရပ်နားခြင်း တားမြစ်ထားသည်။", src:"法45条1項"},
 {id:"chusha-F-09", cat:"chusha", set:0, final:2, fo:9, ans:false, ja:"路面電車の停留所の標示板から10m以内の場所は、運行時間中でも停車ならしてよい。", my:"ဓာတ်ရထားမှတ်တိုင်၏ ဆိုင်းဘုတ်မှ 10 မီတာအတွင်းတွင် ပြေးဆွဲချိန်အတွင်း ဖြစ်သော်လည်း ခဏရပ်ခြင်း(停車) ဖြစ်လျှင် လုပ်နိုင်သည်။", exJa:"誤り。正しくは、停留所の標示板から10m以内は運行時間中は駐停車禁止で、停車もできない。", exMy:"မှားပါသည်။ အမှန်မှာ မှတ်တိုင်ဆိုင်းဘုတ်မှ 10 မီတာအတွင်းတွင် ပြေးဆွဲချိန်အတွင်း ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားပြီး ခဏရပ်ခြင်းလည်း မလုပ်ရ။", src:"法44条1項"},
 {id:"chusha-F-10", cat:"chusha", set:0, final:2, fo:10, ans:true, ja:"違法に駐車している車の運転者は、警察官から移動を命じられたときは、直ちに車を移動しなければならない。", my:"ဥပဒေနှင့်မညီ ယာဉ်ရပ်နားထားသော ယာဉ်မောင်းသူသည် ရဲ(警察官)က ရွှေ့ရန် အမိန့်ပေးသောအခါ ယာဉ်ကို ချက်ချင်း ရွှေ့ရမည်။", exJa:"正しい。警察官や交通巡視員から移動を命じられたら、直ちに移動しなければならない。", exMy:"မှန်ပါသည်။ ရဲ သို့မဟုတ် ယာဉ်ထိန်းကင်းလှည့်ဝန်ထမ်းက ရွှေ့ရန် အမိန့်ပေးလျှင် ချက်ချင်း ရွှေ့ရမည်။", src:"法51条1項、教則5章8節6"},
 {id:"chusha-F-11", cat:"chusha", set:0, final:2, fo:11, ans:true, ja:"車から離れるときは、エンジンを止めてキーを持ち、窓を閉めてドアをロックしなければならない。", my:"ယာဉ်မှ ခွာသွားသောအခါ အင်ဂျင်ကို ရပ်၍ သော့ကို ယူသွားပြီး ပြတင်းပေါက်ပိတ်ကာ တံခါးကို သော့ခတ်ရမည်။", exJa:"正しい。盗難防止のため、エンジンを止めてキーを携帯し、窓を閉めドアをロックする。", exMy:"မှန်ပါသည်။ ခိုးယူခံရခြင်းမှ ကာကွယ်ရန် အင်ဂျင်ရပ်၍ သော့ယူပြီး ပြတင်းပေါက်ပိတ်ကာ တံခါးသော့ခတ်ရမည်။", src:"法71条5号の2、教則5章8節10"},
 {id:"chusha-F-12", cat:"chusha", set:0, final:2, fo:12, ans:false, ja:"横断歩道の手前5m以内は駐停車禁止だが、横断歩道の先（向こう側）であればすぐに止めてよい。", my:"လူကူးမျဉ်းကြား၏ ရှေ့ဘက် 5 မီတာအတွင်းတွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်သော်လည်း လူကူးမျဉ်းကြားကို ကျော်ပြီးသော နောက်ဘက်တွင်မူ ချက်ချင်း ရပ်နိုင်သည်။", exJa:"誤り。正しくは、横断歩道とその端から前後5m以内が駐停車禁止で、先の側も5m以内は止められない。", exMy:"မှားပါသည်။ အမှန်မှာ လူကူးမျဉ်းကြားနှင့် ၎င်း၏အစွန်းမှ ရှေ့နောက် 5 မီတာအတွင်း တားမြစ်ထားသဖြင့် ကျော်ပြီးသောဘက်တွင်လည်း 5 မီတာအတွင်း မရပ်ရ။", src:"法44条1項"},
 {id:"chusha-F-13", cat:"chusha", set:0, final:2, fo:13, ans:false, ja:"高速道路では、休憩のためであれば路肩に短時間停車してよい。", my:"အမြန်လမ်း(高速道路)တွင် အနားယူရန် ဖြစ်လျှင် လမ်းဘေးအနား(路肩)တွင် အချိန်တိုတို ခဏရပ်ခြင်း(停車) လုပ်နိုင်သည်။", exJa:"誤り。正しくは、高速道路は原則駐停車禁止で、休憩はパーキングエリアなどでとる。路肩に止められるのは故障などやむを得ないときだけ。", exMy:"မှားပါသည်။ အမှန်မှာ အမြန်လမ်းတွင် မူအားဖြင့် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားပြီး အနားယူခြင်းကို ပါကင်ဧရိယာ(PA) စသည်တွင် ပြုလုပ်ရမည်။ လမ်းဘေးအနားတွင် ယာဉ်ပျက်ခြင်းကဲ့သို့ မလွှဲမရှောင်သာမှသာ ရပ်နိုင်သည်။", src:"法75条の8"},

 {id:"chusha-F-14", cat:"chusha", set:0, final:3, fo:14, ans:true, ja:"昼間でも、トンネルの中などで50m先が見えない場所に駐停車するときは、原則として非常点滅表示灯などをつけなければならない。", my:"နေ့အချိန် ဖြစ်သော်လည်း ဥမင်လိုဏ်ခေါင်းထဲ စသည်တွင် ရှေ့ 50 မီတာကို မမြင်ရသောနေရာ၌ ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း ပြုလုပ်သောအခါ မူအားဖြင့် အရေးပေါ်မီးဖွင့်ပိတ်(非常点滅表示灯) စသည်တို့ကို ဖွင့်ထားရမည်။", exJa:"正しい。トンネルや濃い霧などで50m先が見えない場所では、夜間と同じく、昼間でも非常点滅表示灯・駐車灯・尾灯のいずれかをつける（車道の幅が5.5m以上の道路の場合）。", exMy:"မှန်ပါသည်။ ဥမင်လိုဏ်ခေါင်း၊ မြူထူခြင်း စသည်ကြောင့် 50 မီတာ မမြင်ရသောနေရာတွင် ညအချိန်ကဲ့သို့ပင် နေ့အချိန်လည်း အရေးပေါ်မီးဖွင့်ပိတ်၊ ယာဉ်ရပ်နားမီး၊ နောက်မီး တစ်ခုခုကို ဖွင့်ရမည် (ယာဉ်သွားလမ်းအကျယ် 5.5 မီတာနှင့်အထက်ရှိသော လမ်းဖြစ်လျှင်)။", src:"法52条1項、令18条2項・19条"},
 {id:"chusha-F-15", cat:"chusha", set:0, final:3, fo:15, ans:false, ja:"オートマチック車から離れるときは、チェンジレバーをNに入れておく。", my:"အော်တိုမစ်ယာဉ်(オートマチック車)မှ ခွာသွားသောအခါ ဂီယာတံ(チェンジレバー)ကို N တွင် ထားခဲ့ရမည်။", exJa:"誤り。正しくは、オートマチック車から離れるときは、チェンジレバーをPに入れておく。", exMy:"မှားပါသည်။ အမှန်မှာ အော်တိုမစ်ယာဉ်မှ ခွာသွားသောအခါ ဂီယာတံကို P တွင် ထားရမည်။", src:"教則5章8節10"},
 {id:"chusha-F-16", cat:"chusha", set:0, final:3, fo:16, ans:true, ja:"傷病者の救護のためやむを得ないときは、右側に3.5m以上の余地がとれない場所でも駐車できる。", my:"ဒဏ်ရာရသူ/လူနာကို ကယ်ဆယ်ရန် မလွှဲမရှောင်သာသောအခါ ညာဘက်တွင် 3.5 မီတာနှင့်အထက် နေရာလွတ် မကျန်သောနေရာ၌လည်း ယာဉ်ရပ်နားနိုင်သည်။", exJa:"正しい。傷病者の救護でやむを得ないときは、3.5mの余地がなくても駐車できる。", exMy:"မှန်ပါသည်။ ဒဏ်ရာရသူ/လူနာ ကယ်ဆယ်ရန် မလွှဲမရှောင်သာလျှင် 3.5 မီတာ နေရာလွတ် မရှိသော်လည်း ယာဉ်ရပ်နားနိုင်သည်။", src:"法45条2項"},
 {id:"chusha-F-17", cat:"chusha", set:0, final:3, fo:17, ans:false, ja:"自宅の前の道路であれば、毎晩車庫のかわりに駐車してもよい。", my:"ကိုယ့်အိမ်ရှေ့ လမ်းဖြစ်လျှင် ညတိုင်း ကားဂိုဒေါင်အစား ယာဉ်ရပ်နားထားနိုင်သည်။", exJa:"誤り。正しくは、道路を車庫がわりにしてはならず、保管場所は道路以外の場所に確保しなければならない。", exMy:"မှားပါသည်။ အမှန်မှာ လမ်းကို ကားဂိုဒေါင်အစား မသုံးရ။ ယာဉ်ထားရှိရာနေရာကို လမ်းမဟုတ်သောနေရာတွင် ရှိထားရမည်။", src:"保管場所法11条、教則5章8節9"},
 {id:"chusha-F-18", cat:"chusha", set:0, final:3, fo:18, ans:true, ja:"「駐車可」の標識は、青地に白の「P」の文字で示される。", my:"「ယာဉ်ရပ်နားနိုင်」 ဆိုင်းဘုတ်ကို အပြာရောင်နောက်ခံပေါ်တွင် အဖြူရောင် 「P」 စာလုံးဖြင့် ပြသည်။", exJa:"正しい。駐車可の標識は青地に白のPで、その場所では駐車できる。", exMy:"မှန်ပါသည်။ ယာဉ်ရပ်နားနိုင် ဆိုင်းဘုတ်သည် အပြာနောက်ခံ၌ အဖြူ P ဖြစ်ပြီး ထိုနေရာတွင် ယာဉ်ရပ်နားနိုင်သည်။", src:"教則付表3(1)53"},
 {id:"chusha-F-19", cat:"chusha", set:0, final:3, fo:19, ans:false, ja:"高齢運転者等専用場所には、専用場所駐車標章の交付を受けていない人でも、短時間なら停車してよい。", my:"သက်ကြီးယာဉ်မောင်းသူ စသည်တို့အတွက် သီးသန့်နေရာ(高齢運転者等専用場所)တွင် သီးသန့်နေရာ ယာဉ်ရပ်နားတံဆိပ်(標章) မရထားသူလည်း အချိန်တိုတို ဖြစ်လျှင် ခဏရပ်ခြင်း လုပ်နိုင်သည်။", exJa:"誤り。正しくは、専用場所駐車標章の交付を受けていない人は、高齢運転者等専用場所で駐車も停車もしてはいけない。", exMy:"မှားပါသည်။ အမှန်မှာ သီးသန့်နေရာ ယာဉ်ရပ်နားတံဆိပ် မရထားသူသည် ထိုနေရာတွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း နှစ်မျိုးလုံး မလုပ်ရ။", src:"法45条の2、教則5章8節5"}
);
QUESTIONS.push(
 {id:"hoko-1-01", cat:"hoko", set:1, final:0, fo:0, ans:true, ja:"横断歩道に近づいたときは、横断する人がいないことが明らかな場合のほかは、その手前で停止できるような速度で進まなければならない。", my:"လူကူးမျဉ်းကြားသို့ နီးကပ်လာသောအခါ ဖြတ်ကူးမည့်သူ မရှိကြောင်း ထင်ရှားစွာ သိရသည့်အခါမှလွဲ၍ ၎င်း၏ရှေ့တွင် ရပ်နိုင်သည့် အမြန်နှုန်းဖြင့် မောင်းရမည်။", exJa:"正しい。渡る人がいないことが明らかでなければ、横断歩道の手前で止まれる速度に落として進む。", exMy:"မှန်သည်။ ဖြတ်ကူးမည့်သူ မရှိကြောင်း မသေချာလျှင် လူကူးမျဉ်းကြားရှေ့တွင် ရပ်နိုင်သည့် အမြန်နှုန်းအထိ လျှော့၍ မောင်းရမည်။", src:"法38条1項、教則5章3節"},
 {id:"hoko-1-02", cat:"hoko", set:1, final:0, fo:0, ans:false, ja:"横断歩道を歩行者が渡ろうとしているときは、警音器を鳴らして知らせれば、そのまま通過してよい。", my:"လူကူးမျဉ်းကြားကို လမ်းလျှောက်သူ ဖြတ်ကူးရန် ပြင်နေသောအခါ ဟွန်းတီး၍ အသိပေးလျှင် ဆက်မောင်းသွားနိုင်သည်။", exJa:"誤り。正しくは、横断歩道の手前（停止線があればその手前）で一時停止し、歩行者に道を譲る。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လူကူးမျဉ်းကြားရှေ့ (ရပ်တန့်မျဉ်း ရှိလျှင် ၎င်း၏ရှေ့) တွင် ခဏရပ်တန့်ခြင်း(一時停止) ပြုလုပ်၍ လမ်းလျှောက်သူကို လမ်းဖယ်ပေးရမည်။", src:"法38条1項"},
 {id:"hoko-1-03", cat:"hoko", set:1, final:0, fo:0, ans:true, ja:"横断歩道の手前で止まっている車があるときは、その横を通って前に出る前に一時停止しなければならない。", my:"လူကူးမျဉ်းကြားရှေ့တွင် ရပ်ထားသောကား ရှိသောအခါ ၎င်း၏ဘေးမှဖြတ်၍ ရှေ့သို့ မထွက်မီ ခဏရပ်တန့်ခြင်း(一時停止) ပြုလုပ်ရမည်။", exJa:"正しい。止まっている車の陰から歩行者が出てくることがあるので、前に出る前に必ず一時停止する。", exMy:"မှန်သည်။ ရပ်ထားသောကား၏ နောက်ကွယ်မှ လမ်းလျှောက်သူ ထွက်လာနိုင်သောကြောင့် ရှေ့သို့မထွက်မီ မဖြစ်မနေ ခဏရပ်တန့်ရမည်။", src:"法38条2項"},
 {id:"hoko-1-04", cat:"hoko", set:1, final:0, fo:0, ans:true, ja:"白か黄のつえを持った人が歩いているときは、一時停止か徐行をして、安全に通れるようにしなければならない。", my:"အဖြူ သို့မဟုတ် အဝါရောင် တုတ်ကောက်ကိုင်ထားသူ လမ်းလျှောက်နေသောအခါ ခဏရပ်တန့်ခြင်း သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်း(徐行) ပြုလုပ်၍ ဘေးကင်းစွာ သွားနိုင်အောင် ပြုလုပ်ပေးရမည်။", exJa:"正しい。目の不自由な人などを守るため、一時停止か徐行をしなければならない。", exMy:"မှန်သည်။ မျက်စိမမြင်သူ စသည်တို့ကို ကာကွယ်ရန် ခဏရပ်တန့်ခြင်း သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်း ပြုလုပ်ရမည်။", src:"法71条2号、教則5章3節"},
 {id:"hoko-1-05", cat:"hoko", set:1, final:0, fo:0, ans:false, ja:"道路交通法でいう幼児とは、8歳未満の子どものことである。", my:"ယာဉ်စည်းကမ်းဥပဒေတွင် ကလေးငယ်(幼児) ဆိုသည်မှာ အသက် 8 နှစ်အောက် ကလေးကို ဆိုလိုသည်။", exJa:"誤り。正しくは、幼児は6歳未満、児童は6歳以上13歳未満の子どもである。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ကလေးငယ်(幼児) သည် အသက် 6 နှစ်အောက်၊ ကလေး(児童) သည် အသက် 6 နှစ်မှ 13 နှစ်အောက် ဖြစ်သည်။", src:"法14条3項"},
 {id:"hoko-1-06", cat:"hoko", set:1, final:0, fo:0, ans:true, ja:"歩行者のそばを通るときは、歩行者との間に安全な間隔をあけるか、徐行しなければならない。", my:"လမ်းလျှောက်သူ၏ ဘေးမှ ဖြတ်မောင်းသောအခါ လမ်းလျှောက်သူနှင့် ဘေးကင်းသော အကွာအဝေးကို ချန်ထားရမည် သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်း(徐行) ပြုလုပ်ရမည်။", exJa:"正しい。安全な間隔をあけられないときは徐行する。", exMy:"မှန်သည်။ ဘေးကင်းသော အကွာအဝေး မချန်နိုင်လျှင် ဖြည်းဖြည်းမောင်းရမည်။", src:"法18条2項、教則5章3節"},
 {id:"hoko-1-07", cat:"hoko", set:1, final:0, fo:0, ans:false, ja:"歩行者がいる安全地帯のそばを通るときは、そのままの速度で通過してよい。", my:"လမ်းလျှောက်သူ ရှိနေသော ဘေးကင်းဇုန်(安全地帯) ၏ ဘေးမှ ဖြတ်မောင်းသောအခါ အမြန်နှုန်း မလျှော့ဘဲ ဖြတ်သွားနိုင်သည်။", exJa:"誤り。正しくは、歩行者がいる安全地帯のそばを通るときは徐行しなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လမ်းလျှောက်သူရှိသော ဘေးကင်းဇုန်၏ ဘေးမှ ဖြတ်သောအခါ ဖြည်းဖြည်းမောင်းရမည်။", src:"法71条3号"},
 {id:"hoko-1-08", cat:"hoko", set:1, final:0, fo:0, ans:true, ja:"乗り降りのため止まっている通学通園バスのそばを通るときは、徐行して安全を確かめなければならない。", my:"ကလေးများ အတက်အဆင်းအတွက် ရပ်ထားသော ကျောင်းကား(通学通園バス) ၏ ဘေးမှ ဖြတ်သောအခါ ဖြည်းဖြည်းမောင်း၍ ဘေးကင်းကြောင်း စစ်ဆေးရမည်။", exJa:"正しい。バスの陰から子どもが飛び出すことがあるので、徐行して安全を確かめる。", exMy:"မှန်သည်။ ကားနောက်ကွယ်မှ ကလေးများ ရုတ်တရက် ထွက်လာနိုင်သဖြင့် ဖြည်းဖြည်းမောင်း၍ ဘေးကင်းကြောင်း စစ်ဆေးရမည်။", src:"法71条2号の3"},
 {id:"hoko-1-09", cat:"hoko", set:1, final:0, fo:0, ans:false, ja:"初心者マークを付けた普通自動車の前方に無理に割り込むことは、禁止されていない。", my:"ယာဉ်မောင်းအသစ် အမှတ်တံဆိပ်(初心者マーク) တပ်ထားသော ကား၏ ရှေ့သို့ အတင်းဖြတ်ဝင်ခြင်းကို တားမြစ်ထားခြင်း မရှိပါ။", exJa:"誤り。正しくは、危険を避けるためやむを得ない場合のほか、幅寄せや無理な割込みをしてはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ အန္တရာယ်ရှောင်ရန် မလွှဲမရှောင်သာသည့်အခါမှလွဲ၍ ဘေးမှ ကပ်မောင်းခြင်း သို့မဟုတ် ရှေ့သို့ အတင်းဖြတ်ဝင်ခြင်း မပြုရ။", src:"法71条5号の4"},
 {id:"hoko-1-10", cat:"hoko", set:1, final:0, fo:0, ans:false, ja:"自動車で自転車の右側を通過する場合に十分な間隔がないときでも、速度を落とす必要はない。", my:"မော်တော်ကားဖြင့် စက်ဘီး၏ ညာဘက်မှ ဖြတ်မောင်းသောအခါ လုံလောက်သော အကွာအဝေး မရှိသော်လည်း အမြန်နှုန်း လျှော့ရန် မလိုပါ။", exJa:"誤り。正しくは、十分な間隔がないときは、その間隔に応じた安全な速度で進まなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လုံလောက်သော အကွာအဝေး မရှိလျှင် ထိုအကွာအဝေးနှင့် ကိုက်ညီသော ဘေးကင်းသည့် အမြန်နှုန်းဖြင့် မောင်းရမည်။", src:"法18条3項（2026年4月1日施行）"},
 {id:"hoko-2-01", cat:"hoko", set:2, final:0, fo:0, ans:true, ja:"横断歩道や自転車横断帯とその手前30m以内の場所では、ほかの車を追い越したり追い抜いたりしてはいけない。", my:"လူကူးမျဉ်းကြား၊ စက်ဘီးဖြတ်ကူးလမ်း(自転車横断帯) နှင့် ၎င်းတို့၏ ရှေ့ 30 မီတာအတွင်းတွင် အခြားယာဉ်ကို ကျော်တက်ခြင်း(追越し) သို့မဟုတ် ဘေးမှ ဖြတ်ကျော်ခြင်း(追抜き) မပြုရ။", exJa:"正しい。横断する歩行者や自転車を守るため、追越しも追抜きも禁止されている。", exMy:"မှန်သည်။ ဖြတ်ကူးနေသော လမ်းလျှောက်သူနှင့် စက်ဘီးများကို ကာကွယ်ရန် ကျော်တက်ခြင်းနှင့် ဘေးမှဖြတ်ကျော်ခြင်း နှစ်မျိုးလုံးကို တားမြစ်ထားသည်။", src:"法30条3号、法38条3項"},
 {id:"hoko-2-02", cat:"hoko", set:2, final:0, fo:0, ans:false, ja:"横断歩道のない交差点では、横断している歩行者がいても、車が先に通行してよい。", my:"လူကူးမျဉ်းကြား မရှိသော လမ်းဆုံတွင် ဖြတ်ကူးနေသော လမ်းလျှောက်သူ ရှိသော်လည်း ကားက အရင်ဖြတ်သွားနိုင်သည်။", exJa:"誤り。正しくは、横断歩道のない交差点やその近くでも、横断している歩行者の通行を妨げてはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လူကူးမျဉ်းကြား မရှိသော လမ်းဆုံနှင့် ၎င်း၏အနီးတွင်လည်း ဖြတ်ကူးနေသော လမ်းလျှောက်သူကို အနှောင့်အယှက် မပေးရ။", src:"法38条の2"},
 {id:"hoko-2-03", cat:"hoko", set:2, final:0, fo:0, ans:true, ja:"道路交通法でいう児童とは、6歳以上13歳未満の子どものことである。", my:"ယာဉ်စည်းကမ်းဥပဒေတွင် ကလေး(児童) ဆိုသည်မှာ အသက် 6 နှစ်နှင့်အထက် 13 နှစ်အောက် ကလေးကို ဆိုလိုသည်။", exJa:"正しい。6歳未満は幼児、6歳以上13歳未満は児童という。", exMy:"မှန်သည်။ အသက် 6 နှစ်အောက်ကို ကလေးငယ်(幼児)၊ 6 နှစ်မှ 13 နှစ်အောက်ကို ကလေး(児童) ဟု ခေါ်သည်။", src:"法14条3項"},
 {id:"hoko-2-04", cat:"hoko", set:2, final:0, fo:0, ans:false, ja:"安全地帯のない停留所で止まっている路面電車に乗り降りする人がいるときでも、路面電車との間に1.5m以上あれば徐行して進んでよい。", my:"ဘေးကင်းဇုန်(安全地帯) မရှိသော မှတ်တိုင်တွင် ရပ်ထားသော ဓာတ်ရထား(路面電車) ၌ အတက်အဆင်းလုပ်သူ ရှိနေသော်လည်း ဓာတ်ရထားနှင့် 1.5 မီတာ အထက် ကွာလျှင် ဖြည်းဖြည်းမောင်း၍ ဖြတ်သွားနိုင်သည်။", exJa:"誤り。正しくは、安全地帯がないときに乗り降りする人がいれば、間隔に関係なく、路面電車の後方で停止して待つ。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ဘေးကင်းဇုန် မရှိဘဲ အတက်အဆင်းလုပ်သူ ရှိလျှင် အကွာအဝေး မည်မျှပင်ရှိစေကာမူ ဓာတ်ရထား၏ နောက်တွင် ရပ်၍ စောင့်ရမည်။", src:"法31条、教則5章3節"},
 {id:"hoko-2-05", cat:"hoko", set:2, final:0, fo:0, ans:true, ja:"ぬかるみや水たまりのあるところでは、泥や水をはねて歩行者に迷惑をかけないよう、徐行するなど注意して通らなければならない。", my:"ရွှံ့ဗွက် သို့မဟုတ် ရေအိုင်ရှိသောနေရာတွင် ရွှံ့ သို့မဟုတ် ရေ စင်၍ လမ်းလျှောက်သူကို အနှောင့်အယှက် မဖြစ်စေရန် ဖြည်းဖြည်းမောင်းခြင်း စသည်ဖြင့် သတိထား၍ ဖြတ်မောင်းရမည်။", exJa:"正しい。泥や水をはねないように、徐行するなどして通る。", exMy:"မှန်သည်။ ရွှံ့ သို့မဟုတ် ရေ မစင်စေရန် ဖြည်းဖြည်းမောင်းခြင်း စသည်ဖြင့် ဖြတ်မောင်းရမည်။", src:"法71条1号"},
 {id:"hoko-2-06", cat:"hoko", set:2, final:0, fo:0, ans:true, ja:"通行に支障のある高齢者が歩いているときは、一時停止か徐行をして、安全に通れるようにしなければならない。", my:"လမ်းလျှောက်ရာတွင် အခက်အခဲရှိသော သက်ကြီးရွယ်အို လမ်းလျှောက်နေသောအခါ ခဏရပ်တန့်ခြင်း သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်း ပြုလုပ်၍ ဘေးကင်းစွာ သွားနိုင်အောင် ပြုလုပ်ပေးရမည်။", exJa:"正しい。高齢者は歩くのが遅く、とっさに危険を避けにくいので、一時停止か徐行をする。", exMy:"မှန်သည်။ သက်ကြီးရွယ်အိုများသည် လမ်းလျှောက်နှေးပြီး အန္တရာယ်ကို ချက်ချင်း ရှောင်ရန် ခက်ခဲသဖြင့် ခဏရပ်တန့်ခြင်း သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်း ပြုလုပ်ရမည်။", src:"法71条2号の2、教則5章3節"},
 {id:"hoko-2-07", cat:"hoko", set:2, final:0, fo:0, ans:false, ja:"普通自転車は、どのような場合でも歩道を通行することはできない。", my:"သာမန်စက်ဘီး(普通自転車) သည် မည်သည့်အခြေအနေတွင်မဆို လူသွားလမ်း(歩道) ပေါ်တွင် မသွားရ။", exJa:"誤り。正しくは、通行可の標識があるとき、13歳未満・70歳以上・体の不自由な人、やむを得ないときは歩道を通れる。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ခွင့်ပြုဆိုင်းဘုတ် ရှိလျှင်၊ အသက် 13 နှစ်အောက်၊ 70 နှစ်နှင့်အထက်၊ ကိုယ်အင်္ဂါ မသန်စွမ်းသူ၊ မလွှဲမရှောင်သာသည့်အခါ လူသွားလမ်းပေါ်တွင် သွားနိုင်သည်။", src:"法63条の4第1項"},
 {id:"hoko-2-08", cat:"hoko", set:2, final:0, fo:0, ans:true, ja:"道路に面した場所に出入りするため歩道や路側帯を横切るときは、その直前で一時停止しなければならない。", my:"လမ်းဘေးရှိ နေရာသို့ ဝင်ထွက်ရန် လူသွားလမ်း(歩道) သို့မဟုတ် လမ်းဘေးဇုန်(路側帯) ကို ဖြတ်ကျော်သောအခါ ၎င်း၏ ရှေ့တည့်တည့်တွင် ခဏရပ်တန့်ရမည်။", exJa:"正しい。直前で一時停止し、歩行者の通行を妨げないようにする。", exMy:"မှန်သည်။ ရှေ့တည့်တည့်တွင် ခဏရပ်တန့်၍ လမ်းလျှောက်သူများကို အနှောင့်အယှက် မပေးရ။", src:"法17条2項"},
 {id:"hoko-2-09", cat:"hoko", set:2, final:0, fo:0, ans:false, ja:"仮免許で練習中の自動車に対しては、幅寄せや前方への割込みをしてもよい。", my:"ယာယီလိုင်စင်(仮免許) ဖြင့် လေ့ကျင့်နေသော ကားကို ဘေးမှ ကပ်မောင်းခြင်း သို့မဟုတ် ရှေ့သို့ ဖြတ်ဝင်ခြင်း ပြုလုပ်နိုင်သည်။", exJa:"誤り。正しくは、仮免許練習中の車にも、危険を避けるためやむを得ない場合のほか、幅寄せや割込みをしてはいけない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ယာယီလိုင်စင်ဖြင့် လေ့ကျင့်နေသော ကားကိုလည်း အန္တရာယ်ရှောင်ရန် မလွှဲမရှောင်သာသည့်အခါမှလွဲ၍ ဘေးမှကပ်မောင်းခြင်း၊ ဖြတ်ဝင်ခြင်း မပြုရ။", src:"法71条5号の4"},
 {id:"hoko-2-10", cat:"hoko", set:2, final:0, fo:0, ans:false, ja:"左折するときは、左後方から来る自転車に注意する必要はない。", my:"ဘယ်ကွေ့သောအခါ ဘယ်ဘက်နောက်မှ လာသော စက်ဘီးကို သတိထားရန် မလိုပါ။", exJa:"誤り。正しくは、左折するときは左後方の自転車や二輪車を巻き込まないよう十分注意する。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ဘယ်ကွေ့သောအခါ ဘယ်ဘက်နောက်ရှိ စက်ဘီးနှင့် ဆိုင်ကယ်တို့ကို ကားဘေးသို့ ဆွဲမသွင်းမိစေရန် အထူးသတိထားရမည်။", src:"教則5章3節"},
 {id:"hoko-3-01", cat:"hoko", set:3, final:0, fo:0, ans:false, ja:"横断歩道を渡ろうとしている歩行者がいても、まだ横断を始めていなければ、そのまま進んでよい。", my:"လူကူးမျဉ်းကြားကို ဖြတ်ကူးရန် ပြင်နေသော လမ်းလျှောက်သူ ရှိသော်လည်း မဖြတ်ကူးရသေးလျှင် ကားက ဆက်မောင်းသွားနိုင်သည်။", exJa:"誤り。正しくは、横断しようとしている人がいるときも、手前で一時停止して道を譲る。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ဖြတ်ကူးရန် ပြင်နေသူ ရှိလျှင်လည်း ရှေ့တွင် ခဏရပ်တန့်၍ လမ်းဖယ်ပေးရမည်။", src:"法38条1項"},
 {id:"hoko-3-02", cat:"hoko", set:3, final:0, fo:0, ans:true, ja:"自転車横断帯を自転車が横断しようとしているときは、その手前で一時停止して道を譲らなければならない。", my:"စက်ဘီးဖြတ်ကူးလမ်း(自転車横断帯) ကို စက်ဘီး ဖြတ်ကူးရန် ပြင်နေသောအခါ ၎င်း၏ရှေ့တွင် ခဏရပ်တန့်၍ လမ်းဖယ်ပေးရမည်။", exJa:"正しい。自転車横断帯も横断歩道と同じで、手前で一時停止して道を譲る。", exMy:"မှန်သည်။ စက်ဘီးဖြတ်ကူးလမ်းသည်လည်း လူကူးမျဉ်းကြားကဲ့သို့ပင် ရှေ့တွင် ခဏရပ်တန့်၍ လမ်းဖယ်ပေးရမည်။", src:"法38条1項"},
 {id:"hoko-3-03", cat:"hoko", set:3, final:0, fo:0, ans:true, ja:"付き添いのいない幼児が歩いているときは、一時停止か徐行をして、安全に通れるようにしなければならない。", my:"အုပ်ထိန်းသူ မပါဘဲ ကလေးငယ်(幼児) လမ်းလျှောက်နေသောအခါ ခဏရပ်တန့်ခြင်း သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်း ပြုလုပ်၍ ဘေးကင်းစွာ သွားနိုင်အောင် ပြုလုပ်ပေးရမည်။", exJa:"正しい。子どもは急に飛び出すことがあるので、一時停止か徐行をする。", exMy:"မှန်သည်။ ကလေးများသည် ရုတ်တရက် လမ်းပေါ်သို့ ပြေးထွက်တတ်သဖြင့် ခဏရပ်တန့်ခြင်း သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်း ပြုလုပ်ရမည်။", src:"法71条2号、教則5章3節"},
 {id:"hoko-3-04", cat:"hoko", set:3, final:0, fo:0, ans:false, ja:"安全地帯のない停留所で、止まっている路面電車に乗り降りする人がいないとき、1m以上の間隔があれば徐行して進める。", my:"ဘေးကင်းဇုန်(安全地帯) မရှိသော မှတ်တိုင်တွင် ရပ်ထားသော ဓာတ်ရထား၌ အတက်အဆင်းလုပ်သူ မရှိသောအခါ 1 မီတာ အထက် ကွာလျှင် ဖြည်းဖြည်းမောင်း၍ ဖြတ်သွားနိုင်သည်။", exJa:"誤り。正しくは、1mではなく、路面電車との間に1.5m以上あるときに徐行して進むことができる。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ 1 မီတာ မဟုတ်ဘဲ ဓာတ်ရထားနှင့် 1.5 မီတာ အထက် ကွာမှသာ ဖြည်းဖြည်းမောင်း၍ ဖြတ်သွားနိုင်သည်။", src:"法31条、教則5章3節"},
 {id:"hoko-3-05", cat:"hoko", set:3, final:0, fo:0, ans:true, ja:"自転車のそばを通るときは、自転車のふらつきを予想して、安全な間隔をあけるか徐行しなければならない。", my:"စက်ဘီး၏ ဘေးမှ ဖြတ်မောင်းသောအခါ စက်ဘီး ယိမ်းယိုင်နိုင်သည်ကို ကြိုတင်မျှော်မှန်း၍ ဘေးကင်းသော အကွာအဝေး ချန်ထားရမည် သို့မဟုတ် ဖြည်းဖြည်းမောင်းရမည်။", exJa:"正しい。自転車は不安定でふらつくことがあるので、安全な間隔をあけるか徐行する。", exMy:"မှန်သည်။ စက်ဘီးသည် မတည်ငြိမ်ဘဲ ယိမ်းယိုင်တတ်သဖြင့် ဘေးကင်းသော အကွာအဝေး ချန်ရမည် သို့မဟုတ် ဖြည်းဖြည်းမောင်းရမည်။", src:"教則5章3節"},
 {id:"hoko-3-06", cat:"hoko", set:3, final:0, fo:0, ans:false, ja:"歩行者用道路を特に通行を認められて通る車は、徐行しなくてよい。", my:"လမ်းလျှောက်သူသီးသန့်လမ်း(歩行者用道路) တွင် အထူးခွင့်ပြုချက်ဖြင့် မောင်းသော ကားသည် ဖြည်းဖြည်းမောင်းရန် မလိုပါ။", exJa:"誤り。正しくは、通行を認められた車でも、歩行者に特に注意して徐行しなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ခွင့်ပြုချက်ရသော ကားဖြစ်သော်လည်း လမ်းလျှောက်သူများကို အထူးသတိထား၍ ဖြည်းဖြည်းမောင်းရမည်။", src:"法9条、教則5章3節"},
 {id:"hoko-3-07", cat:"hoko", set:3, final:0, fo:0, ans:true, ja:"聴覚障害者マークを付けた車に、危険を避けるためやむを得ない場合のほかは、幅寄せや割込みをしてはいけない。", my:"နားမကြားသူ အမှတ်တံဆိပ်(聴覚障害者マーク) တပ်ထားသော ကားကို အန္တရာယ်ရှောင်ရန် မလွှဲမရှောင်သာသည့်အခါမှလွဲ၍ ဘေးမှ ကပ်မောင်းခြင်း သို့မဟုတ် ရှေ့သို့ ဖြတ်ဝင်ခြင်း မပြုရ။", exJa:"正しい。初心者・高齢者・聴覚障害者・身体障害者のマークの車と仮免許練習中の車が守られる。", exMy:"မှန်သည်။ ယာဉ်မောင်းအသစ်၊ သက်ကြီး၊ နားမကြားသူ၊ ကိုယ်အင်္ဂါမသန်စွမ်းသူ အမှတ်တံဆိပ် တပ်ထားသော ကားနှင့် ယာယီလိုင်စင်ဖြင့် လေ့ကျင့်နေသော ကားကို ကာကွယ်ရမည်။", src:"法71条5号の4"},
 {id:"hoko-3-08", cat:"hoko", set:3, final:0, fo:0, ans:false, ja:"自転車は交差点で右折するとき、自動車と同じように道路の中央に寄って右折する。", my:"စက်ဘီးသည် လမ်းဆုံတွင် ညာကွေ့သောအခါ ကားကဲ့သို့ပင် လမ်းအလယ်သို့ ကပ်၍ ညာကွေ့သည်။", exJa:"誤り。正しくは、自転車は道路の左端に沿って交差点の向こう側まで進み、そこで向きを変える二段階右折をする。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ စက်ဘီးသည် လမ်း၏ ဘယ်ဘက်အစွန်းအတိုင်း လမ်းဆုံ၏ တစ်ဖက်အထိ သွားပြီးမှ ဦးတည်ရာ ပြောင်းသော အဆင့်နှစ်ဆင့် ညာကွေ့(二段階右折) ကို ပြုလုပ်ရမည်။", src:"法34条3項"},
 {id:"hoko-3-09", cat:"hoko", set:3, final:0, fo:0, ans:false, ja:"普通自転車が歩道を通るときは、歩道の建物寄りの部分を通行しなければならない。", my:"သာမန်စက်ဘီးသည် လူသွားလမ်းပေါ်တွင် သွားသောအခါ လူသွားလမ်း၏ အဆောက်အအုံဘက်ခြမ်းတွင် သွားရမည်။", exJa:"誤り。正しくは、歩道の車道寄りの部分を徐行し、歩行者の通行を妨げるときは一時停止する。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လူသွားလမ်း၏ ကားလမ်းဘက်ခြမ်းတွင် ဖြည်းဖြည်းသွားရပြီး လမ်းလျှောက်သူကို အနှောင့်အယှက်ဖြစ်မည်ဆိုလျှင် ခဏရပ်တန့်ရမည်။", src:"法63条の4第2項"},
 {id:"hoko-3-10", cat:"hoko", set:3, final:0, fo:0, ans:true, ja:"路面にひし形（◇）の標示があるときは、前方に横断歩道か自転車横断帯があることを示している。", my:"လမ်းမျက်နှာပြင်ပေါ်တွင် စိန်ပုံ (◇) အမှတ်အသား ရှိလျှင် ရှေ့တွင် လူကူးမျဉ်းကြား သို့မဟုတ် စက်ဘီးဖြတ်ကူးလမ်း ရှိကြောင်း ပြသည်။", exJa:"正しい。◇の標示を見たら、横断する歩行者や自転車に備えて速度を落とす。", exMy:"မှန်သည်။ ◇ အမှတ်အသားကို မြင်လျှင် ဖြတ်ကူးမည့် လမ်းလျှောက်သူ၊ စက်ဘီးများအတွက် ပြင်ဆင်၍ အမြန်နှုန်း လျှော့ရမည်။", src:"教則付表3（2）38"},
 {id:"hoko-F-01", cat:"hoko", set:0, final:1, fo:1, ans:true, ja:"横断歩道を歩行者が横断しようとしているとき、停止線があれば、その停止線の手前で一時停止しなければならない。", my:"လူကူးမျဉ်းကြားကို လမ်းလျှောက်သူ ဖြတ်ကူးရန် ပြင်နေသောအခါ ရပ်တန့်မျဉ်း ရှိလျှင် ထိုရပ်တန့်မျဉ်း၏ ရှေ့တွင် ခဏရပ်တန့်ရမည်။", exJa:"正しい。停止線があるときはその手前、ないときは横断歩道の手前で一時停止する。", exMy:"မှန်သည်။ ရပ်တန့်မျဉ်း ရှိလျှင် ၎င်း၏ရှေ့၊ မရှိလျှင် လူကူးမျဉ်းကြား၏ ရှေ့တွင် ခဏရပ်တန့်ရမည်။", src:"法38条1項、教則5章3節"},
 {id:"hoko-F-02", cat:"hoko", set:0, final:1, fo:2, ans:false, ja:"横断歩道の手前で止まっている車の横を通って前に出るときは、徐行すればよく、一時停止の必要はない。", my:"လူကူးမျဉ်းကြားရှေ့တွင် ရပ်ထားသောကား၏ ဘေးမှဖြတ်၍ ရှေ့သို့ထွက်သောအခါ ဖြည်းဖြည်းမောင်းလျှင် ရပြီး ခဏရပ်တန့်ရန် မလိုပါ။", exJa:"誤り。正しくは、徐行ではなく、前に出る前に一時停止しなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ဖြည်းဖြည်းမောင်းရုံဖြင့် မလုံလောက်ဘဲ ရှေ့သို့ မထွက်မီ ခဏရပ်တန့်ရမည်။", src:"法38条2項"},
 {id:"hoko-F-03", cat:"hoko", set:0, final:1, fo:3, ans:false, ja:"横断歩道の手前30m以内では、車を追い越すことはできないが、追い抜くことはできる。", my:"လူကူးမျဉ်းကြား၏ ရှေ့ 30 မီတာအတွင်းတွင် ယာဉ်ကို ကျော်တက်ခြင်း(追越し) မပြုရသော်လည်း ဘေးမှ ဖြတ်ကျော်ခြင်း(追抜き) ကို ပြုလုပ်နိုင်သည်။", exJa:"誤り。正しくは、横断歩道の手前30m以内では、追越しも追抜きも禁止されている。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လူကူးမျဉ်းကြား၏ ရှေ့ 30 မီတာအတွင်း ကျော်တက်ခြင်းရော ဘေးမှဖြတ်ကျော်ခြင်း (လမ်းကြောမပြောင်းဘဲ ရှေ့ကား၏ဘေးမှ ရှေ့သို့ထွက်ခြင်း) ပါ တားမြစ်ထားသည်။", src:"法38条3項"},
 {id:"hoko-F-04", cat:"hoko", set:0, final:1, fo:4, ans:true, ja:"13歳未満の子どもは、普通自転車で歩道を通行することができる。", my:"အသက် 13 နှစ်အောက် ကလေးများသည် သာမန်စက်ဘီး(普通自転車) ဖြင့် လူသွားလမ်း(歩道) ပေါ်တွင် သွားနိုင်သည်။", exJa:"正しい。13歳未満・70歳以上・体の不自由な人は、普通自転車で歩道を通れる（車道寄りを徐行）。", exMy:"မှန်သည်။ အသက် 13 နှစ်အောက်၊ 70 နှစ်နှင့်အထက်၊ ကိုယ်အင်္ဂါမသန်စွမ်းသူတို့သည် သာမန်စက်ဘီးဖြင့် လူသွားလမ်းပေါ်တွင် သွားနိုင်သည် (ကားလမ်းဘက်ခြမ်းတွင် ဖြည်းဖြည်း)။", src:"法63条の4第1項"},
 {id:"hoko-F-05", cat:"hoko", set:0, final:1, fo:5, ans:false, ja:"自転車は、歩道と車道の区別のある道路では、歩道を通行するのが原則である。", my:"လူသွားလမ်းနှင့် ကားလမ်း ခွဲထားသော လမ်းတွင် စက်ဘီးသည် လူသွားလမ်းပေါ်တွင် သွားခြင်းသည် မူလစည်းမျဉ်း ဖြစ်သည်။", exJa:"誤り。正しくは、自転車は軽車両なので車道を通るのが原則で、歩道を通れるのは例外の場合だけである。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ စက်ဘီးသည် ယာဉ်ပေါ့(軽車両) ဖြစ်သဖြင့် ကားလမ်းပေါ်တွင် သွားခြင်းသည် မူလစည်းမျဉ်းဖြစ်ပြီး လူသွားလမ်းပေါ်တွင် ခြွင်းချက်အခါများ၌သာ သွားနိုင်သည်။", src:"法17条1項、法63条の4"},
 {id:"hoko-F-06", cat:"hoko", set:0, final:1, fo:6, ans:true, ja:"身体障害者用の車いすで通行している人がいるときは、一時停止か徐行をして、安全に通れるようにしなければならない。", my:"မသန်စွမ်းသူသုံး ဘီးတပ်ကုလားထိုင်ဖြင့် သွားနေသူ ရှိသောအခါ ခဏရပ်တန့်ခြင်း သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်း ပြုလုပ်၍ ဘေးကင်းစွာ သွားနိုင်အောင် ပြုလုပ်ပေးရမည်။", exJa:"正しい。車いすの人、白か黄のつえを持つ人、盲導犬を連れた人がいるときは、一時停止か徐行をする。", exMy:"မှန်သည်။ ဘီးတပ်ကုလားထိုင်သုံးသူ၊ အဖြူ သို့မဟုတ် အဝါ တုတ်ကောက်ကိုင်သူ၊ မျက်မမြင်လမ်းပြခွေး ခေါ်ထားသူ ရှိလျှင် ခဏရပ်တန့်ခြင်း သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်း ပြုလုပ်ရမည်။", src:"法71条2号"},
 {id:"hoko-F-07", cat:"hoko", set:0, final:1, fo:7, ans:false, ja:"歩行者のそばを通るときは、安全な間隔をあけられなくても、徐行する必要はない。", my:"လမ်းလျှောက်သူ၏ ဘေးမှ ဖြတ်မောင်းသောအခါ ဘေးကင်းသော အကွာအဝေး မချန်နိုင်သော်လည်း ဖြည်းဖြည်းမောင်းရန် မလိုပါ။", exJa:"誤り。正しくは、安全な間隔をあけられないときは徐行しなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ဘေးကင်းသော အကွာအဝေး မချန်နိုင်လျှင် ဖြည်းဖြည်းမောင်းရမည်။", src:"法18条2項"},
 {id:"hoko-F-08", cat:"hoko", set:0, final:2, fo:8, ans:true, ja:"自転車に乗る人は、乗車用ヘルメットをかぶるよう努めなければならない。", my:"စက်ဘီးစီးသူသည် ဦးထုပ်အမာ(ヘルメット) ဆောင်းရန် ကြိုးစားရမည်။", exJa:"正しい。自転車のヘルメット着用は努力義務で、保護者は子どもにもかぶらせるよう努める。", exMy:"မှန်သည်။ စက်ဘီးစီးရာတွင် ဦးထုပ်အမာ ဆောင်းခြင်းသည် ကြိုးစားလုပ်ဆောင်ရမည့် တာဝန်(努力義務) ဖြစ်ပြီး မိဘများသည် ကလေးများကိုလည်း ဆောင်းစေရန် ကြိုးစားရမည်။", src:"法63条の11"},
 {id:"hoko-F-09", cat:"hoko", set:0, final:2, fo:9, ans:true, ja:"自動車に右側を通過されるとき十分な間隔がなければ、自転車はできる限り道路の左側端に寄らなければならない。", my:"ကားက စက်ဘီး၏ ညာဘက်မှ ဖြတ်မောင်းသောအခါ လုံလောက်သော အကွာအဝေး မရှိလျှင် စက်ဘီးသည် တတ်နိုင်သမျှ လမ်း၏ ဘယ်ဘက်အစွန်းသို့ ကပ်၍ သွားရမည်။", exJa:"正しい。このとき自動車は、間隔に応じた安全な速度で進まなければならない（2026年4月から）。", exMy:"မှန်သည်။ ထိုအခါ ကားကလည်း အကွာအဝေးနှင့် ကိုက်ညီသော ဘေးကင်းသည့် အမြန်နှုန်းဖြင့် မောင်းရမည် (2026 ခုနှစ် ဧပြီလမှစ၍)။", src:"法18条3項・4項（2026年4月1日施行）"},
 {id:"hoko-F-10", cat:"hoko", set:0, final:2, fo:10, ans:true, ja:"停留所で止まっている路面電車のそばに安全地帯があるときは、徐行して進むことができる。", my:"မှတ်တိုင်တွင် ရပ်ထားသော ဓာတ်ရထား(路面電車) ၏ ဘေးတွင် ဘေးကင်းဇုန်(安全地帯) ရှိလျှင် ဖြည်းဖြည်းမောင်း၍ ဖြတ်သွားနိုင်သည်။", exJa:"正しい。安全地帯がないときは、乗り降りする人がいなく1.5m以上あけられる場合に限り徐行して進める。", exMy:"မှန်သည်။ ဘေးကင်းဇုန် မရှိလျှင် အတက်အဆင်းလုပ်သူ မရှိဘဲ 1.5 မီတာ အထက် ခြားနိုင်မှသာ ဖြည်းဖြည်းမောင်း၍ ဖြတ်သွားနိုင်သည်။", src:"法31条、教則5章3節"},
 {id:"hoko-F-11", cat:"hoko", set:0, final:2, fo:11, ans:false, ja:"水たまりのあるところで歩行者のそばを通るときは、泥や水をはねても、そのままの速度で通過してよい。", my:"ရေအိုင်ရှိသောနေရာတွင် လမ်းလျှောက်သူ၏ ဘေးမှ ဖြတ်သောအခါ ရွှံ့ သို့မဟုတ် ရေ စင်သော်လည်း အမြန်နှုန်း မလျှော့ဘဲ ဖြတ်သွားနိုင်သည်။", exJa:"誤り。正しくは、泥や水をはねて迷惑をかけないよう、徐行するなど注意して通る。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ရွှံ့ သို့မဟုတ် ရေ စင်၍ အနှောင့်အယှက် မဖြစ်စေရန် ဖြည်းဖြည်းမောင်းခြင်း စသည်ဖြင့် သတိထား၍ ဖြတ်ရမည်။", src:"法71条1号"},
 {id:"hoko-F-12", cat:"hoko", set:0, final:2, fo:12, ans:false, ja:"初心者マークを付けた車の側方に幅寄せをしても、接触しなければ違反にはならない。", my:"ယာဉ်မောင်းအသစ် အမှတ်တံဆိပ်(初心者マーク) တပ်ထားသော ကား၏ ဘေးသို့ ကပ်မောင်းသော်လည်း မထိမိလျှင် စည်းကမ်းချိုးဖောက်ခြင်း မဖြစ်ပါ။", exJa:"誤り。正しくは、危険を避けるためやむを得ない場合のほか、幅寄せそのものが禁止されている。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ အန္တရာယ်ရှောင်ရန် မလွှဲမရှောင်သာသည့်အခါမှလွဲ၍ ဘေးမှကပ်မောင်းခြင်း ကိုယ်တိုင်ကို တားမြစ်ထားသည်။", src:"法71条5号の4"},
 {id:"hoko-F-13", cat:"hoko", set:0, final:2, fo:13, ans:false, ja:"道路に面した駐車場に入るため歩道を横切るときは、歩行者がいなければ一時停止しなくてよい。", my:"လမ်းဘေးရှိ ကားပါကင်သို့ ဝင်ရန် လူသွားလမ်းကို ဖြတ်ကျော်သောအခါ လမ်းလျှောက်သူ မရှိလျှင် ခဏရပ်တန့်ရန် မလိုပါ။", exJa:"誤り。正しくは、歩行者がいてもいなくても、歩道や路側帯の直前で一時停止しなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လမ်းလျှောက်သူ ရှိသည်ဖြစ်စေ မရှိသည်ဖြစ်စေ လူသွားလမ်း သို့မဟုတ် လမ်းဘေးဇုန်(路側帯) ၏ ရှေ့တည့်တည့်တွင် ခဏရပ်တန့်ရမည်။", src:"法17条2項"},
 {id:"hoko-F-14", cat:"hoko", set:0, final:3, fo:14, ans:true, ja:"「学校、幼稚園、保育所等あり」の警戒標識は、黄色のひし形に黒の記号である。", my:"「ကျောင်း၊ မူကြို၊ ကလေးထိန်းကျောင်း စသည် ရှိသည်」 ဟူသော သတိပေးဆိုင်းဘုတ်သည် အဝါရောင် စိန်ပုံပေါ်တွင် အနက်ရောင် ပုံသင်္ကေတ ဖြစ်သည်။", exJa:"正しい。この標識を見たら、子どもの飛び出しに特に注意して走る。", exMy:"မှန်သည်။ ဤဆိုင်းဘုတ်ကို မြင်လျှင် ကလေးများ ရုတ်တရက် ပြေးထွက်လာနိုင်သည်ကို အထူးသတိထား၍ မောင်းရမည်။", src:"教則付表3（1）"},
 {id:"hoko-F-15", cat:"hoko", set:0, final:3, fo:15, ans:false, ja:"歩行者用信号の青の点滅は、歩行者が急いで横断を始めてよいという意味である。", my:"လမ်းလျှောက်သူသုံး မီးပွိုင့်၏ အစိမ်းရောင် မှိတ်တုတ်မှိတ်တုတ်သည် လမ်းလျှောက်သူများ အမြန် ဖြတ်ကူးစတင်နိုင်သည် ဟု ဆိုလိုသည်။", exJa:"誤り。正しくは、青の点滅では歩行者は横断を始めてはいけない。渡っている人は速やかに渡り終えるか引き返す。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ အစိမ်း မှိတ်တုတ်ဖြစ်လျှင် လမ်းလျှောက်သူများ ဖြတ်ကူးခြင်း မစရ။ ဖြတ်နေသူများသည် အမြန်ဖြတ်ကူးပြီးဆုံးရမည် သို့မဟုတ် ပြန်လှည့်ရမည်။", src:"令2条1項"},
 {id:"hoko-F-16", cat:"hoko", set:0, final:3, fo:16, ans:true, ja:"盲導犬を連れた人が歩いているときは、一時停止か徐行をして、安全に通れるようにしなければならない。", my:"မျက်မမြင်လမ်းပြခွေး(盲導犬) ခေါ်ထားသူ လမ်းလျှောက်နေသောအခါ ခဏရပ်တန့်ခြင်း သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်း ပြုလုပ်၍ ဘေးကင်းစွာ သွားနိုင်အောင် ပြုလုပ်ပေးရမည်။", exJa:"正しい。盲導犬を連れた人は目の不自由な人なので、一時停止か徐行をして守る。", exMy:"မှန်သည်။ မျက်မမြင်လမ်းပြခွေး ခေါ်ထားသူသည် မျက်စိမမြင်သူ ဖြစ်သဖြင့် ခဏရပ်တန့်ခြင်း သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်းဖြင့် ကာကွယ်ပေးရမည်။", src:"法71条2号"},
 {id:"hoko-F-17", cat:"hoko", set:0, final:3, fo:17, ans:false, ja:"普通自転車が歩道を通るとき、歩行者の通行を妨げそうな場合でも、徐行していれば一時停止の必要はない。", my:"သာမန်စက်ဘီးသည် လူသွားလမ်းပေါ်တွင် သွားစဉ် လမ်းလျှောက်သူကို အနှောင့်အယှက် ဖြစ်မည့်အခါတွင်ပင် ဖြည်းဖြည်းသွားနေလျှင် ခဏရပ်တန့်ရန် မလိုပါ။", exJa:"誤り。正しくは、歩道では車道寄りを徐行し、歩行者の通行を妨げるときは一時停止しなければならない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ လူသွားလမ်းပေါ်တွင် ကားလမ်းဘက်ခြမ်း၌ ဖြည်းဖြည်းသွားရပြီး လမ်းလျှောက်သူကို အနှောင့်အယှက်ဖြစ်မည်ဆိုလျှင် ခဏရပ်တန့်ရမည်။", src:"法63条の4第2項"},
 {id:"hoko-F-18", cat:"hoko", set:0, final:3, fo:18, ans:true, ja:"高齢者マークを付けた普通自動車に、危険を避けるためやむを得ない場合のほかは、幅寄せや割込みをしてはいけない。", my:"သက်ကြီးယာဉ်မောင်း အမှတ်တံဆိပ်(高齢者マーク) တပ်ထားသော ကားကို အန္တရာယ်ရှောင်ရန် မလွှဲမရှောင်သာသည့်အခါမှလွဲ၍ ဘေးမှ ကပ်မောင်းခြင်း သို့မဟုတ် ရှေ့သို့ ဖြတ်ဝင်ခြင်း မပြုရ။", exJa:"正しい。70歳以上の人が高齢者マークを付けて運転する車は、幅寄せ・割込みから守られる。", exMy:"မှန်သည်။ အသက် 70 နှစ်နှင့်အထက်သူ သက်ကြီးအမှတ်တံဆိပ် တပ်၍ မောင်းသော ကားကို ဘေးမှကပ်မောင်းခြင်း၊ ဖြတ်ဝင်ခြင်းမှ ကာကွယ်ရမည်။", src:"法71条5号の4"},
