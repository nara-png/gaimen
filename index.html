 {id:"hoko-F-19", cat:"hoko", set:0, final:3, fo:19, ans:false, ja:"付き添いのいない児童や幼児が歩いているときは、警音器を鳴らして知らせれば、一時停止や徐行をしなくてもよい。", my:"အုပ်ထိန်းသူ မပါဘဲ ကလေး(児童) သို့မဟုတ် ကလေးငယ်(幼児) လမ်းလျှောက်နေသောအခါ ဟွန်းတီး၍ အသိပေးလျှင် ခဏရပ်တန့်ခြင်း သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်း မလုပ်ဘဲ နေနိုင်သည်။", exJa:"誤り。正しくは、一時停止か徐行をして安全に通れるようにする。警音器はやむを得ないとき以外は鳴らさない。", exMy:"မှားသည်။ မှန်ကန်သည်မှာ ခဏရပ်တန့်ခြင်း သို့မဟုတ် ဖြည်းဖြည်းမောင်းခြင်းဖြင့် ဘေးကင်းစွာ သွားနိုင်အောင် ပြုလုပ်ရမည်။ ဟွန်းကို မလွှဲမရှောင်သာသည့်အခါမှလွဲ၍ မတီးရ။", src:"法71条2号、法54条"}
);
QUESTIONS.push(
 {id:"kousa-1-01", cat:"kousa", set:1, final:0, fo:0, ans:true, ja:"交通整理の行われていない道幅が同じような交差点では、左方から来る車の進行を妨げてはならない。", my:"မီးပွိုင့် သို့မဟုတ် ရဲက ယာဉ်ထိန်းပေးခြင်း မရှိသော၊ လမ်းအကျယ် အတူတူလောက်ရှိသော လမ်းဆုံတွင် ဘယ်ဘက်မှ လာသောယာဉ်၏ သွားလာမှုကို မနှောင့်ယှက်ရ။", exJa:"正しい。交通整理のない同じくらいの道幅の交差点では、左方から来る車が優先（左方優先）で、その進行を妨げてはならない。", exMy:"မှန်ပါသည်။ ယာဉ်ထိန်းမှုမရှိသော လမ်းအကျယ်တူ လမ်းဆုံတွင် ဘယ်ဘက်မှလာသောယာဉ်က ဦးစားပေး (ဘယ်ဘက်ဦးစားပေး) ဖြစ်ပြီး ၎င်း၏ သွားလာမှုကို မနှောင့်ယှက်ရပါ။", src:"法36条1項"},
 {id:"kousa-1-02", cat:"kousa", set:1, final:0, fo:0, ans:false, ja:"右折するときは、自分の車が先に交差点に入っていれば、対向の直進車より先に右折してよい。", my:"ညာကွေ့(右折) မည့်အခါ မိမိကားက လမ်းဆုံ(交差点) ထဲသို့ အရင်ဝင်ထားလျှင် ဆန့်ကျင်ဘက်မှ တည့်တည့်လာသောကားထက် အရင် ညာကွေ့နိုင်သည်။", exJa:"誤り。正しくは、右折車は先に交差点に入っていても、直進や左折をする車の進行を妨げてはならない。", exMy:"မှားပါသည်။ ညာကွေ့မည့်ကားသည် လမ်းဆုံထဲ အရင်ဝင်ထားသော်လည်း တည့်တည့်သွားမည့်ကား သို့မဟုတ် ဘယ်ကွေ့မည့်ကား၏ သွားလာမှုကို မနှောင့်ယှက်ရပါ။", src:"法37条"},
 {id:"kousa-1-03", cat:"kousa", set:1, final:0, fo:0, ans:true, ja:"左折するときは、あらかじめできるだけ道路の左端に寄り、交差点の側端に沿って徐行しなければならない。", my:"ဘယ်ကွေ့(左折) မည့်အခါ ကြိုတင်၍ လမ်း၏ ဘယ်ဘက်အစွန်သို့ တတ်နိုင်သမျှ ကပ်ပြီး လမ်းဆုံ၏ ဘေးအစွန်တလျှောက် ဖြည်းဖြည်းမောင်းခြင်း(徐行) ဖြင့် သွားရမည်။", exJa:"正しい。左折は、あらかじめ道路の左端に寄り、交差点の側端に沿って徐行して曲がる。", exMy:"မှန်ပါသည်။ ဘယ်ကွေ့ရာတွင် ကြိုတင်၍ လမ်းဘယ်ဘက်အစွန်သို့ ကပ်ပြီး လမ်းဆုံ၏ ဘေးအစွန်တလျှောက် ဖြည်းဖြည်းမောင်း၍ ကွေ့ရပါသည်။", src:"法34条1項"},
 {id:"kousa-1-04", cat:"kousa", set:1, final:0, fo:0, ans:false, ja:"「一時停止」の標識がある交差点では、停止線の手前で徐行すれば、止まらなくてもよい。", my:"「一時停止」ယာဉ်စည်းကမ်းဆိုင်းဘုတ်(標識) ရှိသော လမ်းဆုံတွင် ရပ်တန့်မျဉ်း(停止線) ရှေ့၌ ဖြည်းဖြည်းမောင်းလျှင် မရပ်ဘဲ သွားနိုင်သည်။", exJa:"誤り。正しくは、停止線の直前（停止線がなければ交差点の直前）で必ず一時停止しなければならない。徐行では足りない。", exMy:"မှားပါသည်။ ရပ်တန့်မျဉ်း၏ ရှေ့တည့်တည့် (ရပ်တန့်မျဉ်းမရှိလျှင် လမ်းဆုံ၏ ရှေ့တည့်တည့်) တွင် မဖြစ်မနေ ခဏရပ်တန့်ခြင်း(一時停止) ပြုရပါမည်။ ဖြည်းဖြည်းမောင်းရုံဖြင့် မလုံလောက်ပါ။", src:"法43条"},
 {id:"kousa-1-05", cat:"kousa", set:1, final:0, fo:0, ans:true, ja:"前方が混雑していて交差点内で止まってしまうおそれがあるときは、信号が青でも交差点に入ってはならない。", my:"ရှေ့တွင် ယာဉ်ကြပ်နေ၍ လမ်းဆုံထဲ၌ ရပ်သွားနိုင်သည့်အခါ မီးပွိုင့်(信号) အစိမ်းဖြစ်နေသော်လည်း လမ်းဆုံထဲ မဝင်ရ။", exJa:"正しい。交差点内で止まって交差する道路の車の妨げになるおそれがあるときは、青信号でも交差点に入ってはならない。", exMy:"မှန်ပါသည်။ လမ်းဆုံထဲ ရပ်သွားပြီး ဖြတ်သွားသောလမ်းမှ ယာဉ်များကို နှောင့်ယှက်နိုင်လျှင် မီးစိမ်းဖြစ်နေသော်လည်း လမ်းဆုံထဲ မဝင်ရပါ။", src:"法50条1項"},
 {id:"kousa-1-06", cat:"kousa", set:1, final:0, fo:0, ans:false, ja:"環状交差点では、車は左回り（時計の針と反対の向き）に通行する。", my:"ဝိုင်းပတ်လမ်းဆုံ(環状交差点) တွင် ယာဉ်များသည် ဘယ်ဘက်လှည့် (နာရီလက်တံနှင့် ပြောင်းပြန်ဘက်) သို့ ပတ်၍ သွားရသည်။", exJa:"誤り。正しくは、環状交差点では右回り（時計の針と同じ向き）に通行する。", exMy:"မှားပါသည်။ ဝိုင်းပတ်လမ်းဆုံတွင် ညာဘက်လှည့် (နာရီလက်တံနှင့် တူညီသောဘက်) သို့ ပတ်၍ သွားရပါသည်။", src:"教則5章7節・付表3"},
 {id:"kousa-1-07", cat:"kousa", set:1, final:0, fo:0, ans:true, ja:"踏切を通過するときは、その直前（停止線があればその直前）で一時停止し、安全を確かめなければならない。", my:"ရထားလမ်းကူး(踏切) ကို ဖြတ်ကျော်မည့်အခါ ၎င်း၏ ရှေ့တည့်တည့် (ရပ်တန့်မျဉ်းရှိလျှင် ရပ်တန့်မျဉ်း၏ ရှေ့တည့်တည့်) တွင် ခဏရပ်တန့်ပြီး ဘေးကင်းကြောင်း စစ်ဆေးရမည်။", exJa:"正しい。踏切の直前（停止線があればその直前）で一時停止し、安全を確認してから進む。", exMy:"မှန်ပါသည်။ ရထားလမ်းကူး၏ ရှေ့တည့်တည့် (ရပ်တန့်မျဉ်းရှိလျှင် ၎င်း၏ ရှေ့) တွင် ခဏရပ်တန့်ပြီး ဘေးကင်းကြောင်း သေချာမှ ဆက်သွားရပါသည်။", src:"法33条1項"},
 {id:"kousa-1-08", cat:"kousa", set:1, final:0, fo:0, ans:false, ja:"踏切の警報機が鳴っていても、遮断機が降りていなければ、踏切に入ってよい。", my:"ရထားလမ်းကူး၏ သတိပေးခေါင်းလောင်း မြည်နေသော်လည်း ဘားတန်း(遮断機) မကျသေးလျှင် ရထားလမ်းကူးထဲ ဝင်နိုင်သည်။", exJa:"誤り。正しくは、警報機が鳴っている間や、遮断機が降り始めている・降りている間は踏切に入ってはならない。", exMy:"မှားပါသည်။ သတိပေးခေါင်းလောင်း မြည်နေစဉ်၊ ဘားတန်း ကျစပြုနေစဉ် သို့မဟုတ် ကျနေစဉ်တွင် ရထားလမ်းကူးထဲ မဝင်ရပါ။", src:"法33条2項"},
 {id:"kousa-1-09", cat:"kousa", set:1, final:0, fo:0, ans:true, ja:"踏切内では、エンストを防ぐため、変速しないで、発進したときの低速ギアのまま一気に通過するのがよい。", my:"ရထားလမ်းကူးထဲတွင် အင်ဂျင်မသေစေရန် ဂီယာမပြောင်းဘဲ စထွက်ချိန်က အနိမ့်ဂီယာအတိုင်း တစ်ခါတည်း ဖြတ်ကျော်သင့်သည်။", exJa:"正しい。踏切内ではエンストを防ぐため、変速せず低速ギアのまま一気に通過する。", exMy:"မှန်ပါသည်။ ရထားလမ်းကူးထဲတွင် အင်ဂျင်မသေစေရန် ဂီယာမပြောင်းဘဲ အနိမ့်ဂီယာဖြင့် တစ်ခါတည်း ဖြတ်ကျော်ရပါသည်။", src:"教則6章1節"},
 {id:"kousa-1-10", cat:"kousa", set:1, final:0, fo:0, ans:false, ja:"信号機のある踏切では、信号が青を示していても、必ず踏切の直前で一時停止しなければならない。", my:"မီးပွိုင့်ရှိသော ရထားလမ်းကူးတွင် မီးစိမ်းပြနေသော်လည်း ရထားလမ်းကူး၏ ရှေ့တည့်တည့်တွင် မဖြစ်မနေ ခဏရပ်တန့်ရမည်။", exJa:"誤り。正しくは、信号機のある踏切では、信号に従えば一時停止しないで通過できる。", exMy:"မှားပါသည်။ မီးပွိုင့်ရှိသော ရထားလမ်းကူးတွင် မီးပွိုင့်အတိုင်း လိုက်နာလျှင် ခဏမရပ်ဘဲ ဖြတ်ကျော်နိုင်ပါသည်။", src:"法33条1項ただし書"},

 {id:"kousa-2-01", cat:"kousa", set:2, final:0, fo:0, ans:false, ja:"交通整理の行われていない交差点で、交差する道路が優先道路のときは、速度を落とさずにそのまま進んでよい。", my:"ယာဉ်ထိန်းမှု မရှိသော လမ်းဆုံတွင် ဖြတ်သွားသောလမ်းက ဦးစားပေးလမ်း(優先道路) ဖြစ်လျှင် အရှိန်မလျှော့ဘဲ ဆက်သွားနိုင်သည်။", exJa:"誤り。正しくは、交差する道路が優先道路のときは、徐行して、優先道路を通る車の進行を妨げてはならない。", exMy:"မှားပါသည်။ ဖြတ်သွားသောလမ်းက ဦးစားပေးလမ်းဖြစ်လျှင် ဖြည်းဖြည်းမောင်းပြီး ဦးစားပေးလမ်းပေါ်မှ ယာဉ်များ၏ သွားလာမှုကို မနှောင့်ယှက်ရပါ။", src:"法36条2項・3項"},
 {id:"kousa-2-02", cat:"kousa", set:2, final:0, fo:0, ans:true, ja:"右折するときは、あらかじめできるだけ道路の中央に寄り、交差点の中心のすぐ内側を徐行しなければならない。", my:"ညာကွေ့မည့်အခါ ကြိုတင်၍ လမ်းအလယ်သို့ တတ်နိုင်သမျှ ကပ်ပြီး လမ်းဆုံ၏ အလယ်ဗဟို၏ အတွင်းဘက် အနီးကပ်ကို ဖြည်းဖြည်းမောင်း၍ သွားရမည်။", exJa:"正しい。右折は、あらかじめ道路の中央に寄り、交差点の中心のすぐ内側を徐行して曲がる。", exMy:"မှန်ပါသည်။ ညာကွေ့ရာတွင် ကြိုတင်၍ လမ်းအလယ်သို့ ကပ်ပြီး လမ်းဆုံဗဟို၏ အတွင်းဘက် အနီးကပ်ကို ဖြည်းဖြည်းမောင်း၍ ကွေ့ရပါသည်။", src:"法34条2項"},
 {id:"kousa-2-03", cat:"kousa", set:2, final:0, fo:0, ans:false, ja:"一方通行の道路で右折するときも、あらかじめ道路の中央に寄らなければならない。", my:"တစ်လမ်းသွားလမ်းတွင် ညာကွေ့မည့်အခါလည်း ကြိုတင်၍ လမ်းအလယ်သို့ ကပ်ရမည်။", exJa:"誤り。正しくは、一方通行の道路で右折するときは、あらかじめ道路の右端に寄り、交差点の中心の内側を徐行する。", exMy:"မှားပါသည်။ တစ်လမ်းသွားလမ်းတွင် ညာကွေ့မည့်အခါ ကြိုတင်၍ လမ်း၏ ညာဘက်အစွန်သို့ ကပ်ပြီး လမ်းဆုံဗဟို၏ အတွင်းဘက်ကို ဖြည်းဖြည်းမောင်းရပါသည်။", src:"法34条4項"},
 {id:"kousa-2-04", cat:"kousa", set:2, final:0, fo:0, ans:true, ja:"左折するときは、左後方から来る二輪車や自転車を巻き込まないように注意しなければならない。", my:"ဘယ်ကွေ့မည့်အခါ ဘယ်ဘက်နောက်မှလာသော ဆိုင်ကယ် သို့မဟုတ် စက်ဘီး(自転車) ကို ကားဘေးတွင် ညှပ်မိ၍ မတိုက်မိစေရန် သတိထားရမည်။", exJa:"正しい。右左折時は内輪差が生じるため、左側を通る二輪車や自転車などを巻き込まないよう注意する。", exMy:"မှန်ပါသည်။ ကွေ့သည့်အခါ နောက်ဘီးက ရှေ့ဘီးထက် အတွင်းဘက်မှ ဖြတ်သွားသောကြောင့် ဘယ်ဘက်မှ သွားနေသော ဆိုင်ကယ်၊ စက်ဘီး စသည်တို့ကို ညှပ်မိ၍ မတိုက်မိစေရန် သတိထားရပါသည်။", src:"教則5章7節"},
 {id:"kousa-2-05", cat:"kousa", set:2, final:0, fo:0, ans:true, ja:"環状交差点に入ろうとするときは、徐行するとともに、環状交差点内を通行する車の進行を妨げてはならない。", my:"ဝိုင်းပတ်လမ်းဆုံ(環状交差点) ထဲသို့ ဝင်မည့်အခါ ဖြည်းဖြည်းမောင်းရမည်ဖြစ်ပြီး ဝိုင်းပတ်လမ်းဆုံထဲတွင် သွားနေသောယာဉ်၏ သွားလာမှုကို မနှောင့်ယှက်ရ။", exJa:"正しい。環状交差点に入るときは徐行し、中を通行している車が優先なので、その進行を妨げてはならない。", exMy:"မှန်ပါသည်။ ဝိုင်းပတ်လမ်းဆုံထဲ ဝင်သည့်အခါ ဖြည်းဖြည်းမောင်းရပြီး အထဲတွင် သွားနေသောယာဉ်က ဦးစားပေးဖြစ်သဖြင့် ၎င်း၏ သွားလာမှုကို မနှောင့်ယှက်ရပါ။", src:"教則5章7節"},
 {id:"kousa-2-06", cat:"kousa", set:2, final:0, fo:0, ans:false, ja:"一般原動機付自転車は、信号機のある交差点であれば、どこでも二段階右折をしなければならない。", my:"မော်တာဆိုင်ကယ်ငယ်(原付) သည် မီးပွိုင့်ရှိသော လမ်းဆုံ ဖြစ်လျှင် မည်သည့်နေရာတွင်မဆို အဆင့်နှစ်ဆင့်ဖြင့် ညာကွေ့ခြင်း(二段階右折) ကို ပြုလုပ်ရမည်။", exJa:"誤り。正しくは、二段階右折が必要なのは、信号機などで交通整理の行われている交差点で、片側に車両通行帯が3以上ある道路（「小回り」の標識がある場合を除く）か、二段階右折の標識がある場合である。", exMy:"မှားပါသည်။ အဆင့်နှစ်ဆင့် ညာကွေ့ရန် လိုအပ်သည်မှာ မီးပွိုင့်စသည်ရှိသော လမ်းဆုံတွင် တစ်ဖက်၌ ယာဉ်သွားလမ်းကြော ၃ ခုနှင့်အထက်ရှိသောလမ်း (「小回り」ဆိုင်းဘုတ် ရှိလျှင် မပါ) သို့မဟုတ် အဆင့်နှစ်ဆင့်ညာကွေ့ ဆိုင်းဘုတ်ရှိသော နေရာတွင်သာ ဖြစ်ပါသည်။", src:"法34条5項・教則8章"},
 {id:"kousa-2-07", cat:"kousa", set:2, final:0, fo:0, ans:true, ja:"前の車に続いて踏切を通過するときでも、一時停止をして安全を確かめなければならない。", my:"ရှေ့ကားနောက်မှ ဆက်တိုက်လိုက်၍ ရထားလမ်းကူးကို ဖြတ်ကျော်မည့်အခါတွင်လည်း ခဏရပ်တန့်ပြီး ဘေးကင်းကြောင်း စစ်ဆေးရမည်။", exJa:"正しい。前の車に続いて通過するときでも、踏切の直前で一時停止し、安全を確かめなければならない。", exMy:"မှန်ပါသည်။ ရှေ့ကားနောက်မှ လိုက်၍ ဖြတ်ကျော်သည့်အခါတွင်လည်း ရထားလမ်းကူး၏ ရှေ့တွင် ခဏရပ်တန့်ပြီး ဘေးကင်းကြောင်း စစ်ဆေးရပါမည်။", src:"法33条1項・教則6章1節"},
 {id:"kousa-2-08", cat:"kousa", set:2, final:0, fo:0, ans:false, ja:"踏切の向こう側が混雑していて踏切内で止まるおそれがあるときでも、遮断機が上がっていれば踏切に入ってよい。", my:"ရထားလမ်းကူး၏ တစ်ဖက်ခြမ်းတွင် ယာဉ်ကြပ်နေ၍ ရထားလမ်းကူးထဲ၌ ရပ်သွားနိုင်သော်လည်း ဘားတန်း မြှင့်ထားလျှင် ဝင်နိုင်သည်။", exJa:"誤り。正しくは、向こう側が混雑していて踏切内で動けなくなるおそれがあるときは、踏切に入ってはならない。", exMy:"မှားပါသည်။ တစ်ဖက်ခြမ်းတွင် ယာဉ်ကြပ်နေ၍ ရထားလမ်းကူးထဲ၌ ရွှေ့မရဖြစ်နိုင်လျှင် ရထားလမ်းကူးထဲ မဝင်ရပါ။", src:"法50条2項・教則6章1節"},
 {id:"kousa-2-09", cat:"kousa", set:2, final:0, fo:0, ans:true, ja:"踏切内で車が動かなくなったときは、踏切支障報知装置（非常ボタン）を押して列車に知らせる。", my:"ရထားလမ်းကူးထဲတွင် ကား ရွှေ့မရဖြစ်သွားလျှင် အရေးပေါ်ခလုတ်(踏切支障報知装置) ကို နှိပ်၍ ရထားကို အသိပေးရသည်။", exJa:"正しい。警報機の柱などにある踏切支障報知装置（非常ボタン）を押して、一刻も早く列車に知らせる。", exMy:"မှန်ပါသည်။ သတိပေးစက်တိုင် စသည်တွင်ရှိသော အရေးပေါ်ခလုတ်ကို နှိပ်၍ ရထားကို အမြန်ဆုံး အသိပေးရပါသည်။", src:"教則6章1節"},
 {id:"kousa-2-10", cat:"kousa", set:2, final:0, fo:0, ans:false, ja:"踏切を通過するときは、落輪しないように、できるだけ左端に寄って通るのがよい。", my:"ရထားလမ်းကူးကို ဖြတ်ကျော်ရာတွင် ဘီးမကျစေရန် တတ်နိုင်သမျှ ဘယ်ဘက်အစွန်သို့ ကပ်၍ သွားသင့်သည်။", exJa:"誤り。正しくは、踏切では落輪しないように、歩行者や対向車に注意しながら、やや中央寄りを通る。", exMy:"မှားပါသည်။ ရထားလမ်းကူးတွင် ဘီးမကျစေရန် လမ်းလျှောက်သူနှင့် ဆန့်ကျင်ဘက်ကားကို သတိထားရင်း အလယ်ဘက်သို့ အနည်းငယ်ကပ်၍ သွားရပါသည်။", src:"教則6章1節"},

 {id:"kousa-3-01", cat:"kousa", set:3, final:0, fo:0, ans:true, ja:"交通整理の行われていない交差点で、交差する道路の幅が明らかに広いときは、徐行して、その道路を通る車の進行を妨げてはならない。", my:"ယာဉ်ထိန်းမှု မရှိသော လမ်းဆုံတွင် ဖြတ်သွားသောလမ်းက သိသိသာသာ ပိုကျယ်လျှင် ဖြည်းဖြည်းမောင်းပြီး ထိုလမ်းပေါ်မှ ယာဉ်၏ သွားလာမှုကို မနှောင့်ယှက်ရ။", exJa:"正しい。交差する道路が明らかに広いときは、徐行して、その道路を通行する車の進行を妨げてはならない。", exMy:"မှန်ပါသည်။ ဖြတ်သွားသောလမ်းက သိသိသာသာ ပိုကျယ်လျှင် ဖြည်းဖြည်းမောင်းပြီး ထိုလမ်းပေါ်မှ ယာဉ်များ၏ သွားလာမှုကို မနှောင့်ယှက်ရပါ။", src:"法36条2項・3項"},
 {id:"kousa-3-02", cat:"kousa", set:3, final:0, fo:0, ans:true, ja:"交通整理の行われていない左右の見通しのきかない交差点では、優先道路を通行している場合を除き、徐行しなければならない。", my:"ယာဉ်ထိန်းမှု မရှိဘဲ ဘယ်ညာ မမြင်ရသော လမ်းဆုံတွင် ဦးစားပေးလမ်းပေါ်တွင် သွားနေသည့်အခါမှလွဲ၍ ဖြည်းဖြည်းမောင်းရမည်။", exJa:"正しい。交通整理のない左右の見通しのきかない交差点では徐行する。ただし優先道路を通行している場合は除く。", exMy:"မှန်ပါသည်။ ယာဉ်ထိန်းမှုမရှိဘဲ ဘယ်ညာ မမြင်ရသော လမ်းဆုံတွင် ဖြည်းဖြည်းမောင်းရပါမည်။ သို့သော် ဦးစားပေးလမ်းပေါ်တွင် သွားနေလျှင် ခြွင်းချက်ဖြစ်ပါသည်။", src:"法42条1号"},
 {id:"kousa-3-03", cat:"kousa", set:3, final:0, fo:0, ans:false, ja:"交差点とその手前から30m以内の場所では、優先道路を通行している場合でも追越しをしてはならない。", my:"လမ်းဆုံနှင့် ၎င်းသို့ မရောက်မီ 30 မီတာအတွင်း နေရာတွင် ဦးစားပေးလမ်းပေါ်တွင် သွားနေသည့်အခါ၌ပင် ကျော်တက်ခြင်း(追越し) မပြုရ။", exJa:"誤り。正しくは、交差点とその手前30m以内は追越し禁止だが、優先道路を通行している場合は除かれる。", exMy:"မှားပါသည်။ လမ်းဆုံနှင့် ၎င်းသို့ မရောက်မီ 30 မီတာအတွင်းတွင် ကျော်တက်ခြင်းကို တားမြစ်ထားသော်လည်း ဦးစားပေးလမ်းပေါ်တွင် သွားနေသည့်အခါ ခြွင်းချက်ဖြစ်ပါသည်။", src:"法30条3号"},
 {id:"kousa-3-04", cat:"kousa", set:3, final:0, fo:0, ans:false, ja:"交差点で右左折するときの合図は、交差点の手前の側端から10m手前の地点で出す。", my:"လမ်းဆုံတွင် ညာကွေ့ ဘယ်ကွေ့ပြုမည့်အခါ အချက်ပြခြင်း(合図) ကို လမ်းဆုံ၏ ရှေ့ဘေးအစွန်မှ 10 မီတာ အလိုတွင် ပြရသည်။", exJa:"誤り。正しくは、右左折の合図は、交差点の手前の側端から30m手前の地点に達したときに出す。", exMy:"မှားပါသည်။ ညာကွေ့ ဘယ်ကွေ့ အချက်ပြခြင်းကို လမ်းဆုံ၏ ရှေ့ဘေးအစွန်မှ 30 မီတာ အလိုသို့ ရောက်သည့်အခါ ပြရပါသည်။", src:"令21条"},
 {id:"kousa-3-05", cat:"kousa", set:3, final:0, fo:0, ans:true, ja:"交差点で進行方向の信号が赤色の点滅を示しているときは、停止位置で一時停止しなければならない。", my:"လမ်းဆုံတွင် သွားမည့်ဘက်၏ မီးပွိုင့်က အနီရောင် မှိတ်တုတ်မှိတ်တုတ် ပြနေလျှင် ရပ်ရမည့်နေရာတွင် ခဏရပ်တန့်ရမည်။", exJa:"正しい。赤の点滅信号では、停止位置で一時停止し、安全を確かめてから進む。", exMy:"မှန်ပါသည်။ အနီရောင် မှိတ်တုတ်မီးတွင် ရပ်ရမည့်နေရာ၌ ခဏရပ်တန့်ပြီး ဘေးကင်းကြောင်း သေချာမှ ဆက်သွားရပါသည်။", src:"令2条・教則付表1"},
 {id:"kousa-3-06", cat:"kousa", set:3, final:0, fo:0, ans:true, ja:"交差点とその側端から5m以内の場所では、駐車も停車もしてはならない。", my:"လမ်းဆုံနှင့် ၎င်း၏ ဘေးအစွန်မှ 5 မီတာအတွင်း နေရာတွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း(駐停車) မပြုရ။", exJa:"正しい。交差点とその側端から5m以内は駐停車禁止である（赤信号など危険防止の一時停止は別）。", exMy:"မှန်ပါသည်။ လမ်းဆုံနှင့် ၎င်း၏ ဘေးအစွန်မှ 5 မီတာအတွင်းတွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားပါသည် (မီးနီ စသည့် အန္တရာယ်ကာကွယ်ရန် ခဏရပ်ခြင်းမှာ ခြွင်းချက်)။", src:"法44条"},
 {id:"kousa-3-07", cat:"kousa", set:3, final:0, fo:0, ans:false, ja:"二段階右折をしなければならない交差点でも、一般原動機付自転車は右向きの青色の矢印信号に従って右折してよい。", my:"အဆင့်နှစ်ဆင့် ညာကွေ့ရမည့် လမ်းဆုံတွင်ပင် မော်တာဆိုင်ကယ်ငယ်(原付) သည် ညာဘက်ညွှန်သော အစိမ်းရောင်မြှားမီးအတိုင်း ညာကွေ့နိုင်သည်။", exJa:"誤り。正しくは、二段階右折をする原付は、右向きの青色の矢印信号では右折できない。", exMy:"မှားပါသည်။ အဆင့်နှစ်ဆင့် ညာကွေ့ရမည့် မော်တာဆိုင်ကယ်ငယ်သည် ညာဘက်ညွှန် အစိမ်းရောင်မြှားမီးဖြင့် ညာကွေ့၍ မရပါ။", src:"令2条・教則付表1"},
 {id:"kousa-3-08", cat:"kousa", set:3, final:0, fo:0, ans:true, ja:"踏切とその端から前後10m以内の場所では、駐車も停車もしてはならない。", my:"ရထားလမ်းကူးနှင့် ၎င်း၏ အစွန်မှ ရှေ့နောက် 10 မီတာအတွင်း နေရာတွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း မပြုရ။", exJa:"正しい。踏切の上と、その端から前後10m以内は駐停車禁止である。", exMy:"မှန်ပါသည်။ ရထားလမ်းကူးပေါ်နှင့် ၎င်း၏ အစွန်မှ ရှေ့နောက် 10 မီတာအတွင်းတွင် ယာဉ်ရပ်နားခြင်းနှင့် ခဏရပ်ခြင်း တားမြစ်ထားပါသည်။", src:"法44条"},
 {id:"kousa-3-09", cat:"kousa", set:3, final:0, fo:0, ans:false, ja:"踏切の手前30m以内の場所でも、見通しがよければ追越しをしてよい。", my:"ရထားလမ်းကူးသို့ မရောက်မီ 30 မီတာအတွင်း နေရာတွင်ပင် ရှေ့ကို ကောင်းကောင်းမြင်ရလျှင် ကျော်တက်နိုင်သည်။", exJa:"誤り。正しくは、踏切とその手前30m以内は、見通しにかかわらず追越し禁止である。", exMy:"မှားပါသည်။ ရထားလမ်းကူးနှင့် ၎င်းသို့ မရောက်မီ 30 မီတာအတွင်းတွင် မြင်ကွင်းကောင်းသည်ဖြစ်စေ မကောင်းသည်ဖြစ်စေ ကျော်တက်ခြင်း တားမြစ်ထားပါသည်။", src:"法30条3号"},
 {id:"kousa-3-10", cat:"kousa", set:3, final:0, fo:0, ans:false, ja:"踏切で一方からの列車が通過したら、反対方向を確かめなくても、すぐに踏切に入ってよい。", my:"ရထားလမ်းကူးတွင် တစ်ဖက်မှ ရထား ဖြတ်သွားပြီးလျှင် ဆန့်ကျင်ဘက်ကို မစစ်ဆေးဘဲ ချက်ချင်း ရထားလမ်းကူးထဲ ဝင်နိုင်သည်။", exJa:"誤り。正しくは、一方の列車が通過した直後に反対方向から別の列車が来ることがあるので、左右の安全を確かめてから進む。", exMy:"မှားပါသည်။ တစ်ဖက်မှ ရထားဖြတ်သွားပြီးချိန်တွင် ဆန့်ကျင်ဘက်မှ နောက်ရထားတစ်စင်း လာနိုင်သဖြင့် ဘယ်ညာ ဘေးကင်းကြောင်း စစ်ဆေးပြီးမှ ဆက်သွားရပါသည်။", src:"法33条1項・教則6章1節"},

 {id:"kousa-F-01", cat:"kousa", set:0, final:1, fo:1, ans:true, ja:"交差点やその付近で緊急自動車が近づいてきたときは、交差点を避け、道路の左側に寄って一時停止しなければならない。", my:"လမ်းဆုံ သို့မဟုတ် ၎င်း၏ အနီးတွင် အရေးပေါ်ယာဉ်(緊急自動車) နီးကပ်လာလျှင် လမ်းဆုံကို ရှောင်ပြီး လမ်း၏ ဘယ်ဘက်သို့ ကပ်၍ ခဏရပ်တန့်ရမည်။", exJa:"正しい。交差点やその付近では、交差点を避けて道路の左側に寄り一時停止する。一方通行で左に寄るとかえって妨げになるときは右に寄る。", exMy:"မှန်ပါသည်။ လမ်းဆုံ သို့မဟုတ် ၎င်း၏အနီးတွင် လမ်းဆုံကို ရှောင်ပြီး လမ်းဘယ်ဘက်သို့ ကပ်၍ ခဏရပ်တန့်ရပါသည်။ တစ်လမ်းသွားလမ်းတွင် ဘယ်ကပ်ခြင်းက နှောင့်ယှက်ရာရောက်လျှင် ညာဘက်သို့ ကပ်ရပါသည်။", src:"法40条1項"},
 {id:"kousa-F-02", cat:"kousa", set:0, final:1, fo:2, ans:false, ja:"「一時停止」の標識のある交差点で一時停止したあとは、交差する道路の車より先に進んでよい。", my:"「一時停止」ဆိုင်းဘုတ်ရှိသော လမ်းဆုံတွင် ခဏရပ်တန့်ပြီးနောက် ဖြတ်သွားသောလမ်းမှ ယာဉ်ထက် အရင် ဆက်သွားနိုင်သည်။", exJa:"誤り。正しくは、一時停止したあとも、交差する道路を通行する車の進行を妨げてはならない。", exMy:"မှားပါသည်။ ခဏရပ်တန့်ပြီးနောက်တွင်လည်း ဖြတ်သွားသောလမ်းပေါ်မှ ယာဉ်များ၏ သွားလာမှုကို မနှောင့်ယှက်ရပါ။", src:"法43条"},
 {id:"kousa-F-03", cat:"kousa", set:0, final:1, fo:3, ans:true, ja:"交差点で既に右折している車は、前方（対面）の信号が赤に変わっても、そのまま進むことができる。", my:"လမ်းဆုံထဲတွင် ညာကွေ့နေပြီးဖြစ်သော ကားသည် မိမိ၏ ရှေ့ရှိ (မျက်နှာချင်းဆိုင်) မီးပွိုင့် အနီဖြစ်သွားသော်လည်း ဆက်သွားနိုင်သည်။", exJa:"正しい。既に右折している車はそのまま進めるが、青信号で進んで来る車の進行を妨げてはならない。", exMy:"မှန်ပါသည်။ ညာကွေ့နေပြီးဖြစ်သောကားသည် ဆက်သွားနိုင်သော်လည်း မီးစိမ်းဖြင့် လာနေသော ယာဉ်များ၏ သွားလာမှုကို မနှောင့်ယှက်ရပါ။", src:"令2条・教則付表1"},
 {id:"kousa-F-04", cat:"kousa", set:0, final:1, fo:4, ans:false, ja:"交差点で進行方向の信号が黄色の点滅を示しているときは、必ず一時停止しなければならない。", my:"လမ်းဆုံတွင် သွားမည့်ဘက်၏ မီးပွိုင့်က အဝါရောင် မှိတ်တုတ်မှိတ်တုတ် ပြနေလျှင် မဖြစ်မနေ ခဏရပ်တန့်ရမည်။", exJa:"誤り。正しくは、黄色の点滅信号では、他の交通に注意して進むことができる。一時停止が必要なのは赤の点滅である。", exMy:"မှားပါသည်။ အဝါရောင် မှိတ်တုတ်မီးတွင် အခြားယာဉ်များကို သတိထား၍ ဆက်သွားနိုင်ပါသည်။ ခဏရပ်တန့်ရမည်မှာ အနီရောင် မှိတ်တုတ်မီး ဖြစ်ပါသည်။", src:"令2条・教則付表1"},
 {id:"kousa-F-05", cat:"kousa", set:0, final:1, fo:5, ans:true, ja:"交通整理の行われていない道幅が同じような交差点では、交差する道路を通る路面電車の進行を妨げてはならない。", my:"ယာဉ်ထိန်းမှု မရှိသော လမ်းအကျယ် အတူတူလောက်ရှိသော လမ်းဆုံတွင် ဖြတ်သွားသောလမ်းပေါ်မှ ဓာတ်ရထား(路面電車) ၏ သွားလာမှုကို မနှောင့်ယှက်ရ။", exJa:"正しい。道幅が同じような交差点では、左方から来る車や、交差する道路を通る路面電車の進行を妨げてはならない。", exMy:"မှန်ပါသည်။ လမ်းအကျယ်တူ လမ်းဆုံတွင် ဘယ်ဘက်မှလာသော ယာဉ်နှင့် ဖြတ်သွားသောလမ်းပေါ်မှ ဓာတ်ရထား၏ သွားလာမှုကို မနှောင့်ယှက်ရပါ။", src:"法36条1項"},
 {id:"kousa-F-06", cat:"kousa", set:0, final:1, fo:6, ans:false, ja:"原付で二段階右折をするとき、交差点の向こう側で右に向きを変えたら、前方の信号が赤でもすぐに進んでよい。", my:"မော်တာဆိုင်ကယ်ငယ်ဖြင့် အဆင့်နှစ်ဆင့် ညာကွေ့ရာတွင် လမ်းဆုံ၏ တစ်ဖက်ခြမ်း၌ ညာဘက်သို့ လှည့်ပြီးလျှင် ရှေ့မီးပွိုင့် အနီဖြစ်နေသော်လည်း ချက်ချင်း ဆက်သွားနိုင်သည်။", exJa:"誤り。正しくは、交差点の向こう側で止まって右に向きを変えたあと、前方の信号が青になってから進む。", exMy:"မှားပါသည်။ လမ်းဆုံ၏ တစ်ဖက်ခြမ်းတွင် ရပ်၍ ညာဘက်သို့ လှည့်ပြီးနောက် ရှေ့မီးပွိုင့် အစိမ်းဖြစ်မှ ဆက်သွားရပါသည်။", src:"法34条5項・教則8章"},
 {id:"kousa-F-07", cat:"kousa", set:0, final:1, fo:7, ans:true, ja:"踏切の警報機が鳴っていなくても、遮断機が降り始めたら、踏切に入ってはならない。", my:"ရထားလမ်းကူး၏ သတိပေးခေါင်းလောင်း မမြည်သော်လည်း ဘားတန်း ကျစပြုလျှင် ရထားလမ်းကူးထဲ မဝင်ရ။", exJa:"正しい。遮断機が閉じようとしている間や閉じている間、警報機が鳴っている間は踏切に入ってはならない。", exMy:"မှန်ပါသည်။ ဘားတန်း ကျစပြုနေစဉ်၊ ကျနေစဉ် သို့မဟုတ် သတိပေးခေါင်းလောင်း မြည်နေစဉ်တွင် ရထားလမ်းကူးထဲ မဝင်ရပါ။", src:"法33条2項"},

 {id:"kousa-F-08", cat:"kousa", set:0, final:2, fo:8, ans:false, ja:"環状交差点で右折するときは、あらかじめできるだけ道路の中央に寄って通行しなければならない。", my:"ဝိုင်းပတ်လမ်းဆုံတွင် ညာကွေ့မည့်အခါ ကြိုတင်၍ လမ်းအလယ်သို့ တတ်နိုင်သမျှ ကပ်၍ သွားရမည်။", exJa:"誤り。正しくは、環状交差点では右折・左折・直進のどの場合も、あらかじめ道路の左端に寄り、側端に沿って徐行する。", exMy:"မှားပါသည်။ ဝိုင်းပတ်လမ်းဆုံတွင် ညာကွေ့၊ ဘယ်ကွေ့၊ တည့်တည့်သွား မည်သည့်အခါမဆို ကြိုတင်၍ လမ်းဘယ်ဘက်အစွန်သို့ ကပ်ပြီး ဘေးအစွန်တလျှောက် ဖြည်းဖြည်းမောင်းရပါသည်။", src:"法35条の2、教則5章7節"},
 {id:"kousa-F-09", cat:"kousa", set:0, final:2, fo:9, ans:true, ja:"踏切支障報知装置のない踏切で車が動けなくなったときは、発炎筒などを使って列車に合図をする。", my:"အရေးပေါ်ခလုတ် မရှိသော ရထားလမ်းကူးတွင် ကား ရွှေ့မရဖြစ်သွားလျှင် မီးအချက်ပြတုတ်(発炎筒) စသည်ကို အသုံးပြု၍ ရထားကို အချက်ပြရသည်။", exJa:"正しい。非常ボタンがないところでは、発炎筒などを使い、できるだけ早く列車に分かるように合図をする。", exMy:"မှန်ပါသည်။ အရေးပေါ်ခလုတ် မရှိသောနေရာတွင် မီးအချက်ပြတုတ် စသည်ကို အသုံးပြု၍ ရထားသိနိုင်အောင် အမြန်ဆုံး အချက်ပြရပါသည်။", src:"教則6章1節"},
 {id:"kousa-F-10", cat:"kousa", set:0, final:2, fo:10, ans:true, ja:"交差点で進行方向ごとに通行区分が指定されているときは、緊急自動車が近づいた場合などを除き、その区分に従わなければならない。", my:"လမ်းဆုံတွင် သွားမည့်ဘက်အလိုက် လမ်းကြောကို သတ်မှတ်ထားလျှင် အရေးပေါ်ယာဉ် နီးကပ်လာသည့်အခါ စသည်မှလွဲ၍ ထိုသတ်မှတ်ချက်အတိုင်း လိုက်နာရမည်။", exJa:"正しい。進行方向別の通行区分が指定されているときは、緊急自動車が近づいた場合や工事などでやむを得ない場合のほかは、その区分に従う。", exMy:"မှန်ပါသည်။ သွားမည့်ဘက်အလိုက် လမ်းကြော သတ်မှတ်ထားလျှင် အရေးပေါ်ယာဉ် နီးကပ်လာခြင်း သို့မဟုတ် လမ်းပြင်ဆင်ခြင်းကြောင့် မလွှဲမရှောင်သာသည့်အခါမှလွဲ၍ ထိုလမ်းကြောအတိုင်း သွားရပါသည်။", src:"法35条1項・教則5章7節"},
 {id:"kousa-F-11", cat:"kousa", set:0, final:2, fo:11, ans:false, ja:"「停止禁止部分」の標示がある場所では、前方が混雑していれば、その中で止まってもよい。", my:"「停止禁止部分」(ရပ်ခြင်းမပြုရသောနေရာ) လမ်းမျက်နှာပြင် အမှတ်အသား(標示) ရှိသောနေရာတွင် ရှေ့၌ ယာဉ်ကြပ်နေလျှင် ထိုနေရာအတွင်း ရပ်နိုင်သည်။", exJa:"誤り。正しくは、前方が混雑していて停止禁止部分の中で止まるおそれがあるときは、その部分に入ってはならない。", exMy:"မှားပါသည်။ ရှေ့၌ ယာဉ်ကြပ်နေ၍ 「停止禁止部分」 အတွင်း ရပ်သွားနိုင်လျှင် ထိုနေရာထဲ မဝင်ရပါ။", src:"法50条2項"},
 {id:"kousa-F-12", cat:"kousa", set:0, final:2, fo:12, ans:true, ja:"踏切内で車が動かなくなったときは、列車に知らせるとともに、車を踏切の外に移動させなければならない。", my:"ရထားလမ်းကူးထဲတွင် ကား ရွှေ့မရဖြစ်သွားလျှင် ရထားကို အသိပေးသည့်အပြင် ကားကို ရထားလမ်းကူး၏ အပြင်ဘက်သို့ ရွှေ့ရမည်။", exJa:"正しい。一刻も早く列車の運転士などに知らせるとともに、車を踏切の外に移動させなければならない。", exMy:"မှန်ပါသည်။ ရထားမောင်းသူ စသည်ကို အမြန်ဆုံး အသိပေးသည့်အပြင် ကားကို ရထားလမ်းကူး၏ အပြင်ဘက်သို့ ရွှေ့ရပါမည်။", src:"法33条3項・教則6章1節"},
 {id:"kousa-F-13", cat:"kousa", set:0, final:2, fo:13, ans:false, ja:"踏切で安全を確かめるときは、窓を閉めたまま、目で左右を見るだけでよい。", my:"ရထားလမ်းကူးတွင် ဘေးကင်းကြောင်း စစ်ဆေးရာတွင် ပြတင်းပေါက်ကို ပိတ်ထားလျက် မျက်စိဖြင့် ဘယ်ညာ ကြည့်ရုံဖြင့် လုံလောက်သည်။", exJa:"誤り。正しくは、窓を開けるなどして、自分の目と耳で左右の安全を確かめなければならない。", exMy:"မှားပါသည်။ ပြတင်းပေါက်ကို ဖွင့်ခြင်း စသည်ဖြင့် မိမိ၏ မျက်စိနှင့် နားဖြင့် ဘယ်ညာ ဘေးကင်းကြောင်း စစ်ဆေးရပါမည်။", src:"教則6章1節"},

 {id:"kousa-F-14", cat:"kousa", set:0, final:3, fo:14, ans:true, ja:"原付で二段階右折をするときは、あらかじめ道路の左端に寄り、交差点の向こう側までまっすぐ進んでから右に向きを変える。", my:"မော်တာဆိုင်ကယ်ငယ်ဖြင့် အဆင့်နှစ်ဆင့် ညာကွေ့ရာတွင် ကြိုတင်၍ လမ်းဘယ်ဘက်အစွန်သို့ ကပ်ပြီး လမ်းဆုံ၏ တစ်ဖက်ခြမ်းအထိ တည့်တည့်သွားပြီးမှ ညာဘက်သို့ လှည့်ရသည်။", exJa:"正しい。左端に寄り、青信号で交差点の向こう側までまっすぐ進み、そこで止まって右に向きを変え、前方の信号が青になってから進む。", exMy:"မှန်ပါသည်။ ဘယ်ဘက်အစွန်သို့ ကပ်ပြီး မီးစိမ်းဖြင့် လမ်းဆုံ၏ တစ်ဖက်ခြမ်းအထိ တည့်တည့်သွား၊ ထိုနေရာတွင် ရပ်၍ ညာဘက်သို့ လှည့်ပြီး ရှေ့မီးပွိုင့် အစိမ်းဖြစ်မှ ဆက်သွားရပါသည်။", src:"法34条5項・教則8章"},
 {id:"kousa-F-15", cat:"kousa", set:0, final:3, fo:15, ans:false, ja:"大型車は内輪差が小さいので、左折するときに歩行者や自転車を巻き込むおそれは少ない。", my:"ကားကြီးများသည် ကွေ့ရာတွင် ရှေ့ဘီးနှင့် နောက်ဘီး လမ်းကြောင်းကွာခြားမှု(内輪差) နည်းသဖြင့် ဘယ်ကွေ့ရာတွင် လမ်းလျှောက်သူ သို့မဟုတ် စက်ဘီးကို ညှပ်မိ၍ တိုက်မိနိုင်ခြေ နည်းသည်။", exJa:"誤り。正しくは、大型車は内輪差が大きく左後方も見えにくいので、歩行者や自転車などを巻き込まないよう特に注意する。", exMy:"မှားပါသည်။ ကားကြီးများသည် ရှေ့ဘီးနှင့် နောက်ဘီး လမ်းကြောင်းကွာခြားမှု ကြီးမားပြီး ဘယ်ဘက်နောက်ကို မမြင်ရလွယ်သဖြင့် လမ်းလျှောက်သူ၊ စက်ဘီး စသည်တို့ကို ညှပ်မိ၍ မတိုက်မိစေရန် အထူးသတိထားရပါသည်။", src:"教則5章7節"},
 {id:"kousa-F-16", cat:"kousa", set:0, final:3, fo:16, ans:true, ja:"交差点（環状交差点を除く）で左折するときの合図は、左折が終わるまで続けなければならない。", my:"လမ်းဆုံ (ဝိုင်းပတ်လမ်းဆုံ မှလွဲ၍) တွင် ဘယ်ကွေ့မည့်အခါ အချက်ပြခြင်းကို ဘယ်ကွေ့ခြင်း ပြီးဆုံးသည်အထိ ဆက်ပြထားရမည်။", exJa:"正しい。合図は右左折などの行為が終わるまで続け、終わったらやめなければならない。", exMy:"မှန်ပါသည်။ အချက်ပြခြင်းကို ညာကွေ့ ဘယ်ကွေ့ စသည့် လုပ်ဆောင်ချက် ပြီးဆုံးသည်အထိ ဆက်ပြထားပြီး ပြီးဆုံးလျှင် ရပ်ရပါမည်။", src:"法53条1項・4項"},
 {id:"kousa-F-17", cat:"kousa", set:0, final:3, fo:17, ans:true, ja:"黄色のひし形の板に黒で踏切の記号がかかれた標識は、前方に踏切があることを示している。", my:"အဝါရောင် စိန်ပုံသဏ္ဌာန် (◇) ဆိုင်းဘုတ်ပေါ်တွင် အနက်ရောင်ဖြင့် ရထားလမ်းကူး သင်္ကေတ ရေးဆွဲထားသော ဆိုင်းဘုတ်သည် ရှေ့တွင် ရထားလမ်းကူး ရှိကြောင်း ပြသည်။", exJa:"正しい。黄色のひし形は警戒標識で、踏切の記号のものは前方に踏切があることを知らせている。", exMy:"မှန်ပါသည်။ အဝါရောင် စိန်ပုံဆိုင်းဘုတ်သည် သတိပေးဆိုင်းဘုတ်ဖြစ်ပြီး ရထားလမ်းကူး သင်္ကေတပါလျှင် ရှေ့တွင် ရထားလမ်းကူး ရှိကြောင်း အသိပေးခြင်း ဖြစ်ပါသည်။", src:"教則付表3"},
 {id:"kousa-F-18", cat:"kousa", set:0, final:3, fo:18, ans:false, ja:"交差点で右折するとき、対向車線を直進してくる二輪車は見えやすいので、特に注意する必要はない。", my:"လမ်းဆုံတွင် ညာကွေ့မည့်အခါ ဆန့်ကျင်ဘက်လမ်းကြောမှ တည့်တည့်လာသော ဆိုင်ကယ်ကို မြင်ရလွယ်သဖြင့် အထူးသတိထားရန် မလိုပါ။", exJa:"誤り。正しくは、右折するときは対向車線を直進する二輪車が見えにくくなることがあるので、十分注意する。", exMy:"မှားပါသည်။ ညာကွေ့ရာတွင် ဆန့်ကျင်ဘက်လမ်းကြောမှ တည့်တည့်လာသော ဆိုင်ကယ်ကို မမြင်ရဖြစ်တတ်သဖြင့် အထူးသတိထားရပါသည်။", src:"教則5章7節"},
 {id:"kousa-F-19", cat:"kousa", set:0, final:3, fo:19, ans:false, ja:"「一時停止」の標識があり停止線がない交差点では、交差点に少し入った所で一時停止すればよい。", my:"「一時停止」ဆိုင်းဘုတ်ရှိပြီး ရပ်တန့်မျဉ်း မရှိသော လမ်းဆုံတွင် လမ်းဆုံထဲသို့ အနည်းငယ် ဝင်ပြီးမှ ခဏရပ်တန့်လျှင် ရသည်။", exJa:"誤り。正しくは、停止線がないときは、交差点の直前（交差点に入る手前）で一時停止しなければならない。", exMy:"မှားပါသည်။ ရပ်တန့်မျဉ်း မရှိလျှင် လမ်းဆုံ၏ ရှေ့တည့်တည့် (လမ်းဆုံထဲ မဝင်မီ) တွင် ခဏရပ်တန့်ရပါမည်။", src:"法43条"}
);
QUESTIONS.push(
 {id:"sig-1-01", cat:"sig", set:1, final:0, fo:0, ans:true, ja:"黄信号に変わったとき、停止位置に近づいていて安全に止まれない場合は、そのまま進むことができる。", my:"မီးပွိုင့် အဝါရောင်သို့ ပြောင်းချိန်တွင် ရပ်ရမည့်နေရာနှင့် နီးနေပြီး ဘေးကင်းစွာ မရပ်နိုင်ပါက ဆက်၍ မောင်းသွားနိုင်သည်။", exJa:"正しい。黄信号では停止位置から先へ進めないが、黄に変わったとき停止位置に近く安全に止まれない場合はそのまま進める。", exMy:"မှန်သည်။ မီးဝါတွင် ရပ်ရမည့်နေရာကို ကျော်၍ မသွားရပါ။ သို့သော် မီးဝါပြောင်းချိန်တွင် ရပ်ရမည့်နေရာနှင့် နီးနေပြီး ဘေးကင်းစွာ မရပ်နိုင်ပါက ဆက်သွားနိုင်သည်။", src:"令2条・教則付表1"},
 {id:"sig-1-02", cat:"sig", set:1, final:0, fo:0, ans:false, ja:"赤信号のときは、交差点ですでに右折している車も、その場で止まらなければならない。", my:"မီးနီ ဖြစ်နေချိန်တွင် လမ်းဆုံထဲ၌ ညာကွေ့နေပြီးသော ယာဉ်သည်လည်း ထိုနေရာတွင် ရပ်ရမည်။", exJa:"誤り。交差点で既に右折している車は、赤でもそのまま進める。ただし青信号で進んで来る車の進行を妨げてはいけない。", exMy:"မှားသည်။ လမ်းဆုံထဲတွင် ညာကွေ့နေပြီးသော ယာဉ်သည် မီးနီ ဖြစ်သော်လည်း ဆက်သွားနိုင်သည်။ သို့သော် မီးစိမ်းဖြင့် လာနေသော ယာဉ်များကို အနှောင့်အယှက် မပေးရ။", src:"令2条・教則付表1"},
 {id:"sig-1-03", cat:"sig", set:1, final:0, fo:0, ans:true, ja:"青色の矢印信号のときは、赤信号であっても、車は矢印の方向に進むことができる。", my:"အစိမ်းရောင် မြှားပြမီး လင်းနေချိန်တွင် မီးနီ ဖြစ်နေသော်လည်း ယာဉ်သည် မြှားညွှန်ရာဘက်သို့ သွားနိုင်သည်။", exJa:"正しい。青の矢印信号では、赤や黄の信号でも矢印の方向に進める（右向き矢印では二段階右折の原付などは進めない）。", exMy:"မှန်သည်။ အစိမ်းရောင် မြှားပြမီးတွင် မီးနီ (သို့) မီးဝါ ဖြစ်နေသော်လည်း မြှားညွှန်ရာဘက်သို့ သွားနိုင်သည် (ညာမြှားတွင် နှစ်ဆင့်ညာကွေ့ရမည့် 原付 စသည်တို့ မသွားရ)။", src:"令2条・教則付表1"},
 {id:"sig-1-04", cat:"sig", set:1, final:0, fo:0, ans:false, ja:"黄色の点滅信号のときは、車は停止位置で一時停止しなければならない。", my:"အဝါရောင်မီး မှိတ်တုတ်မှိတ်တုတ် လင်းနေချိန်တွင် ယာဉ်သည် ရပ်ရမည့်နေရာ၌ ခဏရပ်တန့်ခြင်း(一時停止) ပြုရမည်။", exJa:"誤り。黄の点滅は、他の交通に注意して進める。停止位置で一時停止しなければならないのは赤の点滅である。", exMy:"မှားသည်။ အဝါမှိတ်တုတ်မီးတွင် အခြားယာဉ်များကို သတိထား၍ ဆက်သွားနိုင်သည်။ ရပ်ရမည့်နေရာ၌ ခဏရပ်တန့်ရမည်မှာ အနီမှိတ်တုတ်မီး ဖြစ်သည်။", src:"令2条・教則付表1"},
 {id:"sig-1-05", cat:"sig", set:1, final:0, fo:0, ans:true, ja:"警察官の手信号が信号機の信号と違うときは、警察官の手信号に従わなければならない。", my:"ရဲ၏ လက်အချက်ပြသည် မီးပွိုင့်နှင့် မတူပါက ရဲ၏ လက်အချက်ပြကို လိုက်နာရမည်။", exJa:"正しい。警察官や交通巡視員の手信号・灯火による信号は、信号機の信号より優先する。", exMy:"မှန်သည်။ ရဲ (သို့) ယာဉ်ထိန်း(交通巡視員) ၏ လက်အချက်ပြနှင့် မီးဖြင့် အချက်ပြခြင်းသည် မီးပွိုင့်ထက် ဦးစားပေးသည်။", src:"法7条・教則1章3節"},
 {id:"sig-1-06", cat:"sig", set:1, final:0, fo:0, ans:false, ja:"警察官が腕を横に水平に上げているとき、警察官の身体の正面に対面する交通は、青信号と同じ意味である。", my:"ရဲက လက်မောင်းကို ဘေးသို့ ရေပြင်ညီ မြှောက်ထားချိန်တွင် ရဲ၏ ရှေ့မျက်နှာ (သို့) ကျောဘက်နှင့် မျက်နှာချင်းဆိုင် လာသော ယာဉ်များအတွက် မီးစိမ်းနှင့် အဓိပ္ပာယ်တူသည်။", exJa:"誤り。正しくは、身体の正面に対面する交通は赤信号と同じ。身体の正面と平行に進む交通が青信号と同じである。", exMy:"မှားသည်။ ရဲနှင့် မျက်နှာချင်းဆိုင် လာသော ယာဉ်များအတွက် မီးနီနှင့် တူသည်။ ရဲ၏ ကိုယ်ခန္ဓာ ရှေ့မျက်နှာနှင့် အပြိုင် သွားသော ယာဉ်များအတွက် မီးစိမ်းနှင့် တူသည်။", src:"教則付表1(3)"},
 {id:"sig-1-07", cat:"sig", set:1, final:0, fo:0, ans:true, ja:"交差点で右左折するときの合図は、その交差点の手前の側端から30m手前の地点に達したときに行う。", my:"လမ်းဆုံတွင် ညာကွေ့ (သို့) ဘယ်ကွေ့ မည့်အခါ အချက်ပြခြင်းကို ထိုလမ်းဆုံ၏ အစွန်းမှ 30 မီတာ အလိုနေရာသို့ ရောက်သောအခါ ပြုလုပ်ရမည်။", exJa:"正しい。右左折・転回の合図は、その地点（交差点ではその手前の側端）から30m手前で行う。", exMy:"မှန်သည်။ ညာကွေ့၊ ဘယ်ကွေ့၊ ယူတန်ကွေ့ခြင်း(転回) ၏ အချက်ပြခြင်းကို ထိုနေရာ (လမ်းဆုံဖြစ်ပါက လမ်းဆုံအစွန်း) မှ 30 မီတာ အလိုတွင် ပြုလုပ်ရမည်။", src:"令21条"},
 {id:"sig-1-08", cat:"sig", set:1, final:0, fo:0, ans:false, ja:"同じ方向に進みながら進路を変えるときの合図は、進路を変えようとする約10秒前に行う。", my:"တူညီသော ဦးတည်ရာသို့ သွားရင်း လမ်းကြောင်းပြောင်းမည့်အခါ အချက်ပြခြင်းကို လမ်းကြောင်းမပြောင်းမီ 10 စက္ကန့်ခန့် အလိုတွင် ပြုလုပ်ရမည်။", exJa:"誤り。正しくは、進路を変えようとするときの約3秒前に合図を行う。", exMy:"မှားသည်။ လမ်းကြောင်းမပြောင်းမီ 3 စက္ကန့်ခန့် အလိုတွင် အချက်ပြရမည်။", src:"令21条"},
 {id:"sig-1-09", cat:"sig", set:1, final:0, fo:0, ans:true, ja:"手で徐行や停止の合図をするときは、腕を車の外に出して斜め下に伸ばす。", my:"ဖြည်းဖြည်းမောင်းခြင်း(徐行) (သို့) ရပ်ခြင်းကို လက်ဖြင့် အချက်ပြမည့်အခါ လက်မောင်းကို ကားအပြင်ဘက်သို့ ထုတ်၍ စောင်းပြီး အောက်ဘက်သို့ ဆန့်ထုတ်ရမည်။", exJa:"正しい。徐行・停止の合図は、ブレーキ灯をつけるか、腕を車の外に出して斜め下に伸ばす。", exMy:"မှန်သည်။ 徐行 (သို့) ရပ်ခြင်း၏ အချက်ပြမှာ ဘရိတ်မီး လင်းစေခြင်း (သို့) လက်မောင်းကို ကားအပြင်သို့ ထုတ်၍ စောင်းပြီး အောက်ဘက်သို့ ဆန့်ခြင်း ဖြစ်သည်။", src:"令21条"},
 {id:"sig-1-10", cat:"sig", set:1, final:0, fo:0, ans:false, ja:"前の車の発進が遅いときは、警音器を鳴らして知らせてよい。", my:"ရှေ့ကား ထွက်ခွာရာတွင် နှေးနေပါက ဟွန်း(警音器) တီး၍ အသိပေးနိုင်သည်။", exJa:"誤り。警音器は「警笛鳴らせ」の標識の場所などのほかは、危険を避けるためやむを得ないときしか鳴らせない。", exMy:"မှားသည်။ ဟွန်းကို 「警笛鳴らせ」 ဆိုင်းဘုတ် ရှိသောနေရာ စသည်မှအပ အန္တရာယ်ရှောင်ရန် မလွဲမရှောင်သာသည့်အခါမှသာ တီးနိုင်သည်။", src:"法54条"},
 {id:"sig-2-01", cat:"sig", set:2, final:0, fo:0, ans:false, ja:"黄色の矢印信号のときは、自動車は矢印の方向に進むことができる。", my:"အဝါရောင် မြှားပြမီး လင်းနေချိန်တွင် မော်တော်ယာဉ်သည် မြှားညွှန်ရာဘက်သို့ သွားနိုင်သည်။", exJa:"誤り。黄色の矢印信号は路面電車のための信号で、自動車などの車は進めない。", exMy:"မှားသည်။ အဝါရောင် မြှားပြမီးသည် ဓာတ်ရထား(路面電車) အတွက်သာ ဖြစ်ပြီး မော်တော်ယာဉ် စသည့် ယာဉ်များ မသွားရ။", src:"令2条・教則付表1"},
 {id:"sig-2-02", cat:"sig", set:2, final:0, fo:0, ans:true, ja:"赤色の点滅信号のときは、車は停止位置で一時停止しなければならない。", my:"အနီရောင်မီး မှိတ်တုတ်မှိတ်တုတ် လင်းနေချိန်တွင် ယာဉ်သည် ရပ်ရမည့်နေရာ၌ ခဏရပ်တန့်ခြင်း(一時停止) ပြုရမည်။", exJa:"正しい。赤の点滅信号では、車は停止位置で一時停止しなければならない。", exMy:"မှန်သည်။ အနီမှိတ်တုတ်မီးတွင် ယာဉ်သည် ရပ်ရမည့်နေရာ၌ ခဏရပ်တန့်ရမည်။", src:"令2条・教則付表1"},
 {id:"sig-2-03", cat:"sig", set:2, final:0, fo:0, ans:true, ja:"右向きの青色の矢印信号のときは、自動車は転回することもできる。", my:"ညာဘက်ညွှန် အစိမ်းရောင် မြှားပြမီး လင်းနေချိန်တွင် မော်တော်ယာဉ်သည် ယူတန်ကွေ့ခြင်း(転回) ကိုလည်း ပြုလုပ်နိုင်သည်။", exJa:"正しい。右向きの青の矢印では、右折のほか転回もできる。", exMy:"မှန်သည်။ ညာမြှား အစိမ်းရောင်မီးတွင် ညာကွေ့သာမက ယူတန်ကွေ့ခြင်းလည်း ပြုလုပ်နိုင်သည်။", src:"令2条・教則付表1"},
 {id:"sig-2-04", cat:"sig", set:2, final:0, fo:0, ans:false, ja:"二段階右折をしなければならない原付は、右向きの青色の矢印信号に従って右折することができる。", my:"နှစ်ဆင့်ညာကွေ့(二段階右折) ရမည့် မော်တာဆိုင်ကယ်ငယ်(原付) သည် ညာဘက်ညွှန် အစိမ်းရောင် မြှားပြမီးအတိုင်း ညာကွေ့နိုင်သည်။", exJa:"誤り。二段階右折をする原付や軽車両は、右向きの青の矢印信号では進むことができない。", exMy:"မှားသည်။ နှစ်ဆင့်ညာကွေ့ရမည့် 原付 နှင့် စက်ဘီး စသည့် 軽車両 တို့သည် ညာမြှား အစိမ်းရောင်မီးဖြင့် မသွားရ။", src:"令2条・教則付表1"},
 {id:"sig-2-05", cat:"sig", set:2, final:0, fo:0, ans:true, ja:"歩行者用信号が青の点滅になったときは、歩行者は横断を始めてはいけない。", my:"လမ်းလျှောက်သူ မီးပွိုင့်တွင် အစိမ်းရောင်မီး မှိတ်တုတ်မှိတ်တုတ် ဖြစ်လာပါက လမ်းလျှောက်သူသည် လမ်းကူးခြင်းကို မစတင်ရ။", exJa:"正しい。歩行者用信号の青の点滅では、横断を始めてはいけない。横断中の人は速やかに渡り終えるか、引き返す。", exMy:"မှန်သည်။ လမ်းလျှောက်သူ မီးပွိုင့်၏ အစိမ်းမှိတ်တုတ်မီးတွင် လမ်းကူးခြင်းကို မစတင်ရ။ ကူးနေဆဲသူသည် အမြန် ကူးပြီးအောင် သွားရမည် (သို့) ပြန်လှည့်ရမည်။", src:"令2条・教則2章"},
 {id:"sig-2-06", cat:"sig", set:2, final:0, fo:0, ans:false, ja:"警察官が腕を垂直に上げているとき、警察官の身体の正面と平行に進む交通は、青信号と同じ意味である。", my:"ရဲက လက်မောင်းကို အပေါ်သို့ ဒေါင်လိုက် မြှောက်ထားချိန်တွင် ရဲ၏ ကိုယ်ခန္ဓာ ရှေ့မျက်နှာနှင့် အပြိုင် သွားသော ယာဉ်များအတွက် မီးစိမ်းနှင့် အဓိပ္ပာယ်တူသည်။", exJa:"誤り。腕を垂直に上げているとき、身体の正面と平行に進む交通は黄信号、対面する交通は赤信号と同じ意味である。", exMy:"မှားသည်။ လက်မောင်းကို ဒေါင်လိုက် မြှောက်ထားချိန်တွင် ကိုယ်ခန္ဓာနှင့် အပြိုင်သွားသော ယာဉ်များအတွက် မီးဝါ၊ မျက်နှာချင်းဆိုင်လာသော ယာဉ်များအတွက် မီးနီနှင့် တူသည်။", src:"教則付表1(3)"},
 {id:"sig-2-07", cat:"sig", set:2, final:0, fo:0, ans:true, ja:"白地に青の左向き矢印の標示板があるときは、前方の信号が赤でも、周りの交通に注意して左折できる。", my:"အဖြူခံပေါ်တွင် အပြာရောင် ဘယ်ညွှန်မြှား ပါသော ဆိုင်းဘုတ်ပြား ရှိပါက ရှေ့မီးပွိုင့် အနီ ဖြစ်နေသော်လည်း ပတ်ဝန်းကျင်ကို သတိထား၍ ဘယ်ကွေ့နိုင်သည်။", exJa:"正しい。「左折可」の標示板があれば、信号が赤や黄でも歩行者など周りに注意して左折できる。", exMy:"မှန်သည်။ 「左折可」 ဆိုင်းဘုတ်ပြား ရှိပါက မီးနီ (သို့) မီးဝါ ဖြစ်နေသော်လည်း လမ်းလျှောက်သူ စသည်တို့ကို သတိထား၍ ဘယ်ကွေ့နိုင်သည်။", src:"教則1章2節"},
 {id:"sig-2-08", cat:"sig", set:2, final:0, fo:0, ans:false, ja:"右左折の合図は、曲がり始めたらすぐにやめなければならない。", my:"ညာကွေ့/ဘယ်ကွေ့ အချက်ပြခြင်းကို ကွေ့စလိုက်သည်နှင့် ချက်ချင်း ရပ်ရမည်။", exJa:"誤り。正しくは、合図は右左折などの行為が終わるまで続け、終わったら速やかにやめる。", exMy:"မှားသည်။ အချက်ပြခြင်းကို ကွေ့ခြင်း စသည်တို့ ပြီးဆုံးသည်အထိ ဆက်လုပ်ထားရပြီး ပြီးလျှင် ချက်ချင်း ရပ်ရမည်။", src:"法53条"},
 {id:"sig-2-09", cat:"sig", set:2, final:0, fo:0, ans:false, ja:"手で左折の合図をするときは、右腕を車の外に出して水平に伸ばす。", my:"လက်ဖြင့် ဘယ်ကွေ့ အချက်ပြမည့်အခါ ညာလက်မောင်းကို ကားအပြင်သို့ ထုတ်၍ ရေပြင်ညီ ဆန့်ထုတ်ရမည်။", exJa:"誤り。右腕を水平に伸ばすのは右折の合図。左折は、左腕を水平に伸ばすか、右腕の肘を垂直に上に曲げる。", exMy:"မှားသည်။ ညာလက်မောင်းကို ရေပြင်ညီ ဆန့်ခြင်းသည် ညာကွေ့ အချက်ပြ ဖြစ်သည်။ ဘယ်ကွေ့တွင် ဘယ်လက်မောင်းကို ရေပြင်ညီ ဆန့်ခြင်း (သို့) ညာလက်မောင်း၏ တံတောင်ကို အပေါ်သို့ ဒေါင်လိုက် ချိုးခြင်း ပြုရမည်။", src:"令21条"},
 {id:"sig-2-10", cat:"sig", set:2, final:0, fo:0, ans:true, ja:"「警笛鳴らせ」の標識がある場所を通るときは、警音器を鳴らさなければならない。", my:"「警笛鳴らせ」 (ဟွန်းတီးပါ) ဆိုင်းဘုတ် ရှိသောနေရာကို ဖြတ်သွားသည့်အခါ ဟွန်း(警音器) တီးရမည်။", exJa:"正しい。「警笛鳴らせ」の標識がある場所では、警音器を鳴らさなければならない。", exMy:"မှန်သည်။ 「警笛鳴らせ」 ဆိုင်းဘုတ် ရှိသောနေရာတွင် ဟွန်းတီးရမည်။", src:"法54条1項"},
 {id:"sig-3-01", cat:"sig", set:3, final:0, fo:0, ans:true, ja:"黄信号のときは、車は原則として停止位置から先へ進んではいけない。", my:"မီးဝါ လင်းနေချိန်တွင် ယာဉ်သည် မူအားဖြင့် ရပ်ရမည့်နေရာကို ကျော်၍ ရှေ့သို့ မသွားရ။", exJa:"正しい。黄信号では停止位置から先へ進めない。ただし停止位置に近づいていて安全に止まれない場合は進める。", exMy:"မှန်သည်။ မီးဝါတွင် ရပ်ရမည့်နေရာကို ကျော်၍ မသွားရ။ သို့သော် ရပ်ရမည့်နေရာနှင့် နီးနေ၍ ဘေးကင်းစွာ မရပ်နိုင်ပါက ဆက်သွားနိုင်သည်။", src:"令2条・教則付表1"},
 {id:"sig-3-02", cat:"sig", set:3, final:0, fo:0, ans:false, ja:"赤信号でも、交差する道路から車が来ていなければ、左折してよい。", my:"မီးနီ ဖြစ်နေသော်လည်း ဖြတ်လမ်းမှ ယာဉ် မလာပါက ဘယ်ကွေ့နိုင်သည်။", exJa:"誤り。赤信号では左折できない。左折できるのは「左折可」の標示板や左向きの青の矢印がある場合だけである。", exMy:"မှားသည်။ မီးနီတွင် ဘယ်ကွေ့ခွင့် မရှိ။ 「左折可」 ဆိုင်းဘုတ်ပြား (သို့) ဘယ်ညွှန် အစိမ်းရောင် မြှားပြမီး ရှိမှသာ ဘယ်ကွေ့နိုင်သည်။", src:"令2条・教則1章2節"},
 {id:"sig-3-03", cat:"sig", set:3, final:0, fo:0, ans:true, ja:"交差点ですでに左折している車は、左折方向の信号が赤になっても、そのまま進むことができる。", my:"လမ်းဆုံထဲတွင် ဘယ်ကွေ့နေပြီးသော ယာဉ်သည် ဘယ်ကွေ့ဘက် မီးပွိုင့် အနီ ဖြစ်သွားသော်လည်း ဆက်သွားနိုင်သည်။", exJa:"正しい。交差点で既に左折している車は、左折方向の信号が赤でもそのまま進める。", exMy:"မှန်သည်။ လမ်းဆုံထဲတွင် ဘယ်ကွေ့နေပြီးသော ယာဉ်သည် ဘယ်ကွေ့ဘက် မီးနီ ဖြစ်သော်လည်း ဆက်သွားနိုင်သည်။", src:"令2条・教則付表1"},
 {id:"sig-3-04", cat:"sig", set:3, final:0, fo:0, ans:false, ja:"交差する道路の信号が赤になったときは、自分の前方の信号は必ず青である。", my:"ဖြတ်လမ်း၏ မီးပွိုင့် အနီ ဖြစ်သွားပါက မိမိ ရှေ့ရှိ မီးပွိုင့်သည် အမြဲတမ်း အစိမ်း ဖြစ်သည်။", exJa:"誤り。全方向が一時的に赤になる信号や時差式信号もあるので、横の信号ではなく前方の信号を見て進む。", exMy:"မှားသည်။ လမ်းအားလုံး တစ်ပြိုင်နက် မီးနီ ဖြစ်သော မီးပွိုင့်နှင့် အချိန်ကွာ မီးပွိုင့်(時差式) များလည်း ရှိသောကြောင့် ဘေးမီးကို မကြည့်ဘဲ ရှေ့မီးပွိုင့်ကို ကြည့်ရမည်။", src:"教則1章2節"},
 {id:"sig-3-05", cat:"sig", set:3, final:0, fo:0, ans:true, ja:"警察官が灯火を横に振っているとき、灯火が振られている方向に進む交通は、青信号と同じ意味である。", my:"ရဲက လက်ကိုင်မီးကို ဘေးတိုက် ယမ်းနေချိန်တွင် မီးယမ်းနေသော ဦးတည်ရာအတိုင်း သွားသော ယာဉ်များအတွက် မီးစိမ်းနှင့် အဓိပ္ပာယ်တူသည်။", exJa:"正しい。灯火を横に振っているとき、振られている方向に進む交通は青信号、これと交差する交通は赤信号と同じ。", exMy:"မှန်သည်။ မီးယမ်းနေသော ဦးတည်ရာအတိုင်း သွားသော ယာဉ်များအတွက် မီးစိမ်း၊ ၎င်းကို ဖြတ်၍ သွားသော ယာဉ်များအတွက် မီးနီနှင့် တူသည်။", src:"教則付表1(3)"},
 {id:"sig-3-06", cat:"sig", set:3, final:0, fo:0, ans:false, ja:"交差点以外で横断歩道・自転車横断帯・踏切のない場所で警察官が手信号をしているときの停止位置は、警察官の5m手前である。", my:"လမ်းဆုံ မဟုတ်ဘဲ လူကူးမျဉ်းကြား၊ စက်ဘီးကူးလမ်း၊ ရထားလမ်းကူး မရှိသော နေရာတွင် ရဲက လက်အချက်ပြနေပါက ရပ်ရမည့်နေရာသည် ရဲ၏ 5 မီတာ အလို ဖြစ်သည်။", exJa:"誤り。正しくは、そのような場所で手信号をしているときの停止位置は、警察官の1m手前である。", exMy:"မှားသည်။ ထိုသို့သော နေရာတွင် ရပ်ရမည့်နေရာသည် ရဲ၏ 1 မီတာ အလို ဖြစ်သည်။", src:"教則付表1(3)"},
 {id:"sig-3-07", cat:"sig", set:3, final:0, fo:0, ans:true, ja:"転回をするときの合図は、転回しようとする地点から30m手前の地点に達したときに行う。", my:"ယူတန်ကွေ့ခြင်း(転回) ပြုလုပ်မည့်အခါ အချက်ပြခြင်းကို လှည့်မည့်နေရာမှ 30 မီတာ အလိုသို့ ရောက်သောအခါ ပြုလုပ်ရမည်။", exJa:"正しい。右折や転回の合図は、その地点から30m手前の地点に達したときに、右の合図を行う。", exMy:"မှန်သည်။ ညာကွေ့နှင့် ယူတန်ကွေ့ခြင်း၏ အချက်ပြခြင်းကို ထိုနေရာမှ 30 မီတာ အလိုသို့ ရောက်သောအခါ ညာဘက် အချက်ပြရမည်။", src:"令21条"},
 {id:"sig-3-08", cat:"sig", set:3, final:0, fo:0, ans:false, ja:"右左折や進路変更をしないときでも、念のため方向指示器で合図を出しておいてよい。", my:"ညာ/ဘယ် ကွေ့ခြင်း (သို့) လမ်းကြောင်းပြောင်းခြင်း မလုပ်မည့်အခါတွင်လည်း သေချာစေရန် အချက်ပြမီး(方向指示器) ကို ဖွင့်ထားနိုင်သည်။", exJa:"誤り。合図に関係する行為をしないのに合図をしてはいけない。行為が終わったら合図もやめる。", exMy:"မှားသည်။ ကွေ့ခြင်း စသည့် လုပ်ဆောင်ချက် မလုပ်ဘဲ အချက်မပြရ။ လုပ်ဆောင်ချက် ပြီးလျှင်လည်း အချက်ပြခြင်းကို ရပ်ရမည်။", src:"法53条4項"},
 {id:"sig-3-09", cat:"sig", set:3, final:0, fo:0, ans:true, ja:"手で右折の合図をするときは、右腕を車の外に出して水平に伸ばすか、左腕の肘を垂直に上に曲げる。", my:"လက်ဖြင့် ညာကွေ့ အချက်ပြမည့်အခါ ညာလက်မောင်းကို ကားအပြင်သို့ ထုတ်၍ ရေပြင်ညီ ဆန့်ခြင်း (သို့) ဘယ်လက်မောင်းကို ကားအပြင်သို့ ထုတ်၍ တံတောင်ကို အပေါ်သို့ ဒေါင်လိုက် ချိုးခြင်း ပြုရမည်။", exJa:"正しい。右折・転回の手の合図は、右腕を水平に伸ばすか、左腕の肘を垂直に上に曲げる。", exMy:"မှန်သည်။ ညာကွေ့နှင့် ယူတန်ကွေ့ခြင်း၏ လက်အချက်ပြမှာ ညာလက်မောင်းကို ရေပြင်ညီ ဆန့်ခြင်း (သို့) ဘယ်လက်မောင်း၏ တံတောင်ကို အပေါ်သို့ ဒေါင်လိုက် ချိုးခြင်း ဖြစ်သည်။", src:"令21条"},
 {id:"sig-3-10", cat:"sig", set:3, final:0, fo:0, ans:false, ja:"「警笛区間」の標識がある区間内でも、見通しのきかない交差点で警音器を鳴らしてはいけない。", my:"「警笛区間」 ဆိုင်းဘုတ် ရှိသော အပိုင်းအတွင်း၌ပင် ဘေးဘက်ကို မမြင်နိုင်သော လမ်းဆုံတွင် ဟွန်း(警音器) မတီးရ။", exJa:"誤り。「警笛区間」内の見通しのきかない交差点・曲がり角・上り坂の頂上を通るときは、警音器を鳴らさなければならない。", exMy:"မှားသည်။ 「警笛区間」 အတွင်းရှိ မမြင်နိုင်သော လမ်းဆုံ၊ လမ်းကွေ့၊ အတက်ကုန်း ထိပ်ကို ဖြတ်သွားသည့်အခါ ဟွန်းတီးရမည်။", src:"法54条1項・教則5章5節"},
 {id:"sig-F-01", cat:"sig", set:0, final:1, fo:1, ans:true, ja:"停止線があるところでは、信号機の信号による停止位置は、停止線の直前である。", my:"ရပ်တန့်မျဉ်း ရှိသောနေရာတွင် မီးပွိုင့်အရ ရပ်ရမည့်နေရာသည် ရပ်တန့်မျဉ်း၏ ရှေ့တည့်တည့် (မျဉ်းကို မကျော်မီ) ဖြစ်သည်။", exJa:"正しい。停止位置は停止線の直前。停止線がない交差点では交差点の直前（すぐ近くに横断歩道があればその直前）。", exMy:"မှန်သည်။ ရပ်ရမည့်နေရာမှာ ရပ်တန့်မျဉ်း၏ ရှေ့တည့်တည့် ဖြစ်သည်။ ရပ်တန့်မျဉ်း မရှိသော လမ်းဆုံတွင် လမ်းဆုံ၏ ရှေ့တည့်တည့် (အနီးတွင် လူကူးမျဉ်းကြား ရှိပါက ၎င်း၏ ရှေ့တည့်တည့်) ဖြစ်သည်။", src:"教則付表1"},
 {id:"sig-F-02", cat:"sig", set:0, final:1, fo:2, ans:false, ja:"赤色の点滅信号のときは、車は他の交通に注意すれば、一時停止しないで進んでよい。", my:"အနီရောင်မီး မှိတ်တုတ်မှိတ်တုတ် လင်းနေချိန်တွင် ယာဉ်သည် အခြားယာဉ်များကို သတိထားလျှင် ခဏရပ်တန့်ခြင်း(一時停止) မပြုဘဲ ဆက်သွားနိုင်သည်။", exJa:"誤り。正しくは、赤の点滅では停止位置で一時停止しなければならない。注意して進めるのは黄の点滅である。", exMy:"မှားသည်။ အနီမှိတ်တုတ်မီးတွင် ရပ်ရမည့်နေရာ၌ ခဏရပ်တန့်ရမည်။ သတိထား၍ ဆက်သွားနိုင်သည်မှာ အဝါမှိတ်တုတ်မီး ဖြစ်သည်။", src:"令2条・教則付表1"},
 {id:"sig-F-03", cat:"sig", set:0, final:1, fo:3, ans:true, ja:"交差点ですでに右折している車は、右折方向の信号が赤でも進めるが、青信号で進んで来る車の進行を妨げてはいけない。", my:"လမ်းဆုံထဲတွင် ညာကွေ့နေပြီးသော ယာဉ်သည် ညာကွေ့ဘက် မီးနီ ဖြစ်သော်လည်း ဆက်သွားနိုင်သည်။ သို့သော် မီးစိမ်းဖြင့် လာနေသော ယာဉ်များကို အနှောင့်အယှက် မပေးရ။", exJa:"正しい。既に右折している車は赤でもそのまま進めるが、青信号に従って進んで来る車の進行を妨げてはいけない。", exMy:"မှန်သည်။ ညာကွေ့နေပြီးသော ယာဉ်သည် မီးနီတွင်လည်း ဆက်သွားနိုင်သော်လည်း မီးစိမ်းအတိုင်း လာနေသော ယာဉ်များကို အနှောင့်အယှက် မပေးရ။", src:"令2条・教則付表1"},
 {id:"sig-F-04", cat:"sig", set:0, final:1, fo:4, ans:false, ja:"青信号のとき、二段階右折をする原付は、交差点の中心のすぐ内側を通って右折してよい。", my:"မီးစိမ်း ဖြစ်နေချိန်တွင် နှစ်ဆင့်ညာကွေ့(二段階右折) ရမည့် မော်တာဆိုင်ကယ်ငယ်(原付) သည် လမ်းဆုံ အလယ်ဗဟို၏ အတွင်းဘက်မှ ဖြတ်၍ ညာကွေ့နိုင်သည်။", exJa:"誤り。二段階右折の原付は、青信号でも右折する地点までまっすぐ進み、その地点で向きを変えることまでしかできない。", exMy:"မှားသည်။ နှစ်ဆင့်ညာကွေ့ရမည့် 原付 သည် မီးစိမ်းတွင်လည်း ညာကွေ့မည့်နေရာ (လမ်းဆုံ၏ တစ်ဖက်ခြမ်း) အထိ တည့်တည့် သွားပြီး ထိုနေရာတွင် ဦးတည်ရာ ပြောင်းရုံသာ ပြုလုပ်နိုင်သည်။", src:"令2条・教則付表1"},
 {id:"sig-F-05", cat:"sig", set:0, final:1, fo:5, ans:true, ja:"警察官が灯火を頭上に上げているとき、それまで灯火が振られていた方向に進む交通は、黄信号と同じ意味である。", my:"ရဲက လက်ကိုင်မီးကို ခေါင်းပေါ်သို့ မြှောက်ထားချိန်တွင် ယခင်က မီးယမ်းခဲ့သော ဦးတည်ရာအတိုင်း သွားသော ယာဉ်များအတွက် မီးဝါနှင့် အဓိပ္ပာယ်တူသည်။", exJa:"正しい。灯火を頭上に上げているとき、それまで振られていた方向の交通は黄信号、これと交差する交通は赤信号と同じ。", exMy:"မှန်သည်။ ယခင်က မီးယမ်းခဲ့သော ဦးတည်ရာ သွားသော ယာဉ်များအတွက် မီးဝါ၊ ၎င်းကို ဖြတ်၍ သွားသော ယာဉ်များအတွက် မီးနီနှင့် တူသည်။", src:"教則付表1(3)"},
 {id:"sig-F-06", cat:"sig", set:0, final:1, fo:6, ans:false, ja:"警察官が身体の向きを変えないで、水平に上げていた腕を下ろしているときは、どの方向の交通も進んでよい。", my:"ရဲက ကိုယ်ခန္ဓာ၏ ဦးတည်ရာကို မပြောင်းဘဲ ရေပြင်ညီ မြှောက်ထားသော လက်မောင်းကို ချထားချိန်တွင် မည်သည့်ဘက်မှ ယာဉ်မဆို သွားနိုင်သည်။", exJa:"誤り。身体の向きを変えずに腕を下ろしているときは、腕を水平に上げているときと同じ意味（平行は青、対面は赤）である。", exMy:"မှားသည်။ ကိုယ်ခန္ဓာ၏ ဦးတည်ရာ မပြောင်းဘဲ လက်ချထားခြင်းသည် လက်ကို ရေပြင်ညီ မြှောက်ထားခြင်းနှင့် အဓိပ္ပာယ်တူသည် (အပြိုင်သွားသူ မီးစိမ်း၊ မျက်နှာချင်းဆိုင်သူ မီးနီ)။", src:"教則付表1(3)"},
 {id:"sig-F-07", cat:"sig", set:0, final:1, fo:7, ans:true, ja:"環状交差点を出るときは、左側の方向指示器を操作するなどして合図をしなければならない。", my:"အဝိုင်းပတ်လမ်းဆုံ(環状交差点) မှ ထွက်မည့်အခါ ဘယ်ဘက် အချက်ပြမီး(方向指示器) ကို ဖွင့်ခြင်း စသည်ဖြင့် အချက်ပြရမည်။", exJa:"正しい。環状交差点を出るときは、左側の方向指示器を操作するか、手で左折と同じ合図をしなければならない。", exMy:"မှန်သည်။ အဝိုင်းပတ်လမ်းဆုံမှ ထွက်မည့်အခါ ဘယ်ဘက် အချက်ပြမီးကို ဖွင့်ခြင်း (သို့) လက်ဖြင့် ဘယ်ကွေ့ အချက်ပြနှင့် အတူတူ ပြုလုပ်ရမည်။", src:"法53条2項・教則5章5節"},
 {id:"sig-F-08", cat:"sig", set:0, final:2, fo:8, ans:false, ja:"後退するときの手による合図は、腕を車の外に出して水平に伸ばす。", my:"နောက်ဆုတ်မည့်အခါ လက်ဖြင့် အချက်ပြခြင်းမှာ လက်မောင်းကို ကားအပြင်သို့ ထုတ်၍ ရေပြင်ညီ ဆန့်ထုတ်ခြင်း ဖြစ်သည်။", exJa:"誤り。後退の手の合図は、腕を車の外に出して斜め下に伸ばし、手のひらを後ろに向けて腕を前後に動かす。", exMy:"မှားသည်။ နောက်ဆုတ်ခြင်း၏ လက်အချက်ပြမှာ လက်မောင်းကို ကားအပြင်သို့ ထုတ်၍ စောင်းပြီး အောက်ဘက်သို့ ဆန့်ကာ လက်ဖဝါးကို နောက်ဘက်သို့ လှည့်၍ ရှေ့နောက် လှုပ်ခြင်း ဖြစ်သည်။", src:"令21条"},
 {id:"sig-F-09", cat:"sig", set:0, final:2, fo:9, ans:true, ja:"夕日の反射などで方向指示器が見えにくいときは、手による合図もあわせて行うようにする。", my:"နေဝင်ချိန် အလင်းရောင် ပြန်ဟပ်ခြင်း စသည်ကြောင့် အချက်ပြမီး(方向指示器) ကို မြင်ရခက်သည့်အခါ လက်ဖြင့် အချက်ပြခြင်းကိုပါ တွဲ၍ ပြုလုပ်သင့်သည်။", exJa:"正しい。夕日の反射などで方向指示器が見えにくい場合は、方向指示器の操作とあわせて手による合図を行う。", exMy:"မှန်သည်။ အချက်ပြမီး မြင်ရခက်သည့်အခါ အချက်ပြမီး ဖွင့်ခြင်းနှင့်အတူ လက်ဖြင့်လည်း အချက်ပြရမည်။", src:"教則5章5節"},
 {id:"sig-F-10", cat:"sig", set:0, final:2, fo:10, ans:false, ja:"交差点で左折するときの合図は、交差点の手前の側端から3m手前で行えばよい。", my:"လမ်းဆုံတွင် ဘယ်ကွေ့မည့်အခါ အချက်ပြခြင်းကို လမ်းဆုံ၏ အစွန်းမှ 3 မီတာ အလိုတွင် ပြုလုပ်လျှင် ရသည်။", exJa:"誤り。正しくは、交差点の手前の側端から30m手前の地点に達したときに合図を行う。", exMy:"မှားသည်။ လမ်းဆုံ၏ အစွန်းမှ 30 မီတာ အလိုသို့ ရောက်သောအခါ အချက်ပြရမည်။", src:"令21条"},
 {id:"sig-F-11", cat:"sig", set:0, final:2, fo:11, ans:true, ja:"危険を避けるためやむを得ないときは、警音器を鳴らすことができる。", my:"အန္တရာယ်ကို ရှောင်ရှားရန် မလွဲမရှောင်သာသည့်အခါ ဟွန်း(警音器) တီးနိုင်သည်။", exJa:"正しい。警音器は、法令で鳴らすよう定められた場合のほか、危険を避けるためやむを得ないときは鳴らせる。", exMy:"မှန်သည်။ ဥပဒေအရ တီးရမည့်အခါ အပြင် အန္တရာယ်ရှောင်ရန် မလွဲမရှောင်သာသည့်အခါ ဟွန်းတီးနိုင်သည်။", src:"法54条2項"},
 {id:"sig-F-12", cat:"sig", set:0, final:2, fo:12, ans:false, ja:"交通巡視員の手信号には、従わなくてもよい。", my:"ယာဉ်ထိန်း(交通巡視員) ၏ လက်အချက်ပြကို လိုက်နာရန် မလိုပါ။", exJa:"誤り。交通巡視員の手信号や灯火による信号にも従わなければならず、信号機の信号より優先する。", exMy:"မှားသည်။ ယာဉ်ထိန်း၏ လက်အချက်ပြနှင့် မီးဖြင့် အချက်ပြခြင်းကိုလည်း လိုက်နာရမည်ဖြစ်ပြီး မီးပွိုင့်ထက် ဦးစားပေးသည်။", src:"法7条・教則1章3節"},
 {id:"sig-F-13", cat:"sig", set:0, final:2, fo:13, ans:true, ja:"「左折可」の標示板により赤信号で左折するときは、信号に従って横断している歩行者や自転車の通行を妨げてはいけない。", my:"「左折可」 ဆိုင်းဘုတ်ပြားအရ မီးနီတွင် ဘယ်ကွေ့မည့်အခါ မီးပွိုင့်အတိုင်း လမ်းကူးနေသော လမ်းလျှောက်သူ နှင့် စက်ဘီးများကို အနှောင့်အယှက် မပေးရ။", exJa:"正しい。「左折可」で左折するときも、信号に従って横断している歩行者や自転車の通行を妨げてはいけない。", exMy:"မှန်သည်။ 「左折可」 ဖြင့် ဘယ်ကွေ့သည့်အခါတွင်လည်း မီးပွိုင့်အတိုင်း လမ်းကူးနေသော လမ်းလျှောက်သူနှင့် စက်ဘီးများကို အနှောင့်အယှက် မပေးရ။", src:"教則1章2節"},
 {id:"sig-F-14", cat:"sig", set:0, final:3, fo:14, ans:false, ja:"歩行者用信号が青の点滅になったら、横断中の歩行者はその場で止まらなければならない。", my:"လမ်းလျှောက်သူ မီးပွိုင့် အစိမ်းမှိတ်တုတ် ဖြစ်လာပါက လမ်းကူးနေဆဲ လမ်းလျှောက်သူသည် ထိုနေရာတွင် ရပ်ရမည်။", exJa:"誤り。横断中の歩行者は、速やかに横断を終わるか、横断をやめて引き返さなければならない。", exMy:"မှားသည်။ လမ်းကူးနေဆဲ လမ်းလျှောက်သူသည် အမြန် ကူးပြီးအောင် သွားရမည် (သို့) မကူးတော့ဘဲ နောက်သို့ ပြန်လှည့်ရမည်။", src:"令2条・教則付表1"},
 {id:"sig-F-15", cat:"sig", set:0, final:3, fo:15, ans:true, ja:"赤信号のときは、車は停止位置を越えて進んではいけない。", my:"မီးနီ ဖြစ်နေချိန်တွင် ယာဉ်သည် ရပ်ရမည့်နေရာကို ကျော်၍ မသွားရ။", exJa:"正しい。赤信号では、車は停止位置を越えて進んではいけない。", exMy:"မှန်သည်။ မီးနီတွင် ယာဉ်သည် ရပ်ရမည့်နေရာကို ကျော်၍ မသွားရ။", src:"令2条・教則付表1"},
 {id:"sig-F-16", cat:"sig", set:0, final:3, fo:16, ans:true, ja:"黄信号のときは、歩行者は横断を始めてはいけない。", my:"မီးဝါ ဖြစ်နေချိန်တွင် လမ်းလျှောက်သူသည် လမ်းကူးခြင်းကို မစတင်ရ။", exJa:"正しい。黄信号では、歩行者は横断を始めてはいけない。横断中の人は速やかに渡り終えるか引き返す。", exMy:"မှန်သည်။ မီးဝါတွင် လမ်းလျှောက်သူသည် လမ်းကူးခြင်းကို မစတင်ရ။ ကူးနေဆဲသူသည် အမြန် ကူးပြီးအောင် သွားရမည် (သို့) ပြန်လှည့်ရမည်။", src:"令2条・教則付表1"},
 {id:"sig-F-17", cat:"sig", set:0, final:3, fo:17, ans:false, ja:"右左折の合図は、右左折が終わったあともしばらく続けなければならない。", my:"ညာကွေ့/ဘယ်ကွေ့ အချက်ပြခြင်းကို ကွေ့ပြီးသွားသည့်နောက်တွင်လည်း အချိန်အတန်ကြာ ဆက်ပြထားရမည်။", exJa:"誤り。合図は右左折などの行為が終わるまで続け、終わったら速やかにやめなければならない。", exMy:"မှားသည်။ အချက်ပြခြင်းကို ကွေ့ခြင်း စသည်တို့ ပြီးဆုံးသည်အထိ ဆက်ပြရပြီး ပြီးလျှင် ချက်ချင်း ရပ်ရမည်။", src:"法53条"},
 {id:"sig-F-18", cat:"sig", set:0, final:3, fo:18, ans:false, ja:"歩道を歩いている人に車が来たことを知らせるため、警音器を鳴らしてよい。", my:"လူသွားလမ်းပေါ်တွင် လမ်းလျှောက်နေသူကို ကားလာကြောင်း အသိပေးရန် ဟွန်း(警音器) တီးနိုင်သည်။", exJa:"誤り。危険を避けるためやむを得ないときなどのほかは、警音器を鳴らしてはいけない。歩道などでもみだりに鳴らさない。", exMy:"မှားသည်။ အန္တရာယ်ရှောင်ရန် မလွဲမရှောင်သာသည့်အခါ စသည်မှအပ ဟွန်း မတီးရ။ လူသွားလမ်း စသည်တို့တွင်လည်း အကြောင်းမဲ့ မတီးရ။", src:"法54条2項・教則5章5節"},
 {id:"sig-F-19", cat:"sig", set:0, final:3, fo:19, ans:true, ja:"警察官が腕を垂直に上げているとき、警察官の身体の正面に対面する交通は、赤信号と同じ意味である。", my:"ရဲက လက်မောင်းကို အပေါ်သို့ ဒေါင်လိုက် မြှောက်ထားချိန်တွင် ရဲ၏ ရှေ့မျက်နှာ (သို့) ကျောဘက်နှင့် မျက်နှာချင်းဆိုင် လာသော ယာဉ်များအတွက် မီးနီနှင့် အဓိပ္ပာယ်တူသည်။", exJa:"正しい。腕を垂直に上げているとき、対面する交通は赤信号、身体の正面と平行に進む交通は黄信号と同じ意味である。", exMy:"မှန်သည်။ လက်မောင်းကို ဒေါင်လိုက် မြှောက်ထားချိန်တွင် မျက်နှာချင်းဆိုင်လာသော ယာဉ်များ မီးနီ၊ ကိုယ်ခန္ဓာနှင့် အပြိုင်သွားသော ယာဉ်များ မီးဝါနှင့် တူသည်။", src:"教則付表1(3)"}
