// ===== 録音の再生（スマホ公開版だけ。window.AUDIO_IDX があり http(s) で開いたとき） =====
// AUDIO_IDX[キー] = [ファイル名, 開始バイト, 終了バイト]。まとめたmp3から1文分だけ取り出して再生する
const AUD = (window.AUDIO_IDX && /^https?:/.test(location.protocol)) ? window.AUDIO_IDX : null;
const AP = AUD ? new Audio() : null;
const clipCache = new Map(), fileCache = new Map();
let apResolve = null;
if(AP){
  // iPhoneは最初のタップの中で一度音を鳴らすと、その後は自動で再生できる
  const unlock=()=>{ try{ const sr=8000,n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b);
      [[0,'RIFF'],[8,'WAVE'],[12,'fmt '],[36,'data']].forEach(([o,t])=>{ for(let i=0;i<4;i++) v.setUint8(o+i,t.charCodeAt(i)); });
      v.setUint32(4,36+n*2,true); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); v.setUint32(40,n*2,true);
      if(!AP.src || AP.paused){ AP.src=URL.createObjectURL(new Blob([b],{type:'audio/wav'})); AP.play().catch(()=>{}); } }catch(e){} };
  document.addEventListener('pointerdown', unlock, {once:true, capture:true});
  document.addEventListener('touchend', unlock, {once:true, capture:true});
}
async function clipUrl(key){
  if(clipCache.has(key)) return clipCache.get(key);
  const [f,a,b]=AUD[key];
  let blob=null;
  if(!fileCache.has(f)){
    const r=await fetch(f,{headers:{Range:'bytes='+a+'-'+b}});
    if(r.status===206) blob=await r.blob();
    else if(r.ok) fileCache.set(f, await r.arrayBuffer());   // 範囲指定が効かないときはファイルごと
    else throw new Error('audio '+r.status);
  }
  blob = blob ? new Blob([blob],{type:'audio/mpeg'}) : new Blob([fileCache.get(f).slice(a,b+1)],{type:'audio/mpeg'});
  const u=URL.createObjectURL(blob); clipCache.set(key,u); return u;
}
function playClip(key, my, nextKey){
  return clipUrl(key).then(u=>{
    if(my!==spSeq) return;
    if(nextKey) clipUrl(nextKey).catch(()=>{});   // 次の文を先に取っておく
    return new Promise((res,rej)=>{
      const [,a,b]=AUD[key], rate=parseFloat($('rate').value)||1;
      const w=setTimeout(()=>res(), ((b-a)/6000)/rate*1000+6000);
      apResolve=()=>{ clearTimeout(w); res(); };
      AP.onended=()=>{ clearTimeout(w); apResolve=null; res(); };
      AP.onerror=()=>{ clearTimeout(w); apResolve=null; rej(new Error('play')); };
      AP.src=u; AP.playbackRate=rate; AP.defaultPlaybackRate=rate;
      const pr=AP.play(); if(pr) pr.catch(e=>{ clearTimeout(w); apResolve=null; rej(e); });
    });
  });
}
// 録音が使えないときの予備：その部分だけ端末の声で読む
function ttsPart(p, my, onChunk){
  return new Promise(res=>{
    const v = p.lang==='ja'? vJa : vMy;
    if(!window.speechSynthesis || !v){ if(onChunk) onChunk(p.text,p.lang); setTimeout(res, p.text.length*(p.lang==='ja'?170:90)/(parseFloat($('rate').value)||1)); return; }
    const chunks=(p.lang==='ja'? yomi(p.text) : myClean(p.text)).match(/[^。။!?！？]+[。။!?！？]*/g)||[p.text]; let k=0;
    const one=()=>{ if(my!==spSeq) return res(); if(k>=chunks.length) return res();
      if(onChunk) onChunk(chunks[k],p.lang);
      const u=new SpeechSynthesisUtterance(chunks[k++]); u.voice=v; u.lang=v.lang; u.rate=parseFloat($('rate').value)||1;
      let d=false; const go=()=>{ if(d) return; d=true; clearTimeout(t); one(); }; u.onend=go; u.onerror=go;
      const t=setTimeout(go, u.text.length*260/u.rate+8000); speechSynthesis.speak(u); };
    one();
  });
}
function speakAudio(parts, onDone, onChunk, my){
  (async()=>{
    for(const p of parts){
      if(my!==spSeq) return;
      const keys=(p.clips||[]).filter(k=>AUD[k]);
      let failed=!keys.length;
      for(let i=0;i<keys.length && !failed;i++){
        if(my!==spSeq) return;
        if(onChunk) onChunk(p.caps? (p.caps[p.clips.indexOf(keys[i])]||'') : p.text, p.lang);
        try{ await playClip(keys[i], my, keys[i+1]); }catch(e){ if(i===0) failed=true; }
      }
      if(failed && p.text){ await ttsPart(p, my, onChunk); }
    }
    if(my!==spSeq) return; speaking=false; updSpk(); if(onDone) onDone();
  })();
}
function speak(parts, onDone, onChunk){
  stopSpeak();
  const my=++spSeq; speaking=true; updSpk();
  if(AUD && parts.some(p=>p.clips && p.clips.some(k=>AUD[k]))){ speakAudio(parts, onDone, onChunk, my); return; }
  const list = parts.filter(p=>p.text && (p.lang==='ja'? vJa : vMy));
  // 声がないときは、読む時間の目安だけ待って次へ（字幕だけで進む）
  if(!window.speechSynthesis || !list.length){ const ms=parts.reduce((a,p)=>a+(p.text||'').length*(p.lang==='ja'?170:90),0)/(parseFloat($('rate').value)||1)+800; if(onChunk) onChunk(parts[0]&&parts[0].text||'', parts[0]&&parts[0].lang); setTimeout(()=>{ if(my!==spSeq) return; speaking=false; updSpk(); if(onDone) onDone(); }, ms); return; }
  if(parts.some(p=>p.lang==='my') && !vMy && !myWarned){ myWarned=true; toast(IS_MOBILE? 'この端末にはミャンマー語の声がないため、ミャンマー語は文字で表示します' : 'ミャンマー語の声が見つかりません（Edge＋インターネット接続が必要です）'); }
  let i=0;
  const run=()=>{
    if(my!==spSeq) return;
    if(i>=list.length){ speaking=false; updSpk(); if(onDone) onDone(); return; }
    const p=list[i++];
    const chunks = (p.lang==='ja'? yomi(p.text) : myClean(p.text)).match(/[^。။!?！？]+[。။!?！？]*/g) || [p.text];
    let k=0;
    const one=()=>{
      if(my!==spSeq) return;
      if(k>=chunks.length){ run(); return; }
      if(onChunk) onChunk(chunks[k], p.lang);
      const u=new SpeechSynthesisUtterance(chunks[k++]);
      u.voice = p.lang==='ja'? vJa : vMy; u.lang = u.voice.lang; u.rate=parseFloat($('rate').value)||1;
      let done=false; const go=()=>{ if(done) return; done=true; clearTimeout(w); one(); };
      u.onend=go; u.onerror=e=>{ if(e.error==='interrupted'||e.error==='canceled') return; go(); };
      const w=setTimeout(()=>{ if(my===spSeq){ speechSynthesis.cancel(); go(); } }, u.text.length*260/u.rate+8000);
      speechSynthesis.speak(u);
    };
    one();
  };
  run();
}

// ===== 出題 =====
// 出題順を毎回入れかえる（位置で答えを覚えられないように）
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// まちがえた問題の解き直し：まちがえた問題だけだと正解が○か×にかたよる（全部同じ答えで解けてしまう）ので、
// 同じカテゴリの別の問題を足して、○と×がほぼ半々になるようにする（最低6問）
function reviewIds(h){
  const wrong=h.items.filter(it=>QBY[it.id]&&it.a!==QBY[it.id].ans).map(it=>QBY[it.id]);
  const used=new Set(h.items.map(it=>it.id));
  const cats=[...new Set(wrong.map(q=>q.cat))];
  // 足す問題は練習問題（総まとめ用の問題は総まとめに残す）から。足りなければ総まとめ用からも
  const pool=shuffle(QUESTIONS.filter(q=>!used.has(q.id)&&cats.includes(q.cat))).sort((a,b)=>(a.set===0)-(b.set===0));
  const out=wrong.slice();
  const cnt=v=>out.filter(q=>q.ans===v).length;
  const need=()=> Math.abs(cnt(true)-cnt(false))>1 || out.length<6;
  let ci=0, guard=0;
  while(need() && pool.length && guard++<500){
    const want = cnt(true)===cnt(false) ? (out.length%2===0) : cnt(true)<cnt(false); // 少ない方の答えを足す
    const c=cats[ci++%cats.length];
    let k=pool.findIndex(q=>q.ans===want&&q.cat===c); if(k<0) k=pool.findIndex(q=>q.ans===want); if(k<0) break;
    out.push(pool.splice(k,1)[0]);
  }
  return out.map(q=>q.id);
}
function begin(kind,cat,set,ids){
  if(!nameNow()){ toast(T('needName')); $('name').focus(); return; }
  store('name', nameNow());
  const qs = shuffle(ids ? ids.map(i=>QBY[i]).filter(Boolean) : setQs(kind,cat,set));
  if(!qs.length){ toast('問題がありません'); return; }
  SES={kind,cat,set,review:!!ids,qs,ans:qs.map(()=>null),idx:0,start:Date.now(),exam:kind==='final'&&!ids};
  clearInterval(tick);
  if(SES.exam){ SES.end=Date.now()+EXAM.min*60000; tick=setInterval(updTimer,500); }
  $('timer').classList.toggle('hide',!SES.exam);
  show('quiz'); renderQ(); updTimer();
}
function updTimer(){
  if(!SES||!SES.exam) return;
  const left=Math.max(0,Math.round((SES.end-Date.now())/1000));
  $('timer').innerHTML=T('left')+' '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  $('timer').classList.toggle('low',left<=300);
  if(left<=0){ clearInterval(tick); toast(T('timeUp')); finish(true); }
}
function curQ(){ return SES.qs[SES.idx]; }
// exOnly=true：答えたあとの自動読み上げ。問題文はもう聞いているので、正誤と解説だけを読む
function qPartsToRead(withEx, exOnly){
  const q=curQ(), a=SES.ans[SES.idx], n=SES.idx+1, out=[];
  if(!exOnly) langsToRead().forEach(l=>{
    if(l==='ja'){ out.push({lang:'ja',text:'問題'+n+'。'+q.ja, clips:['n:'+n+':ja','q:'+q.id+':ja']}); }
    else out.push({lang:'my',text:'မေးခွန်း '+n+'။ '+q.my, clips:['n:'+n+':my','q:'+q.id+':my']});
  });
  if(withEx && a!=null){
    const ok=a===q.ans;
    langsToRead().forEach(l=>{
      if(l==='ja') out.push({lang:'ja',text:(ok?'正解です。':'不正解です。')+'答えは'+(q.ans?'まる':'ばつ')+'です。'+q.exJa.replace(/^(正しい|誤り)。\s*/,''), clips:[ok?'ok:ja':'ng:ja', q.ans?'ao:ja':'ax:ja', 'e:'+q.id+':ja']});
      else out.push({lang:'my',text:(ok?'မှန်ပါသည်။ ':'မှားပါသည်။ ')+'အဖြေမှာ '+(q.ans?'မှန်သည်':'မှားသည်')+' ဖြစ်ပါသည်။ '+q.exMy.replace(/^(မှန်သည်|မှားသည်)။\s*/,''), clips:[ok?'ok:my':'ng:my', q.ans?'ao:my':'ax:my', 'e:'+q.id+':my']});
    });
  }
  return out;
}
// 練習問題：答えたら解説を見せてから自動で次の問題へ
let anTimer=null;
function clearAutoNext(){ clearTimeout(anTimer); anTimer=null; }
function autoNextWait(q,a){ // 読み上げなしのときの待ち時間（解説の長さに合わせる）
  let n=0; if(LANG!=='my') n+=q.exJa.length; if(LANG!=='ja') n+=q.exMy.length*0.5;
  return Math.max(4000, Math.min(15000, 2500 + n*55 + (a===q.ans?0:2000)));
}
function startAutoNext(ms){
  clearAutoNext(); const box=$('anBox'); if(!box) return;
  box.innerHTML='<div class="anbar"><i></i></div><span class="muted">'+T('anNext')+'</span> <button class="btn gray" id="anStop" style="padding:4px 10px">'+T('anStop')+'</button>';
  const bar=box.querySelector('i'); requestAnimationFrame(()=>{ bar.style.transition='width '+ms+'ms linear'; bar.style.width='100%'; });
  $('anStop').onclick=()=>{ clearAutoNext(); stopSpeak(); box.innerHTML='<span class="muted">'+T('anStopped')+'</span>'; };
  const idx=SES.idx;
  anTimer=setTimeout(()=>{ anTimer=null; if(view==='quiz'&&SES&&!SES.exam&&SES.idx===idx&&SES.ans[idx]!=null) $('nextBtn').click(); }, ms);
}
function renderQ(){
  clearAutoNext();
  const q=curQ(), a=SES.ans[SES.idx], n=SES.qs.length;
  const c=CATS.find(c=>c.id===q.cat);
  let lbl = SES.kind==='final'? Tp('finalName')+' '+SES.set : (CATS.find(c=>c.id===SES.cat)? (LANG==='my'?c.my:c.ja) : '')+' '+Tp('set')+' '+SES.set;
  if(SES.review) lbl = Tp('review');
  $('qLabel').innerHTML = esc(lbl);
  $('barIn').style.width = ((SES.ans.filter(x=>x!=null).length)/n*100)+'%';
  $('qNo').innerHTML = T('q')+' '+(SES.idx+1)+' / '+n+'　<span class="muted">'+esc(c?catName(c):'')+'</span>'+(SES.exam?'<br><span class="muted">'+T('examNote')+'</span>':'');
  $('qSign').innerHTML = q.sign? signImg(q.sign) : '';
  $('qText').innerHTML = bi(q.ja,q.my);
  $('s_o').innerHTML=T('o'); $('s_x').innerHTML=T('x');
  const showFb = !SES.exam && a!=null;
  ['btnO','btnX'].forEach((id,k)=>{ const v=k===0; const b=$(id); b.className=(v?'o':'x');
    if(showFb){ if(v===q.ans) b.classList.add('right'); else if(v===a) b.classList.add('wrong'); }
    else if(a===v) b.classList.add('sel');
    b.disabled = showFb;
  });
  $('fb').innerHTML = showFb ? fbHtml(q,a) : '';
  $('prevBtn').innerHTML=T('prev'); $('prevBtn').disabled = SES.idx===0 || !SES.exam;
  $('prevBtn').classList.toggle('hide', !SES.exam);
  $('quitBtn').innerHTML=T('quit');
  const last = SES.idx===n-1;
  $('nextBtn').innerHTML = last ? (SES.exam? T('finish') : T('toResult')) : T('next');
  $('nextBtn').disabled = !SES.exam && a==null;
  $('dots').innerHTML = SES.exam ? SES.qs.map((_,i)=>'<button data-jump="'+i+'" class="'+(SES.ans[i]!=null?'done ':'')+(i===SES.idx?'cur':'')+'">'+(i+1)+'</button>').join('') : '';
  updSpk();
  if(showFb){
    const box=$('anBox');
    if($('autoRead').checked){ if(box) box.innerHTML='<span class="muted">'+T('anAfterRead')+'</span>'; const idx=SES.idx; speak(qPartsToRead(true,true), ()=>{ if(SES&&SES.idx===idx&&view==='quiz') startAutoNext(1500); }); }
    else startAutoNext(autoNextWait(q,a));
  } else if($('autoRead').checked) speak(qPartsToRead(false));
}
function fbHtml(q,a){
  const ok=a===q.ans;
  return '<div class="fb '+(ok?'ok':'ng')+'"><div class="h">'+(ok?'⭕ '+T('right'):'❌ '+T('wrong'))+'　'+T('ansIs')+'：'+(q.ans?'○':'×')+'</div>'+
    '<div class="ex"><b>'+T('ex')+'</b>'+bi(q.exJa,q.exMy)+'</div>'+(q.src?'<div class="src">根拠：'+esc(q.src)+'</div>':'')+'<div class="anbox" id="anBox"></div></div>';
}
function answer(v){
  if(!SES) return; const a=SES.ans[SES.idx];
  if(!SES.exam && a!=null) return;
  SES.ans[SES.idx]=v;
  if(SES.exam){ // 本番形式：自動で次の問題へ
    if(SES.idx<SES.qs.length-1){ SES.idx++; } stopSpeak(); renderQ(); return;
  }
  stopSpeak(); renderQ();
}
$('btnO').onclick=()=>answer(true); $('btnX').onclick=()=>answer(false);
$('nextBtn').onclick=()=>{ if(!SES) return; clearAutoNext(); stopSpeak();
  if(SES.idx<SES.qs.length-1){ SES.idx++; renderQ(); return; }
  if(SES.exam && SES.ans.some(x=>x==null) && !confirm(Tboth('confirmFinish'))) return;
  finish(false);
};
$('prevBtn').onclick=()=>{ if(SES&&SES.idx>0){ stopSpeak(); SES.idx--; renderQ(); } };
$('quitBtn').onclick=()=>{ clearAutoNext(); if(confirm(Tboth('confirmQuit'))){ stopSpeak(); clearInterval(tick); SES=null; renderHome(); show('home'); } };
$('spkBtn').onclick=()=>{ clearAutoNext(); if(speaking){ stopSpeak(); return; } if(view==='quiz'&&SES) speak(qPartsToRead(!SES.exam)); };
document.addEventListener('keydown',e=>{
  if(view!=='quiz'||e.target.tagName==='INPUT') return;
  if(e.key==='o'||e.key==='O'||e.key==='1') answer(true);
  else if(e.key==='x'||e.key==='X'||e.key==='2') answer(false);
  else if(e.key==='Enter'&&!$('nextBtn').disabled) $('nextBtn').click();
});

// ===== 採点・結果 =====
function finish(auto){
  clearInterval(tick); clearAutoNext(); stopSpeak();
  const s=SES, n=s.qs.length, correct=s.qs.filter((q,i)=>s.ans[i]===q.ans).length;
  const passN = s.kind==='final'&&!s.review ? EXAM.pass : Math.ceil(n*0.9);
  const h={date:Date.now(), name:nameNow(), kind:s.kind, cat:s.cat, set:s.set, review:s.review, n, correct, pass:correct>=passN, passN,
    sec:Math.round((Date.now()-s.start)/1000), timeUp:!!auto, items:s.qs.map((q,i)=>({id:q.id,a:s.ans[i]}))};
  const hs=hist(); hs.push(h); store('hist',hs);
  lastResult=h; SES=null; renderResult(); show('result');
  if($('autoRead').checked){
    const parts=[]; langsToRead().forEach(l=>parts.push(l==='ja'? {lang:'ja',text:n+'問中'+correct+'問正解。'+(h.pass?'合格です。':'不合格です。合格には'+passN+'問以上の正解が必要です。')} : {lang:'my',text:'မေးခွန်း '+n+' ခုတွင် '+correct+' ခု မှန်ပါသည်။ '+(h.pass?'အောင်ပါသည်။':'ကျပါသည်။ အောင်ရန် '+passN+' ခုနှင့်အထက် မှန်ရန် လိုအပ်ပါသည်။')}));
    speak(parts);
  }
}
function catStats(h){
  const st={}; h.items.forEach(it=>{ const q=QBY[it.id]; if(!q) return; const s=st[q.cat]||(st[q.cat]={n:0,c:0}); s.n++; if(it.a===q.ans) s.c++; });
  return st;
}
function renderResult(){
  const h=lastResult; if(!h) return;
  const st=catStats(h);
  $('resTop').innerHTML = '<div class="row" style="justify-content:space-between"><div><div class="muted">'+esc(h.name)+'　'+fmtDate(h.date)+'</div><h2 style="margin:4px 0">'+esc(kindLabel(h))+'</h2>'+
    '<div><span class="big">'+h.correct+' / '+h.n+'</span>　<span class="passb '+(h.pass?'p':'f')+'">'+(h.pass?T('pass'):T('fail'))+'</span></div>'+
    '<div class="muted">'+T('passLine')+'：'+h.passN+'/'+h.n+'　'+T('time')+'：'+fmtSec(h.sec)+(h.timeUp?'（時間切れ）':'')+'</div></div>'+
    '<div class="row"><button class="btn" id="prBtn">'+T('print')+'</button><button class="btn sub" id="wdBtn">'+T('word')+'</button></div></div>'+
    '<div class="mobhint">'+T('mobSave')+'</div><div class="row" style="margin-top:12px"><button class="btn sub" id="rtBtn">'+T('retry')+'</button>'+(h.correct<h.n?'<button class="btn sub" id="rnBtn">'+T('retryNg')+'</button>':'')+'<button class="btn gray" id="hmBtn">'+T('home')+'</button></div>';
  $('resCat').innerHTML='<h2>'+T('byCat')+'</h2><table>'+CATS.filter(c=>st[c.id]).map(c=>{ const s=st[c.id], p=Math.round(s.c/s.n*100);
    return '<tr><td>'+c.icon+' '+esc(catName(c))+'</td><td style="width:90px">'+s.c+'/'+s.n+'</td><td style="width:200px"><span class="rate" style="width:'+(p*1.5)+'px;background:'+(p>=90?'var(--ok)':p>=70?'var(--warn)':'var(--ng)')+'"></span> '+p+'%</td></tr>'; }).join('')+'</table>';
  $('h_detail').innerHTML=T('detail'); $('l_onlyng').innerHTML=T('onlyNg');
  renderResList();
  $('prBtn').onclick=()=>{ buildPrint(); window.print(); };
  $('wdBtn').onclick=saveWord;
  $('rtBtn').onclick=()=>{ if(h.review) begin(h.kind,h.cat,h.set,h.items.map(i=>i.id)); else begin(h.kind,h.cat,h.set); };
  if($('rnBtn')) $('rnBtn').onclick=()=>begin(h.kind,h.cat,h.set,reviewIds(h));
  $('hmBtn').onclick=()=>{ stopSpeak(); renderHome(); show('home'); };
}
function renderResList(){
  const h=lastResult, only=$('onlyNg').checked;
  $('resList').innerHTML = h.items.map((it,i)=>{ const q=QBY[it.id]; if(!q) return ''; const ok=it.a===q.ans; if(only&&ok) return '';
    return '<div class="res-item'+(ok?'':' ng')+'"><div class="row" style="gap:8px"><span class="mk" style="color:'+(ok?'var(--ok)':'var(--ng)')+'">'+(ok?'⭕':'❌')+' '+T('q')+(i+1)+'</span>'+
      '<span class="muted">'+T('yourAns')+'：'+(it.a==null?Tp('noAns'):(it.a?'○':'×'))+'　'+T('ansIs')+'：'+(q.ans?'○':'×')+'</span>'+
      '<button class="spk" data-readq="'+q.id+'">🔊</button></div>'+
      '<div style="display:flex;gap:10px;margin-top:4px">'+(q.sign?'<div style="flex:0 0 60px;width:60px;height:60px">'+SIGNS[q.sign].svg+'</div>':'')+'<div style="flex:1">'+bi(q.ja,q.my)+
      '<div style="margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)"><b>'+T('ex')+'</b>'+bi(q.exJa,q.exMy)+'</div></div></div></div>'; }).join('') || '<p class="muted">—</p>';
}
$('onlyNg').onchange=renderResList;
document.addEventListener('click',e=>{ const b=e.target.closest('[data-readq]'); if(!b) return; const q=QBY[b.dataset.readq]; const p=[];
  langsToRead().forEach(l=>p.push(l==='ja'?{lang:'ja',text:q.ja+'。答えは'+(q.ans?'まる':'ばつ')+'。'+q.exJa, clips:['q:'+q.id+':ja',q.ans?'ao:ja':'ax:ja','e:'+q.id+':ja']}:{lang:'my',text:q.my+'။ အဖြေ '+(q.ans?'မှန်သည်':'မှားသည်')+'။ '+q.exMy, clips:['q:'+q.id+':my',q.ans?'ao:my':'ax:my','e:'+q.id+':my']})); speak(p); });

// ===== レポート（印刷・Word） =====
function reportHtml(){
  const h=lastResult, st=catStats(h);
  const bj=(ja,my)=> (LANG!=='my'?'<div>'+esc(ja)+'</div>':'')+(LANG!=='ja'?'<div class="my">'+esc(my)+'</div>':'');
  const ng=h.items.map((it,i)=>({it,i,q:QBY[it.id]})).filter(x=>x.q && x.it.a!==x.q.ans);
  return '<div style="text-align:right;font-size:9pt">'+esc(COMPANY.ja)+'</div><h1>外免切替 知識確認 練習 結果レポート</h1>'+
    '<table><tr><th>氏名</th><td>'+esc(h.name)+'</td><th>実施日時</th><td>'+fmtDate(h.date)+'</td></tr>'+
    '<tr><th>種類</th><td>'+esc(kindLabel(h))+'</td><th>かかった時間</th><td>'+fmtSec(h.sec)+(h.timeUp?'（時間切れ）':'')+'</td></tr>'+
    '<tr><th>研修</th><td colspan="3">'+(ksDone(h.name)? '受講済（'+ksDone(h.name)+'）' : '未受講')+'</td></tr>'+
    '<tr><th>得点</th><td><b>'+h.correct+' / '+h.n+'</b>（正答率 '+Math.round(h.correct/h.n*100)+'%）</td><th>判定</th><td><b>'+(h.pass?'合格':'不合格')+'</b>（合格ライン '+h.passN+'問）</td></tr></table>'+
    '<h3>カテゴリ別の正答率</h3><table><tr><th>カテゴリ</th><th>正解</th><th>正答率</th></tr>'+CATS.filter(c=>st[c.id]).map(c=>'<tr><td>'+esc(c.ja)+'<span class="my"> / '+esc(c.my)+'</span></td><td>'+st[c.id].c+'/'+st[c.id].n+'</td><td>'+Math.round(st[c.id].c/st[c.id].n*100)+'%</td></tr>').join('')+'</table>'+
    '<h3>全問の正誤</h3><div style="display:flex;flex-wrap:wrap;gap:2px">'+h.items.map((it,i)=>{ const q=QBY[it.id]; const ok=q&&it.a===q.ans; return '<span style="display:inline-block;width:11mm;border:1px solid #999;text-align:center;font-size:8.5pt;'+(ok?'':'background:#fde0e0;font-weight:700')+'">'+(i+1)+(ok?'○':'×')+'</span>'; }).join('')+'</div>'+

    '<div class="sig"><div>本人署名</div><div>確認者</div><div>確認日</div></div>'+
    '<p style="font-size:8pt;color:#555">※本アプリの問題は「交通の方法に関する教則」「道路交通法」をもとに作成した練習問題で、実際の試験問題ではありません。</p><p style="font-size:8pt;color:#555;text-align:center">'+esc(COMPANY.ja)+'　企業理念 '+esc(RINEN.head)+'　～一人はすべてのために、すべては一人のために～</p>';
}
function buildPrint(){ $('printArea').innerHTML=reportHtml(); }
window.addEventListener('beforeprint',()=>{ if(view==='result') buildPrint(); else $('printArea').innerHTML=''; });
function saveWord(){
